<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>tmus 经济增加值(EVA) 简化版 2016-2024</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue",
                   Arial, "Noto Sans", "Liberation Sans", sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f7f7f7;
      color: #222;
    }

    h1 {
      font-size: 20px;
      margin-bottom: 4px;
    }

    h2 {
      font-size: 14px;
      font-weight: normal;
      margin-top: 0;
      color: #666;
    }

    .chart-container {
      position: relative;
      margin: 20px auto;
      padding: 20px;
      max-width: 900px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    #chartWrapper {
      position: relative;
      height: 480px;
    }

    .note {
      font-size: 12px;
      color: #777;
      margin-top: 10px;
      line-height: 1.4;
    }

    .legend-note {
      font-size: 12px;
      color: #555;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <h1>tmus 经济增加值 (EVA) - 简化版</h1>
  <h2>2016 - 2024 财年变化（单位：美元）</h2>

  <div class="chart-container">
    <div id="chartWrapper">
      <canvas id="evaChart"></canvas>
    </div>
    <div class="legend-note">
      蓝色柱：EVA &gt; 0（正向经济增加值）<br>
      红色柱：EVA &lt; 0（负向经济增加值）
    </div>
    <div class="note">
      说明：数值基于提供的源数据直接绘制，使用线性刻度展示大额正负变化。
      可以在图上悬停查看各年度精确数值。
    </div>
  </div>

  <!-- Chart.js (latest 4.x) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    // Source data
    const fiscalYears = [
      "2016","2017","2018","2019","2020","2021","2022","2023","2024"
    ];

    const evaValues = [
      -968160034.3790288,
      -869025877.8867445,
      294620142.9665556,
      370628861.6119919,
      -3230940934.8441925,
      -7155940734.109221,
      -8762909821.996185,
      -3309376420.5836887,
      -102427922.78412056
    ];

    // Colors based on positive / negative EVA
    const barColors = evaValues.map(v => v >= 0 ? "rgba(54, 162, 235, 0.85)" : "rgba(220, 53, 69, 0.85)");
    const borderColors = evaValues.map(v => v >= 0 ? "rgba(54, 162, 235, 1)" : "rgba(220, 53, 69, 1)");

    const ctx = document.getElementById("evaChart").getContext("2d");

    // Helper: format large numbers with thousands separators
    function formatNumber(value) {
      if (Math.abs(value) >= 1_000_000_000) {
        return (value / 1_000_000_000).toFixed(2) + "B";
      } else if (Math.abs(value) >= 1_000_000) {
        return (value / 1_000_000).toFixed(2) + "M";
      } else if (Math.abs(value) >= 1_000) {
        return (value / 1_000).toFixed(2) + "K";
      }
      return value.toFixed(0);
    }

    new Chart(ctx, {
      type: "bar",
      data: {
        labels: fiscalYears,
        datasets: [{
          label: "经济增加值 (EVA)",
          data: evaValues,
          backgroundColor: barColors,
          borderColor: borderColors,
          borderWidth: 1.5,
          hoverBackgroundColor: barColors,
          hoverBorderColor: borderColors
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: {
          mode: "nearest",
          axis: "x",
          intersect: true
        },
        plugins: {
          legend: {
            display: false
          },
          tooltip: {
            callbacks: {
              label: function(context) {
                const v = context.raw;
                const formatted = v.toLocaleString("en-US", {
                  maximumFractionDigits: 2
                });
                return " EVA: " + formatted + " USD";
              }
            }
          },
          title: {
            display: false
          }
        },
        scales: {
          x: {
            title: {
              display: true,
              text: "财年",
              color: "#444",
              font: { size: 12 }
            },
            grid: {
              display: false
            }
          },
          y: {
            title: {
              display: true,
              text: "EVA（美元）",
              color: "#444",
              font: { size: 12 }
            },
            ticks: {
              callback: function(value) {
                return formatNumber(value);
              }
            },
            grid: {
              color: "rgba(0,0,0,0.04)"
            }
          }
        }
      }
    });
  </script>
</body>
</html>
