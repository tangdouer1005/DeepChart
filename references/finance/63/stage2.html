<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CSCO 投入资本回报率 (ROIC) 2016–2024</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Chart.js (latest stable v4) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --fg: #111827;
      --card-bg: #f9fafb;
      --accent: #2563eb;
      --accent-light: rgba(37, 99, 235, 0.15);
      --grid: #e5e7eb;
      --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #020617;
        --fg: #e5e7eb;
        --card-bg: #0b1120;
        --accent: #60a5fa;
        --accent-light: rgba(96, 165, 250, 0.2);
        --grid: #1f2937;
      }
    }

    body {
      margin: 0;
      padding: 24px;
      font-family: var(--font-sans);
      background: radial-gradient(circle at top left, #eff6ff, #f9fafb 45%, var(--bg));
      color: var(--fg);
    }

    .wrapper {
      max-width: 900px;
      margin: 0 auto;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 20px 20px 16px;
      box-shadow:
        0 18px 40px rgba(15, 23, 42, 0.09),
        0 0 0 1px rgba(148, 163, 184, 0.12);
      backdrop-filter: blur(8px);
    }

    h1 {
      margin: 0 0 4px;
      font-size: 1.4rem;
      font-weight: 650;
      letter-spacing: 0.01em;
    }

    .subtitle {
      margin: 0 0 16px;
      font-size: 0.85rem;
      color: #6b7280;
    }

    @media (prefers-color-scheme: dark) {
      .subtitle {
        color: #9ca3af;
      }
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      font-size: 0.78rem;
      margin-bottom: 10px;
      color: #6b7280;
    }

    @media (prefers-color-scheme: dark) {
      .meta {
        color: #9ca3af;
      }
    }

    .meta span::before {
      content: "• ";
    }

    .meta span:first-child::before {
      content: "";
    }

    .chart-container {
      position: relative;
      height: 420px;
    }

    canvas {
      max-height: 100%;
    }

    .note {
      margin-top: 10px;
      font-size: 0.78rem;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="card">
      <h1>CSCO 投入资本回报率 (ROIC)</h1>
      <p class="subtitle">2016–2024 财年 | 单位：百分比 (%)</p>
      <div class="meta">
        <span>公司：Cisco Systems, Inc. (CSCO)</span>
        <span>指标：Return on Invested Capital (ROIC)</span>
        <span>图表类型：柱状图</span>
      </div>
      <div class="chart-container">
        <canvas id="roicChart"></canvas>
      </div>
      <p class="note">
        说明：ROIC = 税后经营利润 / 投入资本。数值基于提供的原始数据，以小数形式给出，图中已换算为百分比。
        可悬停查看精确数值，点击图例可临时隐藏/显示数据列。
      </p>
    </div>
  </div>

  <script>
    const ctx = document.getElementById('roicChart');

    // Source data (as provided)
    const fiscalYears = [
      "2016", "2017", "2018", "2019", "2020",
      "2021", "2022", "2023", "2024"
    ];
    const roicRaw = [
      0.1292952773848151,
      0.1084082519289438,
      0.0014034064569554,
      0.2133112285070966,
      0.2508126302729746,
      0.2430835311659313,
      0.2645754896539145,
      0.2906961956196675,
      0.1861786323680822
    ];

    // Convert to percentage values
    const roicPercent = roicRaw.map(v => v * 100);

    // Highlight min/max years for quick reading
    const maxValue = Math.max(...roicPercent);
    const minValue = Math.min(...roicPercent);

    const baseColor = 'rgba(37, 99, 235, 0.8)';
    const baseBorder = 'rgba(37, 99, 235, 1)';
    const maxColor = 'rgba(22, 163, 74, 0.9)';   // green for peak
    const maxBorder = 'rgba(22, 163, 74, 1)';
    const minColor = 'rgba(239, 68, 68, 0.9)';   // red for trough
    const minBorder = 'rgba(239, 68, 68, 1)';

    const backgroundColors = roicPercent.map(v => {
      if (v === maxValue) return maxColor;
      if (v === minValue) return minColor;
      return baseColor;
    });

    const borderColors = roicPercent.map(v => {
      if (v === maxValue) return maxBorder;
      if (v === minValue) return minBorder;
      return baseBorder;
    });

    new Chart(ctx, {
      type: 'bar',
      data: {
        labels: fiscalYears,
        datasets: [
          {
            label: 'ROIC (%)',
            data: roicPercent,
            backgroundColor: backgroundColors,
            borderColor: borderColors,
            borderWidth: 1.5,
            borderRadius: 6,
            hoverBackgroundColor: backgroundColors,
            hoverBorderColor: borderColors
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        layout: {
          padding: {
            top: 10,
            right: 12,
            bottom: 6,
            left: 6
          }
        },
        scales: {
          x: {
            grid: {
              display: false
            },
            title: {
              display: true,
              text: '财年',
              font: {
                size: 11,
                weight: '500'
              }
            },
            ticks: {
              font: {
                size: 11
              }
            }
          },
          y: {
            beginAtZero: true,
            grid: {
              color: 'rgba(148, 163, 184, 0.2)',
              drawBorder: false
            },
            title: {
              display: true,
              text: 'ROIC (%)',
              font: {
                size: 11,
                weight: '500'
              }
            },
            ticks: {
              font: {
                size: 11
              },
              callback: (value) => value + '%'
            }
          }
        },
        plugins: {
          legend: {
            display: true,
            labels: {
              font: { size: 11 }
            }
          },
          tooltip: {
            backgroundColor: 'rgba(15, 23, 42, 0.96)',
            titleFont: { size: 11, weight: '600' },
            bodyFont: { size: 11 },
            padding: 10,
            cornerRadius: 8,
            callbacks: {
              label: (ctx) => {
                const v = ctx.parsed.y;
                return 'ROIC: ' + v.toFixed(2) + '%';
              },
              afterLabel: (ctx) => {
                const v = ctx.parsed.y;
                if (v === maxValue) return '历史峰值 (此区间)';
                if (v === minValue) return '历史低点 (此区间)';
                return '';
              }
            }
          },
          title: {
            display: false
          }
        },
        interaction: {
          mode: 'index',
          intersect: false
        },
        animation: {
          duration: 900,
          easing: 'easeOutCubic'
        }
      }
    });
  </script>
</body>
</html>
