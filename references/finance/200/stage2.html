<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>NVDA 经济增加值(EVA) 2016-2024 柱状图</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Chart.js latest 4.x (no integrity) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --fg: #1f2933;
      --grid: #d2d6dc;
      --accent: #2563eb;
      --accent-soft: rgba(37, 99, 235, 0.15);
      --accent-border: rgba(37, 99, 235, 0.8);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1120;
        --fg: #e5e7eb;
        --grid: #374151;
        --accent: #60a5fa;
        --accent-soft: rgba(96, 165, 250, 0.18);
        --accent-border: rgba(96, 165, 250, 0.9);
      }
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top left, #eef2ff, #f9fafb);
      color: var(--fg);
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
    }

    .card {
      width: 100%;
      max-width: 960px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(10px);
      border-radius: 18px;
      box-shadow:
        0 18px 45px rgba(15, 23, 42, 0.18),
        0 0 0 1px rgba(148, 163, 184, 0.18);
      padding: 18px 22px 24px;
      box-sizing: border-box;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: radial-gradient(circle at top left, #020617, #020617);
      }
      .card {
        background: rgba(15, 23, 42, 0.98);
        box-shadow:
          0 18px 45px rgba(0, 0, 0, 0.6),
          0 0 0 1px rgba(30, 64, 175, 0.6);
      }
    }

    .header {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 8px 16px;
      margin-bottom: 8px;
    }

    .title {
      font-size: 20px;
      font-weight: 650;
      letter-spacing: 0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .subtitle {
      font-size: 13px;
      color: #6b7280;
    }

    @media (prefers-color-scheme: dark) {
      .subtitle {
        color: #9ca3af;
      }
    }

    .tag {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid var(--accent-border);
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      font-size: 12px;
    }

    .toolbar-left {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .metric-pill {
      padding: 3px 9px;
      border-radius: 999px;
      background: rgba(15, 118, 110, 0.06);
      color: #065f46;
      border: 1px solid rgba(16, 185, 129, 0.5);
      font-variant-numeric: tabular-nums;
    }

    @media (prefers-color-scheme: dark) {
      .metric-pill {
        background: rgba(16, 185, 129, 0.15);
        color: #6ee7b7;
        border-color: rgba(45, 212, 191, 0.7);
      }
    }

    .unit-toggle {
      display: inline-flex;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.7);
      overflow: hidden;
      background: rgba(249, 250, 251, 0.6);
      vertical-align: middle;
    }

    .unit-toggle button {
      border: none;
      background: transparent;
      padding: 3px 9px;
      font-size: 11px;
      cursor: pointer;
      color: #4b5563;
      min-width: 58px;
    }

    .unit-toggle button.active {
      background: var(--accent);
      color: #f9fafb;
    }

    @media (prefers-color-scheme: dark) {
      .unit-toggle {
        background: rgba(15, 23, 42, 0.7);
        border-color: rgba(55, 65, 81, 0.9);
      }
      .unit-toggle button {
        color: #9ca3af;
      }
    }

    .chart-container {
      position: relative;
      width: 100%;
      height: 420px;
    }

    @media (max-width: 768px) {
      .card {
        padding: 16px 14px 18px;
      }
      .chart-container {
        height: 360px;
      }
      .title {
        font-size: 17px;
      }
    }

    .footer {
      margin-top: 8px;
      font-size: 11px;
      color: #9ca3af;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 4px;
    }

    .legend-dot {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .legend-dot span {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--accent), #22c55e);
    }
  </style>
</head>
<body>
<div class="page">
  <div class="card">
    <div class="header">
      <div class="title">
        NVDA 经济增加值 (EVA) – 简化版
        <span class="tag">Bar Chart</span>
      </div>
      <div class="subtitle">按财年统计，单位可在“原值 / 十亿”之间切换</div>
    </div>

    <div class="toolbar">
      <div class="toolbar-left">
        <span class="legend-dot"><span></span>EVA</span>
        <span class="metric-pill" id="summary-metric"></span>
      </div>
      <div style="display:flex;align-items:center;gap:6px;">
        <span>显示单位：</span>
        <div class="unit-toggle" aria-label="切换显示单位">
          <button id="btn-raw" class="active" type="button">原值</button>
          <button id="btn-bn" type="button">十亿</button>
        </div>
      </div>
    </div>

    <div class="chart-container">
      <canvas id="evaChart"></canvas>
    </div>

    <div class="footer">
      <span>数据来源：用户提供的 NVDA EVA（简化版）财年数据，2016–2024。</span>
      <span>交互：悬停查看精确值。</span>
    </div>
  </div>
</div>

<script>
  // ---- 原始数据（用户提供） ----
  const fiscalYears = [
    "2016","2017","2018","2019","2020","2021","2022","2023","2024"
  ];

  const evaRaw = [
    71214068.16958272,
    1078061679.7900262,
    2446597309.13642,
    2759385420.944558,
    1977814646.4646463,
    3132901893.8534813,
    6914048782.81863,
    766226775.8909354,
    25250515997.397835
  ];

  function toBillions(values) {
    return values.map(v => v / 1e9);
  }

  function formatNumber(num, decimals) {
    const options = {
      minimumFractionDigits: decimals,
      maximumFractionDigits: decimals
    };
    return Number(num).toLocaleString("en-US", options);
  }

  let currentUnit = "raw"; // 'raw' | 'bn'

  function updateSummary() {
    const latestYear = fiscalYears[fiscalYears.length - 1];
    const latestValue = evaRaw[evaRaw.length - 1];
    const el = document.getElementById("summary-metric");
    if (!el) return;

    if (currentUnit === "raw") {
      el.textContent = "FY" + latestYear + " EVA：" + formatNumber(latestValue, 0);
    } else {
      el.textContent = "FY" + latestYear + " EVA：" + formatNumber(latestValue / 1e9, 2) + " 十亿";
    }
  }

  const canvas = document.getElementById("evaChart");
  const ctx = canvas.getContext("2d");

  // 创建一个固定的渐变，避免在 options 中访问 context.chart 可能带来的问题
  const barGradient = (function() {
    const g = ctx.createLinearGradient(0, 0, 0, canvas.height || 400);
    g.addColorStop(0, "rgba(37, 99, 235, 0.9)");
    g.addColorStop(1, "rgba(37, 99, 235, 0.3)");
    return g;
  })();

  const evaChart = new Chart(ctx, {
    type: "bar",
    data: {
      labels: fiscalYears,
      datasets: [{
        label: "EVA",
        data: evaRaw.slice(),
        borderColor: "rgba(30, 64, 175, 0.95)",
        backgroundColor: barGradient,
        borderWidth: 1.6,
        borderRadius: 6,
        hoverBorderWidth: 2,
        hoverBackgroundColor: "rgba(59, 130, 246, 0.95)",
        maxBarThickness: 46
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: {
        mode: "index",
        intersect: false
      },
      plugins: {
        legend: {
          display: false
        },
        tooltip: {
          backgroundColor: "rgba(15, 23, 42, 0.96)",
          borderColor: "rgba(148, 163, 184, 0.7)",
          borderWidth: 1,
          padding: 10,
          cornerRadius: 8,
          titleFont: {weight: "600", size: 12},
          bodyFont: {size: 12},
          callbacks: {
            label: function(context) {
              var value = context.raw;
              if (currentUnit === "raw") {
                return " EVA：" + formatNumber(value, 0);
              } else {
                return " EVA：" + formatNumber(value, 2) + " 十亿";
              }
            }
          }
        },
        title: {
          display: false
        }
      },
      scales: {
        x: {
          grid: {
            display: false
          },
          ticks: {
            font: {size: 11}
          }
        },
        y: {
          grid: {
            color: "rgba(148, 163, 184, 0.3)",
            drawBorder: false
          },
          ticks: {
            font: {size: 11},
            callback: function(value) {
              if (currentUnit === "raw") {
                if (value >= 1e9) return (value / 1e9).toFixed(1) + "B";
                if (value >= 1e6) return (value / 1e6).toFixed(0) + "M";
                return value;
              } else {
                return value.toFixed(1);
              }
            }
          },
          title: {
            display: true,
            text: function() {
              return currentUnit === "raw" ? "EVA（原值）" : "EVA（十亿）";
            },
            font: {size: 12, weight: "500"}
          }
        }
      }
    }
  });

  function setUnit(unit) {
    if (unit === currentUnit) return;
    currentUnit = unit;

    var rawBtn = document.getElementById("btn-raw");
    var bnBtn = document.getElementById("btn-bn");

    if (unit === "raw") {
      evaChart.data.datasets[0].data = evaRaw.slice();
      rawBtn.classList.add("active");
      bnBtn.classList.remove("active");
    } else {
      evaChart.data.datasets[0].data = toBillions(evaRaw);
      bnBtn.classList.add("active");
      rawBtn.classList.remove("active");
    }

    evaChart.update();
    updateSummary();
  }

  document.getElementById("btn-raw").addEventListener("click", function() {
    setUnit("raw");
  });
  document.getElementById("btn-bn").addEventListener("click", function() {
    setUnit("bn");
  });

  updateSummary();
</script>
</body>
</html>
