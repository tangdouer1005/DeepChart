<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>hd 内部增长率 (IGR) 2016–2024 - Bar Chart</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Chart.js (latest stable 4.x) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 1.5rem;
      background-color: #f7f7f9;
      color: #222;
    }
    h1 {
      font-size: 1.4rem;
      margin-bottom: 0.25rem;
    }
    h2 {
      font-size: 1rem;
      margin-top: 0;
      color: #555;
      font-weight: 400;
    }
    .chart-container {
      position: relative;
      max-width: 900px;
      margin: 1.5rem auto;
      background: #fff;
      padding: 1.25rem 1.5rem 1.75rem;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
    }
    .note {
      max-width: 900px;
      margin: 0.5rem auto 0;
      font-size: 0.8rem;
      color: #666;
    }
    canvas {
      max-height: 480px;
    }
    @media (max-width: 600px) {
      body {
        padding: 1rem 0.5rem;
      }
      .chart-container {
        padding: 1rem;
      }
    }
  </style>
</head>
<body>
  <h1>hd 内部增长率 (IGR) 变化</h1>
  <h2>Fiscal Years 2016–2024</h2>

  <div class="chart-container">
    <canvas id="igrChart"></canvas>
  </div>
  <div class="note">
    数据来源：用户提供结果值 RESULT_IGR。内部增长率 (IGR) 单位为小数形式（即 0.10 = 10%）。
  </div>

  <script>
    // Source data (exactly as provided)
    const fiscalYears = [
      "2016",
      "2017",
      "2018",
      "2019",
      "2020",
      "2021",
      "2022",
      "2023",
      "2024"
    ];

    const igrValues = [
      0.1067360710500543,
      0.1191744428012407,
      0.1123329816041394,
      0.1695421279294036,
      0.1248125095959655,
      0.1177204620734582,
      0.1529285130421411,
      0.1436667720469739,
      0.0969488365422537
    ];

    // Compute min/max to set a clean y-axis range with some padding
    const minVal = Math.min(...igrValues);
    const maxVal = Math.max(...igrValues);
    const padding = 0.02; // 2 percentage points in decimal
    const suggestedMin = Math.max(0, minVal - padding);
    const suggestedMax = maxVal + padding;

    const ctx = document.getElementById("igrChart").getContext("2d");

    const igrChart = new Chart(ctx, {
      type: "bar",
      data: {
        labels: fiscalYears,
        datasets: [
          {
            label: "内部增长率 (IGR)",
            data: igrValues,
            backgroundColor: "rgba(37, 99, 235, 0.7)",
            borderColor: "rgba(37, 99, 235, 1)",
            borderWidth: 1.5,
            hoverBackgroundColor: "rgba(37, 99, 235, 0.9)",
            hoverBorderColor: "rgba(30, 64, 175, 1)",
            borderRadius: 6,
            maxBarThickness: 50
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: {
          mode: "index",
          intersect: false
        },
        plugins: {
          legend: {
            display: true,
            labels: {
              font: {
                size: 12
              }
            }
          },
          tooltip: {
            callbacks: {
              label: function (context) {
                const value = context.parsed.y;
                const pct = (value * 100).toFixed(2) + "%";
                return " IGR: " + pct + " (" + value.toFixed(4) + ")";
              }
            }
          },
          title: {
            display: false
          }
        },
        scales: {
          x: {
            title: {
              display: true,
              text: "Fiscal Year",
              font: {
                size: 12,
                weight: "500"
              }
            },
            grid: {
              display: false
            }
          },
          y: {
            beginAtZero: true,
            suggestedMin: suggestedMin,
            suggestedMax: suggestedMax,
            title: {
              display: true,
              text: "内部增长率 (IGR, 小数)",
              font: {
                size: 12,
                weight: "500"
              }
            },
            ticks: {
              callback: function (value) {
                // show both decimal and percent on the axis
                const pct = (value * 100).toFixed(0);
                return value.toFixed(2) + " (" + pct + "%)";
              }
            }
          }
        }
      }
    });
  </script>
</body>
</html>
