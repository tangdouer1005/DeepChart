<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CSCO 内部增长率 (IGR) 2016–2024</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Chart.js (latest 4.x) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 24px;
      background: #f7f7f9;
      color: #222;
    }
    .chart-wrapper {
      max-width: 960px;
      margin: 0 auto;
    }
    .chart-container {
      position: relative;
      width: 100%;
      /* Fix aspect ratio (16:9) to prevent vertical stretching */
      max-width: 900px;
      margin: 0 auto;
      background: #ffffff;
      padding: 18px 18px 22px;
      border-radius: 8px;
      box-shadow:
        0 8px 16px rgba(15, 23, 42, 0.08),
        0 1px 3px rgba(15, 23, 42, 0.12);
    }
    /* Use the "intrinsic ratio" technique to control height */
    .canvas-holder {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 aspect ratio */
    }
    #igrChart {
      position: absolute;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
    }
    h1 {
      font-size: 1.4rem;
      margin: 0 0 4px;
    }
    h2 {
      font-size: 0.95rem;
      font-weight: 500;
      margin: 0 0 14px;
      color: #555;
    }
    .note {
      font-size: 0.82rem;
      color: #555;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="chart-wrapper">
    <h1>CSCO 内部增长率 (Internal Growth Rate, IGR)</h1>
    <h2>2016–2024 财年变化（柱状图）</h2>

    <div class="chart-container">
      <div class="canvas-holder">
        <canvas id="igrChart"></canvas>
      </div>
      <div class="note">
        数据单位：小数形式（例如 0.05 ≈ 5%）。将鼠标悬停在柱状图上可查看精确数值。
      </div>
    </div>
  </div>

  <script>
    // Data (from source)
    const fiscalYears = [
      "2016",
      "2017",
      "2018",
      "2019",
      "2020",
      "2021",
      "2022",
      "2023",
      "2024"
    ];

    const igrValues = [
      0.0537016861916995,
      0.0336904067019081,
      -0.046804464720875,
      0.0577798487400982,
      0.0570425240054869,
      0.0482631584683967,
      0.0619776733971817,
      0.068885347537548,
      0.036045111335986
    ];

    // Colors: positive vs negative
    const barColors = igrValues.map(v =>
      v >= 0 ? "rgba(37, 99, 235, 0.8)" : "rgba(239, 68, 68, 0.8)"
    );
    const barBorderColors = igrValues.map(v =>
      v >= 0 ? "rgba(37, 99, 235, 1)" : "rgba(239, 68, 68, 1)"
    );

    const ctx = document.getElementById("igrChart").getContext("2d");

    new Chart(ctx, {
      type: "bar",
      data: {
        labels: fiscalYears,
        datasets: [
          {
            label: "内部增长率 (IGR)",
            data: igrValues,
            backgroundColor: barColors,
            borderColor: barBorderColors,
            borderWidth: 1.3,
            borderRadius: 4,
            hoverBackgroundColor: barColors,
            hoverBorderColor: barBorderColors
          }
        ]
      },
      options: {
        // Let CSS control the aspect ratio to avoid extreme stretching
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            display: true,
            labels: {
              boxWidth: 18,
              boxHeight: 18,
              font: {
                size: 12
              }
            }
          },
          tooltip: {
            mode: "nearest",
            intersect: false,
            callbacks: {
              label: function (context) {
                const value = context.raw;
                const pct = (value * 100).toFixed(2) + "%";
                return " IGR: " + value.toFixed(6) + " (" + pct + ")";
              }
            }
          },
          title: {
            display: false
          }
        },
        scales: {
          x: {
            grid: {
              display: false
            },
            title: {
              display: true,
              text: "Fiscal Year",
              color: "#374151",
              font: {
                size: 12
              }
            },
            ticks: {
              font: {
                size: 11
              }
            }
          },
          y: {
            beginAtZero: true,
            grid: {
              color: "rgba(148, 163, 184, 0.3)"
            },
            ticks: {
              callback: function (value) {
                return (value * 100).toFixed(0) + "%";
              },
              font: {
                size: 11
              }
            },
            title: {
              display: true,
              text: "内部增长率 (IGR)",
              color: "#374151",
              font: {
                size: 12
              }
            }
          }
        },
        interaction: {
          mode: "index",
          intersect: false
        },
        animation: {
          duration: 700,
          easing: "easeOutQuart"
        },
        layout: {
          padding: {
            top: 10,
            right: 10,
            bottom: 5,
            left: 5
          }
        }
      }
    });
  </script>
</body>
</html>
