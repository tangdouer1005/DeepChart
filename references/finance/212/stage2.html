<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>P&G EBITDA 2016–2024 Bar Chart</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      color-scheme: light;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 24px;
      background-color: #f5f5f7;
      color: #222;
    }
    .container {
      max-width: 960px;
      margin: 0 auto;
      background: #ffffff;
      padding: 24px 28px 32px;
      border-radius: 10px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.06);
    }
    h1 {
      font-size: 22px;
      margin: 0 0 4px;
    }
    h2 {
      font-size: 14px;
      margin: 0 0 16px;
      color: #666;
      font-weight: 400;
    }
    .chart-wrapper {
      /* Fix aspect ratio explicitly to avoid very tall/narrow distortion */
      position: relative;
      width: 100%;
      max-width: 900px;
      /* 16:9 ratio */
      aspect-ratio: 16 / 9;
      margin: 8px 0 4px;
    }
    canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }
    .note {
      margin-top: 10px;
      font-size: 11px;
      color: #777;
      line-height: 1.4;
    }
    .legend-inline {
      margin-top: 8px;
      font-size: 12px;
      color: #555;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .legend-color-box {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      background: #4e79a7;
    }

    @media (max-width: 600px) {
      body {
        padding: 12px;
      }
      .container {
        padding: 16px 16px 20px;
      }
      h1 {
        font-size: 18px;
      }
      h2 {
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>P&G 息税折旧摊销前利润（EBITDA）趋势</h1>
    <h2>Fiscal Year 2016–2024</h2>

    <div class="chart-wrapper">
      <canvas id="ebitdaChart"></canvas>
    </div>

    <div class="legend-inline">
      <span class="legend-color-box"></span>
      <span>EBITDA（十亿美元）</span>
    </div>

    <div class="note">
      说明：数据基于用户提供的年度 EBITDA 结果（单位：美元）。坐标轴刻度和标签按十亿美元展示，提示框显示精确数值（含千分位）。
    </div>
  </div>

  <script>
    // Raw data (in USD)
    const fiscalYears = [2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024];
    const ebitdaValues = [
      17507000000,
      21674000000,
      16555000000,
      9333000000,
      19236000000,
      20806000000,
      21190000000,
      21738000000,
      22487000000
    ];

    // Convert to billions of USD for axis
    const ebitdaInBillions = ebitdaValues.map(v => v / 1_000_000_000);

    const ctx = document.getElementById('ebitdaChart').getContext('2d');

    new Chart(ctx, {
      type: 'bar',
      data: {
        labels: fiscalYears,
        datasets: [{
          label: 'EBITDA（十亿美元）',
          data: ebitdaInBillions,
          backgroundColor: '#4e79a7',
          borderColor: '#2f5b92',
          borderWidth: 1,
          borderRadius: 4,
          hoverBackgroundColor: '#6f9dd1',
          hoverBorderColor: '#2f5b92'
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false, // we control it via CSS aspect-ratio
        layout: {
          padding: {
            top: 10,
            right: 18,
            bottom: 10,
            left: 10
          }
        },
        plugins: {
          legend: {
            display: false
          },
          tooltip: {
            callbacks: {
              label: function(context) {
                const index = context.dataIndex;
                const originalValue = ebitdaValues[index];
                const billions = ebitdaInBillions[index];
                const formatted = originalValue.toLocaleString('en-US');
                return [
                  `EBITDA: $${formatted}`,
                  `≈ ${billions.toFixed(2)} 十亿美元`
                ];
              }
            }
          },
          title: {
            display: false
          }
        },
        scales: {
          x: {
            title: {
              display: true,
              text: '财年',
              color: '#444',
              font: { size: 13 }
            },
            grid: {
              display: false
            },
            ticks: {
              color: '#333',
              font: { size: 12 }
            }
          },
          y: {
            beginAtZero: true,
            title: {
              display: true,
              text: 'EBITDA（十亿美元）',
              color: '#444',
              font: { size: 13 }
            },
            ticks: {
              color: '#333',
              font: { size: 12 },
              callback: function(value) {
                return value + 'B';
              }
            },
            grid: {
              color: 'rgba(0,0,0,0.08)'
            }
          }
        },
        animation: {
          duration: 800,
          easing: 'easeOutQuart'
        }
      }
    });
  </script>
</body>
</html>
