<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>acn 投入资本回报率 (ROIC) 2016–2024</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Chart.js (latest stable 4.x) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --fg: #1f2933;
      --grid: rgba(148, 163, 184, 0.35);
      --bar: #2563eb;
      --bar-hover: #1d4ed8;
      --accent: #111827;
      --subtitle: #6b7280;
      --tooltip-bg: rgba(15, 23, 42, 0.95);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #020617;
        --fg: #e5e7eb;
        --grid: rgba(148, 163, 184, 0.35);
        --bar: #60a5fa;
        --bar-hover: #93c5fd;
        --accent: #f9fafb;
        --subtitle: #9ca3af;
      }
    }

    body {
      margin: 0;
      padding: 24px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .chart-container {
      max-width: 960px;
      width: 100%;
      background: rgba(255, 255, 255, 0.02);
      border-radius: 16px;
      padding: 20px 20px 28px;
      box-shadow:
        0 18px 45px rgba(15, 23, 42, 0.25),
        0 0 0 1px rgba(148, 163, 184, 0.25);
    }

    @media (prefers-color-scheme: light) {
      .chart-container {
        background: #ffffff;
        box-shadow:
          0 18px 45px rgba(15, 23, 42, 0.08),
          0 0 0 1px rgba(148, 163, 184, 0.12);
      }
    }

    .chart-header {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 12px;
    }

    .chart-title {
      font-size: 20px;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 0.01em;
    }

    .chart-subtitle {
      font-size: 13px;
      color: var(--subtitle);
    }

    .chart-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 16px;
      margin-top: 6px;
      font-size: 11px;
      color: var(--subtitle);
    }

    .chart-meta span {
      white-space: nowrap;
    }

    .canvas-wrapper {
      position: relative;
      width: 100%;
      height: min(480px, 70vh);
      margin-top: 6px;
    }

    .chartjs-tooltip {
      opacity: 0;
      position: absolute;
      background: var(--tooltip-bg);
      color: #f9fafb;
      border-radius: 8px;
      padding: 8px 10px;
      pointer-events: none;
      transform: translate(-50%, -100%);
      transition: opacity 0.12s ease-out;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.55);
      font-size: 11px;
      line-height: 1.4;
      white-space: nowrap;
      z-index: 9999;
    }

    .chartjs-tooltip .title {
      font-weight: 600;
      margin-bottom: 2px;
    }

    .chartjs-tooltip .value {
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="chart-container">
    <div class="chart-header">
      <div class="chart-title">acn 投入资本回报率 (ROIC)</div>
      <div class="chart-subtitle">2016–2024 财年 | 单位：倍（Return on Invested Capital）</div>
      <div class="chart-meta">
        <span>图表类型：柱状图</span>
        <span>交互：悬停查看精确数值</span>
      </div>
    </div>

    <div class="canvas-wrapper">
      <canvas id="roicChart"></canvas>
      <div id="chartjs-tooltip" class="chartjs-tooltip"></div>
    </div>
  </div>

  <script>
    // Ensure code runs after the page is fully loaded
    window.addEventListener("load", function () {
      const fiscalYears = [
        "2016", "2017", "2018", "2019",
        "2020", "2021", "2022", "2023", "2024"
      ];

      const roicValues = [
        1.667961216029256,
        1.0865768524685524,
        0.841265805204118,
        0.7170045511309749,
        0.563111426868349,
        0.5453570487871584,
        0.5244160162763601,
        0.4158979711829387,
        0.3452404023684121
      ];

      const canvas = document.getElementById("roicChart");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");

      function createBarGradient(ctx, area) {
        const gradient = ctx.createLinearGradient(0, area.bottom, 0, area.top);
        gradient.addColorStop(0, "rgba(37, 99, 235, 0.9)");
        gradient.addColorStop(0.7, "rgba(37, 99, 235, 0.98)");
        gradient.addColorStop(1, "rgba(56, 189, 248, 1)");
        return gradient;
      }

      const externalTooltipHandler = (context) => {
        const { chart, tooltip } = context;
        const tooltipEl = document.getElementById("chartjs-tooltip");
        if (!tooltipEl) return;

        if (tooltip.opacity === 0) {
          tooltipEl.style.opacity = 0;
          return;
        }

        if (tooltip.body) {
          const titleLines = tooltip.title || [];
          const bodyLines = tooltip.body.map(b => b.lines);
          const title = titleLines.join(" ");
          const valueRaw = bodyLines[0][0]; // already formatted
          tooltipEl.innerHTML = `
            <div class="title">${title} 财年</div>
            <div class="value">${valueRaw}</div>
          `;
        }

        const { offsetLeft: positionX, offsetTop: positionY } = chart.canvas;
        tooltipEl.style.opacity = 1;
        tooltipEl.style.left = positionX + tooltip.caretX + "px";
        tooltipEl.style.top = positionY + tooltip.caretY - 8 + "px";
      };

      const roicChart = new Chart(ctx, {
        type: "bar",
        data: {
          labels: fiscalYears,
          datasets: [{
            label: "ROIC",
            data: roicValues,
            borderWidth: 0,
            borderRadius: 6,
            backgroundColor: function (context) {
              const chart = context.chart;
              const area = chart.chartArea;
              if (!area) {
                return "rgba(37, 99, 235, 0.9)";
              }
              return createBarGradient(chart.ctx, area);
            },
            hoverBackgroundColor: getComputedStyle(document.documentElement)
              .getPropertyValue("--bar-hover") || "#1d4ed8",
            maxBarThickness: 48
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              display: true,
              labels: {
                usePointStyle: true,
                padding: 16,
                font: { size: 11 }
              }
            },
            tooltip: {
              enabled: false, // use external
              external: externalTooltipHandler,
              callbacks: {
                label: (ctx) => {
                  const v = ctx.raw;
                  if (v == null || isNaN(v)) return "";
                  return v.toFixed(3) + " 倍";
                }
              }
            },
            title: { display: false }
          },
          layout: {
            padding: { top: 8, right: 12, bottom: 0, left: 4 }
          },
          scales: {
            x: {
              grid: { display: false },
              ticks: { font: { size: 11 } }
            },
            y: {
              beginAtZero: true,
              grace: "10%",
              grid: {
                color: getComputedStyle(document.documentElement)
                  .getPropertyValue("--grid") || "rgba(148, 163, 184, 0.35)"
              },
              ticks: {
                font: { size: 11 },
                callback: (val) => Number(val).toFixed(1) + "x"
              },
              title: {
                display: true,
                text: "ROIC（倍）",
                font: { size: 12, weight: "500" }
              }
            }
          },
          animation: {
            duration: 700,
            easing: "easeOutCubic"
          },
          hover: {
            mode: "nearest",
            intersect: true
          }
        }
      });

      // keep gradient correct on resize
      window.addEventListener("resize", () => {
        roicChart.update("none");
      });
    });
  </script>
</body>
</html>
