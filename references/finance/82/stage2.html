<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>GE 现金循环周期 (CCC) 2016-2024 柱状图</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f7fb;
      --card-bg: #ffffff;
      --text: #222222;
      --accent: #1f77b4;
      --accent-soft: rgba(31, 119, 180, 0.15);
      --grid: #e0e0e0;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --card-bg: #020617;
        --text: #e5e7eb;
        --accent: #38bdf8;
        --accent-soft: rgba(56, 189, 248, 0.18);
        --grid: #1f2933;
      }
    }

    body {
      margin: 0;
      padding: 0;
      font-family: var(--font);
      background: radial-gradient(circle at top, #e0f2fe 0, var(--bg) 45%, var(--bg) 100%);
      min-height: 100vh;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      max-width: 900px;
      width: 95%;
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px 22px 18px;
      box-shadow:
        0 18px 45px rgba(15, 23, 42, 0.15),
        0 0 0 1px rgba(148, 163, 184, 0.25);
    }

    header {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px 16px;
      align-items: baseline;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 18px;
      margin: 0;
      letter-spacing: 0.02em;
    }

    .subtitle {
      font-size: 12px;
      color: #6b7280;
    }

    .meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      font-size: 11px;
      color: #6b7280;
      text-align: right;
    }

    .meta span {
      white-space: nowrap;
    }

    .chart-wrapper {
      position: relative;
      margin: 4px 0 4px;
      height: 420px;
    }

    .legend {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #4b5563;
      margin-top: 2px;
    }

    .legend-color {
      width: 10px;
      height: 10px;
      border-radius: 2px;
      background: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-soft);
    }

    footer {
      margin-top: 6px;
      font-size: 10px;
      color: #9ca3af;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 4px 10px;
    }

    .range-highlight {
      font-weight: 500;
      color: var(--accent);
    }

    @media (max-width: 640px) {
      .container {
        padding: 14px 12px 12px;
      }
      .chart-wrapper {
        height: 360px;
      }
      h1 {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>GE 现金循环周期 (CCC) 趋势</h1>
        <div class="subtitle">按财年 / 单位：天</div>
      </div>
      <div class="meta">
        <span>范围：<span class="range-highlight">2016 – 2024</span></span>
        <span>图表类型：柱状图（可交互）</span>
      </div>
    </header>

    <div class="chart-wrapper">
      <canvas id="cccChart" aria-label="GE 现金循环周期 2016 至 2024 年变化柱状图" role="img"></canvas>
    </div>

    <div class="legend">
      <span class="legend-color"></span>
      <span>GE 现金循环周期（CCC）</span>
    </div>

    <footer>
      <span>来源：用户提供的 GE 财年 CCC 数据</span>
      <span>交互：移动端可触摸查看精确数值</span>
    </footer>
  </div>

  <!-- Chart.js (latest stable 4.x) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script>
    // 数据（来自题目提供的来源数据）
    const years = [
      "2016", "2017", "2018", "2019",
      "2020", "2021", "2022", "2023", "2024"
    ];

    const cccValues = [
      149.6711940824679,
      171.2966847638093,
      145.57480508012088,
      96.9868320920116,
      94.3807313851621,
      134.7721099077143,
      105.86184134488587,
      202.2033818667261,
      140.95907556681314
    ];

    // 计算最小/最大值用于 y 轴范围
    const minCCC = Math.min(...cccValues);
    const maxCCC = Math.max(...cccValues);
    const padding = 10; // y 轴上下留白

    const ctx = document.getElementById("cccChart").getContext("2d");

    const cccChart = new Chart(ctx, {
      type: "bar",
      data: {
        labels: years,
        datasets: [{
          label: "现金循环周期 (天)",
          data: cccValues,
          backgroundColor: "rgba(31, 119, 180, 0.7)",
          borderColor: "rgba(31, 119, 180, 1)",
          hoverBackgroundColor: "rgba(31, 119, 180, 0.9)",
          borderWidth: 1.2,
          borderRadius: 5,
          barPercentage: 0.7,
          categoryPercentage: 0.7
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: {
          mode: "index",
          intersect: false
        },
        plugins: {
          legend: {
            display: false
          },
          tooltip: {
            backgroundColor: "rgba(15, 23, 42, 0.9)",
            titleFont: { size: 12, weight: "600" },
            bodyFont: { size: 11 },
            padding: 10,
            displayColors: false,
            callbacks: {
              label: function (context) {
                const value = context.raw;
                return "CCC: " + value.toFixed(2) + " 天";
              },
              title: function (context) {
                return "财年 " + context[0].label;
              }
            }
          },
          title: {
            display: false
          }
        },
        scales: {
          x: {
            grid: {
              display: false
            },
            ticks: {
              font: {
                size: 11
              }
            }
          },
          y: {
            beginAtZero: false,
            suggestedMin: Math.max(0, Math.floor(minCCC - padding)),
            suggestedMax: Math.ceil(maxCCC + padding),
            grid: {
              color: getComputedStyle(document.documentElement)
                .getPropertyValue("--grid").trim() || "#e0e0e0",
              drawBorder: false
            },
            ticks: {
              font: {
                size: 11
              },
              callback: function (value) {
                return value + " 天";
              }
            },
            title: {
              display: true,
              text: "现金循环周期（天）",
              font: {
                size: 12,
                weight: "500"
              }
            }
          }
        },
        animation: {
          duration: 900,
          easing: "easeOutCubic"
        }
      }
    });
  </script>
</body>
</html>
