<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>ma 的格雷厄姆“烟蒂股”净值（NNWC）趋势（2016–2024）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Chart.js (latest stable 4.x) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      color-scheme: light dark;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
      margin: 0;
      padding: 16px;
      background: #f5f5f7;
      color: #222;
    }
    @media (prefers-color-scheme: dark) {
      body {
        background: #020617;
        color: #e5e7eb;
      }
    }
    h1 {
      font-size: 1.3rem;
      margin: 0 0 4px 0;
      font-weight: 600;
    }
    h2 {
      font-size: 0.95rem;
      font-weight: 400;
      margin: 0 0 14px 0;
      color: #555;
    }
    @media (prefers-color-scheme: dark) {
      h2 {
        color: #9ca3af;
      }
    }
    .chart-wrapper {
      max-width: 880px;
      margin: 0 auto;
    }
    .chart-container {
      position: relative;
      /* Keep a stable 16:9-ish aspect ratio to avoid vertical stretching */
      aspect-ratio: 16 / 9;
      max-height: 480px;
      min-height: 260px;
      background: #ffffff;
      border-radius: 8px;
      padding: 16px 18px 20px;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.08);
      box-sizing: border-box;
    }
    @media (prefers-color-scheme: dark) {
      .chart-container {
        background: #020617;
        box-shadow: 0 4px 20px rgba(15, 23, 42, 0.8);
      }
    }
    canvas {
      /* Chart.js will fill this area; no explicit height to avoid distortion */
      width: 100% !important;
      height: 100% !important;
    }
    .note {
      max-width: 880px;
      margin: 10px auto 0;
      font-size: 0.8rem;
      color: #666;
      line-height: 1.4;
    }
    @media (prefers-color-scheme: dark) {
      .note {
        color: #9ca3af;
      }
    }
  </style>
</head>
<body>
  <div class="chart-wrapper">
    <div class="chart-container">
      <h1>ma 的格雷厄姆“烟蒂股”净值（NNWC）</h1>
      <h2>每股 NNWC 变化趋势（2016–2024 财年）</h2>
      <canvas id="nnwcChart"></canvas>
    </div>
    <div class="note">
      数据来源：用户提供的每股 NNWC 结果（RESULT_NNWC_Per_Share）。单位：与原始数据一致（每股）。
    </div>
  </div>

  <script>
    // 财年标签
    const years = [
      "2016",
      "2017",
      "2018",
      "2019",
      "2020",
      "2021",
      "2022",
      "2023",
      "2024"
    ];

    // 每股 NNWC 数据
    const nnwcPerShare = [
      0.215258852457637,
      -1.8320895248941864,
      -3.0563514366329785,
      -6.206457925636008,
      -7.906560636182903,
      -13.415322580645162,
      -16.21112255406797,
      -17.431289640591967,
      -23.562028047464946
    ];

    const ctx = document.getElementById("nnwcChart").getContext("2d");

    new Chart(ctx, {
      type: "line",
      data: {
        labels: years,
        datasets: [
          {
            label: "每股 NNWC",
            data: nnwcPerShare,
            borderColor: "rgba(37, 99, 235, 1)",
            backgroundColor: "rgba(37, 99, 235, 0.08)",
            pointBackgroundColor: "rgba(37, 99, 235, 1)",
            pointRadius: 3,
            pointHoverRadius: 5,
            borderWidth: 2,
            tension: 0.25,
            fill: true
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false, // we control ratio via CSS wrapper
        interaction: {
          mode: "nearest",
          intersect: false
        },
        plugins: {
          legend: {
            display: true,
            labels: {
              usePointStyle: true,
              boxWidth: 6,
              font: { size: 11 }
            }
          },
          tooltip: {
            backgroundColor: "rgba(15,23,42,0.94)",
            borderColor: "rgba(148, 163, 184, 0.7)",
            borderWidth: 1,
            cornerRadius: 6,
            padding: 10,
            callbacks: {
              label: function (context) {
                const v = context.parsed.y;
                const formatted =
                  Math.abs(v) < 0.0001 ? v.toExponential(2) : v.toFixed(4);
                return " 每股 NNWC: " + formatted;
              }
            }
          }
        },
        scales: {
          x: {
            title: {
              display: true,
              text: "财年",
              font: { size: 11 }
            },
            grid: {
              display: false
            },
            ticks: {
              font: { size: 11 }
            }
          },
          y: {
            title: {
              display: true,
              text: "每股 NNWC",
              font: { size: 11 }
            },
            grid: {
              color: "rgba(148, 163, 184, 0.3)"
            },
            ticks: {
              font: { size: 11 }
            }
          }
        }
      }
    });
  </script>
</body>
</html>
