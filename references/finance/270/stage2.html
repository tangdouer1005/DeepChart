<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>v 的资本再投资率（2016–2024）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Chart.js (latest 4.x) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --fg: #1f2933;
      --grid: #d3dce6;
      --accent: #2563eb;
      --accent-light: rgba(37, 99, 235, 0.12);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1120;
        --fg: #e5e7eb;
        --grid: #1f2937;
        --accent: #60a5fa;
        --accent-light: rgba(96, 165, 250, 0.15);
      }
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
    }

    body {
      margin: 0;
      padding: 2rem 1.5rem 2.5rem;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 920px;
    }

    h1 {
      margin: 0 0 0.25rem;
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    h2 {
      margin: 0 0 1rem;
      font-size: 0.95rem;
      font-weight: 400;
      color: #6b7280;
    }

    @media (prefers-color-scheme: dark) {
      h2 {
        color: #9ca3af;
      }
    }

    .chart-card {
      background: radial-gradient(circle at top left, rgba(37, 99, 235, 0.05), transparent 60%),
                  radial-gradient(circle at bottom right, rgba(59, 130, 246, 0.06), transparent 55%),
                  var(--bg);
      border-radius: 16px;
      padding: 1.25rem 1.25rem 1rem;
      box-shadow:
        0 18px 45px rgba(15, 23, 42, 0.16),
        0 0 0 1px rgba(148, 163, 184, 0.16);
    }

    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
      flex-wrap: wrap;
    }

    .chart-meta {
      font-size: 0.8rem;
      color: #6b7280;
    }

    @media (prefers-color-scheme: dark) {
      .chart-meta {
        color: #9ca3af;
      }
    }

    .chart-wrapper {
      position: relative;
      width: 100%;
      height: 420px;
    }

    .note {
      margin-top: 0.75rem;
      font-size: 0.78rem;
      color: #6b7280;
      line-height: 1.4;
    }

    @media (prefers-color-scheme: dark) {
      .note {
        color: #9ca3af;
      }
    }

    .toggle-row {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.3rem;
      font-size: 0.78rem;
      color: #6b7280;
    }

    @media (prefers-color-scheme: dark) {
      .toggle-row {
        color: #9ca3af;
      }
    }

    .toggle-row input {
      cursor: pointer;
    }

    .toggle-row label {
      cursor: pointer;
      user-select: none;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>v 的资本再投资率（Reinvestment Rate）</h1>
  <h2>2016–2024 年度变化趋势</h2>

  <div class="chart-card">
    <div class="chart-header">
      <div class="chart-meta">单位：小数（可视为占比，例如 0.13 ≈ 13%）</div>
    </div>

    <div class="toggle-row">
      <label for="pctToggle">
        <input type="checkbox" id="pctToggle">
        以百分比形式显示数值
      </label>
    </div>

    <div class="chart-wrapper">
      <canvas id="reinvestmentChart"></canvas>
    </div>

    <div class="note">
      数据来源：用户提供的 2016–2024 财年 v 的资本再投资率（RESULT_Reinvestment_Rate）。<br>
      负值表示资本净回收或再投资为负，正值表示资本净投入或再投资为正。
    </div>
  </div>
</div>

<script>
  // 原始数据
  const labels = [
    "2016", "2017", "2018", "2019", "2020",
    "2021", "2022", "2023", "2024"
  ];

  const reinvestmentData = [
    -0.1642197746279023,
    -0.1611376277622699,
    0.0701532175481268,
    0.2912535632282351,
    -0.2720071389438035,
    -0.2367802386973345,
    0.0324195470663024,
    -0.0347974956786396,
    0.1306088256344503
  ];

  const ctx = document.getElementById("reinvestmentChart").getContext("2d");

  // 计算用于 Y 轴范围的边界并适当留白
  const minVal = Math.min(...reinvestmentData);
  const maxVal = Math.max(...reinvestmentData);
  const padding = (maxVal - minVal || 0.1) * 0.2;
  const suggestedMin = minVal - padding;
  const suggestedMax = maxVal + padding;

  const baseOptions = {
    responsive: true,
    maintainAspectRatio: false,
    interaction: {
      mode: "index",
      intersect: false
    },
    animation: {
      duration: 600,
      easing: "easeOutQuart"
    },
    plugins: {
      legend: {
        display: false
      },
      tooltip: {
        backgroundColor: "rgba(15,23,42,0.9)",
        borderColor: "rgba(148,163,184,0.4)",
        borderWidth: 1,
        padding: 10,
        displayColors: false,
        callbacks: {
          label: function(context) {
            const value = context.raw;
            const isPercent = document.getElementById("pctToggle").checked;
            if (isPercent) {
              return "资本再投资率: " + (value * 100).toFixed(2) + "%";
            }
            return "资本再投资率: " + value.toFixed(4);
          }
        }
      },
      title: {
        display: false
      }
    },
    scales: {
      x: {
        grid: {
          display: false
        },
        ticks: {
          maxRotation: 0,
          minRotation: 0
        }
      },
      y: {
        beginAtZero: false,
        suggestedMin: suggestedMin,
        suggestedMax: suggestedMax,
        grid: {
          color: function(context) {
            return context.tick.value === 0 ? "rgba(148,163,184,0.8)" : "rgba(148,163,184,0.28)";
          },
          lineWidth: function(context) {
            return context.tick.value === 0 ? 1.2 : 0.6;
          },
          drawBorder: false
        },
        ticks: {
          callback: function(value) {
            const isPercent = document.getElementById("pctToggle").checked;
            if (isPercent) {
              return (value * 100).toFixed(0) + "%";
            }
            return value.toFixed(2);
          }
        }
      }
    }
  };

  const gradient = (() => {
    const chartArea = { width: 600, height: 400 }; // placeholder for initial
    const g = ctx.createLinearGradient(0, 0, 0, chartArea.height);
    g.addColorStop(0, "rgba(37,99,235,0.22)");
    g.addColorStop(0.4, "rgba(59,130,246,0.12)");
    g.addColorStop(1, "rgba(37,99,235,0.02)");
    return g;
  })();

  const chartConfig = {
    type: "line",
    data: {
      labels: labels,
      datasets: [{
        label: "资本再投资率",
        data: reinvestmentData,
        tension: 0.32,
        borderColor: "rgba(37,99,235,1)",
        borderWidth: 2,
        pointRadius: 4,
        pointHoverRadius: 5,
        pointBackgroundColor: "rgba(255,255,255,1)",
        pointBorderColor: "rgba(37,99,235,1)",
        pointBorderWidth: 1.5,
        fill: true,
        backgroundColor: gradient
      }]
    },
    options: baseOptions
  };

  const reinvestmentChart = new Chart(ctx, chartConfig);

  // 根据容器实时更新渐变（自适应大小）
  function updateGradient() {
    const chart = reinvestmentChart;
    const chartArea = chart.chartArea;
    if (!chartArea || !chartArea.width || !chartArea.height) return;

    const g = ctx.createLinearGradient(0, chartArea.top, 0, chartArea.bottom);
    g.addColorStop(0, "rgba(37,99,235,0.24)");
    g.addColorStop(0.4, "rgba(59,130,246,0.14)");
    g.addColorStop(1, "rgba(37,99,235,0.01)");

    chart.data.datasets[0].backgroundColor = g;
    chart.update();
  }

  reinvestmentChart.options.animation.onComplete = updateGradient;
  window.addEventListener("resize", () => {
    clearTimeout(window.__resizeTimer);
    window.__resizeTimer = setTimeout(() => {
      updateGradient();
    }, 150);
  });

  // 切换百分比显示
  document.getElementById("pctToggle").addEventListener("change", () => {
    reinvestmentChart.update();
  });
</script>
</body>
</html>
