<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ma's 可持续增长率 (SGR) 2016–2024</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Chart.js (latest stable) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      color-scheme: light dark;
      --bg-color: #020617;
      --fg-color: #e5e7eb;
      --card-bg: #020617;
      --accent: #2563eb;
      --accent-soft: rgba(37, 99, 235, 0.25);
      --grid-color: rgba(148, 163, 184, 0.35);
      --border-color: #1f2933;
      --font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      font-family: var(--font-family);
      background: radial-gradient(circle at top left, #0f172a 0, #020617 45%, #000 100%);
      color: var(--fg-color);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: stretch;
    }

    .wrapper {
      max-width: 960px;
      width: 100%;
    }

    .card {
      background: #020617;
      border-radius: 18px;
      padding: 20px 20px 18px;
      border: 1px solid rgba(148, 163, 184, 0.22);
      box-shadow:
        0 18px 45px rgba(15, 23, 42, 0.75),
        0 0 0 1px rgba(15, 23, 42, 0.9);
    }

    .header {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 16px;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .title-block {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0.02em;
      font-weight: 600;
      color: #e5e7eb;
    }

    .subtitle {
      font-size: 12px;
      color: #9ca3af;
    }

    .legend {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #9ca3af;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(148, 163, 184, 0.45);
    }

    .legend-swatch {
      width: 10px;
      height: 10px;
      border-radius: 2px;
      background: linear-gradient(180deg, #38bdf8 0, #2563eb 60%, #1d4ed8 100%);
      box-shadow: 0 0 0 1px rgba(8, 47, 73, 0.7);
    }

    .chart-container {
      position: relative;
      width: 100%;
      height: 420px;
    }

    .footer {
      margin-top: 8px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 11px;
      color: #6b7280;
    }

    .footnote { max-width: 70%; }

    .controls {
      display: inline-flex;
      gap: 4px;
      align-items: center;
    }

    .btn {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.5);
      background: rgba(15, 23, 42, 0.8);
      color: #d1d5db;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.05s ease;
    }

    .btn:hover {
      background: rgba(30, 64, 175, 0.85);
      border-color: rgba(129, 140, 248, 0.9);
      transform: translateY(-0.5px);
    }

    .btn:active {
      transform: translateY(0);
      background: rgba(30, 64, 175, 0.95);
    }

    @media (max-width: 640px) {
      body { padding: 12px; }
      .card { padding: 14px 12px 10px; }
      .chart-container { height: 360px; }
      .footer { flex-direction: column; }
      .footnote { max-width: 100%; }
    }
  </style>
</head>
<body>
<div class="wrapper">
  <div class="card">
    <div class="header">
      <div class="title-block">
        <h1>ma 的可持续增长率（SGR）变化趋势：2016–2024</h1>
        <div class="subtitle">
          显示 2016–2024 年间 ma 的可持续增长率（Sustainable Growth Rate, SGR）年度变化。
        </div>
      </div>

      <div class="controls">
        <div class="legend">
          <span class="legend-swatch"></span>
          <span>可持续增长率（SGR）</span>
        </div>
        <button class="btn" id="toggleValuesBtn">切换数据标签</button>
      </div>
    </div>

    <div class="chart-container">
      <canvas id="sgrChart"></canvas>
    </div>

    <div class="footer">
      <div class="footnote">
        数据来源：用户提供的 ma 的 SGR 结果（RESULT_SGR）。单位为倍数（times），数值 &gt; 1 表示理论上可支撑的较高可持续增长率。
      </div>
      <div>
        交互说明：悬停查看精确数值；使用“切换数据标签”控制柱顶数据展示。
      </div>
    </div>
  </div>
</div>

<script>
  // Exact data from the prompt
  const labels = [
    "2016", "2017", "2018", "2019", "2020",
    "2021", "2022", "2023", "2024"
  ];

  const sgrValues = [
    0.5515234508729887,
    0.5345199568500539,
    0.8864954432477217,
    1.2000354358610914,
    0.78248127645718,
    1.0137926001605488,
    1.1795738427626743,
    1.3664474181598243,
    1.5544953034143432
  ];

  const maxValue = Math.max(...sgrValues);
  const suggestedMax = Math.ceil((maxValue * 1.15) * 10) / 10;

  // Simple value-label plugin (no config nesting inside options)
  const valueLabelPlugin = {
    id: "valueLabelPlugin",
    afterDatasetsDraw(chart, args, pluginOptions) {
      if (!pluginOptions || !pluginOptions.show) return;

      const { ctx } = chart;
      const dataset = chart.data.datasets[0];
      const meta = chart.getDatasetMeta(0);
      ctx.save();
      ctx.font = "11px system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif";
      ctx.fillStyle = "rgba(229, 231, 235, 0.9)";
      ctx.textAlign = "center";
      ctx.textBaseline = "bottom";

      meta.data.forEach((bar, index) => {
        const val = dataset.data[index];
        const rounded = Number(val).toFixed(2);
        const x = bar.x;
        const y = bar.y - 4;
        ctx.fillText(rounded, x, y);
      });
      ctx.restore();
    }
  };

  const ctx = document.getElementById("sgrChart");

  const sgrChart = new Chart(ctx, {
    type: "bar",
    data: {
      labels,
      datasets: [{
        label: "可持续增长率（SGR）",
        data: sgrValues,
        // Use a static color so bars always render correctly
        backgroundColor: "rgba(59, 130, 246, 0.85)",
        hoverBackgroundColor: "rgba(59, 130, 246, 1)",
        borderRadius: 6,
        borderWidth: 0,
        barPercentage: 0.7,
        categoryPercentage: 0.7
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: {
        duration: 800,
        easing: "easeOutCubic"
      },
      layout: {
        padding: { top: 10, right: 10, left: 4, bottom: 8 }
      },
      plugins: {
        legend: {
          display: false
        },
        tooltip: {
          enabled: true,
          backgroundColor: "rgba(15, 23, 42, 0.96)",
          borderColor: "rgba(148, 163, 184, 0.7)",
          borderWidth: 1,
          padding: 10,
          titleColor: "#e5e7eb",
          bodyColor: "#e5e7eb",
          titleFont: { size: 12, weight: "600" },
          bodyFont: { size: 11 },
          callbacks: {
            label: (context) => {
              const v = context.parsed.y;
              return "SGR: " + v.toFixed(4);
            }
          }
        },
        // Plugin configuration goes under the plugin id
        valueLabelPlugin: {
          show: false
        }
      },
      scales: {
        x: {
          grid: { display: false },
          ticks: {
            color: "rgba(148, 163, 184, 0.9)",
            font: { size: 11 }
          }
        },
        y: {
          beginAtZero: true,
          suggestedMax,
          grid: {
            color: "rgba(51, 65, 85, 0.5)",
            drawBorder: false
          },
          ticks: {
            color: "rgba(148, 163, 184, 0.9)",
            font: { size: 11 },
            callback: (value) => value.toFixed(1)
          },
          title: {
            display: true,
            text: "SGR（倍数）",
            color: "rgba(156, 163, 175, 0.9)",
            font: { size: 11 }
          }
        }
      }
    },
    plugins: [valueLabelPlugin]
  });

  // Toggle labels visibility
  const toggleBtn = document.getElementById("toggleValuesBtn");
  toggleBtn.addEventListener("click", () => {
    const current = sgrChart.options.plugins.valueLabelPlugin.show;
    sgrChart.options.plugins.valueLabelPlugin.show = !current;
    sgrChart.update();
  });
</script>
</body>
</html>
