<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <title>ma 的防御区间比率 (DIR) 变化趋势（2016–2024）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Chart.js (latest stable v4.x) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Chart.js Zoom Plugin -->
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.umd.min.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
      margin: 0;
      padding: 24px;
      background-color: #f7f7f9;
      color: #222;
    }

    h1 {
      font-size: 22px;
      margin: 0 0 4px;
      font-weight: 600;
    }

    h2 {
      font-size: 14px;
      margin: 0 0 16px;
      font-weight: 400;
      color: #555;
    }

    .chart-container {
      max-width: 900px;
      margin: 0 auto;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.06);
      padding: 20px 20px 16px;
    }

    .chart-wrapper {
      position: relative;
      height: 420px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
      font-size: 12px;
    }

    .controls button {
      border: 1px solid #d0d7de;
      background-color: #fff;
      border-radius: 4px;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 12px;
      color: #24292f;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .controls button:hover {
      background-color: #f3f4f6;
      border-color: #9ca3af;
    }

    .source {
      margin-top: 10px;
      font-size: 11px;
      color: #6b7280;
    }

    @media (max-width: 600px) {
      body {
        padding: 12px;
      }
      .chart-container {
        padding: 14px 12px 12px;
      }
      .chart-wrapper {
        height: 320px;
      }
    }
  </style>
</head>
<body>
  <div class="chart-container">
    <h1>ma 的防御区间比率 (DIR) 变化趋势</h1>
    <h2>2016 — 2024 财年</h2>

    <div class="chart-wrapper">
      <canvas id="dirChart"></canvas>
    </div>

    <div class="controls">
      <button id="resetZoomBtn">重置缩放</button>
      <span style="align-self:center; color:#6b7280;">
        提示：按住鼠标拖拽可框选缩放，滚轮可放大/缩小，拖拽图表可平移视图。
      </span>
    </div>

    <div class="source">
      数据：用户提供的 RESULT_DIR（防御区间比率），单位为原始数值。
    </div>
  </div>

  <script>
    // Source data (2016–2024)
    const years = [
      "2016",
      "2017",
      "2018",
      "2019",
      "2020",
      "2021",
      "2022",
      "2023",
      "2024",
    ];

    const dirValues = [
      671.7746759720837,
      576.3582978723404,
      543.1207616066771,
      631.8610610887935,
      645.0186980609418,
      432.38525335151104,
      381.8354557304723,
      416.27772768259695,
      354.2689709972189,
    ];

    const ctx = document.getElementById("dirChart").getContext("2d");

    const dirChart = new Chart(ctx, {
      type: "line",
      data: {
        labels: years,
        datasets: [
          {
            label: "防御区间比率 (DIR)",
            data: dirValues,
            borderColor: "#2563EB",
            backgroundColor: "rgba(37, 99, 235, 0.12)",
            pointBackgroundColor: "#2563EB",
            pointBorderColor: "#ffffff",
            pointHoverRadius: 5,
            pointRadius: 4,
            pointBorderWidth: 2,
            tension: 0.25, // smooth curve
            fill: true,
          },
        ],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: {
          mode: "nearest",
          intersect: false,
        },
        plugins: {
          legend: {
            display: true,
            labels: {
              usePointStyle: true,
              boxWidth: 6,
              boxHeight: 6,
            },
          },
          tooltip: {
            callbacks: {
              label: function (context) {
                const value = context.parsed.y;
                return " DIR: " + value.toFixed(2);
              },
            },
          },
          title: {
            display: false,
          },
          zoom: {
            pan: {
              enabled: true,
              mode: "x",
            },
            zoom: {
              wheel: {
                enabled: true,
              },
              drag: {
                enabled: true,
              },
              mode: "x",
            },
          },
        },
        scales: {
          x: {
            title: {
              display: true,
              text: "财年 (Fiscal Year)",
              font: {
                size: 12,
              },
            },
            grid: {
              display: false,
            },
          },
          y: {
            title: {
              display: true,
              text: "防御区间比率 (DIR)",
              font: {
                size: 12,
              },
            },
            ticks: {
              callback: function (value) {
                return value.toFixed(0);
              },
            },
            grid: {
              color: "rgba(148, 163, 184, 0.25)",
            },
          },
        },
      },
    });

    // Reset zoom button
    document
      .getElementById("resetZoomBtn")
      .addEventListener("click", function () {
        dirChart.resetZoom();
      });
  </script>
</body>
</html>
