<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>v's 盈余-现金质量剪刀差 (2016–2024)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Chart.js (latest stable 4.x) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            margin: 0;
            padding: 20px;
            background: #f9fafb;
            color: #111827;
        }
        h1 {
            font-size: 20px;
            margin-bottom: 4px;
        }
        h2 {
            font-size: 14px;
            margin-top: 0;
            margin-bottom: 16px;
            font-weight: 400;
            color: #6b7280;
        }
        .chart-container {
            position: relative;
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            padding: 16px 20px 24px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.06);
        }
        canvas {
            max-height: 480px;
        }
        .note {
            max-width: 900px;
            margin: 10px auto 0;
            font-size: 12px;
            color: #6b7280;
        }
        .legend-note {
            margin-top: 8px;
            font-size: 12px;
            color: #4b5563;
        }
    </style>
</head>
<body>
<div class="chart-container">
    <h1>v's 盈余-现金质量剪刀差</h1>
    <h2>Fiscal Years 2016–2024</h2>
    <canvas id="spreadChart"></canvas>
    <div class="legend-note">
        单位：绝对值（无量纲）。0 表示盈余质量与现金质量大致一致，偏离 0 越远剪刀差越大。
    </div>
</div>
<div class="note">
    数据来源：用户提供的 RESULT_Spread 序列。可通过拖拽或缩放查看细节（在触摸设备上用双指缩放）。
</div>

<script>
    // Data from source
    const years = [
        "2016", "2017", "2018", "2019",
        "2020", "2021", "2022", "2023", "2024"
    ];

    const spreadValues = [
        -0.0080656080153188,
        0.0380116959064327,
        0.0351598373201557,
        0.0099295481632451,
        -0.0055507417276357,
        0.0356011354271587,
        0.0462241013794782,
        0.0395681818181818,
        0.0022377168801686
    ];

    // Format numbers to 4 decimal places for tooltips
    function formatValue(v) {
        return Number(v).toFixed(4);
    }

    const ctx = document.getElementById('spreadChart').getContext('2d');

    const chart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: years,
            datasets: [{
                label: "盈余-现金质量剪刀差 (RESULT_Spread)",
                data: spreadValues,
                borderColor: "#2563eb",
                backgroundColor: "rgba(37, 99, 235, 0.1)",
                tension: 0.25,
                pointRadius: 4,
                pointHoverRadius: 6,
                pointBackgroundColor: "#2563eb",
                pointBorderWidth: 1,
                fill: true
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: {
                mode: 'index',
                intersect: false
            },
            plugins: {
                tooltip: {
                    backgroundColor: "rgba(17,24,39,0.9)",
                    titleColor: "#e5e7eb",
                    bodyColor: "#f9fafb",
                    borderColor: "#4b5563",
                    borderWidth: 1,
                    padding: 10,
                    callbacks: {
                        label: function(context) {
                            const year = context.label;
                            const val = formatValue(context.parsed.y);
                            return ` ${year} 剪刀差: ${val}`;
                        }
                    }
                },
                legend: {
                    display: true,
                    labels: {
                        usePointStyle: true,
                        padding: 16
                    }
                },
                title: {
                    display: false
                }
            },
            scales: {
                x: {
                    title: {
                        display: true,
                        text: "Fiscal Year"
                    },
                    grid: {
                        display: false
                    }
                },
                y: {
                    title: {
                        display: true,
                        text: "Earnings Quality Spread (RESULT_Spread)"
                    },
                    ticks: {
                        callback: function(value) {
                            return value.toFixed(3);
                        }
                    },
                    grid: {
                        color: "rgba(209, 213, 219, 0.5)"
                    }
                }
            }
        }
    });
</script>
</body>
</html>
