<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>NFLX 经济增加值 (EVA) 简化版：2016–2024</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Chart.js (latest stable 4.x) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Chart.js zoom plugin -->
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.umd.min.js"></script>

  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --fg: #1f2933;
      --grid: #d1d5db;
      --accent: #2563eb;
      --accent-soft: rgba(37, 99, 235, 0.08);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1120;
        --fg: #e5e7eb;
        --grid: #4b5563;
        --accent: #60a5fa;
        --accent-soft: rgba(96, 165, 250, 0.12);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--fg);
      padding: 24px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 0.3rem;
    }

    p.subtitle {
      font-size: 0.9rem;
      margin-bottom: 1.2rem;
      color: #6b7280;
    }

    @media (prefers-color-scheme: dark) {
      p.subtitle { color: #9ca3af; }
    }

    .chart-wrapper {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    .chart-container {
      position: relative;
      /* FIX 1: Give the chart a clear landscape aspect ratio */
      width: 100%;
      aspect-ratio: 16 / 9;
      min-height: 280px;
      max-height: 520px;

      padding: 16px 18px 22px 18px;
      border-radius: 10px;
      background: radial-gradient(circle at top left, var(--accent-soft), transparent 55%),
                  radial-gradient(circle at bottom right, rgba(148, 163, 184, 0.08), transparent 60%),
                  var(--bg);
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.18);
      display: flex;
      flex-direction: column;
    }

    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 10px;
      gap: 8px;
      flex-wrap: wrap;
    }

    .chart-header-title {
      font-size: 1.05rem;
      font-weight: 600;
    }

    .chart-header-meta {
      font-size: 0.8rem;
      color: #6b7280;
    }

    @media (prefers-color-scheme: dark) {
      .chart-header-meta { color: #9ca3af; }
    }

    .chart-canvas-container {
      /* FIX 2: This makes the canvas occupy remaining height cleanly */
      position: relative;
      flex: 1 1 auto;
    }

    canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }

    .chart-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      font-size: 0.75rem;
      color: #9ca3af;
      flex-wrap: wrap;
      gap: 6px;
    }

    .unit-toggle {
      font-size: 0.75rem;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.6);
      padding: 3px;
      display: inline-flex;
      align-items: center;
      background: rgba(15, 23, 42, 0.02);
    }

    .unit-toggle button {
      border: none;
      background: transparent;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 0.74rem;
      cursor: pointer;
      color: #6b7280;
      transition: background 0.2s, color 0.2s;
    }

    .unit-toggle button.active {
      background: var(--accent);
      color: #f9fafb;
    }

    .unit-toggle button:not(.active):hover {
      background: rgba(148, 163, 184, 0.18);
    }

    @media (max-width: 600px) {
      body {
        padding: 16px;
      }
      .chart-container {
        padding: 12px 10px 16px 10px;
        aspect-ratio: 4 / 3; /* Slightly taller on phones but still not extreme */
      }
      .chart-header {
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <h1>NFLX 经济增加值 (EVA) – 简化版</h1>
  <p class="subtitle">展示 2016–2024 财年 NFLX 经济增加值的变化趋势（单位可切换：美元 / 十亿美元）</p>

  <div class="chart-wrapper">
    <div class="chart-container">
      <div class="chart-header">
        <div class="chart-header-title">NFLX EVA 趋势（2016–2024 财年）</div>
        <div class="chart-header-meta">
          数据来源：用户提供 | 货币单位：美元（EVA）
        </div>
      </div>

      <div class="chart-canvas-container">
        <canvas id="evaChart" aria-label="NFLX 2016 至 2024 年经济增加值（EVA）折线图" role="img"></canvas>
      </div>

      <div class="chart-footer">
        <div>
          <strong>交互提示：</strong>悬停查看具体数值，拖动横向缩放（双击可重置）。
        </div>
        <div class="unit-toggle" aria-label="单位切换">
          <button type="button" data-unit="raw" class="active">美元</button>
          <button type="button" data-unit="billion">十亿美元</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 原始数据（单位：美元）
    const rawLabels = [
      "2016", "2017", "2018", "2019", "2020",
      "2021", "2022", "2023", "2024"
    ];

    const rawData = [
      -112842955.08719534,
      94086555.25703596,
      592543130.6130335,
      835217612.0303206,
      2090881489.385591,
      3207555626.2606506,
      2046841030.8091164,
      3141326989.0799227,
      6060735551.952335
    ];

    let currentUnit = "raw"; // "raw" | "billion"
    const billion = 1_000_000_000;

    function getDisplayData() {
      return currentUnit === "billion"
        ? rawData.map(v => v / billion)
        : [...rawData];
    }

    function getYAxisLabel() {
      return currentUnit === "billion" ? "EVA（十亿美元）" : "EVA（美元）";
    }

    function formatNumber(value) {
      if (currentUnit === "billion") {
        return value.toLocaleString(undefined, {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }) + " B";
      }
      if (Math.abs(value) >= 1_000_000) {
        return value.toLocaleString(undefined, {
          maximumFractionDigits: 0
        });
      }
      return value.toLocaleString(undefined, {
        maximumFractionDigits: 2
      });
    }

    const ctx = document.getElementById("evaChart").getContext("2d");

    const evaChart = new Chart(ctx, {
      type: "line",
      data: {
        labels: rawLabels,
        datasets: [{
          label: "EVA",
          data: getDisplayData(),
          tension: 0.25,
          borderColor: getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#2563eb",
          backgroundColor: "rgba(37, 99, 235, 0.16)",
          pointBackgroundColor: "#ffffff",
          pointBorderColor: "#1f2937",
          pointRadius: 4,
          pointHoverRadius: 6,
          pointBorderWidth: 1.4,
          borderWidth: 2.4,
          fill: true
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false, // paired with CSS aspect-ratio for a stable shape
        interaction: {
          intersect: false,
          mode: "index"
        },
        layout: {
          padding: {
            top: 8,
            right: 10,
            bottom: 4,
            left: 6
          }
        },
        plugins: {
          legend: {
            display: false
          },
          tooltip: {
            backgroundColor: "rgba(15,23,42,0.92)",
            padding: 10,
            titleFont: { size: 12, weight: "600" },
            bodyFont: { size: 11 },
            cornerRadius: 6,
            displayColors: false,
            callbacks: {
              title: function (items) {
                return "财年 " + items[0].label;
              },
              label: function (context) {
                const original = rawData[context.dataIndex];
                const display = context.parsed.y;
                const unitLabel = currentUnit === "billion" ? "十亿美元" : "美元";
                const displayStr = formatNumber(display);

                if (currentUnit === "billion") {
                  const exactStr = original.toLocaleString(undefined, {
                    maximumFractionDigits: 0
                  });
                  return [
                    "EVA（展示）: " + displayStr + " " + unitLabel,
                    "EVA（精确）: " + exactStr + " 美元"
                  ];
                }

                const exactStr = original.toLocaleString(undefined, {
                  maximumFractionDigits: 0
                });
                return "EVA: " + exactStr + " " + unitLabel;
              }
            }
          },
          title: {
            display: false
          },
          zoom: {
            pan: {
              enabled: true,
              mode: "x"
            },
            zoom: {
              drag: {
                enabled: true
              },
              mode: "x"
            }
          }
        },
        scales: {
          x: {
            grid: {
              display: false
            },
            ticks: {
              autoSkip: false,
              maxRotation: 0,
              minRotation: 0
            }
          },
          y: {
            title: {
              display: true,
              text: getYAxisLabel(),
              padding: 8
            },
            grid: {
              color: getComputedStyle(document.documentElement).getPropertyValue("--grid").trim() || "#d1d5db"
            },
            ticks: {
              callback: function (value) {
                return formatNumber(value);
              }
            }
          }
        }
      }
    });

    // 单位切换逻辑
    const unitButtons = document.querySelectorAll(".unit-toggle button");

    unitButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        const unit = btn.getAttribute("data-unit");
        if (unit === currentUnit) return;

        currentUnit = unit;

        unitButtons.forEach(b => b.classList.toggle("active", b === btn));

        evaChart.data.datasets[0].data = getDisplayData();
        evaChart.options.scales.y.title.text = getYAxisLabel();
        evaChart.resetZoom();
        evaChart.update();
      });
    });

    // 双击画布重置缩放
    ctx.canvas.addEventListener("dblclick", function () {
      evaChart.resetZoom();
    });
  </script>
</body>
</html>
