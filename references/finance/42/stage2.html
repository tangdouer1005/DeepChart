<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Defensive Interval Ratio (DIR) 2016–2024</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f7fb;
      color: #222;
    }
    h1 {
      font-size: 20px;
      margin-bottom: 4px;
    }
    h2 {
      font-size: 14px;
      font-weight: 400;
      color: #555;
      margin-top: 0;
      margin-bottom: 18px;
    }
    .chart-container {
      max-width: 820px;
      margin: 0 auto;
      background: #ffffff;
      padding: 18px 20px 22px;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
    }
    .canvas-wrapper {
      /* Fixed height to avoid vertical overstretching */
      width: 100%;
      height: 360px;
      position: relative;
    }
    .meta {
      font-size: 11px;
      color: #666;
      margin-top: 8px;
    }
    .meta span {
      display: inline-block;
      margin-right: 16px;
    }
    canvas {
      /* Let Chart.js handle responsiveness within a sane box */
      width: 100% !important;
      height: 100% !important;
      display: block;
    }

    @media (max-width: 600px) {
      h1 { font-size: 17px; }
      h2 { font-size: 13px; }
    }
  </style>
</head>
<body>
  <div class="chart-container">
    <h1>防御区间比率 (DIR) — Cost</h1>
    <h2>Fiscal Years 2016–2024</h2>

    <div class="canvas-wrapper">
      <canvas id="dirChart"></canvas>
    </div>

    <div class="meta">
      <span><strong>Metric:</strong> Defensive Interval Ratio (DIR)</span>
      <span><strong>Type:</strong> Bar chart, interactive</span>
      <span><strong>Years:</strong> 2016–2024</span>
    </div>
  </div>

  <!-- Chart.js (latest stable) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
  <script>
    const fiscalYears = [
      "2016","2017","2018","2019","2020","2021","2022","2023","2024"
    ];

    const dirValues = [
      14.692386589828503,
      17.46777783114783,
      20.564130244500205,
      24.4680196801968,
      31.283581071866905,
      25.19416449548412,
      20.724763986293183,
      24.91512793796119,
      18.79876248123736
    ];

    const ctx = document.getElementById("dirChart");

    const formatDir = (value) => value.toFixed(2);

    const maxValue = Math.max(...dirValues);
    const yMax = Math.ceil(maxValue / 5) * 5;

    new Chart(ctx, {
      type: "bar",
      data: {
        labels: fiscalYears,
        datasets: [{
          label: "Defensive Interval Ratio (DIR)",
          data: dirValues,
          backgroundColor: (ctx) => {
            const maxVal = maxValue;
            const value = ctx.raw;
            const baseColor = "rgba(37, 99, 235, 0.85)";
            const highlightColor = "rgba(22, 163, 74, 0.95)";
            return value === maxVal ? highlightColor : baseColor;
          },
          borderColor: "rgba(30, 64, 175, 1)",
          borderWidth: 1,
          borderRadius: 4,
          hoverBackgroundColor: "rgba(37, 99, 235, 1)",
          hoverBorderColor: "rgba(15, 23, 42, 1)"
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false, // we control via wrapper height
        animation: {
          duration: 700,
          easing: "easeOutQuart"
        },
        plugins: {
          legend: {
            display: true,
            labels: {
              boxWidth: 14,
              boxHeight: 10,
              usePointStyle: true,
              pointStyle: "rectRounded",
              font: { size: 11 }
            }
          },
          tooltip: {
            backgroundColor: "rgba(15,23,42,0.94)",
            titleColor: "#f9fafb",
            bodyColor: "#e5e7eb",
            borderColor: "#1f2937",
            borderWidth: 1,
            padding: 8,
            cornerRadius: 6,
            displayColors: false,
            callbacks: {
              label: (ctx) => {
                const year = ctx.label;
                const value = ctx.raw;
                return ` ${year}: DIR = ${formatDir(value)}`;
              }
            }
          }
        },
        scales: {
          x: {
            grid: { display: false },
            ticks: {
              font: { size: 12 },
              color: "#374151"
            }
          },
          y: {
            beginAtZero: true,
            suggestedMax: yMax,
            grid: {
              color: "rgba(148, 163, 184, 0.25)",
              drawBorder: false
            },
            ticks: {
              font: { size: 12 },
              color: "#374151",
              stepSize: 5,
              callback: (value) => value.toString()
            },
            title: {
              display: true,
              text: "Defensive Interval Ratio (DIR, days)",
              font: { size: 12, weight: "500" },
              color: "#374151"
            }
          }
        },
        interaction: {
          mode: "nearest",
          intersect: true
        }
      }
    });
  </script>
</body>
</html>
