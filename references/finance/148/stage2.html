<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>ma 的经济增加值 (EVA) 2016–2024 趋势图</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Chart.js latest stable -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #fafafa;
      color: #222;
    }
    h1 {
      font-size: 20px;
      margin-bottom: 4px;
    }
    h2 {
      font-size: 14px;
      font-weight: 400;
      margin-top: 0;
      margin-bottom: 20px;
      color: #555;
    }
    .chart-container {
      position: relative;
      max-width: 960px;
      margin: 0 auto;
      background: #fff;
      padding: 16px 20px 24px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }
    .footer-note {
      max-width: 960px;
      margin: 10px auto 0;
      font-size: 12px;
      color: #777;
    }
    canvas {
      max-height: 480px;
    }
  </style>
</head>
<body>
  <div class="chart-container">
    <h1>ma 的经济增加值 (EVA) - 简化版</h1>
    <h2>2016–2024 年度变化趋势</h2>
    <canvas id="evaLineChart"></canvas>
  </div>
  <div class="footer-note">
    数据来源：用户提供（单位：元）。可通过悬停查看精确数值。
  </div>

  <script>
    // Source data (exact values as provided)
    const labels = [
      "2016", "2017", "2018", "2019", "2020",
      "2021", "2022", "2023", "2024"
    ];

    const evaValues = [
      3335125345.377258,
      2991127598.8960447,
      5150937257.0794,
      7369655847.292159,
      5788597293.814432,
      7360264315.513729,
      9025036396.181383,
      10131128143.55891,
      11636273915.038675
    ];

    const ctx = document.getElementById("evaLineChart").getContext("2d");

    // Helper: format large numbers in a readable way (e.g., 亿, 万)
    function formatChineseNumber(value) {
      if (value === null || value === undefined || isNaN(value)) return "";
      const abs = Math.abs(value);

      if (abs >= 1e8) {
        return (value / 1e8).toFixed(2).replace(/\.0+$/, "") + " 亿";
      } else if (abs >= 1e4) {
        return (value / 1e4).toFixed(2).replace(/\.0+$/, "") + " 万";
      } else {
        return value.toFixed(2).replace(/\.0+$/, "");
      }
    }

    // Helper: format full number in yuan with separators for tooltip
    function formatFullNumber(value) {
      if (value === null || value === undefined || isNaN(value)) return "";
      const parts = value.toFixed(2).split(".");
      parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      return parts.join(".");
    }

    const evaLineChart = new Chart(ctx, {
      type: "line",
      data: {
        labels: labels,
        datasets: [{
          label: "EVA（经济增加值）",
          data: evaValues,
          borderColor: "rgba(54, 162, 235, 0.9)",
          backgroundColor: "rgba(54, 162, 235, 0.15)",
          borderWidth: 2,
          pointRadius: 4,
          pointHoverRadius: 6,
          pointBackgroundColor: "rgba(54, 162, 235, 1)",
          pointBorderWidth: 1,
          tension: 0.25
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: {
          mode: "index",
          intersect: false
        },
        plugins: {
          legend: {
            display: true,
            labels: {
              usePointStyle: true,
              boxWidth: 8,
              padding: 16
            }
          },
          tooltip: {
            usePointStyle: true,
            callbacks: {
              label: function(context) {
                const value = context.parsed.y;
                return " " + context.dataset.label + "：" + formatFullNumber(value) + " 元";
              },
              footer: function(context) {
                const value = context[0].parsed.y;
                return " 约合：" + formatChineseNumber(value);
              }
            },
            footerFont: {
              style: "normal"
            }
          },
          title: {
            display: false
          }
        },
        scales: {
          x: {
            title: {
              display: true,
              text: "财政年度 (Fiscal Year)",
              color: "#555",
              font: {
                size: 12
              }
            },
            grid: {
              display: false
            }
          },
          y: {
            title: {
              display: true,
              text: "EVA（元）",
              color: "#555",
              font: {
                size: 12
              }
            },
            ticks: {
              callback: function(value) {
                return formatChineseNumber(value);
              }
            },
            grid: {
              color: "rgba(0,0,0,0.06)"
            }
          }
        }
      }
    });
  </script>
</body>
</html>
