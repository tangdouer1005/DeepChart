<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>ORCL 格雷厄姆“烟蒂股”净值（NNWC） 2016-2024</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- 引入 Chart.js 最新稳定版本 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, "Helvetica Neue", Arial, "Noto Sans", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f6f7fb;
      color: #222;
    }

    h1 {
      font-size: 20px;
      margin: 0 0 4px;
      text-align: center;
    }

    h2 {
      font-size: 14px;
      font-weight: normal;
      text-align: center;
      margin: 0 0 16px;
      color: #555;
    }

    .chart-container {
      max-width: 900px;
      margin: 0 auto;
      background: #fff;
      border-radius: 10px;
      padding: 16px 18px 22px;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.08);
    }

    /* 让容器控制高度，Chart.js 自适应 */
    .chart-wrapper {
      position: relative;
      height: 480px;
    }

    .footer-note {
      max-width: 900px;
      margin: 10px auto 0;
      font-size: 11px;
      color: #666;
      text-align: right;
    }

    .legend-note {
      font-size: 11px;
      color: #666;
      text-align: left;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="chart-container">
    <h1>ORCL 格雷厄姆“烟蒂股”净值（NNWC）变化</h1>
    <h2>按财年，每股 NNWC（2016 - 2024）</h2>
    <div class="chart-wrapper">
      <canvas id="nnwcChart"></canvas>
    </div>
    <div class="legend-note">
      说明：数值为每股格雷厄姆净净营运资本（Net-Net Working Capital, NNWC），单位与原始数据一致。<br />
      提示：将鼠标悬停在柱状上可查看精确数值。
    </div>
  </div>
  <div class="footer-note">
    数据来源：用户提供的 ORCL 2016–2024 财年 NNWC 每股数据
  </div>

  <script>
    // 确保 DOM 加载完成后再初始化图表，避免获取不到 canvas
    document.addEventListener("DOMContentLoaded", function () {
      const labels = [
        "2016",
        "2017",
        "2018",
        "2019",
        "2020",
        "2021",
        "2022",
        "2023",
        "2024"
      ];

      const nnwcValues = [
        -0.0178861788617886,
        -1.4764282191645122,
        -3.511326097215668,
        -10.707395498392282,
        -15.355494839101397,
        -23.02713434811384,
        -29.94687724335965,
        -40.428054953000725,
        -38.67623095997166
      ];

      const ctx = document.getElementById("nnwcChart");
      if (!ctx) {
        console.error("未找到 ID 为 nnwcChart 的画布元素。");
        return;
      }

      new Chart(ctx, {
        type: "bar",
        data: {
          labels: labels,
          datasets: [
            {
              label: "每股 NNWC",
              data: nnwcValues,
              backgroundColor: "rgba(59, 130, 246, 0.75)",
              borderColor: "rgba(37, 99, 235, 1)",
              borderWidth: 1.2,
              borderRadius: 4,
              hoverBackgroundColor: "rgba(37, 99, 235, 0.9)",
              hoverBorderColor: "rgba(30, 64, 175, 1)"
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: {
            mode: "index",
            intersect: false
          },
          plugins: {
            legend: {
              display: true,
              position: "top",
              labels: {
                usePointStyle: true,
                pointStyle: "rectRounded",
                padding: 12,
                font: {
                  size: 11.5
                }
              }
            },
            tooltip: {
              backgroundColor: "rgba(15, 23, 42, 0.92)",
              titleFont: { size: 12, weight: "600" },
              bodyFont: { size: 12 },
              padding: 10,
              cornerRadius: 6,
              callbacks: {
                label: function (context) {
                  const value = context.raw;
                  return " 每股 NNWC：" + value.toFixed(3);
                }
              }
            },
            title: {
              display: false
            }
          },
          scales: {
            x: {
              title: {
                display: true,
                text: "财年",
                font: {
                  size: 12
                }
              },
              ticks: {
                font: {
                  size: 11
                }
              },
              grid: {
                display: false
              }
            },
            y: {
              title: {
                display: true,
                text: "每股 NNWC（可为负值）",
                font: {
                  size: 12
                }
              },
              ticks: {
                font: {
                  size: 11
                }
              },
              grid: {
                color: "rgba(148, 163, 184, 0.3)"
              }
            }
          }
        }
      });
    });
  </script>
</body>
</html>
