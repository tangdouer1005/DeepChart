<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NVDA 内部增长率 (IGR) 2016–2024</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Chart.js (latest 4.x) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #222222;
      --grid-color: #e2e6ef;
      --accent: #2563eb;
      --accent-soft: rgba(37, 99, 235, 0.18);
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    body {
      margin: 0;
      padding: 1.5rem;
      background: #f4f6fb;
      color: var(--text-color);
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
    }

    .card {
      background: var(--bg-color);
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      padding: 1.5rem 1.75rem 1.75rem;
    }

    h1 {
      margin: 0 0 0.25rem;
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .subtitle {
      margin-bottom: 1.25rem;
      font-size: 0.9rem;
      color: #6b7280;
    }

    .note {
      margin-top: 0.75rem;
      font-size: 0.8rem;
      color: #6b7280;
    }

    canvas {
      max-height: 480px;
    }

    @media (max-width: 600px) {
      body {
        padding: 0.75rem;
      }
      .card {
        padding: 1rem;
      }
      h1 {
        font-size: 1.15rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>NVDA 内部增长率 (Internal Growth Rate, IGR)</h1>
      <div class="subtitle">按财年统计：2016 – 2024</div>
      <canvas id="igrChart"></canvas>
      <div class="note">
        说明：内部增长率 (IGR) 为公司在保持现有财务结构不变的情况下，依靠留存收益所能实现的最大增长率。数据来源于提供的财报结果。
      </div>
    </div>
  </div>

  <script>
    // Data from source
    const fiscalYears = [
      "2016",
      "2017",
      "2018",
      "2019",
      "2020",
      "2021",
      "2022",
      "2023",
      "2024"
    ];

    const igrValues = [
      0.0582452295559244,
      0.1951253385181584,
      0.3453733248245055,
      0.4437121167539576,
      0.1865477805776313,
      0.2059531282695124,
      0.3446712853773584,
      0.1025455578659158,
      1.218970527189705
    ];

    // Convert to percentage for display
    const igrPercentages = igrValues.map(v => v * 100);

    const ctx = document.getElementById("igrChart").getContext("2d");

    const igrChart = new Chart(ctx, {
      type: "bar",
      data: {
        labels: fiscalYears,
        datasets: [
          {
            label: "内部增长率 (IGR)",
            data: igrPercentages,
            backgroundColor: function (ctx) {
              const index = ctx.dataIndex;
              const value = ctx.raw;
              // Highlight the latest year with a stronger color
              if (index === igrPercentages.length - 1) {
                return "rgba(37, 99, 235, 0.95)";
              }
              // Slight gradient intensity by value
              const base = 0.35 + (value / Math.max(...igrPercentages)) * 0.25;
              return `rgba(37, 99, 235, ${base})`;
            },
            borderColor: "#1d4ed8",
            borderWidth: 1,
            borderRadius: 6,
            hoverBackgroundColor: "rgba(37, 99, 235, 0.95)",
            hoverBorderColor: "#1d4ed8"
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: {
          mode: "index",
          intersect: false
        },
        plugins: {
          title: {
            display: false
          },
          legend: {
            display: true,
            labels: {
              usePointStyle: true,
              boxWidth: 8,
              padding: 14
            }
          },
          tooltip: {
            callbacks: {
              label: function (context) {
                const val = context.raw;
                return `IGR: ${val.toFixed(2)}%`;
              }
            }
          }
        },
        scales: {
          x: {
            grid: {
              display: false
            },
            ticks: {
              padding: 6
            }
          },
          y: {
            beginAtZero: true,
            grid: {
              color: "rgba(148, 163, 184, 0.32)",
              drawBorder: false
            },
            ticks: {
              callback: function (val) {
                return val + "%";
              }
            },
            title: {
              display: true,
              text: "内部增长率 (IGR, %)",
              padding: { top: 4, bottom: 4 }
            }
          }
        }
      }
    });
  </script>
</body>
</html>
