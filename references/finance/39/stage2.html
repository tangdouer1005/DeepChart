<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <title>AMZN 自由现金流收益质量 (Quality of Income Ratio) 2016–2024</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Chart.js (latest stable 4.x) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 24px;
      background-color: #f7f8fa;
      color: #1f2933;
    }
    h1 {
      margin: 0 0 4px;
      font-size: 24px;
      font-weight: 600;
    }
    h2 {
      margin: 12px 0 8px;
      font-size: 18px;
      font-weight: 500;
      color: #52606d;
    }
    .container {
      max-width: 960px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
      padding: 20px 22px 26px;
    }
    .meta {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 16px;
    }
    .chart-wrapper {
      position: relative;
      height: 440px;
    }
    .legend-note {
      font-size: 12px;
      color: #6b7280;
      margin-top: 10px;
      line-height: 1.4;
    }
    .footer-note {
      margin-top: 18px;
      font-size: 11px;
      color: #9ca3af;
    }
    @media (max-width: 640px) {
      body {
        padding: 12px;
      }
      .container {
        padding: 14px 14px 18px;
      }
      .chart-wrapper {
        height: 360px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>AMZN 自由现金流收益质量 (Quality of Income Ratio)</h1>
    <h2>2016–2024 年变化（柱状图）</h2>
    <div class="meta">
      指标定义：自由现金流收益质量 = 经营活动现金流 / 净利润。数值越高，净利润由现金支撑的比例通常被视为越高。
    </div>

    <div class="chart-wrapper">
      <canvas id="qoiChart"></canvas>
    </div>

    <div class="legend-note">
      • 数据区间：2016–2024 财年<br/>
      • 鼠标悬停查看精确数值，可切换图例项以显示/隐藏系列（若有）。
    </div>

    <div class="footer-note">
      数据来源：用户提供的 AMZN 自由现金流收益质量（RESULT_QoI_Ratio）年度序列。
    </div>
  </div>

  <script>
    // Source data (exactly as provided)
    const fiscalYears = [
      "2016","2017","2018","2019","2020","2021","2022","2023","2024"
    ];

    const qoiRatio = [
      1.398390505608844,
      1.1784522587268993,
      1.1066565809379727,
      1.0307507025291047,
      1.3740718400965075,
      0.7810729700566496,
      0.8630766674666323,
      0.9933461965737004,
      0.9546001252183084
    ];

    // Create the bar chart
    const ctx = document.getElementById("qoiChart").getContext("2d");

    const qoiChart = new Chart(ctx, {
      type: "bar",
      data: {
        labels: fiscalYears,
        datasets: [
          {
            label: "自由现金流收益质量 (Quality of Income Ratio)",
            data: qoiRatio,
            backgroundColor: qoiRatio.map(v =>
              v >= 1
                ? "rgba(37, 99, 235, 0.75)"   // blue for >= 1
                : "rgba(239, 68, 68, 0.75)"  // red for < 1
            ),
            borderColor: qoiRatio.map(v =>
              v >= 1 ? "rgba(37, 99, 235, 1)" : "rgba(239, 68, 68, 1)"
            ),
            borderWidth: 1.5,
            borderRadius: 5,
            hoverBackgroundColor: qoiRatio.map(v =>
              v >= 1
                ? "rgba(37, 99, 235, 0.95)"
                : "rgba(239, 68, 68, 0.95)"
            ),
            hoverBorderColor: "#111827",
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: {
          mode: "nearest",
          intersect: true
        },
        plugins: {
          legend: {
            display: true,
            labels: {
              usePointStyle: true,
              pointStyle: "rectRounded",
              padding: 16
            }
          },
          tooltip: {
            backgroundColor: "rgba(15, 23, 42, 0.92)",
            titleFont: { weight: "600", size: 13 },
            bodyFont: { size: 12 },
            padding: 10,
            callbacks: {
              label: function(context) {
                const value = context.parsed.y;
                return " QoI 比率: " + value.toFixed(3);
              },
              afterLabel: function(context) {
                const value = context.parsed.y;
                if (value >= 1) {
                  return " 说明：现金流高于或接近净利润。";
                } else {
                  return " 说明：现金流低于净利润。";
                }
              }
            }
          },
          title: {
            display: false
          }
        },
        scales: {
          x: {
            title: {
              display: true,
              text: "财年",
              font: { size: 12 }
            },
            grid: {
              display: false
            },
            ticks: {
              maxRotation: 0,
              minRotation: 0
            }
          },
          y: {
            beginAtZero: true,
            title: {
              display: true,
              text: "自由现金流收益质量 (倍数)",
              font: { size: 12 }
            },
            grid: {
              color: "rgba(156, 163, 175, 0.25)"
            },
            ticks: {
              callback: function(value) {
                return value.toFixed ? value.toFixed(1) : value;
              }
            },
            suggestedMax: 1.6
          }
        },
        animation: {
          duration: 800,
          easing: "easeOutQuart"
        },
        hover: {
          mode: "nearest",
          intersect: true
        }
      }
    });
  </script>
</body>
</html>
