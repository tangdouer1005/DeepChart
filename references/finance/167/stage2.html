<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>mrk 盈余-现金质量剪刀差（2016-2024）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Chart.js (latest stable 4.x) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --fg: #1f2933;
      --grid: #d0d7e2;
      --primary: #2563eb;
      --primary-light: rgba(37, 99, 235, 0.15);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1120;
        --fg: #e5e7eb;
        --grid: #374151;
        --primary: #60a5fa;
        --primary-light: rgba(96, 165, 250, 0.2);
      }
    }
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
    }
    body {
      margin: 0;
      padding: 1.5rem;
      background: var(--bg);
      color: var(--fg);
    }
    .container {
      max-width: 960px;
      margin: 0 auto;
    }
    h1 {
      font-size: 1.4rem;
      margin: 0 0 0.25rem;
      font-weight: 600;
    }
    .subtitle {
      font-size: 0.9rem;
      color: #6b7280;
      margin-bottom: 0.75rem;
    }
    @media (prefers-color-scheme: dark) {
      .subtitle {
        color: #9ca3af;
      }
    }
    .chart-wrapper {
      position: relative;
      width: 100%;
      height: 420px;
      padding: 1rem;
      border-radius: 0.75rem;
      background: radial-gradient(circle at top left, rgba(37, 99, 235, 0.06), transparent),
                  radial-gradient(circle at bottom right, rgba(56, 189, 248, 0.06), transparent);
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.12);
    }
    @media (max-width: 600px) {
      body {
        padding: 1rem;
      }
      .chart-wrapper {
        height: 360px;
        padding: 0.75rem;
      }
    }
    .note {
      font-size: 0.8rem;
      margin-top: 0.75rem;
      color: #6b7280;
    }
    @media (prefers-color-scheme: dark) {
      .note {
        color: #9ca3af;
      }
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 0.5rem;
      font-size: 0.8rem;
      justify-content: flex-end;
      align-items: center;
    }
    .btn {
      border: 1px solid #cbd5e1;
      background: rgba(255,255,255,0.6);
      border-radius: 999px;
      padding: 0.2rem 0.7rem;
      cursor: pointer;
      font-size: 0.78rem;
      color: #374151;
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      backdrop-filter: blur(6px);
    }
    .btn span {
      font-size: 0.9em;
    }
    .btn:hover {
      background: rgba(255,255,255,0.9);
    }
    @media (prefers-color-scheme: dark) {
      .btn {
        border-color: #4b5563;
        background: rgba(15,23,42,0.8);
        color: #e5e7eb;
      }
      .btn:hover {
        background: rgba(31,41,55,0.95);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>mrk 盈余-现金质量剪刀差（2016-2024）</h1>
    <div class="subtitle">指标：RESULT_Spread（Earnings Quality Spread，单位：绝对值）</div>

    <div class="controls">
      <button class="btn" id="toggleStyleBtn">
        <span>●</span> 切换线条样式
      </button>
      <button class="btn" id="resetZoomBtn">
        重置缩放
      </button>
    </div>

    <div class="chart-wrapper">
      <canvas id="spreadChart"></canvas>
    </div>

    <div class="note">
      数据来源（已提供）：<strong>Fiscal Year, RESULT_Spread</strong>。<br />
      该图展示 2016–2024 年间盈余与现金质量差异的变化趋势，数值越高代表盈余质量与现金流质量差异越大。
    </div>
  </div>

  <!-- Zoom plugin for Chart.js 4 -->
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.umd.min.js"></script>

  <script>
    // 原始数据（用户提供）
    const years = [
      "2016","2017","2018","2019","2020","2021","2022","2023","2024"
    ];
    const spreadValues = [
      0.0655251859896272,
      0.044234893505558,
      0.0551525139435455,
      0.0430690757570314,
      0.0362076313322158,
      0.0107460386654636,
      0.0425963677660178,
      0.1171357750133203,
      0.0388862325219746
    ];

    const ctx = document.getElementById("spreadChart").getContext("2d");

    let dashed = false;

    const spreadChart = new Chart(ctx, {
      type: "line",
      data: {
        labels: years,
        datasets: [{
          label: "盈余-现金质量剪刀差（RESULT_Spread）",
          data: spreadValues,
          borderColor: getComputedStyle(document.documentElement)
            .getPropertyValue("--primary").trim() || "#2563eb",
          backgroundColor: getComputedStyle(document.documentElement)
            .getPropertyValue("--primary-light").trim() || "rgba(37, 99, 235, 0.15)",
          tension: 0.25,
          borderWidth: 2.5,
          pointRadius: 4,
          pointHoverRadius: 6,
          pointBackgroundColor: "#ffffff",
          pointBorderWidth: 1.5,
          fill: true,
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: {
          mode: "nearest",
          intersect: false
        },
        plugins: {
          legend: {
            display: true,
            labels: {
              usePointStyle: true,
              padding: 16,
              font: { size: 11 }
            }
          },
          tooltip: {
            callbacks: {
              label: (ctx) => {
                const v = ctx.parsed.y;
                return ` 剪刀差: ${v.toFixed(4)}`;
              },
              title: (items) => {
                if (!items.length) return "";
                return `年度: ${items[0].label}`;
              }
            }
          },
          zoom: {
            zoom: {
              wheel: {
                enabled: true
              },
              pinch: {
                enabled: true
              },
              mode: "x"
            },
            pan: {
              enabled: true,
              mode: "x"
            }
          }
        },
        scales: {
          x: {
            title: {
              display: true,
              text: "Fiscal Year",
              font: { size: 11 }
            },
            grid: {
              color: getComputedStyle(document.documentElement)
                .getPropertyValue("--grid").trim() || "#d0d7e2"
            }
          },
          y: {
            title: {
              display: true,
              text: "RESULT_Spread（绝对值）",
              font: { size: 11 }
            },
            ticks: {
              callback: (value) => value.toFixed(3)
            },
            grid: {
              color: getComputedStyle(document.documentElement)
                .getPropertyValue("--grid").trim() || "#d0d7e2"
            },
            beginAtZero: true
          }
        }
      }
    });

    // 切换线条样式（实线 / 虚线）
    document.getElementById("toggleStyleBtn").addEventListener("click", () => {
      dashed = !dashed;
      spreadChart.data.datasets[0].borderDash = dashed ? [6, 4] : [];
      spreadChart.update();
    });

    // 重置缩放
    document.getElementById("resetZoomBtn").addEventListener("click", () => {
      spreadChart.resetZoom();
    });
  </script>
</body>
</html>
