<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MSFT Piotroski F-Score (2016–2024)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Chart.js (latest stable 4.x) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      color-scheme: light dark;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      background: #f5f5f7;
      color: #1f2933;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 24px;
      box-sizing: border-box;
    }

    .chart-container {
      width: 100%;
      max-width: 900px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.12);
      padding: 20px 24px 28px;
      box-sizing: border-box;
    }

    /* FIX: give the chart a clear fixed-height wrapper so it doesn't stretch */
    .canvas-wrapper {
      position: relative;
      width: 100%;
      height: 420px;        /* reasonable fixed height for readability */
      margin-top: 10px;
    }

    h1 {
      font-size: 1.35rem;
      margin: 0 0 4px 0;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #6b7280;
      margin-bottom: 4px;
    }

    .note {
      font-size: 0.8rem;
      color: #9ca3af;
      margin-top: 10px;
    }

    @media (max-width: 600px) {
      .chart-container {
        padding: 14px 14px 18px;
      }
      .canvas-wrapper {
        height: 320px;      /* slightly shorter but still readable on mobile */
      }
      h1 {
        font-size: 1.1rem;
      }
      .subtitle {
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>
  <div class="chart-container">
    <h1>MSFT Piotroski F-Score (皮奥特罗斯基 F-Score)</h1>
    <div class="subtitle">Fiscal Years 2016–2024</div>
    <div class="canvas-wrapper">
      <canvas id="fScoreChart"
        aria-label="MSFT Piotroski F-Score bar chart from 2016 to 2024"
        role="img"></canvas>
    </div>
    <div class="note">
      Source: Provided dataset. Piotroski F-Score ranges from 0 (weak) to 9 (strong).
    </div>
  </div>

  <script>
    // Data from the source
    const fiscalYears = ["2016","2017","2018","2019","2020","2021","2022","2023","2024"];
    const fScores = [5,7,7,8,8,8,7,6,7];

    const canvas = document.getElementById("fScoreChart");
    const ctx = canvas.getContext("2d");

    // Create gradient fill for bars
    const gradient = ctx.createLinearGradient(0, 0, 0, 400);
    gradient.addColorStop(0, "rgba(37, 99, 235, 0.95)");
    gradient.addColorStop(1, "rgba(59, 130, 246, 0.6)");

    const borderColor = "rgba(30, 64, 175, 1)";

    new Chart(ctx, {
      type: "bar",
      data: {
        labels: fiscalYears,
        datasets: [{
          label: "Piotroski F-Score",
          data: fScores,
          backgroundColor: gradient,
          borderColor: borderColor,
          borderWidth: 1.5,
          borderRadius: 6,
          hoverBackgroundColor: "rgba(37, 99, 235, 0.9)",
          hoverBorderColor: "rgba(30, 64, 175, 1)",
          maxBarThickness: 50
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,   // use the fixed-height wrapper instead
        plugins: {
          legend: {
            display: true,
            labels: {
              font: {
                size: 12
              },
              color: "#4b5563"
            }
          },
          tooltip: {
            enabled: true,
            backgroundColor: "rgba(15, 23, 42, 0.92)",
            titleColor: "#e5e7eb",
            bodyColor: "#e5e7eb",
            borderWidth: 0,
            padding: 10,
            callbacks: {
              label: function(context) {
                const value = context.parsed.y;
                return " F-Score: " + value + " / 9";
              }
            }
          }
        },
        scales: {
          x: {
            grid: {
              display: false
            },
            title: {
              display: true,
              text: "Fiscal Year",
              font: {
                size: 12,
                weight: "500"
              },
              color: "#6b7280"
            },
            ticks: {
              color: "#4b5563",
              font: {
                size: 11
              }
            }
          },
          y: {
            beginAtZero: true,
            suggestedMax: 9,
            ticks: {
              stepSize: 1,
              color: "#4b5563",
              font: {
                size: 11
              }
            },
            grid: {
              color: "rgba(148, 163, 184, 0.3)",
              drawBorder: false
            },
            title: {
              display: true,
              text: "Piotroski F-Score (0–9)",
              font: {
                size: 12,
                weight: "500"
              },
              color: "#6b7280"
            }
          }
        },
        animation: {
          duration: 800,
          easing: "easeOutCubic"
        },
        hover: {
          mode: "nearest",
          intersect: true
        }
      }
    });
  </script>
</body>
</html>
