<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>v's Piotroski F-Score (2016–2024)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Chart.js (latest stable 4.x) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      color-scheme: light dark;
      --bg-color: #ffffff;
      --fg-color: #222222;
      --grid-color: rgba(0, 0, 0, 0.07);
      --accent: #2563eb;
      --accent-soft: rgba(37, 99, 235, 0.08);
      --accent-border: rgba(37, 99, 235, 0.25);
      --tooltip-bg: rgba(17, 24, 39, 0.95);
      --tooltip-color: #f9fafb;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #020617;
        --fg-color: #e5e7eb;
        --grid-color: rgba(148, 163, 184, 0.18);
        --accent: #60a5fa;
        --accent-soft: rgba(96, 165, 250, 0.08);
        --accent-border: rgba(96, 165, 250, 0.35);
        --tooltip-bg: rgba(15, 23, 42, 0.98);
        --tooltip-color: #f9fafb;
      }
    }

    body {
      margin: 0;
      padding: 1.5rem;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      background: radial-gradient(circle at top, #e5f0ff 0, var(--bg-color) 55%);
      color: var(--fg-color);
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 1rem;
      padding: 1.5rem 1.75rem 1.75rem;
      box-shadow:
        0 18px 45px rgba(15, 23, 42, 0.12),
        0 0 0 1px rgba(148, 163, 184, 0.18);
      backdrop-filter: blur(14px);
    }

    @media (prefers-color-scheme: dark) {
      .container {
        background: rgba(15, 23, 42, 0.9);
      }
    }

    h1 {
      margin: 0;
      font-size: 1.25rem;
      letter-spacing: 0.01em;
    }

    .subtitle {
      margin-top: 0.25rem;
      font-size: 0.78rem;
      color: #6b7280;
    }

    @media (prefers-color-scheme: dark) {
      .subtitle {
        color: #9ca3af;
      }
    }

    .chart-wrapper {
      position: relative;
      margin-top: 1.25rem;
      padding: 0.75rem 0.25rem 0.25rem;
      background: radial-gradient(circle at top left, var(--accent-soft), transparent 60%);
      border-radius: 0.9rem;
      border: 1px solid var(--accent-border);
    }

    canvas {
      max-height: 420px;
    }

    .legend {
      margin-top: 0.7rem;
      font-size: 0.78rem;
      color: #4b5563;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1.5rem;
      align-items: center;
    }

    @media (prefers-color-scheme: dark) {
      .legend {
        color: #9ca3af;
      }
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .legend-swatch {
      width: 14px;
      height: 4px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), #34d399);
    }

    .note {
      margin-top: 0.35rem;
      font-size: 0.72rem;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>v's 皮奥特罗斯基 F-Score (Piotroski F-Score)</h1>
      <p class="subtitle">Fiscal Years 2016–2024 · Source: Provided data</p>
    </header>

    <section class="chart-wrapper">
      <canvas id="piotroskiChart"></canvas>
    </section>

    <div class="legend">
      <span class="legend-item">
        <span class="legend-swatch"></span>
        Piotroski F-Score (0–9, higher is better)
      </span>
    </div>
    <div class="note">
      Interactive: hover to see exact values; drag horizontally (or wheel/pinch on trackpads) to zoom; double-click to reset.
    </div>
  </div>

  <script>
    // Data from the user-provided source
    const years = [2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024];
    const fScores = [4, 7, 7, 8, 4, 8, 8, 8, 8];

    // Simple zoom/pan plugin using Chart.js built‑in features (no external deps)
    const simpleZoomPlugin = {
      id: 'simpleZoom',
      beforeInit(chart) {
        const state = {
          isDragging: false,
          dragStartX: null,
          dragStartScale: null
        };
        chart.$zoomState = state;

        const canvas = chart.canvas;

        // Convert mouse X to value in the x scale
        const getValueForX = (event) => {
          const rect = canvas.getBoundingClientRect();
          const x = event.clientX - rect.left;
          return chart.scales.x.getValueForPixel(x);
        };

        // Mouse down: start drag
        canvas.addEventListener('mousedown', (e) => {
          const xScale = chart.scales.x;
          state.isDragging = true;
          state.dragStartX = getValueForX(e);
          state.dragStartScale = {
            min: xScale.min,
            max: xScale.max
          };
        });

        // Mouse move: update drag (pan)
        window.addEventListener('mousemove', (e) => {
          if (!state.isDragging) return;
          const xScale = chart.scales.x;
          const currentValue = getValueForX(e);
          const delta = state.dragStartX - currentValue;
          const range = state.dragStartScale.max - state.dragStartScale.min;

          let newMin = state.dragStartScale.min + delta;
          let newMax = state.dragStartScale.max + delta;

          // Clamp to data bounds
          const dataMin = years[0] - 0.4;
          const dataMax = years[years.length - 1] + 0.4;
          if (newMin < dataMin) {
            const diff = dataMin - newMin;
            newMin += diff;
            newMax += diff;
          }
          if (newMax > dataMax) {
            const diff = newMax - dataMax;
            newMin -= diff;
            newMax -= diff;
          }

          xScale.options.min = newMin;
          xScale.options.max = newMax;
          chart.update('none');
        });

        // Mouse up: end drag
        window.addEventListener('mouseup', () => {
          state.isDragging = false;
        });

        // Wheel to zoom in/out
        canvas.addEventListener('wheel', (e) => {
          e.preventDefault();
          const xScale = chart.scales.x;
          const mouseValue = getValueForX(e);

          const zoomFactor = e.deltaY < 0 ? 0.9 : 1.1; // zoom in vs out
          const min = xScale.min;
          const max = xScale.max;
          const range = max - min;

          const newRange = range * zoomFactor;
          const ratio = (mouseValue - min) / range;
          let newMin = mouseValue - newRange * ratio;
          let newMax = mouseValue + newRange * (1 - ratio);

          const dataMin = years[0] - 0.4;
          const dataMax = years[years.length - 1] + 0.4;

          // Clamp zoom: don't go beyond data and don't zoom too far in
          const minRange = 1; // at least 1 year visible
          if (newRange < minRange) {
            return;
          }

          if (newMin < dataMin) {
            const diff = dataMin - newMin;
            newMin += diff;
            newMax += diff;
          }
          if (newMax > dataMax) {
            const diff = newMax - dataMax;
            newMin -= diff;
            newMax -= diff;
          }

          xScale.options.min = newMin;
          xScale.options.max = newMax;
          chart.update('none');
        });

        // Double‑click to reset zoom/pan
        canvas.addEventListener('dblclick', () => {
          const xScale = chart.scales.x;
          xScale.options.min = years[0] - 0.4;
          xScale.options.max = years[years.length - 1] + 0.4;
          chart.update();
        });
      }
    };

    Chart.register(simpleZoomPlugin);

    const ctx = document.getElementById('piotroskiChart').getContext('2d');

    new Chart(ctx, {
      type: 'line',
      data: {
        labels: years,
        datasets: [
          {
            label: "Piotroski F-Score",
            data: fScores,
            tension: 0.25,
            borderColor: ctx.createLinearGradient(0, 0, 0, 400),
            segment: {
              borderColor: (ctxSegment) => {
                const { p0, p1 } = ctxSegment;
                if (!p0 || !p1) return '#2563eb';
                return p1.parsed.y >= p0.parsed.y ? '#22c55e' : '#ef4444';
              }
            },
            borderWidth: 2.4,
            pointRadius: 4,
            pointHoverRadius: 5.5,
            pointBackgroundColor: '#ffffff',
            pointBorderColor: '#2563eb',
            pointBorderWidth: 2,
            fill: {
              target: 'origin',
              above: 'rgba(37, 99, 235, 0.16)'
            }
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: {
          mode: 'nearest',
          axis: 'x',
          intersect: false
        },
        plugins: {
          legend: {
            display: false
          },
          tooltip: {
            backgroundColor: getComputedStyle(document.documentElement)
              .getPropertyValue('--tooltip-bg').trim() || 'rgba(15,23,42,0.98)',
            titleColor: getComputedStyle(document.documentElement)
              .getPropertyValue('--tooltip-color').trim() || '#f9fafb',
            bodyColor: getComputedStyle(document.documentElement)
              .getPropertyValue('--tooltip-color').trim() || '#f9fafb',
            borderColor: 'rgba(148,163,184,0.4)',
            borderWidth: 1,
            padding: 10,
            displayColors: false,
            callbacks: {
              title: (items) => `Fiscal Year: ${items[0].label}`,
              label: (item) => `Piotroski F-Score: ${item.formattedValue}`
            }
          }
        },
        scales: {
          x: {
            type: 'linear',
            title: {
              display: true,
              text: 'Fiscal Year',
              font: { size: 11, weight: '500' }
            },
            ticks: {
              stepSize: 1,
              precision: 0,
              callback: (val) => val
            },
            min: years[0] - 0.4,
            max: years[years.length - 1] + 0.4,
            grid: {
              color: getComputedStyle(document.documentElement)
                .getPropertyValue('--grid-color').trim() || 'rgba(0,0,0,0.07)'
            }
          },
          y: {
            title: {
              display: true,
              text: 'Piotroski F-Score',
              font: { size: 11, weight: '500' }
            },
            min: 0,
            max: 9,
            ticks: {
              stepSize: 1
            },
            grid: {
              color: getComputedStyle(document.documentElement)
                .getPropertyValue('--grid-color').trim() || 'rgba(0,0,0,0.07)'
            }
          }
        }
      }
    });
  </script>
</body>
</html>
