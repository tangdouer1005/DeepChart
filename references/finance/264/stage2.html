<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>v 的投入资本回报率（ROIC）2016–2024 变化趋势</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Chart.js (latest stable 4.x at time of writing) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      color-scheme: light dark;
      --bg-color: #ffffff;
      --text-color: #222222;
      --grid-color: rgba(0, 0, 0, 0.08);
      --accent: #2563eb;
      --accent-soft: rgba(37, 99, 235, 0.15);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #0b1120;
        --text-color: #e5e7eb;
        --grid-color: rgba(148, 163, 184, 0.35);
        --accent: #60a5fa;
        --accent-soft: rgba(96, 165, 250, 0.15);
      }
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      background: radial-gradient(circle at top left, #eff6ff 0, #ffffff 40%, #e5e7eb 100%);
      background-attachment: fixed;
      color: var(--text-color);
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
    }

    .card {
      background-color: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 18px;
      box-shadow:
        0 18px 45px rgba(15, 23, 42, 0.20),
        0 0 0 1px rgba(148, 163, 184, 0.18);
      max-width: 960px;
      width: 100%;
      padding: 20px 22px 24px;
      box-sizing: border-box;
    }

    @media (prefers-color-scheme: dark) {
      .card {
        background-color: rgba(15, 23, 42, 0.92);
      }
      body {
        background: radial-gradient(circle at top left, #0f172a 0, #020617 50%, #000000 100%);
      }
    }

    .header {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .title {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .subtitle {
      font-size: 0.85rem;
      color: #6b7280;
    }
    @media (prefers-color-scheme: dark) {
      .subtitle {
        color: #9ca3af;
      }
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 0.78rem;
      color: #6b7280;
      margin-bottom: 10px;
    }
    @media (prefers-color-scheme: dark) {
      .meta {
        color: #9ca3af;
      }
    }

    .meta span {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 999px;
      background-color: rgba(148, 163, 184, 0.12);
    }

    .meta span strong {
      font-weight: 600;
      color: var(--text-color);
    }

    .chart-container {
      position: relative;
      width: 100%;
      max-width: 100%;
      height: 420px;
      margin-top: 6px;
    }

    @media (max-width: 600px) {
      .card {
        padding: 14px 12px 18px;
      }
      .title {
        font-size: 1.05rem;
      }
      .subtitle {
        font-size: 0.8rem;
      }
      .chart-container {
        height: 320px;
      }
    }

    .legend-inline {
      display: flex;
      justify-content: flex-start;
      gap: 12px;
      align-items: center;
      margin-bottom: 4px;
      font-size: 0.8rem;
    }

    .legend-swatch {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent-soft), var(--accent));
      box-shadow: 0 0 0 1px rgba(37, 99, 235, 0.3);
    }

    .hint {
      margin-top: 8px;
      font-size: 0.75rem;
      color: #6b7280;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
    }
    @media (prefers-color-scheme: dark) {
      .hint {
        color: #9ca3af;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="card">
      <div class="header">
        <div>
          <div class="title">v 的投入资本回报率（ROIC）趋势</div>
          <div class="subtitle">2016–2024 财年变化（单位：%）</div>
        </div>
      </div>

      <div class="meta">
        <span><strong>指标</strong> ROIC（Return on Invested Capital）</span>
        <span><strong>区间</strong> 2016–2024 财年</span>
        <span><strong>交互</strong> 悬停查看具体数值</span>
      </div>

      <div class="legend-inline">
        <span class="legend-swatch"></span>
        <span>ROIC（年末值，已换算为百分比）</span>
      </div>

      <div class="chart-container">
        <canvas id="roicChart"></canvas>
      </div>

      <div class="hint">
        <span>提示：将鼠标悬停在折线节点上可查看精确 ROIC 数值。</span>
        <span>数据来源：用户提供的 2016–2024 财年 ROIC 序列。</span>
      </div>
    </div>
  </div>

  <script>
    // Data from source (converted to percentages)
    const labels = [
      "2016", "2017", "2018", "2019", "2020",
      "2021", "2022", "2023", "2024"
    ];

    const roicRaw = [
      0.1578676115879611,
      0.1608282329416772,
      0.2426229584502731,
      0.2640788301220306,
      0.2420862503672333,
      0.2811041632879178,
      0.367570412310678,
      0.4040071263492115,
      0.4280222803015777
    ];

    const roicPercent = roicRaw.map(v => v * 100);

    const ctx = document.getElementById("roicChart").getContext("2d");

    // Detect theme for tick/tooltip styling
    const isDark = window.matchMedia &&
      window.matchMedia("(prefers-color-scheme: dark)").matches;

    const textColor = isDark ? "#e5e7eb" : "#111827";
    const gridColor = isDark ? "rgba(148, 163, 184, 0.4)" : "rgba(15, 23, 42, 0.1)";
    const tooltipBg = isDark ? "rgba(15, 23, 42, 0.98)" : "rgba(255, 255, 255, 0.98)";
    const tooltipBorder = isDark ? "rgba(55, 65, 81, 0.9)" : "rgba(209, 213, 219, 0.9)";

    new Chart(ctx, {
      type: "line",
      data: {
        labels: labels,
        datasets: [
          {
            label: "ROIC",
            data: roicPercent,
            tension: 0.32,
            pointRadius: 4,
            pointHoverRadius: 6,
            pointBackgroundColor: "#ffffff",
            pointBorderWidth: 2,
            pointBorderColor: "#2563eb",
            borderColor: "#2563eb",
            borderWidth: 2,
            fill: {
              target: "origin",
              above: "rgba(37, 99, 235, 0.15)"
            }
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: {
          mode: "nearest",
          intersect: false
        },
        plugins: {
          legend: {
            display: false
          },
          tooltip: {
            backgroundColor: tooltipBg,
            titleColor: textColor,
            bodyColor: textColor,
            borderColor: tooltipBorder,
            borderWidth: 1,
            padding: 10,
            displayColors: false,
            callbacks: {
              title: context => `财年：${context[0].label}`,
              label: context => {
                const value = context.parsed.y;
                return `ROIC：${value.toFixed(2)}%`;
              }
            }
          }
        },
        scales: {
          x: {
            title: {
              display: false
            },
            ticks: {
              color: textColor,
              maxRotation: 0
            },
            grid: {
              color: gridColor,
              drawBorder: false
            }
          },
          y: {
            title: {
              display: true,
              text: "ROIC（%）",
              color: textColor
            },
            ticks: {
              color: textColor,
              callback: value => value + "%"
            },
            grid: {
              color: gridColor,
              drawBorder: false
            },
            beginAtZero: true
          }
        }
      }
    });
  </script>
</body>
</html>
