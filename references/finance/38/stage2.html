<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>AMZN 经济增加值 (EVA) 2016-2024 柱状图</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue",
        Arial, "Noto Sans", "Liberation Sans", sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #fafafa;
      color: #222;
    }
    h1 {
      font-size: 22px;
      margin-bottom: 4px;
    }
    h2 {
      font-size: 14px;
      font-weight: 400;
      color: #666;
      margin-top: 0;
      margin-bottom: 16px;
    }
    #chartContainer {
      max-width: 960px;
      margin: 0 auto;
      background: #fff;
      border-radius: 8px;
      padding: 16px 20px 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    /* Key fix: control chart aspect ratio */
    .chart-wrapper {
      position: relative;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      /* 16:9 aspect ratio to avoid vertical stretching */
      aspect-ratio: 16 / 9;
    }
    canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
      font-size: 13px;
    }
    .controls label {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .note {
      font-size: 12px;
      color: #777;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div id="chartContainer">
    <h1>AMZN 经济增加值 (EVA) - 简化版</h1>
    <h2>2016 - 2024 财年变化（单位：美元）</h2>

    <div class="controls">
      <label>
        <input type="checkbox" id="logScaleToggle" />
        使用对数坐标（仅正值）
      </label>
      <label>
        <input type="checkbox" id="formatBillionsToggle" checked />
        以十亿美元显示刻度和数值
      </label>
    </div>

    <div class="chart-wrapper">
      <canvas id="evaChart"></canvas>
    </div>

    <div class="note">
      数据来源：用户提供财报数据（RESULT_EVA）。正值代表经济增加值为正，负值代表经济增加值为负。
    </div>
  </div>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>

  <script>
    // ===== 原始数据（美元） =====
    const evaData = [
      { year: 2016, value: 1712906115.1079135 },
      { year: 2017, value: -122506095.6384654 },
      { year: 2018, value: 6782123932.155226 },
      { year: 2019, value: 7296777618.775042 },
      { year: 2020, value: 12692350781.702374 },
      { year: 2021, value: 8459446862.467564 },
      { year: 2022, value: -4794550000.0 },
      { year: 2023, value: 10870352847.671535 },
      { year: 2024, value: 36031581615.16792 }
    ];

    const ctx = document.getElementById('evaChart').getContext('2d');
    const logToggle = document.getElementById('logScaleToggle');
    const formatBillionsToggle = document.getElementById('formatBillionsToggle');

    // ===== Helpers =====
    function formatNumber(value, useBillions) {
      if (value === null || value === undefined || isNaN(value)) return '';
      if (!useBillions) {
        const abs = Math.abs(value);
        if (abs >= 1e12) return (value / 1e12).toFixed(2) + ' 万亿';
        if (abs >= 1e9) return (value / 1e9).toFixed(2) + ' 十亿';
        if (abs >= 1e6) return (value / 1e6).toFixed(2) + ' 百万';
        if (abs >= 1e3) return (value / 1e3).toFixed(2) + ' 千';
        return value.toFixed(2);
      } else {
        return (value / 1e9).toFixed(2) + ' 十亿';
      }
    }

    function buildChartConfig(useLogScale, useBillions) {
      const labels = evaData.map(d => d.year.toString());
      const values = evaData.map(d => d.value);

      const backgroundColors = values.map(v =>
        v >= 0 ? 'rgba(54, 162, 235, 0.7)' : 'rgba(231, 76, 60, 0.75)'
      );
      const borderColors = values.map(v =>
        v >= 0 ? 'rgba(54, 162, 235, 1)' : 'rgba(192, 57, 43, 1)'
      );

      const config = {
        type: 'bar',
        data: {
          labels,
          datasets: [{
            label: 'EVA（美元）',
            data: values,
            backgroundColor: backgroundColors,
            borderColor: borderColors,
            borderWidth: 1.2,
            borderRadius: 4,
            hoverBackgroundColor: backgroundColors,
            hoverBorderColor: borderColors
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false, // use CSS aspect-ratio instead
          interaction: {
            mode: 'nearest',
            intersect: false
          },
          plugins: {
            tooltip: {
              callbacks: {
                label: context => {
                  const value = context.parsed.y;
                  const year = context.label;
                  const formatted = formatNumber(value, useBillions);
                  return ` ${year} 年 EVA: ${formatted}`;
                }
              }
            },
            legend: {
              display: false
            },
            title: {
              display: false
            }
          },
          scales: {
            x: {
              grid: {
                display: false
              },
              ticks: {
                maxRotation: 0
              }
            },
            y: {
              type: useLogScale ? 'logarithmic' : 'linear',
              beginAtZero: !useLogScale,
              grace: useLogScale ? 0 : '5%',
              grid: {
                color: 'rgba(0,0,0,0.06)'
              },
              ticks: {
                callback: (value) => {
                  const num = Number(value);
                  if (useLogScale) {
                    if (num <= 0 || isNaN(num)) return '';
                    return formatNumber(num, useBillions);
                  } else {
                    return formatNumber(num, useBillions);
                  }
                }
              }
            }
          }
        }
      };

      if (useLogScale) {
        config.options.scales.y.min = undefined;
      }

      return config;
    }

    // ===== Init Chart =====
    let evaChart = new Chart(ctx, buildChartConfig(false, true));

    // ===== Interactivity: toggles =====
    logToggle.addEventListener('change', () => {
      const useLog = logToggle.checked;
      evaChart.destroy();
      evaChart = new Chart(ctx, buildChartConfig(useLog, formatBillionsToggle.checked));
    });

    formatBillionsToggle.addEventListener('change', () => {
      const useBillions = formatBillionsToggle.checked;
      const useLog = logToggle.checked;
      evaChart.destroy();
      evaChart = new Chart(ctx, buildChartConfig(useLog, useBillions));
    });
  </script>
</body>
</html>
