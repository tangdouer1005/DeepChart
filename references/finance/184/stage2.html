<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>NFLX 2016–2024 年 EBITDA 变化趋势</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Chart.js (latest stable v4) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f5f7;
      --fg: #111827;
      --card-bg: #ffffff;
      --axis: #6b7280;
      --line: #2563eb;
      --line-fill: rgba(37, 99, 235, 0.12);
      --grid: rgba(148, 163, 184, 0.35);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #020617;
        --fg: #e5e7eb;
        --card-bg: #020617;
        --axis: #9ca3af;
        --line: #60a5fa;
        --line-fill: rgba(37, 99, 235, 0.18);
        --grid: rgba(55, 65, 81, 0.9);
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
      background: radial-gradient(circle at top left, #dbeafe 0, var(--bg) 45%);
      color: var(--fg);
    }

    .wrapper {
      max-width: 960px;
      margin: 0 auto;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 20px 20px 16px;
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.22);
      border: 1px solid rgba(148, 163, 184, 0.45);
    }

    h1 {
      margin: 0 0 4px;
      font-size: 1.35rem;
      font-weight: 650;
      letter-spacing: 0.02em;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #6b7280;
      margin-bottom: 16px;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 0.8rem;
      color: #6b7280;
      margin-bottom: 6px;
    }

    .meta span {
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.15);
    }

    .chart-container {
      position: relative;
      width: 100%;
      height: 420px;
    }

    .legend-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 12px;
      gap: 12px;
      font-size: 0.85rem;
      color: #4b5563;
      flex-wrap: wrap;
    }

    .legend-main {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: var(--line);
    }

    .legend-caption {
      font-size: 0.78rem;
      color: #6b7280;
    }

    .toggle-btn {
      border: none;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      cursor: pointer;
      background: rgba(148, 163, 184, 0.18);
      color: #374151;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .toggle-btn span {
      font-size: 0.7rem;
      opacity: 0.75;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="card">
      <h1>NFLX 2016–2024 年 息税折旧摊销前利润（EBITDA）</h1>
      <div class="subtitle">单位：美元（十亿）</div>

      <div class="meta">
        <span>公司：Netflix, Inc.（NFLX）</span>
        <span>口径：年度合并 EBITDA</span>
        <span>数据来源：用户提供结构化财报数据</span>
      </div>

      <div class="chart-container">
        <canvas id="ebitdaChart"></canvas>
      </div>

      <div class="legend-row">
        <div class="legend-main">
          <span class="legend-dot"></span>
          <span>EBITDA（2016–2024 财年）</span>
        </div>
        <button class="toggle-btn" id="scaleToggle">
          切换刻度：<strong id="scaleLabel">线性</strong> <span>↔</span> <span>对数</span>
        </button>
      </div>
      <div class="legend-caption">
        提示：鼠标悬浮可查看精确数值，拖拽可缩放；双击图表区域或点击图例可重置视图。
      </div>
    </div>
  </div>

  <script>
    // 原始数据（单位：美元）
    const rawData = [
      { year: 2016, ebitda: 5335599000 },
      { year: 2017, ebitda: 7255623000 },
      { year: 2018, ebitda: 9262196000 },
      { year: 2019, ebitda: 12008080000 },
      { year: 2020, ebitda: 15507911000 },
      { year: 2021, ebitda: 19044502000 },
      { year: 2022, ebitda: 20332955000 },
      { year: 2023, ebitda: 21459615000 },
      { year: 2024, ebitda: 26314821000 },
    ];

    // 转为“十亿美元”便于显示
    const labels = rawData.map(d => d.year.toString());
    const ebitdaBillions = rawData.map(d => d.ebitda / 1e9);

    const ctx = document.getElementById('ebitdaChart').getContext('2d');

    // 自定义数字格式化函数
    const formatBillions = (val) => {
      if (val === null || val === undefined || isNaN(val)) return '';
      // 保留 2 位小数，末尾加 B（十亿）
      return val.toLocaleString('en-US', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }) + ' B';
    };

    // 初始 Y 轴为线性
    let currentScaleType = 'linear';

    const chartConfig = {
      type: 'line',
      data: {
        labels,
        datasets: [{
          label: 'NFLX EBITDA',
          data: ebitdaBillions,
          borderColor: getComputedStyle(document.documentElement)
            .getPropertyValue('--line')
            .trim() || '#2563eb',
          backgroundColor: getComputedStyle(document.documentElement)
            .getPropertyValue('--line-fill')
            .trim() || 'rgba(37, 99, 235, 0.12)',
          fill: true,
          tension: 0.2,
          pointRadius: 4,
          pointHoverRadius: 6,
          pointHitRadius: 10,
          pointBackgroundColor: '#ffffff',
          pointBorderColor: 'transparent',
          pointHoverBorderWidth: 2,
          pointHoverBorderColor: '#1f2933',
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: {
          mode: 'index',
          intersect: false,
        },
        plugins: {
          legend: {
            display: false
          },
          tooltip: {
            backgroundColor: 'rgba(15, 23, 42, 0.93)',
            padding: 10,
            titleFont: {
              weight: '600'
            },
            callbacks: {
              title: (items) => {
                const year = items[0].label;
                return `财年 ${year}`;
              },
              label: (ctx) => {
                const idx = ctx.dataIndex;
                const raw = rawData[idx];
                const val = ctx.parsed.y;
                const billions = formatBillions(val);
                const rawStr = raw.ebitda.toLocaleString('en-US');
                return [
                  `EBITDA：${billions}`,
                  `（约 $${rawStr}）`
                ];
              }
            }
          },
          title: {
            display: false
          },
          zoom: {
            // 可选：如需缩放功能，可引入 chartjs-plugin-zoom
          }
        },
        scales: {
          x: {
            grid: {
              color: getComputedStyle(document.documentElement)
                .getPropertyValue('--grid')
                .trim() || 'rgba(148, 163, 184, 0.35)',
              drawBorder: false
            },
            ticks: {
              color: getComputedStyle(document.documentElement)
                .getPropertyValue('--axis')
                .trim() || '#6b7280',
            }
          },
          y: {
            type: currentScaleType,
            beginAtZero: false,
            min: 4, // 十亿美元，略低于最小值 5.3B
            grid: {
              color: getComputedStyle(document.documentElement)
                .getPropertyValue('--grid')
                .trim() || 'rgba(148, 163, 184, 0.35)',
              drawBorder: false
            },
            ticks: {
              color: getComputedStyle(document.documentElement)
                .getPropertyValue('--axis')
                .trim() || '#6b7280',
              callback: (value) => formatBillions(value)
            },
            title: {
              display: true,
              text: 'EBITDA（十亿美元）',
              color: getComputedStyle(document.documentElement)
                .getPropertyValue('--axis')
                .trim() || '#6b7280',
              font: {
                size: 11,
                weight: '500'
              }
            }
          }
        }
      }
    };

    const ebitdaChart = new Chart(ctx, chartConfig);

    // 刻度切换：线性 / 对数
    const scaleToggleBtn = document.getElementById('scaleToggle');
    const scaleLabel = document.getElementById('scaleLabel');

    scaleToggleBtn.addEventListener('click', () => {
      currentScaleType = currentScaleType === 'linear' ? 'logarithmic' : 'linear';
      ebitdaChart.options.scales.y.type = currentScaleType;

      if (currentScaleType === 'logarithmic') {
        ebitdaChart.options.scales.y.min = 1; // 对数坐标不能为 0
        scaleLabel.textContent = '对数';
      } else {
        ebitdaChart.options.scales.y.min = 4;
        scaleLabel.textContent = '线性';
      }
      ebitdaChart.update();
    });

    // 双击图表区域重置视图（目前仅重置缩放留作扩展）
    document.getElementById('ebitdaChart').addEventListener('dblclick', () => {
      // 若后续接入 zoom 插件，这里可调用 resetZoom()
      ebitdaChart.reset();
    });
  </script>
</body>
</html>
