<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NFLX Piotroski F-Score (2016–2024)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Chart.js (latest stable 4.x) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      color-scheme: light dark;
      --bg-color: #f7f7f9;
      --card-bg: #ffffff;
      --text-color: #222222;
      --axis-color: #555555;
      --bar-color: #2563eb;
      --bar-hover: #1d4ed8;
      --grid-color: rgba(148, 163, 184, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      padding: 24px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 4px;
    }

    .subtitle {
      color: #6b7280;
      font-size: 0.9rem;
      margin-bottom: 20px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 18px 18px 12px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    }

    canvas {
      max-width: 100%;
      height: 420px;
    }

    .note {
      margin-top: 10px;
      font-size: 0.8rem;
      color: #6b7280;
    }

    @media (max-width: 600px) {
      body {
        padding: 12px;
      }
      h1 {
        font-size: 1.3rem;
      }
      canvas {
        height: 340px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>NFLX 皮奥特罗斯基 F-Score (Piotroski F-Score)</h1>
    <div class="subtitle">Fiscal years 2016–2024</div>

    <div class="card">
      <canvas id="fScoreChart"></canvas>
      <div class="note">
        Data: User-provided Piotroski F-Score values for Netflix (NFLX), fiscal years 2016–2024.
        F-Score range: 0–9 (higher indicates stronger fundamentals).
      </div>
    </div>
  </div>

  <script>
    // Source data (from user)
    const years = [2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024];
    const fScores = [2, 4, 4, 3, 7, 6, 5, 8, 8];

    const ctx = document.getElementById('fScoreChart').getContext('2d');

    const chart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: years,
        datasets: [{
          label: 'Piotroski F-Score',
          data: fScores,
          backgroundColor: 'rgba(37, 99, 235, 0.75)',
          borderColor: 'rgba(37, 99, 235, 1)',
          borderWidth: 1.5,
          borderRadius: 6,
          hoverBackgroundColor: 'rgba(29, 78, 216, 0.9)',
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          title: {
            display: false
          },
          legend: {
            display: true,
            labels: {
              font: {
                size: 12
              },
              color: '#374151'
            }
          },
          tooltip: {
            usePointStyle: true,
            callbacks: {
              label: (context) => {
                const value = context.parsed.y;
                return `F-Score: ${value}`;
              },
              footer: (items) => {
                const year = items[0].label;
                return `Fiscal year: ${year}`;
              }
            }
          }
        },
        scales: {
          x: {
            grid: {
              display: false
            },
            ticks: {
              color: '#4b5563',
              font: {
                size: 11
              }
            }
          },
          y: {
            beginAtZero: true,
            suggestedMax: 9,
            ticks: {
              stepSize: 1,
              color: '#4b5563',
              font: {
                size: 11
              }
            },
            title: {
              display: true,
              text: 'Piotroski F-Score (0–9)',
              color: '#4b5563',
              font: {
                size: 12,
                weight: '500'
              }
            },
            grid: {
              color: 'rgba(148, 163, 184, 0.3)'
            }
          }
        },
        interaction: {
          mode: 'nearest',
          axis: 'x',
          intersect: true
        },
        animation: {
          duration: 900,
          easing: 'easeOutQuart'
        }
      }
    });
  </script>
</body>
</html>
