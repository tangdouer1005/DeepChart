<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>HD 投入资本回报率 (ROIC) 2016–2024</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue",
        Arial, "Noto Sans", sans-serif;
      margin: 0;
      padding: 24px;
      background-color: #f7f7f9;
      color: #222;
    }

    h1 {
      font-size: 20px;
      margin: 0 0 4px 0;
    }

    h2 {
      font-size: 13px;
      font-weight: 500;
      margin: 0 0 20px 0;
      color: #666;
    }

    .chart-container {
      max-width: 900px;
      margin: 0 auto;
      background: #fff;
      border-radius: 10px;
      padding: 20px 24px 28px 24px;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.12);
      box-sizing: border-box;
    }

    .chart-wrapper {
      position: relative;
      height: 420px;
    }

    .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
      font-size: 12px;
      color: #555;
      gap: 10px;
      flex-wrap: wrap;
    }

    .meta span.label {
      font-weight: 600;
      color: #333;
    }

    .note {
      font-size: 11px;
      color: #777;
      margin-top: 6px;
      line-height: 1.45;
    }

    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
      font-size: 11px;
    }

    .btn {
      border-radius: 999px;
      border: 1px solid #d0d7de;
      background: #f6f8fa;
      padding: 4px 10px;
      cursor: pointer;
      font-size: 11px;
      color: #444;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .btn:hover {
      background: #e6edf5;
      border-color: #9bb5d0;
      color: #1f2933;
    }

    .btn:active {
      background: #d0e2ff;
    }

    .btn span.icon {
      font-size: 13px;
    }

    @media (max-width: 600px) {
      body {
        padding: 12px;
      }
      .chart-container {
        padding: 14px 12px 18px 12px;
      }
      .chart-wrapper {
        height: 340px;
      }
    }
  </style>
</head>
<body>
  <div class="chart-container">
    <h1>HD 投入资本回报率 (ROIC)</h1>
    <h2>2016–2024 年度变化（柱状图，单位：百分比）</h2>
    <div class="chart-wrapper">
      <canvas id="roicChart"></canvas>
    </div>

    <div class="meta">
      <div>
        <span class="label">说明：</span>
        柱体高度表示当年 ROIC（投入资本回报率），数值越高代表资本使用效率越好。
      </div>
      <div class="controls">
        <button class="btn" id="toggleValuesBtn">
          <span class="icon">🔢</span> 显示/隐藏柱体数值
        </button>
      </div>
    </div>
    <div class="note">
      数据来源：用户提供。<br />
      提示：鼠标悬停可查看精确数值。
    </div>
  </div>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>

  <script>
    // 原始数据（ROIC 为小数形式）
    const years = [2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024];
    const roicRaw = [
      0.2820985806927257,
      0.3186339135958768,
      0.3678900884274318,
      0.4705312177907826,
      0.4601494856035973,
      0.4576470456085698,
      0.4952039941903304,
      0.4583733953515355,
      0.386107352926364
    ];

    // 转换为百分比并保留 1 位小数
    const roicPct = roicRaw.map(v => +(v * 100).toFixed(1));

    const ctx = document.getElementById('roicChart').getContext('2d');

    // 渐变填充
    const gradient = ctx.createLinearGradient(0, 0, 0, 400);
    gradient.addColorStop(0, '#1d4ed8');   // 深蓝
    gradient.addColorStop(1, '#60a5fa');   // 浅蓝

    // 自定义插件：在柱体上方绘制数据标签
    const valueLabelPlugin = {
      id: 'valueLabelPlugin',
      afterDatasetsDraw(chart, args, pluginOptions) {
        const {
          ctx,
          data,
          chartArea: { top },
          scales: { x, y }
        } = chart;
        const show = chart.config.options.plugins.valueLabel?.display;
        if (!show) return;

        ctx.save();
        ctx.font = '11px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';

        data.datasets.forEach((dataset, datasetIndex) => {
          const meta = chart.getDatasetMeta(datasetIndex);
          meta.data.forEach((element, index) => {
            const value = dataset.data[index];
            if (value == null) return;
            const position = element.tooltipPosition();
            const text = value.toFixed(1) + '%';

            const labelY = position.y - 4;
            if (labelY <= top + 8) return;

            ctx.fillStyle = '#111827';
            ctx.fillText(text, position.x, labelY);
          });
        });

        ctx.restore();
      }
    };

    Chart.register(valueLabelPlugin);

    const roicChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: years,
        datasets: [
          {
            label: 'ROIC (%)',
            data: roicPct,
            backgroundColor: gradient,
            borderColor: '#1d4ed8',
            borderWidth: 1,
            borderRadius: 5,
            hoverBackgroundColor: '#2563eb',
            hoverBorderColor: '#1d4ed8'
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        layout: {
          padding: {
            top: 20,
            right: 16,
            bottom: 10,
            left: 8
          }
        },
        plugins: {
          legend: {
            display: true,
            labels: {
              font: { size: 11 },
              color: '#374151'
            }
          },
          tooltip: {
            enabled: true,
            backgroundColor: '#111827',
            titleColor: '#e5e7eb',
            bodyColor: '#f9fafb',
            padding: 10,
            cornerRadius: 6,
            displayColors: false,
            callbacks: {
              label: function (context) {
                const value = context.parsed.y;
                return 'ROIC：' + value.toFixed(1) + '%';
              },
              title: function (items) {
                if (!items.length) return '';
                return '财年：' + items[0].label;
              }
            }
          },
          title: {
            display: false
          },
          valueLabel: {
            display: true // 初始显示柱体顶部数值
          }
        },
        scales: {
          x: {
            grid: {
              display: false,
              drawBorder: false
            },
            ticks: {
              color: '#4b5563',
              font: {
                size: 11
              }
            }
          },
          y: {
            beginAtZero: true,
            suggestedMax: 60, // 60% 便于观察趋势
            grid: {
              color: '#e5e7eb',
              drawBorder: false
            },
            ticks: {
              color: '#6b7280',
              font: { size: 11 },
              callback: function (value) {
                return value + '%';
              }
            },
            title: {
              display: true,
              text: 'ROIC (%)',
              color: '#374151',
              font: { size: 12, weight: '600' }
            }
          }
        },
        animation: {
          duration: 800,
          easing: 'easeOutQuart'
        }
      }
    });

    // 交互按钮：切换柱体顶部数值显示
    const toggleBtn = document.getElementById('toggleValuesBtn');
    toggleBtn.addEventListener('click', () => {
      const current = roicChart.options.plugins.valueLabel.display;
      roicChart.options.plugins.valueLabel.display = !current;
      roicChart.update();
    });
  </script>
</body>
</html>
