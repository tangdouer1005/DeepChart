<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>NFLX 格雷厄姆“烟蒂股”净值 (NNWC) 2016–2024</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --fg: #222222;
      --grid: #e0e0e0;
      --bar: #1f77b4;
      --bar-hover: #1565c0;
      --negative-line: #b71c1c33;
      --axis: #555555;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121212;
        --fg: #e5e5e5;
        --grid: #333333;
        --bar: #64b5f6;
        --bar-hover: #90caf9;
        --negative-line: #ef53504d;
        --axis: #bbbbbb;
      }
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .container {
      max-width: 900px;
      margin: 24px auto;
      padding: 0 16px 32px;
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 0.25rem;
    }

    .subtitle {
      font-size: 0.9rem;
      color: var(--axis);
      margin-bottom: 1.2rem;
    }

    .chart-wrapper {
      background: rgba(255, 255, 255, 0.02);
      border-radius: 8px;
      padding: 16px 16px 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }

    canvas {
      max-height: 520px;
    }

    .note {
      font-size: 0.8rem;
      color: var(--axis);
      margin-top: 0.75rem;
      line-height: 1.4;
    }

    .legend-note {
      margin-top: 0.4rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>NFLX 格雷厄姆“烟蒂股”净值 (NNWC) 每股变化</h1>
    <div class="subtitle">2016–2024 财年，单位：每股 NNWC</div>

    <div class="chart-wrapper">
      <canvas id="nnwcChart"></canvas>
    </div>

    <div class="note">
      说明：格雷厄姆“烟蒂股”净值 (Net-Net Working Capital, NNWC) 为简化的每股指标，
      数值为负表示流动负债超过流动资产及折扣后存货。
      <div class="legend-note">将鼠标悬停在柱状图上可查看具体数值；可在图例中点击系列名称进行隐藏/显示。</div>
    </div>
  </div>

  <!-- Chart.js (latest 4.x) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    // Data from the user (nflx NNWC per share, 2016–2024)
    const years = [
      "2016","2017","2018","2019","2020","2021","2022","2023","2024"
    ];
    const nnwcPerShare = [
      -1.1823766904060622,
      -1.736922298764139,
      -2.44690234108376,
      -4.474682855024183,
      -4.062794798858673,
      -4.538177577892361,
      -4.110637062642646,
      -4.05464451454734,
      -3.5938605976856586
    ];

    const ctx = document.getElementById("nnwcChart").getContext("2d");

    // Compute a reasonable Y scale so negative bars are well visible
    const minVal = Math.min(...nnwcPerShare);
    const maxVal = Math.max(...nnwcPerShare);
    const padding = 0.5;
    const suggestedMin = Math.floor((minVal - padding) * 10) / 10;
    const suggestedMax = Math.ceil((maxVal + padding) * 10) / 10;

    const nnwcChart = new Chart(ctx, {
      type: "bar",
      data: {
        labels: years,
        datasets: [
          {
            label: "NNWC 每股 (美元)",
            data: nnwcPerShare,
            backgroundColor: function(context) {
              const value = context.raw;
              return value < 0 ? "var(--bar)" : "#43a047";
            },
            hoverBackgroundColor: function(context) {
              const value = context.raw;
              return value < 0 ? "var(--bar-hover)" : "#66bb6a";
            },
            borderRadius: 6,
            borderSkipped: false
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: {
          mode: "index",
          intersect: false
        },
        plugins: {
          tooltip: {
            callbacks: {
              label: function(context) {
                const v = context.parsed.y;
                return ` NNWC 每股: ${v.toFixed(3)}`;
              }
            }
          },
          legend: {
            display: true,
            labels: {
              color: getComputedStyle(document.documentElement)
                .getPropertyValue("--fg")
            }
          },
          title: {
            display: false
          }
        },
        scales: {
          x: {
            grid: {
              display: false
            },
            ticks: {
              color: getComputedStyle(document.documentElement)
                .getPropertyValue("--axis")
            }
          },
          y: {
            beginAtZero: false,
            suggestedMin: suggestedMin,
            suggestedMax: suggestedMax,
            grid: {
              color: getComputedStyle(document.documentElement)
                .getPropertyValue("--grid")
            },
            ticks: {
              color: getComputedStyle(document.documentElement)
                .getPropertyValue("--axis"),
              callback: function(value) {
                return value.toFixed(1);
              }
            },
            title: {
              display: true,
              text: "NNWC 每股 (美元)",
              color: getComputedStyle(document.documentElement)
                .getPropertyValue("--axis")
            }
          }
        }
      },
      plugins: [
        {
          id: "zeroLineBackground",
          beforeDraw(chart, args, opts) {
            const { ctx, chartArea, scales } = chart;
            if (!chartArea) return;
            const yZero = scales.y.getPixelForValue(0);

            ctx.save();
            ctx.beginPath();
            ctx.rect(
              chartArea.left,
              Math.min(yZero, chartArea.bottom),
              chartArea.right - chartArea.left,
              Math.abs(chartArea.bottom - yZero)
            );
            ctx.fillStyle = getComputedStyle(document.documentElement)
              .getPropertyValue("--negative-line");
            ctx.fill();
            ctx.restore();
          }
        }
      ]
    });

    // Handle color updates when system theme changes (for users switching light/dark)
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
      nnwcChart.options.scales.x.ticks.color = getComputedStyle(document.documentElement)
        .getPropertyValue("--axis");
      nnwcChart.options.scales.y.ticks.color = getComputedStyle(document.documentElement)
        .getPropertyValue("--axis");
      nnwcChart.options.scales.y.grid.color = getComputedStyle(document.documentElement)
        .getPropertyValue("--grid");
      nnwcChart.options.plugins.legend.labels.color = getComputedStyle(document.documentElement)
        .getPropertyValue("--fg");
      nnwcChart.update();
    });
  </script>
</body>
</html>
