<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TMO 斯隆比率 (Sloan Ratio) 2016–2024</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Chart.js (latest stable 4.x) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      color-scheme: light dark;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      background-color: #f7f7f9;
      color: #222;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 24px;
      box-sizing: border-box;
    }
    .chart-container {
      max-width: 900px;
      width: 100%;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
      padding: 20px 24px 20px;
      box-sizing: border-box;
    }
    h1 {
      font-size: 22px;
      margin: 0 0 6px;
      text-align: left;
    }
    .subtitle {
      font-size: 13px;
      color: #666;
      margin-bottom: 12px;
    }
    /* Fix aspect ratio: give the chart a sane, responsive height */
    .canvas-wrapper {
      position: relative;
      width: 100%;
      /* 16:9 aspect ratio; adjust if desired */
      padding-top: 56.25%;
    }
    #sloanChart {
      position: absolute;
      top: 0;
      left: 0;
      width: 100% !important;
      height: 100% !important;
    }
    .note {
      font-size: 11px;
      color: #777;
      margin-top: 10px;
      line-height: 1.4;
    }
    @media (max-width: 600px) {
      body {
        padding: 12px;
      }
      .chart-container {
        padding: 16px;
      }
      h1 {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="chart-container">
    <h1>TMO 斯隆比率（Sloan Ratio / Accruals Ratio）</h1>
    <div class="subtitle">2016–2024 财年变化（单位：比率）</div>

    <!-- Aspect-ratio wrapper to prevent extreme vertical stretching -->
    <div class="canvas-wrapper">
      <canvas id="sloanChart"></canvas>
    </div>

    <div class="note">
      说明：斯隆比率为负值时，通常表示应计项目占收益的比例较低，收益质量相对更高。
      数据来源：用户提供的 tmo 2016–2024 财年结果。
    </div>
  </div>

  <script>
    // Source data from prompt
    const fiscalYears = [
      "2016",
      "2017",
      "2018",
      "2019",
      "2020",
      "2021",
      "2022",
      "2023",
      "2024"
    ];

    const sloanValues = [
      -0.0261579413965274,
      -0.0347056357663023,
      -0.0284319890877848,
      -0.022283685096804,
      -0.030039314777177,
      -0.0221470991320237,
      -0.0229252588713158,
      -0.024617112517868,
      -0.0237902135712354
    ];

    const canvas = document.getElementById("sloanChart");
    const ctx = canvas.getContext("2d");

    // Create gradient for bars
    const gradient = ctx.createLinearGradient(0, 0, 0, 400);
    gradient.addColorStop(0, "rgba(34, 123, 227, 0.95)");
    gradient.addColorStop(1, "rgba(34, 123, 227, 0.45)");

    const borderGradient = ctx.createLinearGradient(0, 0, 0, 400);
    borderGradient.addColorStop(0, "rgba(24, 92, 180, 1)");
    borderGradient.addColorStop(1, "rgba(24, 92, 180, 0.9)");

    new Chart(ctx, {
      type: "bar",
      data: {
        labels: fiscalYears,
        datasets: [
          {
            label: "斯隆比率",
            data: sloanValues,
            backgroundColor: gradient,
            borderColor: borderGradient,
            borderWidth: 1.5,
            borderRadius: 6,
            hoverBackgroundColor: "rgba(255, 159, 64, 0.85)",
            hoverBorderColor: "rgba(255, 159, 64, 1)",
            hoverBorderWidth: 2
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false, // we control aspect ratio via CSS wrapper
        interaction: {
          mode: "index",
          intersect: false
        },
        plugins: {
          legend: {
            display: true,
            labels: {
              font: { size: 12 },
              usePointStyle: true,
              pointStyle: "rectRounded",
              padding: 14
            }
          },
          tooltip: {
            backgroundColor: "rgba(33, 37, 41, 0.92)",
            padding: 10,
            titleFont: { size: 13, weight: "600" },
            bodyFont: { size: 12 },
            callbacks: {
              label: function (context) {
                const value = context.parsed.y;
                return "  斯隆比率: " + value.toFixed(4);
              }
            }
          },
          title: {
            display: false
          }
        },
        scales: {
          x: {
            grid: { display: false },
            ticks: {
              font: { size: 12 }
            }
          },
          y: {
            beginAtZero: false,
            ticks: {
              font: { size: 12 },
              callback: function (value) {
                return value.toFixed(3);
              }
            },
            title: {
              display: true,
              text: "斯隆比率（Accruals Ratio）",
              font: { size: 13, weight: "600" }
            }
          }
        }
      }
    });
  </script>
</body>
</html>
