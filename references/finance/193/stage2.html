<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>NVDA 2016–2024 年 EBITDA 变化（息税折旧摊销前利润）</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f5f6fa;
      color: #222;
    }
    h1 {
      font-size: 22px;
      margin-bottom: 4px;
    }
    h2 {
      font-size: 14px;
      font-weight: normal;
      color: #666;
      margin-top: 0;
      margin-bottom: 20px;
    }
    #chart-container {
      max-width: 900px;
      margin: 0 auto;
      background: #fff;
      padding: 18px 22px 22px;
      border-radius: 10px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.05);
    }
    /* Fix chart height explicitly to avoid vertical stretching */
    #chart-wrapper {
      position: relative;
      width: 100%;
      height: 420px; /* Fixed practical height */
    }
    canvas {
      max-width: 100%;
      max-height: 100%;
    }
    .note {
      max-width: 900px;
      margin: 10px auto 0;
      font-size: 12px;
      color: #777;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div id="chart-container">
    <h1>英伟达 (NVDA) EBITDA 变化趋势</h1>
    <h2>息税折旧摊销前利润，2016–2024 财年（单位：十亿美元）</h2>
    <div id="chart-wrapper">
      <canvas id="nvdaEbitdaChart"></canvas>
    </div>
  </div>
  <div class="note">
    数据来源：用户提供的财务数据（RESULT_EBITDA，单位为美元）。<br>
    图表中数值转换为「十亿美元」以增强可读性，并对纵轴进行了合理缩放以避免视觉失真。
  </div>

  <!-- Chart.js (latest stable) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    // 原始数据（单位：美元）
    const fiscalYears = [
      "2016",
      "2017",
      "2018",
      "2019",
      "2020",
      "2021",
      "2022",
      "2023",
      "2024"
    ];

    const ebitdaUSD = [
      987000000,
      2150000000,
      3456000000,
      4706000000,
      3403000000,
      5691000000,
      11351000000,
      6360000000,
      35583000000
    ];

    // 转换为十亿美元
    const ebitdaInBillions = ebitdaUSD.map(v => v / 1e9);

    // 计算合适的 y 轴最大值（向上取整到 5 的倍数），避免单柱撑满整个高度
    const maxVal = Math.max(...ebitdaInBillions);
    const yMax = Math.ceil(maxVal / 5) * 5; // 如 35.58 -> 40

    const ctx = document.getElementById("nvdaEbitdaChart").getContext("2d");

    new Chart(ctx, {
      type: "bar",
      data: {
        labels: fiscalYears,
        datasets: [{
          label: "EBITDA（十亿美元）",
          data: ebitdaInBillions,
          backgroundColor: function(context) {
            const index = context.dataIndex;
            const baseColor = "rgba(46, 134, 222, 0.85)";
            const latestColor = "rgba(46, 204, 113, 0.9)";
            return index === ebitdaInBillions.length - 1 ? latestColor : baseColor;
          },
          borderColor: function(context) {
            const index = context.dataIndex;
            const baseColor = "rgba(46, 134, 222, 1)";
            const latestColor = "rgba(39, 174, 96, 1)";
            return index === ebitdaInBillions.length - 1 ? latestColor : baseColor;
          },
          borderWidth: 1.5,
          hoverBackgroundColor: "rgba(52, 152, 219, 0.95)",
          hoverBorderColor: "rgba(41, 128, 185, 1)",
          borderRadius: 4,
          maxBarThickness: 45
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false, // 用固定高度控制比例，避免拉伸
        interaction: {
          mode: "index",
          intersect: false
        },
        layout: {
          padding: {
            top: 10,
            right: 12,
            bottom: 8,
            left: 4
          }
        },
        plugins: {
          legend: {
            display: true,
            labels: {
              font: { size: 12 },
              color: "#333"
            }
          },
          tooltip: {
            backgroundColor: "rgba(0,0,0,0.82)",
            titleFont: { size: 13 },
            bodyFont: { size: 12 },
            padding: 10,
            callbacks: {
              label: function(context) {
                const valueBillion = context.raw;
                const valueUSD = valueBillion * 1e9;
                const formattedB = valueBillion.toFixed(2);
                const formattedUSD = valueUSD.toLocaleString("en-US", {
                  maximumFractionDigits: 0
                });
                return [
                  "EBITDA: " + formattedB + " 十亿美元",
                  "≈ " + formattedUSD + " 美元"
                ];
              }
            }
          },
          title: {
            display: false
          }
        },
        scales: {
          x: {
            grid: {
              display: false
            },
            ticks: {
              color: "#555",
              font: {
                size: 11
              }
            }
          },
          y: {
            beginAtZero: true,
            suggestedMax: yMax,
            grid: {
              color: "rgba(0,0,0,0.05)"
            },
            ticks: {
              color: "#555",
              font: { size: 11 },
              callback: function(value) {
                return value + "B";
              }
            },
            title: {
              display: true,
              text: "EBITDA（十亿美元）",
              color: "#555",
              font: { size: 12 }
            }
          }
        }
      }
    });
  </script>
</body>
</html>
