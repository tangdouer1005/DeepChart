<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TSLA 投入资本回报率 (ROIC) 2016–2024</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Chart.js (latest stable) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1f2933;
      --muted: #9fb3c8;
      --accent: #2563eb;
      --accent-light: rgba(37, 99, 235, 0.18);
      --accent-strong: #1d4ed8;
      --grid: #e5e7eb;
      --negative: #dc2626;
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      margin: 0;
      padding: 2rem 1.25rem;
      background: #f9fafb;
      color: var(--fg);
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 960px;
      width: 100%;
      background: var(--bg);
      border-radius: 12px;
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.12);
      padding: 1.75rem 1.75rem 2rem;
    }

    header {
      margin-bottom: 1.25rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: baseline;
      justify-content: space-between;
    }

    h1 {
      font-size: 1.35rem;
      margin: 0;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: #111827;
    }

    .subtitle {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .meta {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 0.25rem;
    }

    .chart-wrapper {
      position: relative;
      height: 420px;
      width: 100%;
    }

    .legend-note {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 0.75rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.18rem 0.55rem;
      border-radius: 999px;
      border: 1px solid var(--grid);
      background: #f9fafb;
    }

    .pill-color {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: var(--accent);
    }

    .pill-color-negative {
      background: var(--negative);
    }

    @media (max-width: 640px) {
      .container {
        padding: 1.25rem 1rem 1.5rem;
      }
      .chart-wrapper {
        height: 360px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>特斯拉 (TSLA) 投入资本回报率 (ROIC)</h1>
        <div class="subtitle">按财年：2016 – 2024</div>
        <div class="meta">
          单位：比例（例如 0.10 = 10%），来源：用户提供的财务数据
        </div>
      </div>
    </header>

    <div class="chart-wrapper">
      <canvas id="roicChart"></canvas>
    </div>

    <div class="legend-note">
      <span class="pill">
        <span class="pill-color"></span>
        <span>ROIC（投入资本回报率）</span>
      </span>
      <span class="pill">
        <span class="pill-color pill-color-negative"></span>
        <span>负 ROIC 区间</span>
      </span>
    </div>
  </div>

  <script>
    // Source data (as provided)
    const fiscalYears = [
      "2016",
      "2017",
      "2018",
      "2019",
      "2020",
      "2021",
      "2022",
      "2023",
      "2024",
    ];

    const roicRaw = [
      -0.1193375615484627,
      -0.1642886918744444,
      -0.0315201579127416,
      -0.0050457643513969,
      0.1032084218333535,
      0.3571268905872266,
      0.5019409225435687,
      0.1062584956849633,
      0.0958030072030705,
    ];

    const ctx = document.getElementById("roicChart").getContext("2d");

    // Helper to format as percent with one decimal place
    const toPercentLabel = (v) =>
      (v * 100).toFixed(Math.abs(v) < 0.1 ? 1 : 1) + "%";

    // Create gradient for positive and negative regions
    function createGradient(ctx, chartArea) {
      const gradient = ctx.createLinearGradient(
        0,
        chartArea.bottom,
        0,
        chartArea.top
      );
      // Define colors: negative region (bottom) → neutral → positive (top)
      gradient.addColorStop(0, "rgba(220,38,38,0.15)"); // red-ish
      gradient.addColorStop(0.45, "rgba(220,38,38,0.0)");
      gradient.addColorStop(0.55, "rgba(37,99,235,0.08)");
      gradient.addColorStop(1, "rgba(37,99,235,0.22)");
      return gradient;
    }

    // Prepare config
    const data = {
      labels: fiscalYears,
      datasets: [
        {
          label: "ROIC",
          data: roicRaw,
          tension: 0.3,
          borderColor: "rgba(37, 99, 235, 1)",
          borderWidth: 2.4,
          pointRadius: 4,
          pointHoverRadius: 6,
          pointBackgroundColor: function (context) {
            const value = context.raw;
            return value < 0 ? "rgba(220,38,38,1)" : "rgba(37,99,235,1)";
          },
          pointBorderColor: "#ffffff",
          pointBorderWidth: 1.6,
          fill: true,
          backgroundColor: function (context) {
            const chart = context.chart;
            const { ctx, chartArea } = chart;
            if (!chartArea) {
              // Initial chart load
              return "rgba(37,99,235,0.18)";
            }
            return createGradient(ctx, chartArea);
          },
        },
      ],
    };

    const config = {
      type: "line",
      data: data,
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: {
          mode: "index",
          intersect: false,
        },
        plugins: {
          legend: {
            display: false,
          },
          tooltip: {
            backgroundColor: "rgba(15,23,42,0.92)",
            borderColor: "rgba(148,163,184,0.5)",
            borderWidth: 1,
            padding: 10,
            cornerRadius: 8,
            displayColors: false,
            callbacks: {
              title: (items) =>
                items.length ? `财年 ${items[0].label}` : "",
              label: (context) => {
                const v = context.parsed.y;
                return `ROIC：${toPercentLabel(v)}`;
              },
              footer: (items) => {
                const v = items[0]?.parsed.y ?? null;
                if (v == null) return "";
                return v < 0 ? "说明：负值表示对投入资本产生亏损" : "";
              },
            },
          },
          title: {
            display: false,
          },
        },
        scales: {
          x: {
            grid: {
              display: true,
              drawBorder: false,
              color: "rgba(229,231,235,0.7)",
            },
            ticks: {
              color: "#4b5563",
              font: {
                size: 11,
              },
            },
          },
          y: {
            grid: {
              color: (context) => {
                if (context.tick.value === 0) {
                  return "#9ca3af";
                }
                return "rgba(229,231,235,0.7)";
              },
              lineWidth: (context) =>
                context.tick.value === 0 ? 1.4 : 1,
              drawBorder: false,
            },
            ticks: {
              color: "#4b5563",
              font: { size: 11 },
              callback: (value) => toPercentLabel(value),
            },
            title: {
              display: true,
              text: "ROIC（投入资本回报率，%）",
              color: "#6b7280",
              font: { size: 11 },
            },
            // Nice bounds around -20% to ~55%
            suggestedMin: -0.2,
            suggestedMax: 0.55,
          },
        },
      },
    };

    new Chart(ctx, config);
  </script>
</body>
</html>
