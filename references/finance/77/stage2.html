<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>cvx 现金消耗跑道（零收入情景）2016-2024</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f5f5f7;
      color: #222;
    }
    h1 {
      font-size: 20px;
      margin-bottom: 4px;
    }
    h2 {
      font-size: 14px;
      margin-top: 0;
      margin-bottom: 18px;
      font-weight: 400;
      color: #666;
    }
    .chart-container {
      max-width: 900px;
      margin: 0 auto;
      background: #fff;
      padding: 16px 20px 24px;
      border-radius: 10px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.06);
    }
    .chart-wrapper {
      position: relative;
      height: 430px;
    }
    .meta {
      font-size: 12px;
      color: #888;
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
    }
    .meta span {
      white-space: nowrap;
    }
    @media (max-width: 600px) {
      body {
        padding: 10px;
      }
      .chart-container {
        padding: 12px 12px 18px;
      }
      h1 {
        font-size: 18px;
      }
      .chart-wrapper {
        height: 360px;
      }
    }
  </style>
</head>
<body>
  <div class="chart-container">
    <h1>cvx 现金消耗跑道（月）</h1>
    <h2>零收入情景，2016–2024 财年</h2>
    <div class="chart-wrapper">
      <canvas id="runwayChart"></canvas>
    </div>
    <div class="meta">
      <span>指标：现金消耗跑道（Runway，月）</span>
      <span>情景：零收入</span>
      <span>单位：月</span>
      <span>交互：悬停查看精确数值，可开关数据标签</span>
    </div>
  </div>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script>
    const ctx = document.getElementById('runwayChart');

    // Source data (zero revenue scenario)
    const labels = [
      '2016', '2017', '2018', '2019',
      '2020', '2021', '2022', '2023', '2024'
    ];

    const runwayMonths = [
      15.641857862339116,
      11.132613723978412,
      22.247271283984915,
      12.540341848924829,
      12.563517305893358,
      2.0356111645813284,
      6.214254328148344,
      19.905882352941177,
      14.07576543850545
    ];

    // Utility: round to 2 decimals for labels & tooltips
    function formatVal(value) {
      return Number.parseFloat(value).toFixed(2);
    }

    // Create chart
    const chart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels,
        datasets: [{
          label: '现金消耗跑道（月）',
          data: runwayMonths,
          backgroundColor: '#3b82f6',
          hoverBackgroundColor: '#2563eb',
          borderRadius: 6,
          borderSkipped: false,
          maxBarThickness: 60
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: {
          mode: 'index',
          intersect: false
        },
        plugins: {
          title: {
            display: false
          },
          legend: {
            display: false
          },
          tooltip: {
            backgroundColor: 'rgba(15,23,42,0.92)',
            titleColor: '#fff',
            bodyColor: '#e5e7eb',
            borderColor: 'rgba(148,163,184,0.6)',
            borderWidth: 1,
            padding: 10,
            callbacks: {
              label: function(context) {
                const v = context.parsed.y;
                return '  跑道：' + formatVal(v) + ' 个月';
              }
            }
          }
        },
        scales: {
          x: {
            title: {
              display: true,
              text: '财年',
              color: '#4b5563',
              font: { size: 12 }
            },
            ticks: {
              color: '#4b5563'
            },
            grid: {
              display: false
            }
          },
          y: {
            title: {
              display: true,
              text: '现金消耗跑道（月）',
              color: '#4b5563',
              font: { size: 12 }
            },
            ticks: {
              color: '#4b5563',
              callback: function(value) {
                return value + ' 月';
              }
            },
            grid: {
              color: 'rgba(148,163,184,0.25)'
            },
            beginAtZero: true
          }
        }
      },
      plugins: [{
        // Simple value labels on top of bars
        id: 'valueLabels',
        afterDatasetsDraw(chart, args, pluginOptions) {
          const { ctx } = chart;
          ctx.save();
          ctx.font = '11px -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'bottom';
          ctx.fillStyle = '#111827';

          chart.getDatasetMeta(0).data.forEach((bar, index) => {
            const value = formatVal(chart.data.datasets[0].data[index]);
            const x = bar.x;
            const y = bar.y - 4;
            ctx.fillText(value, x, y);
          });

          ctx.restore();
        }
      }]
    });
  </script>
</body>
</html>
