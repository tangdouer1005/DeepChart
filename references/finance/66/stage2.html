<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>CSCO 格雷厄姆“烟蒂股”净值 (NNWC) 2016–2024</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 20px;
      background: #f7f7f9;
      color: #222;
    }

    h1 {
      font-size: 20px;
      margin-bottom: 4px;
    }

    h2 {
      font-size: 14px;
      font-weight: 400;
      margin-top: 0;
      color: #555;
    }

    #chart-container {
      max-width: 900px;
      margin: 30px auto;
      background: #ffffff;
      border-radius: 8px;
      padding: 20px 24px 24px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.06);
      /* Fix aspect ratio by controlling height and disabling auto-stretch */
      height: 420px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }

    #chart-wrapper {
      flex: 1;
      position: relative;
    }

    canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }

    .note {
      max-width: 900px;
      margin: 0 auto;
      font-size: 12px;
      color: #666;
      line-height: 1.5;
    }

    .legend-inline {
      font-size: 12px;
      color: #444;
      margin-top: 8px;
    }

    .legend-color-box {
      display: inline-block;
      width: 10px;
      height: 10px;
      margin-right: 4px;
      vertical-align: middle;
      border-radius: 2px;
    }
  </style>
</head>
<body>
  <div id="chart-container">
    <h1>CSCO 格雷厄姆“烟蒂股”净值 (NNWC) 变化</h1>
    <h2>按年度每股 NNWC（2016–2024，单位：美元/股）</h2>
    <div id="chart-wrapper">
      <canvas id="nnwcChart"></canvas>
    </div>
    <div class="legend-inline">
      <span class="legend-color-box" id="legend-bar-color"></span>
      每股 NNWC（Graham Net-Net Working Capital per Share）
    </div>
  </div>

  <div class="note">
    数据来源：用户提供的财报提取结果。<br />
    提示：正值表示按格雷厄姆 NNWC 公式计算的每股净流动资产为正，负值表示相反。
  </div>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script>
    // Source data (as provided)
    const fiscalYears = [
      "2016",
      "2017",
      "2018",
      "2019",
      "2020",
      "2021",
      "2022",
      "2023",
      "2024"
    ];

    const nnwcPerShare = [
      4.058962264150943,
      3.965537730243613,
      -0.7668510551116574,
      -3.6979564338648094,
      -3.140573577809121,
      -4.03918791312559,
      -4.177480916030534,
      -3.4472594397076737,
      -10.362875430822257
    ];

    // Colors: green for positive, red for negative
    const barColors = nnwcPerShare.map(v =>
      v >= 0 ? "rgba(46, 204, 113, 0.8)" : "rgba(231, 76, 60, 0.8)"
    );
    const barBorderColors = nnwcPerShare.map(v =>
      v >= 0 ? "rgba(39, 174, 96, 1)" : "rgba(192, 57, 43, 1)"
    );

    // Legend color box gradient
    document.getElementById("legend-bar-color").style.background =
      "linear-gradient(90deg, rgba(46, 204, 113, 0.8), rgba(231, 76, 60, 0.8))";

    const ctx = document.getElementById("nnwcChart");

    // Reasonable y-axis range with padding
    const minValue = Math.min(...nnwcPerShare);
    const maxValue = Math.max(...nnwcPerShare);
    const padding = (maxValue - minValue) * 0.15 || 1;

    new Chart(ctx, {
      type: "bar",
      data: {
        labels: fiscalYears,
        datasets: [
          {
            label: "NNWC 每股净流动资产（美元）",
            data: nnwcPerShare,
            backgroundColor: barColors,
            borderColor: barBorderColors,
            borderWidth: 1.2,
            borderRadius: 4,
            hoverBackgroundColor: barColors,
            hoverBorderColor: barBorderColors
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false, // let the container control the aspect ratio
        interaction: {
          mode: "index",
          intersect: false
        },
        plugins: {
          tooltip: {
            callbacks: {
              label: function (context) {
                const value = context.parsed.y;
                return " " + context.dataset.label + ": " + value.toFixed(3) + " 美元/股";
              }
            }
          },
          legend: {
            display: false
          },
          title: {
            display: false
          }
        },
        layout: {
          padding: {
            top: 10,
            right: 12,
            bottom: 8,
            left: 4
          }
        },
        scales: {
          x: {
            grid: {
              display: false
            },
            ticks: {
              maxRotation: 0,
              minRotation: 0,
              autoSkip: false
            }
          },
          y: {
            beginAtZero: false,
            suggestedMin: minValue - padding,
            suggestedMax: maxValue + padding,
            grid: {
              color: "rgba(0, 0, 0, 0.06)"
            },
            ticks: {
              callback: function (value) {
                return value.toFixed(1);
              }
            }
          }
        }
      }
    });
  </script>
</body>
</html>
