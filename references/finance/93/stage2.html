<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <title>GOOG 防御区间比率 (DIR) 2016–2024 变化趋势</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Chart.js (latest 4.x) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f7;
      color: #222;
    }
    h1 {
      margin: 0 0 4px;
      font-size: 22px;
      font-weight: 600;
    }
    h2 {
      margin: 0 0 16px;
      font-size: 14px;
      font-weight: 400;
      color: #555;
    }
    .chart-wrapper {
      max-width: 900px;
      margin: 0 auto;
    }
    .chart-container {
      position: relative;              /* Needed for fixed aspect ratio */
      width: 100%;
      max-width: 900px;
      height: auto;
      aspect-ratio: 16 / 9;            /* Prevent very tall/narrow chart */
      background: #ffffff;
      border-radius: 10px;
      padding: 18px 18px 10px;
      box-sizing: border-box;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
    }
    canvas {
      width: 100% !important;
      height: 100% !important;
    }
    .note {
      max-width: 900px;
      margin: 10px auto 0;
      font-size: 12px;
      color: #666;
      line-height: 1.5;
    }
    @media (max-width: 600px) {
      body {
        padding: 12px;
      }
      .chart-container {
        padding: 14px 10px 8px;
        aspect-ratio: 4 / 3;          /* Slightly taller on mobile, still constrained */
      }
    }
  </style>
</head>
<body>
  <div class="chart-wrapper">
    <h1>GOOG 防御区间比率 (DIR) 趋势</h1>
    <h2>2016–2024 财年</h2>
    <div class="chart-container">
      <canvas id="dirChart"></canvas>
    </div>
  </div>

  <div class="note">
    数据来源：用户提供的财年 DIR 数值（单位：天）。
    防御区间比率反映企业以流动资产覆盖日常现金支出的能力，数值越高，通常意味着短期偿债安全边际更高。
  </div>

  <script>
    // Data from user (Fiscal Year, RESULT_DIR)
    const labels = [
      "2016",
      "2017",
      "2018",
      "2019",
      "2020",
      "2021",
      "2022",
      "2023",
      "2024"
    ];

    const dirData = [
      148.89341306568906,
      126.81483755919554,
      126.5502538999954,
      131.5276667763622,
      149.42984225387997,
      124.87760097919217,
      109.0416310085868,
      117.81381526752456,
      116.43909808608412
    ];

    const ctx = document.getElementById("dirChart").getContext("2d");

    const minValue = Math.min(...dirData);
    const maxValue = Math.max(...dirData);
    // 10% padding around data range
    const padding = (maxValue - minValue) * 0.1 || 2;

    new Chart(ctx, {
      type: "line",
      data: {
        labels,
        datasets: [
          {
            label: "防御区间比率 (DIR)",
            data: dirData,
            borderColor: "rgba(37, 99, 235, 1)",
            backgroundColor: "rgba(37, 99, 235, 0.12)",
            tension: 0.2,
            pointRadius: 4,
            pointHoverRadius: 6,
            pointBackgroundColor: "#ffffff",
            pointBorderWidth: 2,
            pointBorderColor: "rgba(37, 99, 235, 1)",
            fill: true
          }
        ]
      },
      options: {
        responsive: true,
        // Let the CSS aspect-ratio control the size; avoid extreme auto-ratios
        maintainAspectRatio: false,
        interaction: {
          mode: "nearest",
          axis: "x",
          intersect: false
        },
        plugins: {
          legend: {
            display: true,
            labels: {
              usePointStyle: true,
              padding: 16,
              boxWidth: 8
            }
          },
          tooltip: {
            backgroundColor: "rgba(15, 23, 42, 0.94)",
            borderColor: "rgba(148, 163, 184, 0.5)",
            borderWidth: 1,
            padding: 10,
            displayColors: false,
            callbacks: {
              label: function (context) {
                const value = context.parsed.y;
                return " DIR: " + value.toFixed(2);
              },
              title: function (items) {
                if (!items.length) return "";
                return "财年 " + items[0].label;
              }
            }
          },
          title: {
            display: false
          }
        },
        scales: {
          x: {
            grid: {
              display: false
            },
            ticks: {
              maxRotation: 0,
              autoSkipPadding: 16
            }
          },
          y: {
            beginAtZero: false,
            suggestedMin: Math.max(0, minValue - padding),
            suggestedMax: maxValue + padding,
            title: {
              display: true,
              text: "防御区间比率 (DIR, 天)",
              font: {
                size: 12
              }
            },
            ticks: {
              callback: function (value) {
                // Keep clean integer-ish ticks
                return Number(value).toFixed(0);
              }
            }
          }
        }
      }
    });
  </script>
</body>
</html>
