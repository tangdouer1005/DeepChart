<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LLY 可持续增长率 (SGR) 2016–2024</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Chart.js (latest 4.x) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --fg: #1f2933;
      --grid: rgba(148, 163, 184, 0.35);
      --accent: #2563eb;
      --accent-soft: rgba(37, 99, 235, 0.12);
      --accent-border: rgba(37, 99, 235, 0.4);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #020617;
        --fg: #e5e7eb;
        --grid: rgba(148, 163, 184, 0.4);
        --accent: #60a5fa;
        --accent-soft: rgba(37, 99, 235, 0.18);
        --accent-border: rgba(59, 130, 246, 0.6);
      }
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 1.5rem;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      background: radial-gradient(circle at top left, #e0f2fe 0, #e5e7eb 35%, var(--bg) 70%);
      color: var(--fg);
    }
    .chart-wrapper {
      max-width: 960px;
      margin: 0 auto;
    }
    .card {
      background: rgba(255, 255, 255, 0.82);
      border-radius: 14px;
      padding: 1.5rem 1.7rem 1.7rem;
      box-shadow:
        0 18px 45px rgba(15, 23, 42, 0.16),
        0 1px 0 rgba(148, 163, 184, 0.4);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(148, 163, 184, 0.4);
    }
    @media (prefers-color-scheme: dark) {
      .card {
        background: rgba(15, 23, 42, 0.92);
        border-color: rgba(51, 65, 85, 0.9);
        box-shadow:
          0 18px 45px rgba(0, 0, 0, 0.75),
          0 1px 0 rgba(15, 23, 42, 0.9);
      }
    }
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1.1rem;
    }
    h1 {
      font-size: 1.15rem;
      letter-spacing: 0.02em;
      margin: 0;
      font-weight: 600;
    }
    .subtitle {
      font-size: 0.85rem;
      color: #6b7280;
    }
    @media (prefers-color-scheme: dark) {
      .subtitle {
        color: #9ca3af;
      }
    }
    .badge {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.8);
      color: #4b5563;
      background: rgba(248, 250, 252, 0.9);
    }
    @media (prefers-color-scheme: dark) {
      .badge {
        border-color: rgba(75, 85, 99, 0.9);
        color: #e5e7eb;
        background: rgba(15, 23, 42, 0.9);
      }
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem 1rem;
      font-size: 0.8rem;
      color: #6b7280;
      margin-bottom: 1rem;
    }
    @media (prefers-color-scheme: dark) {
      .meta {
        color: #9ca3af;
      }
    }
    .meta span {
      white-space: nowrap;
    }
    .chart-container {
      position: relative;
      width: 100%;
      height: 440px;
    }
    .note {
      margin-top: 0.7rem;
      font-size: 0.76rem;
      color: #6b7280;
    }
    @media (prefers-color-scheme: dark) {
      .note {
        color: #9ca3af;
      }
    }
  </style>
</head>
<body>
  <div class="chart-wrapper">
    <div class="card">
      <div class="header-row">
        <div>
          <h1>LLY 可持续增长率 (Sustainable Growth Rate, SGR)</h1>
          <div class="subtitle">2016–2024 年度变化</div>
        </div>
        <div class="badge">Line Chart</div>
      </div>

      <div class="meta">
        <span>公司：LLY</span>
        <span>指标：可持续增长率 (SGR)</span>
        <span>频率：年度</span>
        <span>范围：2016–2024 财年</span>
      </div>

      <div class="chart-container">
        <canvas id="sgrChart"></canvas>
      </div>

      <div class="note">
        数据来源：用户提供的年度 SGR 结果 (RESULT_SGR)。数值以小数形式显示，并在工具提示中转换为百分比。
      </div>
    </div>
  </div>

  <script>
    // Source data (from CSV)
    const years = [2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024];
    const sgrValues = [
      0.0405262605409566,
      -0.1872038562650635,
      0.0859160912940166,
      0.950271800315224,
      0.8502394374734801,
      0.3412809148610199,
      0.2760201742320036,
      0.1093377276313271,
      0.4734497676654383
    ];

    const ctx = document.getElementById('sgrChart').getContext('2d');

    const data = {
      labels: years,
      datasets: [
        {
          label: '可持续增长率 (SGR)',
          data: sgrValues,
          tension: 0.35,
          borderColor: getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#2563eb',
          backgroundColor: getComputedStyle(document.documentElement).getPropertyValue('--accent-soft').trim() || 'rgba(37, 99, 235, 0.12)',
          pointBackgroundColor: '#ffffff',
          pointBorderColor: getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#2563eb',
          pointRadius: 4,
          pointHoverRadius: 6,
          pointHitRadius: 10,
          pointBorderWidth: 2,
          borderWidth: 2,
          fill: true
        }
      ]
    };

    const options = {
      responsive: true,
      maintainAspectRatio: false,
      interaction: {
        intersect: false,
        mode: 'index'
      },
      plugins: {
        legend: {
          display: true,
          labels: {
            usePointStyle: true,
            padding: 16,
            font: {
              size: 11
            }
          }
        },
        tooltip: {
          usePointStyle: true,
          callbacks: {
            label: function(context) {
              const value = context.parsed.y;
              if (value === null || value === undefined) return '';
              const pct = (value * 100).toFixed(2) + '%';
              return ' ' + context.dataset.label + ': ' + pct;
            }
          }
        },
        title: {
          display: false
        }
      },
      scales: {
        x: {
          grid: {
            display: false
          },
          ticks: {
            font: {
              size: 11
            }
          }
        },
        y: {
          title: {
            display: true,
            text: 'SGR (百分比 %)',
            font: {
              size: 11
            }
          },
          ticks: {
            callback: function(value) {
              return (value * 100).toFixed(0) + '%';
            },
            font: {
              size: 11
            }
          },
          grid: {
            color: getComputedStyle(document.documentElement).getPropertyValue('--grid').trim() || 'rgba(148, 163, 184, 0.35)'
          }
        }
      }
    };

    // Create chart
    const sgrChart = new Chart(ctx, {
      type: 'line',
      data: data,
      options: options
    });

    // Optional: support dynamic re-coloring on theme change
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    mq.addEventListener('change', () => {
      const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
      const accentSoft = getComputedStyle(document.documentElement).getPropertyValue('--accent-soft').trim();
      const gridColor = getComputedStyle(document.documentElement).getPropertyValue('--grid').trim();

      sgrChart.data.datasets[0].borderColor = accent || '#2563eb';
      sgrChart.data.datasets[0].backgroundColor = accentSoft || 'rgba(37, 99, 235, 0.12)';
      sgrChart.options.scales.y.grid.color = gridColor || 'rgba(148, 163, 184, 0.35)';
      sgrChart.update();
    });
  </script>
</body>
</html>
