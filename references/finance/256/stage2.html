<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>UNH 盈余-现金质量剪刀差 (Earnings Quality Spread) 2016–2024</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Chart.js (latest stable 4.x) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      color-scheme: light dark;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f7f9;
      color: #222;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 24px;
    }
    .container {
      max-width: 960px;
      width: 100%;
      background: #ffffff;
      border-radius: 12px;
      box-shadow:
        0 16px 40px rgba(15, 23, 42, 0.12),
        0 0 0 1px rgba(15, 23, 42, 0.03);
      padding: 24px 28px 32px;
    }
    h1 {
      font-size: 1.35rem;
      margin: 0 0 4px;
      letter-spacing: 0.02em;
    }
    h2 {
      font-size: 0.95rem;
      margin: 0 0 16px;
      color: #555;
      font-weight: 500;
    }
    .subtitle {
      font-size: 0.85rem;
      margin-bottom: 18px;
      color: #666;
    }
    .chart-wrapper {
      position: relative;
      width: 100%;
      height: 420px;
    }
    .footnote {
      margin-top: 12px;
      font-size: 0.75rem;
      color: #777;
    }
    @media (max-width: 600px) {
      body {
        padding: 12px;
      }
      .container {
        padding: 16px 14px 20px;
      }
      .chart-wrapper {
        height: 360px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>UNH 盈余-现金质量剪刀差</h1>
    <h2>Earnings Quality Spread by Fiscal Year (2016–2024)</h2>
    <div class="subtitle">
      单位：比例（无量纲）。条形图展示了从 2016 年到 2024 年 UNH 盈余-现金质量剪刀差的变化。
    </div>
    <div class="chart-wrapper">
      <canvas id="eqSpreadChart"></canvas>
    </div>
    <div class="footnote">
      数据来源：提供的财报数据（Fiscal Year, RESULT_Spread）。鼠标悬停可查看具体数值。
    </div>
  </div>

  <script>
    // Data from the source:
    // Fiscal Year, RESULT_Spread
    // 2016, 0.0237373003734053
    // 2017, 0.0232142311336614
    // 2018, 0.0255906728280199
    // 2019, 0.0283585293305939
    // 2020, 0.0364838433312319
    // 2021, 0.024703598334534
    // 2022, 0.0265815846310746
    // 2023, 0.0257477017856283
    // 2024, 0.0342623575606907

    const ctx = document.getElementById('eqSpreadChart').getContext('2d');

    const labels = [
      '2016', '2017', '2018', '2019',
      '2020', '2021', '2022', '2023', '2024'
    ];

    const spreadValues = [
      0.0237373003734053,
      0.0232142311336614,
      0.0255906728280199,
      0.0283585293305939,
      0.0364838433312319,
      0.024703598334534,
      0.0265815846310746,
      0.0257477017856283,
      0.0342623575606907
    ];

    // Create a subtle gradient for the bars
    function createGradient(ctx, chartArea) {
      const {top, bottom} = chartArea;
      const gradient = ctx.createLinearGradient(0, top, 0, bottom);
      gradient.addColorStop(0, 'rgba(37, 99, 235, 0.9)');   // top
      gradient.addColorStop(1, 'rgba(59, 130, 246, 0.6)');  // bottom
      return gradient;
    }

    let gradientFill;

    const eqSpreadChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [{
          label: '盈余-现金质量剪刀差 (Earnings Quality Spread)',
          data: spreadValues,
          backgroundColor: function(context) {
            const chart = context.chart;
            const {ctx, chartArea} = chart;
            if (!chartArea) {
              // This case happens on initial chart render
              return 'rgba(59, 130, 246, 0.75)';
            }
            if (!gradientFill) {
              gradientFill = createGradient(ctx, chartArea);
            }
            return gradientFill;
          },
          borderColor: 'rgba(37, 99, 235, 1)',
          borderWidth: 1,
          borderRadius: 6,
          hoverBackgroundColor: 'rgba(37, 99, 235, 0.95)',
          hoverBorderColor: 'rgba(17, 78, 216, 1)',
          maxBarThickness: 46
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: {
          duration: 800,
          easing: 'easeOutQuart'
        },
        plugins: {
          legend: {
            display: true,
            labels: {
              usePointStyle: true,
              padding: 16,
              font: {
                size: 12
              }
            }
          },
          tooltip: {
            enabled: true,
            backgroundColor: 'rgba(15, 23, 42, 0.95)',
            titleFont: {
              size: 12,
              weight: '600'
            },
            bodyFont: {
              size: 12
            },
            padding: 10,
            borderColor: 'rgba(148, 163, 184, 0.7)',
            borderWidth: 1,
            displayColors: false,
            callbacks: {
              label: function(context) {
                const value = context.parsed.y;
                // Show both raw value and percentage form for clarity
                const pct = (value * 100).toFixed(2) + '%';
                const raw = value.toFixed(6);
                return ' 剪刀差: ' + pct + '  (原始值: ' + raw + ')';
              }
            }
          },
          title: {
            display: false
          }
        },
        scales: {
          x: {
            grid: {
              display: false
            },
            ticks: {
              font: {
                size: 11
              }
            }
          },
          y: {
            beginAtZero: true,
            grid: {
              color: 'rgba(148, 163, 184, 0.25)'
            },
            ticks: {
              font: {
                size: 11
              },
              callback: function(value) {
                return (value * 100).toFixed(1) + '%';
              }
            },
            title: {
              display: true,
              text: '盈余-现金质量剪刀差 (百分比)',
              font: {
                size: 11,
                weight: '500'
              }
            }
          }
        }
      }
    });

    // Recompute gradient on resize for correct scaling
    window.addEventListener('resize', () => {
      gradientFill = null;
      eqSpreadChart.update();
    });
  </script>
</body>
</html>
