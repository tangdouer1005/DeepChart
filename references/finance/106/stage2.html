<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>hd 可持续增长率 (SGR) 2016-2024 折线图</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f7f7f7;
      color: #333;
    }
    h1 {
      font-size: 20px;
      margin-bottom: 4px;
    }
    h2 {
      font-size: 14px;
      margin-top: 0;
      color: #666;
      font-weight: 400;
    }
    #chartContainer {
      max-width: 900px;
      margin: 20px auto;
      background-color: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
      padding: 16px 20px 24px;
      /* 固定可视高度，避免垂直严重拉伸/压缩 */
      height: 500px;
      box-sizing: border-box;
    }
    #sgrChart {
      width: 100%;
      height: 100%;
    }
    .note {
      max-width: 900px;
      margin: 0 auto;
      font-size: 12px;
      color: #777;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div id="chartContainer">
    <h1>hd 可持续增长率 (SGR) 变化趋势</h1>
    <h2>2016–2024 财年</h2>
    <canvas id="sgrChart"></canvas>
  </div>
  <div class="note">
    数据来源于用户提供的 RESULT_SGR，单位为百分比（按 100×SGR 显示）。
    鼠标悬停可查看各年度精确值，拖动可平移，滚轮可缩放，双击图表重置缩放。
  </div>

  <!-- Chart.js 最新稳定版 v4 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- 缩放插件 -->
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.umd.min.js"></script>

  <script>
    // 原始数据（SGR 为小数形式）
    const fiscalYears = [
      "2016",
      "2017",
      "2018",
      "2019",
      "2020",
      "2021",
      "2022",
      "2023",
      "2024"
    ];

    const sgrRaw = [
      0.5087607110883744,
      0.8551037656117947,
      1.5268705719716609,
      -30.268867924528305,
      -2.116139367240689,
      70.10928961748634,
      11.787897691827824,
      -139.044776119403,
      5.188027628549501
    ];

    // 图表中按百分比显示（SGR × 100）
    const sgrPct = sgrRaw.map(v => v * 100);

    const ctx = document.getElementById("sgrChart").getContext("2d");

    const sgrChart = new Chart(ctx, {
      type: "line",
      data: {
        labels: fiscalYears,
        datasets: [
          {
            label: "可持续增长率 (SGR, %)",
            data: sgrPct,
            borderColor: "#1f78b4",
            backgroundColor: "rgba(31, 120, 180, 0.12)",
            pointBackgroundColor: "#1f78b4",
            pointBorderColor: "#ffffff",
            pointHoverRadius: 5,
            pointRadius: 4,
            borderWidth: 2,
            tension: 0.25,
            fill: true
          }
        ]
      },
      options: {
        responsive: true,
        // 使用容器给定的宽高，避免任意纵横比导致的视觉扭曲
        maintainAspectRatio: false,
        interaction: {
          mode: "nearest",
          intersect: false
        },
        plugins: {
          legend: {
            display: true,
            labels: {
              usePointStyle: true,
              boxWidth: 8
            }
          },
          tooltip: {
            callbacks: {
              label: function (context) {
                const year = context.label;
                const value = context.parsed.y;
                const raw = sgrRaw[context.dataIndex];
                return [
                  `年度: ${year}`,
                  `SGR（显示值）: ${value.toFixed(2)}%`,
                  `SGR（原始值）: ${raw.toFixed(6)}`
                ];
              }
            }
          },
          title: {
            display: false
          },
          zoom: {
            pan: {
              enabled: true,
              mode: "x"
            },
            zoom: {
              wheel: {
                enabled: true
              },
              pinch: {
                enabled: true
              },
              mode: "x"
            }
          }
        },
        scales: {
          x: {
            title: {
              display: true,
              text: "财年"
            },
            grid: {
              display: false
            }
          },
          y: {
            title: {
              display: true,
              text: "可持续增长率 (SGR, %)"
            },
            ticks: {
              callback: function (value) {
                return value + "%";
              }
            }
            // 不强制从 0 开始，以更真实反映波动
          }
        }
      }
    });

    // 双击图表区域重置缩放
    document.getElementById("sgrChart").ondblclick = function () {
      sgrChart.resetZoom();
    };
  </script>
</body>
</html>
