<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CSCO 盈余-现金质量剪刀差 (Earnings Quality Spread) 2016–2024</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Use Chart.js 3.x (robust and widely supported) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      margin: 0;
      padding: 1.5rem;
      background: #f7f7f9;
      color: #222;
    }
    .chart-container {
      max-width: 900px;
      margin: 0 auto;
      background: #ffffff;
      padding: 1.5rem 1.5rem 1rem;
      border-radius: 10px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
    }
    h1 {
      font-size: 1.35rem;
      margin: 0 0 0.25rem;
      text-align: center;
      color: #111827;
    }
    h2 {
      font-size: 0.9rem;
      font-weight: 500;
      margin: 0 0 1.1rem;
      text-align: center;
      color: #6b7280;
    }
    .chart-wrapper {
      position: relative;
      height: 420px;
    }
    .note {
      font-size: 0.75rem;
      color: #6b7280;
      text-align: right;
      margin-top: 0.4rem;
    }
    @media (max-width: 600px) {
      body {
        padding: 0.8rem;
      }
      .chart-container {
        padding: 1rem 0.9rem 0.8rem;
      }
      .chart-wrapper {
        height: 360px;
      }
    }
  </style>
</head>
<body>
  <div class="chart-container">
    <h1>CSCO 盈余-现金质量剪刀差</h1>
    <h2>Fiscal Years 2016–2024（Earnings Quality Spread）</h2>
    <div class="chart-wrapper">
      <canvas id="spreadChart"></canvas>
    </div>
    <div class="note">
      数据来源：用户提供；单位为比例（Spread）。悬停柱状图可查看精确数值。
    </div>
  </div>

  <script>
    // Data from source
    const fiscalYears = [
      "2016",
      "2017",
      "2018",
      "2019",
      "2020",
      "2021",
      "2022",
      "2023",
      "2024"
    ];

    const spreadValues = [
      0.0240910541431762,
      0.0339364536525231,
      0.1136285529878207,
      0.0407596198996016,
      0.0437278739241925,
      0.0505640759033012,
      0.0147677011368205,
      0.074269608994455,
      0.0049499480697412
    ];

    // Simple y-axis max with headroom
    const maxVal = Math.max(...spreadValues);
    const suggestedMax = Math.ceil((maxVal * 1.2) * 1000) / 1000;

    const ctx = document.getElementById("spreadChart").getContext("2d");

    // Create a straightforward bar chart (no parsing or advanced options that might hide bars)
    const spreadChart = new Chart(ctx, {
      type: "bar",
      data: {
        labels: fiscalYears,
        datasets: [{
          label: "Earnings Quality Spread",
          data: spreadValues,
          backgroundColor: "rgba(37, 99, 235, 0.8)",
          borderColor: "rgba(30, 64, 175, 1)",
          borderWidth: 1,
          borderRadius: 4,
          barPercentage: 0.6,
          categoryPercentage: 0.7
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            display: true,
            position: "top",
            labels: {
              usePointStyle: true,
              padding: 16,
              font: { size: 11 }
            }
          },
          tooltip: {
            enabled: true,
            mode: "nearest",
            intersect: false,
            backgroundColor: "rgba(17, 24, 39, 0.92)",
            titleColor: "#f9fafb",
            bodyColor: "#e5e7eb",
            padding: 10,
            cornerRadius: 6,
            callbacks: {
              label: function (context) {
                const v = context.parsed.y;
                const pct = (v * 100).toFixed(2);
                return `Spread: ${v.toFixed(4)}  (${pct}%)`;
              }
            }
          }
        },
        scales: {
          x: {
            grid: { display: false },
            ticks: { font: { size: 11 } }
          },
          y: {
            beginAtZero: true,
            suggestedMax: suggestedMax,
            grid: { color: "rgba(209, 213, 219, 0.5)" },
            ticks: {
              callback: function (value) {
                const pct = (value * 100).toFixed(1);
                return value.toFixed(2) + " (" + pct + "%)";
              },
              font: { size: 10 }
            },
            title: {
              display: true,
              text: "Earnings Quality Spread（比例 / %）",
              font: { size: 11, weight: "500" },
              padding: { top: 4 }
            }
          }
        },
        animation: {
          duration: 800,
          easing: "easeOutCubic"
        }
      }
    });
  </script>
</body>
</html>
