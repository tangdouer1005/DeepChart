<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sloan Ratio (Accruals Ratio) 2016–2024</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Chart.js (latest stable 4.x) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      color-scheme: light dark;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 20px;
      background: #f7f7f9;
      color: #222;
    }
    h1 {
      font-size: 1.6rem;
      margin: 0 0 4px 0;
    }
    h2 {
      font-size: 1rem;
      margin: 0 0 16px 0;
      color: #555;
      font-weight: 400;
    }
    .chart-container {
      max-width: 900px;
      margin: 0 auto;
      background: #ffffff;
      padding: 20px 20px 30px 20px;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
    }
    #chartWrapper {
      position: relative;
      height: 420px;
      width: 100%;
    }
    .note {
      max-width: 900px;
      margin: 12px auto 0 auto;
      font-size: 0.85rem;
      color: #666;
    }
    @media (max-width: 600px) {
      body {
        padding: 12px;
      }
      .chart-container {
        padding: 14px 12px 22px 12px;
      }
      #chartWrapper {
        height: 340px;
      }
    }
  </style>
</head>
<body>
  <div class="chart-container">
    <h1>Cost 斯隆比率 (Sloan Ratio / Accruals Ratio)</h1>
    <h2>Fiscal Years 2016 – 2024</h2>
    <div id="chartWrapper">
      <canvas id="sloanChart"></canvas>
    </div>
  </div>
  <div class="note">
    Source: Provided dataset. Values represent the Sloan (accruals) ratio by fiscal year.
  </div>

  <script>
    // Data from source (Fiscal Year, RESULT_Sloan)
    const labels = [
      "2016","2017","2018","2019","2020","2021","2022","2023","2024"
    ];
    const sloanData = [
      -0.028467815049864,
      -0.1164436771687527,
      -0.068414164841857,
      -0.0625536356256523,
      -0.0962597567257022,
      -0.068818365498502,
      -0.0250822301796911,
      -0.0717332532291979,
      -0.0572231226364127
    ];

    const ctx = document.getElementById("sloanChart").getContext("2d");

    // Create gradient for line fill (subtle)
    const gradient = ctx.createLinearGradient(0, 0, 0, 400);
    gradient.addColorStop(0, "rgba(54, 162, 235, 0.35)");
    gradient.addColorStop(1, "rgba(54, 162, 235, 0)");

    const data = {
      labels: labels,
      datasets: [
        {
          label: "Sloan Ratio",
          data: sloanData,
          tension: 0.25,
          borderColor: "rgba(54, 162, 235, 1)",
          backgroundColor: gradient,
          borderWidth: 2,
          pointRadius: 4,
          pointHoverRadius: 6,
          pointBackgroundColor: "#ffffff",
          pointBorderColor: "rgba(54, 162, 235, 1)",
          pointBorderWidth: 2,
          fill: true,
        },
      ],
    };

    const options = {
      responsive: true,
      maintainAspectRatio: false,
      interaction: {
        mode: "nearest",
        axis: "x",
        intersect: false,
      },
      plugins: {
        legend: {
          display: true,
          labels: {
            usePointStyle: true,
            boxWidth: 8,
          },
        },
        title: {
          display: false,
        },
        tooltip: {
          callbacks: {
            label: function (ctx) {
              const value = ctx.parsed.y;
              return "Sloan Ratio: " + value.toFixed(4);
            },
          },
        },
      },
      scales: {
        x: {
          title: {
            display: true,
            text: "Fiscal Year",
            color: "#555",
          },
          grid: {
            display: false,
          },
        },
        y: {
          title: {
            display: true,
            text: "Sloan Ratio",
            color: "#555",
          },
          ticks: {
            callback: function (value) {
              return value.toFixed(2);
            },
          },
          grid: {
            color: "rgba(0, 0, 0, 0.06)",
          },
        },
      },
    };

    new Chart(ctx, {
      type: "line",
      data: data,
      options: options,
    });
  </script>
</body>
</html>
