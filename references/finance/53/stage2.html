<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>crm 净资产收益率-杜邦分析 (ROE) 2016-2024</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 20px;
      background-color: #f7f8fa;
      color: #222;
    }
    h1 {
      font-size: 20px;
      margin-bottom: 4px;
    }
    h2 {
      font-size: 14px;
      font-weight: 400;
      color: #666;
      margin-top: 0;
      margin-bottom: 16px;
    }
    #chart-wrapper {
      max-width: 860px;
      margin: 0 auto;
    }
    #chart-container {
      position: relative;
      width: 100%;
      /* Fix a reasonable height so the chart isn’t stretched */
      height: 420px;
      background: #fff;
      border-radius: 8px;
      padding: 16px 20px 24px;
      box-sizing: border-box;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }
    canvas {
      /* Let Chart.js fully control sizing */
      width: 100% !important;
      height: 100% !important;
      display: block;
    }
    .note {
      font-size: 12px;
      color: #777;
      margin-top: 10px;
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      #chart-container {
        height: 320px;
        padding: 12px 12px 18px;
      }
    }
  </style>
</head>
<body>
  <div id="chart-wrapper">
    <h1>crm 净资产收益率-杜邦分析 (ROE)</h1>
    <h2>2016 - 2024 年度变化（Original ROE(Avg)）</h2>

    <div id="chart-container">
      <canvas id="roeChart"></canvas>
    </div>

    <div class="note">
      说明：数据来源于提供的年度 ROE（Original ROE(Avg)），内部以百分比展示（例如 0.10 = 10%）。<br>
      鼠标悬停可查看精确数值，图例可点击以隐藏或显示数据线。
    </div>
  </div>

  <!-- Chart.js (latest 4.x) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script>
    // Source data
    const years = ["2016","2017","2018","2019","2020","2021","2022","2023","2024"];
    const roeValues = [
      -0.0105648753203924,
      0.0516676163057238,
      0.015092860791985,
      0.0888093676120957,
      0.005091937765205,
      0.1080421343097455,
      0.0289889986348671,
      0.0035711219847197,
      0.0700987246303122
    ];

    // Convert to percentage for display (e.g., 0.10 -> 10)
    const roePercent = roeValues.map(v => v * 100);

    const ctx = document.getElementById("roeChart").getContext("2d");

    new Chart(ctx, {
      type: "line",
      data: {
        labels: years,
        datasets: [{
          label: "ROE (Original ROE(Avg), %)",
          data: roePercent,
          borderColor: "#1f78b4",
          backgroundColor: "rgba(31, 120, 180, 0.12)",
          pointBackgroundColor: "#1f78b4",
          pointBorderColor: "#ffffff",
          pointRadius: 4,
          pointHoverRadius: 6,
          pointHitRadius: 8,
          pointBorderWidth: 1.5,
          tension: 0.25,
          fill: true
        }]
      },
      options: {
        // Let Chart.js keep the aspect ratio based on the fixed container size
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          tooltip: {
            mode: "nearest",
            intersect: false,
            callbacks: {
              label: function(ctx) {
                const value = ctx.raw;
                return " ROE: " + value.toFixed(2) + "%";
              }
            }
          },
          legend: {
            display: true,
            labels: {
              usePointStyle: true,
              pointStyle: "circle"
            }
          },
          title: {
            display: false
          }
        },
        scales: {
          x: {
            title: {
              display: true,
              text: "年度",
              color: "#555",
              font: {
                size: 12
              }
            },
            ticks: {
              maxRotation: 0,
              minRotation: 0
            },
            grid: {
              display: false
            }
          },
          y: {
            title: {
              display: true,
              text: "ROE（%）",
              color: "#555",
              font: {
                size: 12
              }
            },
            ticks: {
              callback: function(value) {
                return value + "%";
              }
            },
            grid: {
              color: "rgba(0,0,0,0.06)"
            }
          }
        },
        interaction: {
          mode: "index",
          intersect: false
        }
      }
    });
  </script>
</body>
</html>
