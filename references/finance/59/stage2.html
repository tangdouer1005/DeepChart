<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>crm 经济增加值 (EVA) 简化版 2016-2024</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue",
        Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
      margin: 0;
      padding: 20px;
      background: #f7f7f9;
      color: #222;
    }
    h1 {
      font-size: 20px;
      margin-bottom: 4px;
    }
    h2 {
      font-size: 13px;
      margin-top: 0;
      font-weight: 400;
      color: #666;
    }
    #chart-container {
      max-width: 960px;
      margin: 20px auto;
      padding: 18px 20px 24px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(15, 23, 42, 0.08);
    }
    canvas {
      max-width: 100%;
    }
    .note {
      max-width: 960px;
      margin: 0 auto;
      font-size: 12px;
      color: #666;
    }
  </style>
</head>
<body>
  <h1>crm 经济增加值 (EVA) - 简化版</h1>
  <h2>2016–2024 年度变化（单位：元）</h2>

  <div id="chart-container">
    <canvas id="evaChart"></canvas>
  </div>
  <div class="note">
    数据来源：用户提供的 crm EVA（简化版）年度结果。所有数值为负，表示经济增加值为负。
  </div>

  <!-- Chart.js (latest 4.x) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script>
    (function () {
      const ctx = document.getElementById('evaChart');

      const labels = [
        '2016',
        '2017',
        '2018',
        '2019',
        '2020',
        '2021',
        '2022',
        '2023',
        '2024'
      ];

      // 原始数据（元）
      const evaValues = [
        -529316350.0,
        -611145201.6759777,
        -680915174.9688286,
        -773265840.69176,
        -2427699008.498584,
        -4298143303.397111,
        -5759016449.086162,
        -5402131818.181818,
        -1995631111.1111107
      ];

      // 为了更清晰显示，在工具提示中用“亿元”显示，同时保持轴为“亿元”刻度
      const toYi = v => v / 100000000; // 1 亿 = 100,000,000 元

      const dataInYi = evaValues.map(toYi);

      // 配色：使用单一主色（蓝色调），保持设计简洁
      const barColor = 'rgba(37, 99, 235, 0.7)';
      const barBorderColor = 'rgba(37, 99, 235, 1)';

      new Chart(ctx, {
        type: 'bar',
        data: {
          labels,
          datasets: [
            {
              label: 'EVA（亿元）',
              data: dataInYi,
              backgroundColor: barColor,
              borderColor: barBorderColor,
              borderWidth: 1.2,
              borderRadius: 4,
              hoverBackgroundColor: 'rgba(30, 64, 175, 0.9)',
              hoverBorderColor: 'rgba(30, 64, 175, 1)'
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          layout: {
            padding: {
              top: 10,
              right: 10,
              bottom: 10,
              left: 10
            }
          },
          plugins: {
            legend: {
              display: true,
              labels: {
                font: {
                  size: 11
                }
              }
            },
            tooltip: {
              usePointStyle: true,
              callbacks: {
                label: function (context) {
                  const valueYi = context.raw;
                  const valueYuan = evaValues[context.dataIndex];
                  // 格式化函数
                  const formatNumber = (num, decimals = 2) => {
                    return num.toLocaleString('zh-CN', {
                      minimumFractionDigits: decimals,
                      maximumFractionDigits: decimals
                    });
                  };
                  return [
                    'EVA：' + formatNumber(valueYi, 2) + ' 亿元',
                    '（约 ' + formatNumber(valueYuan, 0) + ' 元）'
                  ];
                }
              }
            },
            title: {
              display: false
            }
          },
          scales: {
            x: {
              grid: {
                display: false
              },
              ticks: {
                font: {
                  size: 11
                }
              }
            },
            y: {
              grid: {
                color: 'rgba(148, 163, 184, 0.3)'
              },
              ticks: {
                font: {
                  size: 11
                },
                // 显示“亿元”
                callback: function (value) {
                  return value + ' 亿';
                }
              },
              title: {
                display: true,
                text: '经济增加值（亿元，负值表示为负 EVA）',
                font: {
                  size: 11
                }
              }
            }
          },
          interaction: {
            mode: 'index',
            intersect: false
          },
          animation: {
            duration: 700,
            easing: 'easeOutCubic'
          }
        }
      });

      // 设置一个合理的初始高度以保证可见性
      ctx.parentElement.style.height = '420px';
    })();
  </script>
</body>
</html>
