<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Meta 盈余-现金质量剪刀差 (2016-2024)</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 20px;
      background: #f7f8fa;
      color: #222;
    }

    h1 {
      font-size: 20px;
      margin-bottom: 4px;
    }

    h2 {
      font-size: 14px;
      font-weight: normal;
      margin-top: 0;
      margin-bottom: 20px;
      color: #555;
    }

    #chartWrapper {
      max-width: 900px;
      margin: 0 auto;
      background: #fff;
      padding: 18px 22px 22px;
      border-radius: 10px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.06);
    }

    /* Fix chart size to avoid vertical stretching */
    .chart-container {
      position: relative;
      width: 100%;
      max-width: 900px;
      height: 420px;       /* Fixed height gives a clean aspect ratio */
      margin: 0 auto;
    }

    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    .chart-footer {
      margin-top: 10px;
      font-size: 12px;
      color: #777;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      row-gap: 4px;
    }

    .chart-footer span {
      margin-right: 10px;
    }
  </style>
</head>
<body>
  <div id="chartWrapper">
    <h1>Meta 盈余-现金质量剪刀差</h1>
    <h2>Fiscal Year 2016 - 2024（单位：比例）</h2>

    <div class="chart-container">
      <canvas id="metaSpreadChart"></canvas>
    </div>

    <div class="chart-footer">
      <span>说明：剪刀差 = 盈余质量 − 现金质量（RESULT_Spread）。</span>
      <span>交互：悬停查看精确数值，可点击图例切换序列显示。</span>
    </div>
  </div>

  <!-- Chart.js (latest stable 4.x) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script>
    // Data from source
    const years = [
      "2016",
      "2017",
      "2018",
      "2019",
      "2020",
      "2021",
      "2022",
      "2023",
      "2024"
    ];

    const resultSpread = [
      0.1030183268047006,
      0.110807104391745,
      0.0787647505196361,
      0.1545576698019158,
      0.0656047995845461,
      0.1125904157047429,
      0.1550976077153596,
      0.1541591428915372,
      0.1145711590600324
    ];

    const canvas = document.getElementById("metaSpreadChart");
    const ctx = canvas.getContext("2d");

    // Gradient for visual clarity
    const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
    gradient.addColorStop(0, "rgba(54, 162, 235, 0.9)");
    gradient.addColorStop(1, "rgba(54, 162, 235, 0.4)");

    new Chart(ctx, {
      type: "bar",
      data: {
        labels: years,
        datasets: [
          {
            label: "盈余-现金质量剪刀差 (RESULT_Spread)",
            data: resultSpread,
            backgroundColor: gradient,
            borderColor: "rgba(54, 162, 235, 1)",
            borderWidth: 1,
            hoverBackgroundColor: "rgba(54, 162, 235, 1)",
            borderRadius: 4,
            maxBarThickness: 46
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false, // use the CSS-defined height
        plugins: {
          legend: {
            display: true,
            labels: {
              font: {
                size: 12
              }
            }
          },
          tooltip: {
            enabled: true,
            callbacks: {
              label: function (context) {
                const value = context.parsed.y;
                return (
                  "剪刀差: " +
                  value.toFixed(4) +
                  " (" +
                  (value * 100).toFixed(2) +
                  "%)"
                );
              }
            }
          }
        },
        scales: {
          x: {
            title: {
              display: true,
              text: "Fiscal Year",
              font: {
                size: 12
              }
            },
            grid: {
              display: false
            },
            ticks: {
              font: {
                size: 11
              }
            }
          },
          y: {
            beginAtZero: true,
            title: {
              display: true,
              text: "RESULT_Spread（比例）",
              font: {
                size: 12
              }
            },
            ticks: {
              font: {
                size: 11
              },
              callback: function (value) {
                return value.toFixed(2);
              }
            },
            grid: {
              color: "rgba(0, 0, 0, 0.05)"
            }
          }
        },
        interaction: {
          mode: "index",
          intersect: false
        },
        animation: {
          duration: 700,
          easing: "easeOutCubic"
        }
      }
    });
  </script>
</body>
</html>
