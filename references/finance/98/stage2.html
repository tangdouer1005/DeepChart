<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>GOOG 经济增加值 (EVA) 2016-2024 - 柱状图</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Chart.js (latest stable) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --fg: #111827;
      --grid: #e5e7eb;
      --pos-bar: #2563eb;
      --neg-bar: #ef4444;
      --pos-hover: #1d4ed8;
      --neg-hover: #dc2626;
      --tooltip-bg: rgba(17, 24, 39, 0.95);
      --tooltip-fg: #f9fafb;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #020617;
        --fg: #e5e7eb;
        --grid: #1f2933;
        --tooltip-bg: rgba(15, 23, 42, 0.98);
        --tooltip-fg: #f9fafb;
      }
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      background-color: var(--bg);
      color: var(--fg);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 2rem;
      box-sizing: border-box;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    h1 {
      font-size: clamp(1.25rem, 2.5vw, 1.6rem);
      margin: 0;
      font-weight: 600;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #6b7280;
      max-width: 640px;
    }

    @media (prefers-color-scheme: dark) {
      .subtitle {
        color: #9ca3af;
      }
    }

    .chart-wrapper {
      position: relative;
      width: 100%;
      height: min(480px, 70vh);
      background: radial-gradient(circle at top left, #f9fafb, #f3f4f6);
      border-radius: 12px;
      padding: 1rem 1rem 1.25rem;
      box-sizing: border-box;
      box-shadow:
        0 18px 45px rgba(15, 23, 42, 0.18),
        0 1px 0 rgba(255, 255, 255, 0.7) inset;
      border: 1px solid rgba(148, 163, 184, 0.35);
      overflow: hidden;
    }

    @media (prefers-color-scheme: dark) {
      .chart-wrapper {
        background: radial-gradient(circle at top left, #020617, #020617);
        box-shadow:
          0 18px 40px rgba(15, 23, 42, 0.9),
          0 1px 0 rgba(148, 163, 184, 0.15) inset;
        border-color: rgba(51, 65, 85, 0.9);
      }
    }

    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 0.25rem;
      padding-inline: 0.25rem;
      gap: 0.5rem;
    }

    .chart-title {
      font-size: 0.95rem;
      font-weight: 600;
    }

    .chart-legend {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.8rem;
      color: #6b7280;
    }

    @media (prefers-color-scheme: dark) {
      .chart-legend {
        color: #9ca3af;
      }
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }

    .legend-swatch {
      width: 10px;
      height: 10px;
      border-radius: 3px;
    }

    .legend-pos {
      background: var(--pos-bar);
    }

    .legend-neg {
      background: var(--neg-bar);
    }

    footer {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 1.25rem 1.5rem;
      box-sizing: border-box;
      font-size: 0.75rem;
      color: #9ca3af;
    }

    @media (prefers-color-scheme: dark) {
      footer {
        color: #6b7280;
      }
    }

    .note {
      margin-top: 0.35rem;
    }

    canvas {
      width: 100% !important;
      height: 100% !important;
    }
  </style>
</head>
<body>
  <main class="container">
    <header>
      <h1>GOOG 经济增加值 (EVA，简化版)</h1>
      <p class="subtitle">
        显示 2016–2024 财年 GOOG 经济增加值（EVA）的变化（单位：美元，精确值），柱体颜色区分正负 EVA。
      </p>
    </header>

    <section class="chart-wrapper">
      <div class="chart-header">
        <div class="chart-title">2016–2024 财年 EVA 变化</div>
        <div class="chart-legend">
          <span class="legend-item">
            <span class="legend-swatch legend-pos"></span> 正 EVA
          </span>
          <span class="legend-item">
            <span class="legend-swatch legend-neg"></span> 负 EVA
          </span>
        </div>
      </div>
      <canvas id="evaChart"></canvas>
    </section>
  </main>

  <footer>
    <div>数据来源：用户提供的 EVA 结果 (RESULT_EVA)。</div>
    <div class="note">
      提示：悬停可查看精确数值（带千位分隔符），点击图例可单独查看正值或负值区间。
    </div>
  </footer>

  <script>
    // 原始数据（来自用户提供 CSV）
    const rawData = [
      { year: 2016, eva: 7147510579.710144 },
      { year: 2017, eva: -2464469056.3748016 },
      { year: 2018, eva: 7860221797.038353 },
      { year: 2019, eva: 12015668498.42271 },
      { year: 2020, eva: 14535078644.815102 },
      { year: 2021, eva: 42990467138.007805 },
      { year: 2022, eva: 38061792507.85105 },
      { year: 2023, eva: 46389507888.16687 },
      { year: 2024, eva: 64444633685.26479 }
    ];

    // 提取标签与数值
    const labels = rawData.map(d => d.year.toString());
    const values = rawData.map(d => d.eva);

    // 正负值拆分用于单独控制颜色和图例交互
    const positiveValues = values.map(v => (v > 0 ? v : null));
    const negativeValues = values.map(v => (v < 0 ? v : null));

    const ctx = document.getElementById('evaChart').getContext('2d');

    const evaChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels,
        datasets: [
          {
            label: '正 EVA',
            data: positiveValues,
            backgroundColor: 'rgba(37, 99, 235, 0.9)',
            hoverBackgroundColor: 'rgba(29, 78, 216, 1)',
            borderColor: 'rgba(15, 23, 42, 0.5)',
            borderWidth: 0.8,
            borderRadius: 6,
            borderSkipped: false
          },
          {
            label: '负 EVA',
            data: negativeValues,
            backgroundColor: 'rgba(239, 68, 68, 0.9)',
            hoverBackgroundColor: 'rgba(220, 38, 38, 1)',
            borderColor: 'rgba(15, 23, 42, 0.5)',
            borderWidth: 0.8,
            borderRadius: 6,
            borderSkipped: false
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: {
          mode: 'index',
          intersect: false
        },
        plugins: {
          legend: {
            display: true,
            labels: {
              usePointStyle: true,
              pointStyle: 'rectRounded',
              padding: 16,
              font: {
                size: 11
              }
            }
          },
          tooltip: {
            backgroundColor: getComputedStyle(document.documentElement)
              .getPropertyValue('--tooltip-bg') || 'rgba(15, 23, 42, 0.95)',
            titleColor: getComputedStyle(document.documentElement)
              .getPropertyValue('--tooltip-fg') || '#f9fafb',
            bodyColor: getComputedStyle(document.documentElement)
              .getPropertyValue('--tooltip-fg') || '#f9fafb',
            padding: 10,
            borderWidth: 0,
            displayColors: false,
            callbacks: {
              label: context => {
                const value = context.raw;
                if (value === null || value === undefined) return '';
                // 使用千位分隔符格式化；保留两位小数
                const formatted = Number(value).toLocaleString('en-US', {
                  minimumFractionDigits: 2,
                  maximumFractionDigits: 2
                });
                return ` EVA: ${formatted} USD`;
              }
            }
          },
          title: {
            display: false
          }
        },
        scales: {
          x: {
            grid: {
              display: false
            },
            ticks: {
              font: {
                size: 11
              }
            }
          },
          y: {
            beginAtZero: true,
            grid: {
              color: getComputedStyle(document.documentElement)
                .getPropertyValue('--grid') || '#e5e7eb'
            },
            ticks: {
              font: {
                size: 11
              },
              callback: value => {
                // 轴标签用简写（十亿 = B）
                const absVal = Math.abs(value);
                if (absVal >= 1e9) {
                  return (value / 1e9).toFixed(1) + 'B';
                }
                if (absVal >= 1e6) {
                  return (value / 1e6).toFixed(1) + 'M';
                }
                return value;
              }
            },
            title: {
              display: true,
              text: 'EVA（美元）',
              font: {
                size: 12,
                weight: '500'
              }
            }
          }
        },
        animation: {
          duration: 900,
          easing: 'easeOutCubic'
        }
      }
    });
  </script>
</body>
</html>
