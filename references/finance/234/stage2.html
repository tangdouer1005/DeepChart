<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>tmus 可持续增长率 (SGR) 2016–2024 折线图</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f7f8fa;
      color: #222;
    }

    h1 {
      font-size: 20px;
      margin-bottom: 4px;
    }

    h2 {
      font-size: 14px;
      font-weight: 400;
      margin: 0 0 16px;
      color: #555;
    }

    .chart-container {
      position: relative;
      margin: 0 auto;
      max-width: 900px;
      background: #fff;
      padding: 16px 18px 24px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
    }

    .meta {
      font-size: 12px;
      color: #777;
      margin-top: 10px;
      line-height: 1.4;
    }

    .meta span.label {
      font-weight: 600;
      color: #444;
    }

    canvas {
      max-height: 520px;
    }
  </style>
</head>
<body>
  <div class="chart-container">
    <h1>tmus 可持续增长率 (Sustainable Growth Rate, SGR)</h1>
    <h2>2016–2024 年度变动趋势</h2>
    <canvas id="sgrChart"></canvas>
    <div class="meta">
      <div><span class="label">说明：</span>可持续增长率（SGR）反映公司在维持当前财务结构前提下，可持续实现的销售增长率。</div>
      <div><span class="label">数据区间：</span>2016–2024 财年</div>
      <div><span class="label">单位：</span>小数形式（例如 0.12 = 12%）</div>
      <div><span class="label">负值提示：</span>2020 年 SGR 为 -1.0839，表示财务结构在当年存在异常或重大调整。</div>
    </div>
  </div>

  <!-- Chart.js (latest 4.x) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script>
    // Source data (as provided)
    const fiscalYears = [
      "2016",
      "2017",
      "2018",
      "2019",
      "2020",
      "2021",
      "2022",
      "2023",
      "2024",
    ];

    const sgrValues = [
      0.0807633719426321,
      0.2196837847775462,
      0.1221735727732301,
      0.1296278991533818,
      -1.0839131866614258,
      0.0449846034839266,
      0.0373311809048847,
      0.1126731214324519,
      0.1271430378946036,
    ];

    // Create chart
    const ctx = document.getElementById("sgrChart").getContext("2d");

    // Determine a reasonable y-axis range with some padding
    const minVal = Math.min(...sgrValues);
    const maxVal = Math.max(...sgrValues);
    const padding = 0.05 * (maxVal - minVal || 1); // avoid zero range
    const suggestedMin = Math.floor((minVal - padding) * 10) / 10;
    const suggestedMax = Math.ceil((maxVal + padding) * 10) / 10;

    new Chart(ctx, {
      type: "line",
      data: {
        labels: fiscalYears,
        datasets: [
          {
            label: "可持续增长率 (SGR)",
            data: sgrValues,
            borderColor: "#2563EB",
            backgroundColor: "rgba(37, 99, 235, 0.08)",
            pointBackgroundColor: "#2563EB",
            pointBorderColor: "#fff",
            pointHoverRadius: 6,
            pointRadius: 4,
            pointHitRadius: 12,
            borderWidth: 2,
            fill: true,
            tension: 0.25,
          },
        ],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: {
          mode: "nearest",
          intersect: false,
        },
        plugins: {
          legend: {
            display: true,
            labels: {
              usePointStyle: true,
              boxWidth: 8,
              padding: 16,
            },
          },
          tooltip: {
            enabled: true,
            callbacks: {
              label: (context) => {
                const raw = context.raw;
                const pct = (raw * 100).toFixed(2);
                return ` SGR: ${raw.toFixed(4)} (${pct}%)`;
              },
              title: (items) => `Fiscal Year: ${items[0].label}`,
            },
          },
          title: {
            display: false,
          },
        },
        scales: {
          x: {
            title: {
              display: true,
              text: "Fiscal Year",
              color: "#444",
            },
            grid: {
              display: false,
            },
          },
          y: {
            title: {
              display: true,
              text: "SGR (小数)",
              color: "#444",
            },
            ticks: {
              callback: (value) => value.toFixed(2),
            },
            suggestedMin,
            suggestedMax,
            grid: {
              color: "rgba(148, 163, 184, 0.2)",
            },
          },
        },
      },
    });
  </script>
</body>
</html>
