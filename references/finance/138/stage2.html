<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LLY 皮奥特罗斯基 F-Score (2016–2024)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Chart.js (latest stable 4.x) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: 1.5rem;
      background: #f7f7fb;
      color: #222;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.2rem;
    }

    h2 {
      font-size: 1rem;
      font-weight: 500;
      color: #555;
      margin-top: 0;
      margin-bottom: 1.2rem;
    }

    .chart-container {
      max-width: 900px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      padding: 1.5rem;
    }

    .chart-wrapper {
      position: relative;
      height: 450px;
    }

    .note {
      max-width: 900px;
      margin: 0.8rem auto 0;
      font-size: 0.8rem;
      color: #666;
      line-height: 1.4;
    }

    @media (max-width: 600px) {
      body {
        padding: 1rem;
      }
      .chart-wrapper {
        height: 360px;
      }
    }
  </style>
</head>
<body>
  <div class="chart-container">
    <h1>LLY 皮奥特罗斯基 F-Score 趋势</h1>
    <h2>Fiscal Years 2016–2024</h2>
    <div class="chart-wrapper">
      <canvas id="fScoreChart"></canvas>
    </div>
  </div>

  <div class="note">
    数据来源（用户提供）：Fiscal Year vs RESULT_F_Score<br />
    2016: 6 &nbsp;•&nbsp; 2017: 4 &nbsp;•&nbsp; 2018: 8 &nbsp;•&nbsp; 2019: 6
    &nbsp;•&nbsp; 2020: 6 &nbsp;•&nbsp; 2021: 6 &nbsp;•&nbsp; 2022: 7
    &nbsp;•&nbsp; 2023: 5 &nbsp;•&nbsp; 2024: 6
  </div>

  <script>
    // Data from the user-provided table
    const years = [
      "2016",
      "2017",
      "2018",
      "2019",
      "2020",
      "2021",
      "2022",
      "2023",
      "2024",
    ];
    const fScores = [6, 4, 8, 6, 6, 6, 7, 5, 6];

    const ctx = document.getElementById("fScoreChart").getContext("2d");

    // Create gradient for the bars (visual clarity)
    const gradient = ctx.createLinearGradient(0, 0, 0, 400);
    gradient.addColorStop(0, "rgba(46, 134, 222, 0.9)");
    gradient.addColorStop(1, "rgba(46, 134, 222, 0.3)");

    const fScoreChart = new Chart(ctx, {
      type: "bar",
      data: {
        labels: years,
        datasets: [
          {
            label: "Piotroski F-Score",
            data: fScores,
            backgroundColor: gradient,
            borderColor: "rgba(46, 134, 222, 1)",
            borderWidth: 1.5,
            borderRadius: 6,
            hoverBackgroundColor: "rgba(46, 134, 222, 0.95)",
            hoverBorderColor: "rgba(30, 96, 166, 1)",
          },
        ],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: {
          mode: "nearest",
          axis: "x",
          intersect: true,
        },
        plugins: {
          tooltip: {
            enabled: true,
            callbacks: {
              label: function (context) {
                return `F-Score: ${context.parsed.y}`;
              },
            },
          },
          legend: {
            display: true,
            labels: {
              font: { size: 12 },
            },
          },
          title: {
            display: false,
          },
        },
        scales: {
          x: {
            title: {
              display: true,
              text: "Fiscal Year",
              font: { size: 12, weight: "500" },
            },
            grid: {
              display: false,
            },
          },
          y: {
            title: {
              display: true,
              text: "Piotroski F-Score (0–9)",
              font: { size: 12, weight: "500" },
            },
            beginAtZero: true,
            suggestedMax: 9,
            ticks: {
              stepSize: 1,
            },
            grid: {
              color: "rgba(148, 163, 184, 0.3)",
            },
          },
        },
        animation: {
          duration: 800,
          easing: "easeOutQuart",
        },
      },
    });
  </script>
</body>
</html>
