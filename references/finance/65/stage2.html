<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CSCO ROE (DuPont Analysis) 2016–2024</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Chart.js (latest 4.x) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --fg: #222222;
      --grid: #e0e0e0;
      --accent: #2563eb;
      --accent-light: rgba(37, 99, 235, 0.15);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1120;
        --fg: #e5e7eb;
        --grid: #1f2933;
        --accent: #60a5fa;
        --accent-light: rgba(96, 165, 250, 0.16);
      }
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, sans-serif;
    }

    body {
      margin: 0;
      padding: 1.5rem;
      background: var(--bg);
      color: var(--fg);
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.4rem;
      margin: 0 0 0.3rem;
      font-weight: 600;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #6b7280;
      margin-bottom: 1rem;
    }

    @media (prefers-color-scheme: dark) {
      .subtitle {
        color: #9ca3af;
      }
    }

    .chart-card {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 12px;
      padding: 1rem 1rem 0.6rem;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
      border: 1px solid rgba(148, 163, 184, 0.25);
    }

    @media (prefers-color-scheme: dark) {
      .chart-card {
        background: radial-gradient(circle at top, #020617 0, #020617 55%, #020617 100%);
        border-color: rgba(148, 163, 184, 0.35);
        box-shadow: 0 18px 45px rgba(0, 0, 0, 0.7);
      }
    }

    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.6rem;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .chart-meta {
      font-size: 0.78rem;
      color: #6b7280;
    }

    @media (prefers-color-scheme: dark) {
      .chart-meta {
        color: #9ca3af;
      }
    }

    .controls {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .toggle-group {
      display: inline-flex;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.6);
      overflow: hidden;
      font-size: 0.75rem;
    }

    .toggle-group button {
      padding: 0.25rem 0.6rem;
      border: none;
      background: transparent;
      color: inherit;
      cursor: pointer;
    }

    .toggle-group button.active {
      background: var(--accent);
      color: #ffffff;
    }

    .note {
      font-size: 0.72rem;
      color: #6b7280;
      margin-top: 0.3rem;
    }

    @media (prefers-color-scheme: dark) {
      .note {
        color: #9ca3af;
      }
    }

    canvas {
      max-height: 460px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>CSCO 净资产收益率 - 杜邦分析 (ROE)</h1>
    <div class="subtitle">Fiscal Years 2016–2024 &nbsp;•&nbsp; Line chart showing annual ROE (DuPont)</div>

    <div class="chart-card">
      <div class="chart-header">
        <div class="chart-meta">
          Hover or tap points to see exact ROE values.<br />
          Values converted from ratios to percentages.
        </div>
        <div class="controls">
          <span style="font-size:0.78rem;">Scale:</span>
          <div class="toggle-group" id="scaleToggle">
            <button data-scale="linear" class="active">Linear</button>
            <button data-scale="logarithmic">Log</button>
          </div>
        </div>
      </div>
      <canvas id="roeChart"></canvas>
      <div class="note">
        Source data (Original ROE Avg): 2016–2024, values such as 0.1742 converted to 17.42%.
      </div>
    </div>
  </div>

  <script>
    // Source data (ratios)
    const fiscalYears = [2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024];
    const roeRatios = [
      0.1742156321988254,
      0.1481464350963206,
      0.0020120540327964,
      0.3027287528492348,
      0.3137178106335063,
      0.2674663804533114,
      0.2914815911558582,
      0.2998597342082115,
      0.229818505734328
    ];

    // Convert to percentages rounded to two decimals
    const roePercent = roeRatios.map(v => +(v * 100).toFixed(2));

    const ctx = document.getElementById('roeChart').getContext('2d');

    // Create gradient for line and fill
    function createGradients(ctx) {
      const h = ctx.canvas.height || 400;
      const gradientLine = ctx.createLinearGradient(0, 0, 0, h);
      gradientLine.addColorStop(0, '#2563eb');
      gradientLine.addColorStop(1, '#60a5fa');

      const gradientFill = ctx.createLinearGradient(0, 0, 0, h);
      gradientFill.addColorStop(0, 'rgba(37, 99, 235, 0.25)');
      gradientFill.addColorStop(1, 'rgba(37, 99, 235, 0)');

      return { gradientLine, gradientFill };
    }

    let { gradientLine, gradientFill } = createGradients(ctx);

    const data = {
      labels: fiscalYears,
      datasets: [{
        label: 'ROE (DuPont, %)',
        data: roePercent,
        borderColor: gradientLine,
        backgroundColor: gradientFill,
        fill: true,
        spanGaps: false,
        tension: 0.35,
        pointRadius: 4,
        pointHoverRadius: 6,
        pointBackgroundColor: '#ffffff',
        pointBorderColor: '#2563eb',
        pointBorderWidth: 1.5,
        pointHoverBorderWidth: 2,
        pointHoverBackgroundColor: '#2563eb'
      }]
    };

    const options = {
      responsive: true,
      maintainAspectRatio: false,
      interaction: {
        mode: 'nearest',
        intersect: false
      },
      plugins: {
        legend: {
          display: true,
          labels: {
            usePointStyle: true,
            boxWidth: 8
          }
        },
        tooltip: {
          backgroundColor: 'rgba(15,23,42,0.9)',
          borderColor: 'rgba(148,163,184,0.5)',
          borderWidth: 1,
          padding: 8,
          displayColors: false,
          callbacks: {
            title: (items) => {
              const item = items[0];
              return `Fiscal Year ${item.label}`;
            },
            label: (item) => {
              const value = item.raw;
              return `ROE: ${value.toFixed(2)}%`;
            }
          }
        }
      },
      scales: {
        x: {
          title: {
            display: true,
            text: 'Fiscal Year'
          },
          grid: {
            display: false
          }
        },
        y: {
          type: 'linear',
          title: {
            display: true,
            text: 'ROE (%)'
          },
          ticks: {
            callback: (value) => value + '%'
          },
          grid: {
            color: 'rgba(148,163,184,0.3)',
            drawBorder: false
          },
          suggestedMin: 0,
          suggestedMax: 40
        }
      }
    };

    const roeChart = new Chart(ctx, {
      type: 'line',
      data,
      options
    });

    // Update gradients on resize so they always cover canvas height
    window.addEventListener('resize', () => {
      const newGradients = createGradients(ctx);
      gradientLine = newGradients.gradientLine;
      gradientFill = newGradients.gradientFill;
      roeChart.data.datasets[0].borderColor = gradientLine;
      roeChart.data.datasets[0].backgroundColor = gradientFill;
      roeChart.update('none');
    });

    // Scale toggle (linear / log)
    const scaleToggle = document.getElementById('scaleToggle');
    scaleToggle.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-scale]');
      if (!btn) return;

      const scaleType = btn.getAttribute('data-scale');

      // Update button styles
      [...scaleToggle.querySelectorAll('button')].forEach(b => {
        b.classList.toggle('active', b === btn);
      });

      // For log scale, ensure min is > 0
      if (scaleType === 'logarithmic') {
        roeChart.options.scales.y.type = 'logarithmic';
        roeChart.options.scales.y.min = 0.1;
        roeChart.options.scales.y.max = 40;
        roeChart.options.scales.y.ticks = {
          callback: (value) => value + '%'
        };
      } else {
        roeChart.options.scales.y.type = 'linear';
        roeChart.options.scales.y.min = undefined;
        roeChart.options.scales.y.max = undefined;
        roeChart.options.scales.y.ticks = {
          callback: (value) => value + '%'
        };
        roeChart.options.scales.y.suggestedMin = 0;
        roeChart.options.scales.y.suggestedMax = 40;
      }

      roeChart.update();
    });
  </script>
</body>
</html>
