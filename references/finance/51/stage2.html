<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>CRM 内部增长率 (IGR) 变化趋势（2016–2024）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Chart.js (latest stable 4.x) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f7f7f9;
      color: #222;
    }
    h1 {
      font-size: 20px;
      margin-bottom: 4px;
    }
    h2 {
      font-size: 13px;
      font-weight: 400;
      color: #666;
      margin-top: 0;
      margin-bottom: 18px;
    }
    .chart-container {
      position: relative;
      max-width: 900px;
      margin: 0 auto;
      background: #fff;
      border-radius: 8px;
      padding: 16px 18px 20px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.06);
    }

    /* Fixed but responsive height to avoid extreme vertical stretching */
    .chart-wrapper {
      position: relative;
      width: 100%;
      max-width: 860px;
      margin: 0 auto;
      /* 16:9 aspect ratio box – prevents distortion */
      aspect-ratio: 16 / 9;
    }

    canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }

    .note {
      font-size: 11px;
      color: #666;
      margin-top: 10px;
      line-height: 1.5;
    }
    .legend-inline {
      font-size: 12px;
      color: #444;
      margin-bottom: 8px;
    }
    .legend-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 5px;
      vertical-align: middle;
      background: #2563eb;
      border: 2px solid rgba(37, 99, 235, 0.25);
    }

    @media (max-width: 600px) {
      .chart-wrapper {
        /* On small screens keep a reasonable height */
        aspect-ratio: 4 / 3;
      }
    }
  </style>
</head>
<body>
  <div class="chart-container">
    <h1>CRM 内部增长率 (IGR) 变化趋势</h1>
    <h2>Fiscal Year 2016–2024（缺失年份不插值，仅显示有数据年份）</h2>
    <div class="legend-inline">
      <span class="legend-dot"></span>内部增长率 (IGR)
    </div>

    <!-- Wrapper with controlled aspect ratio to prevent vertical stretching -->
    <div class="chart-wrapper">
      <canvas id="igrChart"></canvas>
    </div>

    <div class="note">
      说明：IGR（内部增长率）单位为小数，例如 0.035 ≈ 3.5%。本图基于提供的年度数据绘制，不对缺失年份进行推断或填充。
    </div>
  </div>

  <script>
    // Source data (as provided)
    const rawData = [
      { year: 2016, igr: -0.0040275568247199 },
      { year: 2017, igr:  0.021749492110641 },
      { year: 2018, igr:  0.0066499096538635 },
      { year: 2023, igr: -0.0066849573104563 },
      { year: 2024, igr:  0.0350518901346226 }
    ];

    const labels = rawData.map(d => d.year);
    const dataValues = rawData.map(d => d.igr);

    const ctx = document.getElementById('igrChart').getContext('2d');

    const formatPercent = (value) => {
      if (value === null || value === undefined || isNaN(value)) return '';
      return (value * 100).toFixed(2) + '%';
    };

    new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          label: '内部增长率 (IGR)',
          data: dataValues,
          borderColor: '#2563eb',
          backgroundColor: 'rgba(37, 99, 235, 0.12)',
          pointBackgroundColor: '#2563eb',
          pointBorderColor: '#ffffff',
          pointHoverBackgroundColor: '#1d4ed8',
          pointRadius: 4,
          pointHoverRadius: 5,
          tension: 0.25,
          fill: true,
          borderWidth: 2
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false, // aspect ratio controlled by CSS wrapper
        interaction: {
          mode: 'nearest',
          axis: 'x',
          intersect: false
        },
        plugins: {
          legend: {
            display: false
          },
          tooltip: {
            backgroundColor: 'rgba(15, 23, 42, 0.92)',
            borderColor: 'rgba(148, 163, 184, 0.3)',
            borderWidth: 1,
            padding: 10,
            displayColors: false,
            callbacks: {
              title: (items) => {
                const item = items[0];
                return 'Fiscal Year: ' + item.label;
              },
              label: (item) => {
                const val = item.raw;
                return 'IGR: ' + formatPercent(val);
              }
            }
          }
        },
        scales: {
          x: {
            title: {
              display: true,
              text: 'Fiscal Year',
              color: '#374151',
              font: { size: 12, weight: '500' }
            },
            ticks: {
              color: '#4b5563',
              autoSkip: false
            },
            grid: {
              display: false
            }
          },
          y: {
            title: {
              display: true,
              text: '内部增长率 (IGR，%)',
              color: '#374151',
              font: { size: 12, weight: '500' }
            },
            ticks: {
              color: '#4b5563',
              callback: function(value) {
                return (value * 100).toFixed(1) + '%';
              }
            },
            grid: {
              color: 'rgba(148, 163, 184, 0.3)',
              drawBorder: false
            }
          }
        }
      }
    });
  </script>
</body>
</html>
