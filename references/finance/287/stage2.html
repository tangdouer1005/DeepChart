<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>xom 盈余-现金质量剪刀差 (2016–2024)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Chart.js latest 4.x -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 24px;
      background: #fafafa;
      color: #222;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 4px;
      font-weight: 600;
    }
    h2 {
      font-size: 14px;
      margin: 0 0 16px;
      color: #555;
      font-weight: 400;
    }
    .chart-container {
      max-width: 900px;
      margin: 0 auto;
      background: #fff;
      padding: 18px 20px 24px;
      border-radius: 10px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }
    .chart-wrapper {
      position: relative;
      height: 420px;
    }
    .note {
      font-size: 12px;
      color: #666;
      margin-top: 10px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="chart-container">
    <h1>xom 盈余-现金质量剪刀差变化</h1>
    <h2>2016–2024 年度 Earnings Quality Spread（RESULT_Spread）</h2>
    <div class="chart-wrapper">
      <canvas id="spreadChart"></canvas>
    </div>
    <div class="note">
      数据来源：用户提供的年度 RESULT_Spread 数值。<br>
      鼠标悬停可查看具体年度数值。
    </div>
  </div>

  <script>
    // Ensure Chart.js has loaded
    window.addEventListener("load", function () {
      const canvas = document.getElementById("spreadChart");
      if (!canvas) return;

      const ctx = canvas.getContext("2d");

      const years = [
        "2016", "2017", "2018", "2019", "2020",
        "2021", "2022", "2023", "2024"
      ];

      const spreadValues = [
        0.0427000383766669,
        0.030503457264674,
        0.0436732878870953,
        0.0433864329924251,
        0.1067323221355668,
        0.0747059953280837,
        0.0594838910154098,
        0.0519436961351464,
        0.0514393968609
      ];

      // Fallback if Chart is not available
      if (typeof Chart === "undefined") {
        canvas.insertAdjacentHTML("afterend", "<p style='color:red;font-size:12px;'>Chart.js 加载失败，请检查网络连接。</p>");
        return;
      }

      // Gradient for the bars
      const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height || 400);
      gradient.addColorStop(0, "#1f77b4");
      gradient.addColorStop(1, "#74b3ff");

      const maxSpread = Math.max(...spreadValues);
      const yMax = Math.ceil((maxSpread + 0.01) * 1000) / 1000;

      new Chart(ctx, {
        type: "bar",
        data: {
          labels: years,
          datasets: [
            {
              label: "RESULT_Spread",
              data: spreadValues,
              backgroundColor: gradient,
              borderColor: "#1f77b4",
              borderWidth: 1,
              hoverBackgroundColor: "#165a86",
              borderRadius: 6,
              barPercentage: 0.6,
              categoryPercentage: 0.7
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: {
            mode: "nearest",
            intersect: true
          },
          plugins: {
            legend: {
              display: true,
              labels: {
                usePointStyle: true,
                boxWidth: 8,
                boxHeight: 8
              }
            },
            title: {
              display: false
            },
            tooltip: {
              callbacks: {
                label: function (context) {
                  const value = context.parsed.y;
                  return "RESULT_Spread: " + value.toFixed(4);
                }
              }
            }
          },
          scales: {
            x: {
              grid: {
                display: false
              },
              ticks: {
                maxRotation: 0,
                minRotation: 0
              }
            },
            y: {
              beginAtZero: true,
              suggestedMax: yMax,
              title: {
                display: true,
                text: "RESULT_Spread",
                font: {
                  size: 12
                }
              },
              ticks: {
                callback: function (value) {
                  return Number(value).toFixed(2);
                }
              }
            }
          }
        }
      });
    });
  </script>
</body>
</html>
