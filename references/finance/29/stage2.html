<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>ACN 经济增加值 (EVA) 2016–2024</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 使用稳定的 Chart.js v3（某些运行环境对 v4 不兼容时更稳妥） -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, "Helvetica Neue", Arial, "Noto Sans", "Liberation Sans",
        sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #fafafa;
      color: #222;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.6rem;
      margin: 0 0 6px 0;
      font-weight: 600;
    }

    h2 {
      font-size: 1rem;
      font-weight: 400;
      margin: 0 0 18px 0;
      color: #555;
    }

    .chart-wrapper {
      position: relative;
      height: 480px;
      background: #fff;
      border-radius: 8px;
      padding: 18px 18px 30px 18px;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.08);
    }

    .footer-note {
      font-size: 0.8rem;
      color: #666;
      margin-top: 8px;
    }

    @media (max-width: 600px) {
      .chart-wrapper {
        height: 420px;
        padding: 14px 10px 24px 10px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>ACN 经济增加值 (EVA) 变化趋势</h1>
    <h2>2016–2024 年（单位：元）</h2>

    <div class="chart-wrapper">
      <canvas id="evaChart"></canvas>
    </div>

    <div class="footer-note">
      数据来源：用户提供的 ACN EVA 简化版数据（Fiscal Year vs. RESULT_EVA）。
    </div>
  </div>

  <script>
    // 为了兼容性，使用最基础的 JS 语法（不使用 const/let、箭头函数、Intl 等）
    window.onload = function () {
      var fiscalYears = [
        "2016",
        "2017",
        "2018",
        "2019",
        "2020",
        "2021",
        "2022",
        "2023",
        "2024"
      ];

      var evaValues = [
        3510098344.70991,
        3711783293.389648,
        3771594885.7384944,
        4205879084.78264,
        4100376532.595264,
        4804095878.832297,
        5761431929.766994,
        5127822820.319231,
        5213978085.686655
      ];

      // 简单的数字格式化：保留两位小数
      function formatNumber(num) {
        return (Math.round(num * 100) / 100).toLocaleString('zh-CN');
      }

      var canvas = document.getElementById("evaChart");
      if (!canvas) {
        return;
      }

      var ctx = canvas.getContext("2d");

      new Chart(ctx, {
        type: "line",
        data: {
          labels: fiscalYears,
          datasets: [
            {
              label: "经济增加值 (EVA)",
              data: evaValues,
              borderColor: "rgba(37, 99, 235, 1)",
              backgroundColor: "rgba(37, 99, 235, 0.12)",
              pointBackgroundColor: "rgba(37, 99, 235, 1)",
              pointBorderColor: "#ffffff",
              pointHoverRadius: 6,
              pointRadius: 4,
              pointBorderWidth: 2,
              tension: 0.25,
              fill: true
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: {
            mode: "index",
            intersect: false
          },
          plugins: {
            legend: {
              display: true,
              labels: {
                usePointStyle: true,
                pointStyle: "circle",
                boxWidth: 8,
                font: {
                  size: 12
                }
              }
            },
            tooltip: {
              backgroundColor: "rgba(15,23,42,0.9)",
              titleFont: { size: 13, weight: "600" },
              bodyFont: { size: 12 },
              padding: 10,
              callbacks: {
                label: function (context) {
                  var value = context.parsed.y;
                  return " EVA: " + formatNumber(value) + " 元";
                }
              }
            },
            title: {
              display: false
            }
          },
          scales: {
            x: {
              title: {
                display: true,
                text: "财年 (Fiscal Year)",
                font: { size: 12 }
              },
              grid: {
                display: false
              }
            },
            y: {
              title: {
                display: true,
                text: "EVA（元）",
                font: { size: 12 }
              },
              ticks: {
                callback: function (value) {
                  var billions = value / 1000000000;
                  return formatNumber(billions) + " 十亿";
                }
              },
              grid: {
                color: "rgba(148, 163, 184, 0.28)"
              }
            }
          }
        }
      });
    };
  </script>
</body>
</html>
