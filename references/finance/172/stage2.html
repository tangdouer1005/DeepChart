<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MSFT Sloan Ratio (Accruals Ratio) 2016–2024</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Chart.js (latest 4.x) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f7;
      color: #222;
    }
    .chart-container {
      max-width: 900px;
      height: 480px; /* ensure enough height so Chart.js can render */
      margin: 0 auto;
      background: #ffffff;
      border-radius: 10px;
      padding: 18px 20px 24px;
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.1);
      display: flex;
      flex-direction: column;
    }
    h1 {
      font-size: 1.4rem;
      margin: 0 0 4px;
      text-align: left;
    }
    h2 {
      font-size: 0.95rem;
      font-weight: 400;
      color: #555;
      margin: 0 0 12px;
    }
    .subtitle-cn {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 8px;
    }
    .canvas-wrapper {
      flex: 1;
      position: relative;
    }
    canvas {
      max-width: 100%;
      max-height: 100%;
    }
    .note {
      font-size: 0.75rem;
      color: #777;
      margin-top: 12px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="chart-container">
    <h1>MSFT Sloan Ratio (Accruals Ratio) by Fiscal Year</h1>
    <div class="subtitle-cn">微软 斯隆比率（权责发生额比率）年度变化：2016–2024</div>
    <h2>Fiscal Years 2016–2024</h2>

    <div class="canvas-wrapper">
      <canvas id="msftSloanChart" aria-label="MSFT Sloan Ratio from 2016 to 2024" role="img"></canvas>
    </div>

    <div class="note">
      Notes:<br />
      • Data: RESULT_Sloan (Accruals/Sloan Ratio) for Microsoft (MSFT), fiscal years 2016–2024.<br />
      • Values below zero indicate negative accruals (often associated with higher earnings quality).
    </div>
  </div>

  <script>
    // Ensure script runs after DOM is ready
    document.addEventListener('DOMContentLoaded', function () {
      const canvas = document.getElementById('msftSloanChart');
      if (!canvas) return;

      const ctx = canvas.getContext('2d');

      const fiscalYears = [
        '2016',
        '2017',
        '2018',
        '2019',
        '2020',
        '2021',
        '2022',
        '2023',
        '2024'
      ];

      const sloanValues = [
        -0.0694577989276576,
        -0.0644831868991214,
        -0.1092664231678581,
        -0.0474693988309583,
        -0.0557745204272394,
        -0.0487143554456848,
        -0.0466549005967487,
        -0.0391881732611068,
        -0.0658169387938394
      ];

      new Chart(ctx, {
        type: 'bar',
        data: {
          labels: fiscalYears,
          datasets: [
            {
              label: 'Sloan Ratio (Accruals Ratio)',
              data: sloanValues,
              backgroundColor: 'rgba(37, 99, 235, 0.75)',
              hoverBackgroundColor: 'rgba(37, 99, 235, 0.95)',
              borderColor: 'rgba(15, 23, 42, 0.15)',
              borderWidth: 1,
              borderRadius: 6
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              display: true,
              labels: {
                boxWidth: 14,
                padding: 16
              }
            },
            tooltip: {
              mode: 'index',
              intersect: false,
              backgroundColor: 'rgba(15, 23, 42, 0.92)',
              titleColor: '#f9fafb',
              bodyColor: '#e5e7eb',
              borderColor: 'rgba(148, 163, 184, 0.4)',
              borderWidth: 1,
              padding: 10,
              callbacks: {
                label: function (context) {
                  const v = context.parsed.y;
                  if (v == null || isNaN(v)) return '';
                  return ' Sloan Ratio: ' + v.toFixed(4);
                }
              }
            },
            title: {
              display: false
            }
          },
          scales: {
            x: {
              grid: {
                display: false
              },
              title: {
                display: true,
                text: 'Fiscal Year',
                color: '#374151',
                font: {
                  size: 11,
                  weight: '500'
                }
              },
              ticks: {
                maxRotation: 0,
                minRotation: 0
              }
            },
            y: {
              beginAtZero: false,
              grid: {
                color: 'rgba(148, 163, 184, 0.3)'
              },
              title: {
                display: true,
                text: 'Sloan Ratio (Accruals Ratio)',
                color: '#374151',
                font: {
                  size: 11,
                  weight: '500'
                }
              },
              ticks: {
                callback: function (value) {
                  // ensure it's numeric before formatting
                  const num = Number(value);
                  if (isNaN(num)) return value;
                  return num.toFixed(2);
                }
              }
            }
          },
          animation: {
            duration: 700,
            easing: 'easeOutCubic'
          },
          interaction: {
            mode: 'nearest',
            intersect: true
          }
        }
      });
    });
  </script>
</body>
</html>
