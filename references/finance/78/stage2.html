<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CVX 盈余-现金质量剪刀差 (2016–2024)</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #fafafa;
      color: #222;
    }
    h1 {
      font-size: 20px;
      margin-bottom: 4px;
    }
    h2 {
      font-size: 14px;
      font-weight: normal;
      color: #555;
      margin-top: 0;
      margin-bottom: 20px;
    }
    .chart-wrapper {
      max-width: 800px;
      margin: 0 auto;
    }
    .chart-container {
      position: relative;          /* required for explicit height */
      width: 100%;
      height: 420px;               /* fixed, natural height to avoid vertical stretching */
      background: #fff;
      padding: 16px 20px 24px;
      border-radius: 8px;
      box-sizing: border-box;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }
    canvas {
      width: 100% !important;      /* make canvas follow container width */
      height: 100% !important;     /* and height, controlled by .chart-container */
      display: block;
    }
    .note {
      max-width: 800px;
      margin: 12px auto 0;
      font-size: 12px;
      color: #777;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="chart-wrapper">
    <h1>CVX 盈余-现金质量剪刀差</h1>
    <h2>年度变化：2016–2024</h2>
    <div class="chart-container">
      <canvas id="spreadChart"></canvas>
    </div>
  </div>
  <div class="note">
    数据说明：RESULT_Spread 表示盈余-现金质量剪刀差（Earnings Quality Spread），数据来源于用户提供的年度结果。
  </div>

  <!-- Chart.js (latest stable 4.x) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    const years = [
      "2016","2017","2018","2019","2020","2021","2022","2023","2024"
    ];
    const spreadValues = [
      0.0508674883438997,
      0.0433677639311595,
      0.0622216444179179,
      0.099232430473996,
      0.0676546148720291,
      0.0566421530276951,
      0.0568533758074506,
      0.0548387283114562,
      0.0533428466745087
    ];

    const ctx = document.getElementById('spreadChart').getContext('2d');

    new Chart(ctx, {
      type: 'line',
      data: {
        labels: years,
        datasets: [{
          label: 'RESULT_Spread',
          data: spreadValues,
          borderColor: '#1976d2',
          backgroundColor: 'rgba(25, 118, 210, 0.1)',
          borderWidth: 2,
          tension: 0.25,
          pointRadius: 4,
          pointHoverRadius: 5,
          pointBackgroundColor: '#1976d2',
          pointBorderColor: '#ffffff',
          pointBorderWidth: 1.5
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,  // allow canvas to fill the fixed-height container
        interaction: {
          mode: 'nearest',
          intersect: false
        },
        plugins: {
          legend: {
            display: true,
            labels: {
              font: { size: 12 }
            }
          },
          tooltip: {
            callbacks: {
              label: function(context) {
                const value = context.parsed.y;
                return 'RESULT_Spread: ' + value.toFixed(4);
              }
            }
          },
          title: {
            display: false
          }
        },
        scales: {
          x: {
            title: {
              display: true,
              text: 'Fiscal Year',
              font: { size: 12 }
            },
            grid: {
              display: false
            }
          },
          y: {
            title: {
              display: true,
              text: 'Earnings Quality Spread (RESULT_Spread)',
              font: { size: 12 }
            },
            ticks: {
              callback: function(value) {
                return Number(value).toFixed(3);
              }
            },
            grid: {
              color: 'rgba(0,0,0,0.04)'
            }
          }
        }
      }
    });
  </script>
</body>
</html>
