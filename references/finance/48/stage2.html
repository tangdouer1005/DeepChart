<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Piotroski F-Score (2017–2024)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #f7f8fb;
      --card-bg: #ffffff;
      --axis: #555;
      --grid: #e0e4ef;
      --primary: #3b82f6;
      --primary-dark: #1d4ed8;
      --text-main: #111827;
      --text-muted: #6b7280;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      background: radial-gradient(circle at top left, #eef2ff, #f9fafb);
      color: var(--text-main);
    }

    .container {
      max-width: 960px;
      margin: 40px auto;
      padding: 0 16px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 14px;
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.08);
      padding: 22px 22px 26px;
      border: 1px solid rgba(148, 163, 184, 0.25);
    }

    h1 {
      margin: 0 0 4px;
      font-size: 1.4rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .subtitle {
      margin: 0 0 14px;
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 999px;
      background: #eef2ff;
      color: #3730a3;
      font-weight: 500;
    }

    .pill span.dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: #4f46e5;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
      justify-content: flex-start;
      margin: 4px 0 8px;
      font-size: 0.82rem;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
    }

    .legend-color {
      width: 14px;
      height: 14px;
      border-radius: 4px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    }

    .chart-wrapper {
      position: relative;
      margin-top: 10px;
      height: 420px; /* explicit height so the chart area is non-zero */
    }

    canvas {
      width: 100% !important;
      height: 100% !important;
    }

    .note {
      margin-top: 10px;
      font-size: 0.78rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .note strong {
      color: var(--text-main);
      font-weight: 600;
    }

    @media (max-width: 640px) {
      .card {
        padding: 16px 14px 20px;
      }
      h1 {
        font-size: 1.2rem;
      }
      .chart-wrapper {
        height: 320px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Piotroski F-Score (2017–2024)</h1>
      <p class="subtitle">
        Annual Piotroski F-Score for cost from fiscal year 2017 through 2024.
      </p>

      <div class="meta-row">
        <div class="pill">
          <span class="dot"></span>
          Fundamental Quality Metric
        </div>
        <span>Score range: 0 (weak) – 9 (strong)</span>
      </div>

      <div class="legend">
        <div class="legend-item">
          <span class="legend-color"></span>
          <span>Piotroski F-Score</span>
        </div>
      </div>

      <div class="chart-wrapper">
        <canvas id="piotroskiChart"></canvas>
      </div>

      <p class="note">
        <strong>Data source:</strong> Provided dataset. Values reflect the
        reported Piotroski F-Score for each fiscal year from 2017 to 2024.
      </p>
    </div>
  </div>

  <!-- Chart.js (latest stable 4.x) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    // Ensure chart renders after layout is complete
    window.addEventListener("load", function () {
      const fiscalYears = ["2017", "2018", "2019", "2020", "2021", "2022", "2023", "2024"];
      const fScores = [7, 6, 5, 5, 6, 7, 7, 6];

      const canvas = document.getElementById("piotroskiChart");
      const ctx = canvas.getContext("2d");

      const minScore = Math.min(...fScores);
      const maxScore = Math.max(...fScores);
      const yMin = Math.max(0, minScore - 1);
      const yMax = Math.min(9, maxScore + 1);

      new Chart(ctx, {
        type: "bar",
        data: {
          labels: fiscalYears,
          datasets: [
            {
              label: "Piotroski F-Score",
              data: fScores,
              backgroundColor: "rgba(59, 130, 246, 0.85)",
              borderColor: "#1d4ed8",
              borderWidth: 1.4,
              borderRadius: 6,
              hoverBackgroundColor: "rgba(29, 78, 216, 0.95)",
              hoverBorderColor: "#1d4ed8",
              barPercentage: 0.6,
              categoryPercentage: 0.7
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: {
            mode: "nearest",
            axis: "x",
            intersect: false
          },
          plugins: {
            legend: {
              display: false
            },
            tooltip: {
              backgroundColor: "rgba(15,23,42,0.93)",
              titleColor: "#e5e7eb",
              bodyColor: "#f9fafb",
              borderColor: "rgba(148,163,184,0.6)",
              borderWidth: 1,
              padding: 10,
              displayColors: false,
              callbacks: {
                title: (items) => `Fiscal Year: ${items[0].label}`,
                label: (item) => `Piotroski F-Score: ${item.formattedValue}`
              }
            },
            title: {
              display: false
            }
          },
          scales: {
            x: {
              grid: {
                display: false
              },
              ticks: {
                color: "#4b5563",
                font: {
                  size: 11
                }
              }
            },
            y: {
              beginAtZero: false,
              min: yMin,
              max: yMax,
              ticks: {
                color: "#4b5563",
                precision: 0,
                stepSize: 1,
                font: {
                  size: 11
                }
              },
              grid: {
                color: "rgba(148, 163, 184, 0.25)"
              },
              title: {
                display: true,
                text: "Piotroski F-Score",
                color: "#4b5563",
                font: {
                  size: 11,
                  weight: "500"
                }
              }
            }
          },
          animation: {
            duration: 900,
            easing: "easeOutQuart"
          }
        }
      });
    });
  </script>
</body>
</html>
