<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>ABT 净资产收益率-杜邦分析 (ROE) 2016-2024</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #fafafa;
      color: #333;
    }
    h1 {
      font-size: 20px;
      margin-bottom: 4px;
    }
    h2 {
      font-size: 14px;
      font-weight: 400;
      color: #666;
      margin-top: 0;
      margin-bottom: 18px;
    }
    #chart-container {
      max-width: 960px;
      margin: 0 auto;
      background: #fff;
      border-radius: 8px;
      padding: 18px 18px 26px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    canvas {
      max-width: 100%;
    }
    .note {
      font-size: 12px;
      color: #777;
      margin-top: 10px;
      line-height: 1.5;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 8px;
      font-size: 12px;
      color: #555;
    }
    .controls label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .controls input[type="checkbox"] {
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="chart-container">
    <h1>ABT 净资产收益率-杜邦分析 (ROE)</h1>
    <h2>2016 - 2024 年度变化（柱状图）</h2>

    <div class="controls">
      <label>
        <input type="checkbox" id="toggleLine" checked />
        显示趋势线
      </label>
      <span>| 提示：悬停查看具体数值（%）</span>
    </div>

    <canvas id="roeChart"></canvas>
    <div class="note">
      数据来源：用户提供（单位：百分比）。<br>
      数值为 Original ROE(Avg)，已从小数转换为百分比显示。
    </div>
  </div>

  <!-- Chart.js (latest stable 4.x) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    // Source data (as provided)
    const years = [2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024];
    const roeRaw = [
      0.0670674746700519,
      0.0185476815398075,
      0.0771071783266309,
      0.1196844770499253,
      0.140750250501002,
      0.2061936838421835,
      0.1912868336828164,
      0.1520275206205421,
      0.3107097731461625
    ];

    // Convert to percentage for display
    const roePercent = roeRaw.map(v => v * 100);

    const ctx = document.getElementById('roeChart').getContext('2d');

    const barColor = 'rgba(54, 162, 235, 0.75)';
    const barBorderColor = 'rgba(54, 162, 235, 1)';
    const lineColor = 'rgba(255, 99, 132, 0.9)';

    const roeChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: years,
        datasets: [
          {
            type: 'bar',
            label: 'ROE（年度，%）',
            data: roePercent,
            backgroundColor: barColor,
            borderColor: barBorderColor,
            borderWidth: 1.2,
            borderRadius: 4,
            maxBarThickness: 48
          },
          {
            type: 'line',
            label: 'ROE 趋势（%）',
            data: roePercent,
            borderColor: lineColor,
            backgroundColor: lineColor,
            borderWidth: 1.6,
            pointRadius: 3,
            pointHoverRadius: 5,
            tension: 0.25,
            fill: false,
            yAxisID: 'y'
          }
        ]
      },
      options: {
        responsive: true,
        interaction: {
          mode: 'nearest',
          intersect: false
        },
        plugins: {
          legend: {
            display: true,
            position: 'top',
            labels: {
              usePointStyle: true,
              boxWidth: 8
            }
          },
          tooltip: {
            callbacks: {
              label: function (context) {
                const value = context.raw;
                return `${context.dataset.label}: ${value.toFixed(2)}%`;
              }
            }
          },
          title: {
            display: false
          }
        },
        scales: {
          x: {
            title: {
              display: true,
              text: '财年',
              color: '#555',
              font: { size: 12 }
            },
            grid: {
              display: false
            }
          },
          y: {
            title: {
              display: true,
              text: '净资产收益率 ROE（%）',
              color: '#555',
              font: { size: 12 }
            },
            ticks: {
              callback: function(value) {
                return value + '%';
              }
            },
            beginAtZero: true,
            grid: {
              color: 'rgba(0,0,0,0.05)'
            }
          }
        }
      }
    });

    // Toggle line trend visibility
    const toggleLineCheckbox = document.getElementById('toggleLine');
    toggleLineCheckbox.addEventListener('change', function () {
      const lineDataset = roeChart.data.datasets[1]; // second dataset
      lineDataset.hidden = !this.checked;
      roeChart.update();
    });
  </script>
</body>
</html>
