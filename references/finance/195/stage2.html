<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>NVDA 格雷厄姆“烟蒂股”净值 (NNWC) 2016-2024</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      color-scheme: light dark;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f7;
      color: #222;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 24px;
    }
    .chart-container {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.06);
      padding: 18px 22px 22px;
      max-width: 900px;
      width: 100%;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 4px;
      font-weight: 600;
    }
    .subtitle {
      font-size: 13px;
      color: #666;
      margin-bottom: 10px;
    }
    canvas {
      max-height: 520px;
    }
    .note {
      margin-top: 8px;
      font-size: 11px;
      color: #777;
    }
  </style>
</head>
<body>
  <div class="chart-container">
    <h1>NVDA 格雷厄姆“烟蒂股”净值 (NNWC) 变化</h1>
    <div class="subtitle">单位：每股 NNWC（美元），财年 2016 — 2024</div>
    <canvas id="nvdaNnwcChart"></canvas>
    <div class="note">
      数据来源：用户提供的每股 NNWC（Graham's Net-Net Working Capital, NNWC）。<br />
      鼠标悬停查看具体数值，可使用图表右上角的缩放/重置工具进行交互。
    </div>
  </div>

  <script>
    // Source data (as provided)
    const years = [2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024];
    const nnwcPerShare = [
      0.1384885764499121,
      0.1716872110939907,
      0.2169699367088607,
      0.26428,
      0.347046925566343,
      0.1654856687898089,
      0.4439447731755424,
      0.159234144395692,
      0.865878107457899
    ];

    // Create a gentle gradient for the line area
    function createGradient(ctx, area) {
      const gradient = ctx.createLinearGradient(0, area.bottom, 0, area.top);
      gradient.addColorStop(0, "rgba(37, 99, 235, 0)");
      gradient.addColorStop(0.5, "rgba(37, 99, 235, 0.12)");
      gradient.addColorStop(1, "rgba(37, 99, 235, 0.28)");
      return gradient;
    }

    const ctx = document.getElementById("nvdaNnwcChart").getContext("2d");

    // Register zoom plugin (built-in from chartjs-plugin-zoom if needed)
    // Using Chart.js v4 core without extra plugins for simplicity/cleanliness

    let gradientFill = null;

    const chart = new Chart(ctx, {
      type: "line",
      data: {
        labels: years,
        datasets: [
          {
            label: "NNWC 每股净值",
            data: nnwcPerShare,
            tension: 0.25,
            borderColor: "#2563eb",
            borderWidth: 2.2,
            pointRadius: 4,
            pointHoverRadius: 5,
            pointBackgroundColor: "#2563eb",
            pointBorderWidth: 1.5,
            fill: true,
            backgroundColor: function (context) {
              const chart = context.chart;
              const { ctx, chartArea } = chart;
              if (!chartArea) {
                return null;
              }
              if (!gradientFill) {
                gradientFill = createGradient(ctx, chartArea);
              }
              return gradientFill;
            }
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: {
          mode: "index",
          intersect: false
        },
        plugins: {
          legend: {
            display: true,
            labels: {
              boxWidth: 14,
              boxHeight: 14,
              usePointStyle: true,
              pointStyle: "circle",
              font: {
                size: 12
              }
            }
          },
          tooltip: {
            callbacks: {
              label: function (context) {
                const value = context.parsed.y;
                return " NNWC 每股净值: " + value.toFixed(4);
              },
              title: function (items) {
                if (!items.length) return "";
                return "财年 " + items[0].label;
              }
            }
          },
          title: {
            display: false
          }
        },
        scales: {
          x: {
            title: {
              display: true,
              text: "财年",
              font: { size: 12 }
            },
            grid: {
              display: false
            },
            ticks: {
              autoSkip: false,
              maxRotation: 0,
              font: {
                size: 11
              }
            }
          },
          y: {
            title: {
              display: true,
              text: "NNWC 每股净值 (美元)",
              font: { size: 12 }
            },
            beginAtZero: true,
            ticks: {
              font: {
                size: 11
              },
              callback: function (value) {
                return value.toFixed(2);
              }
            },
            grid: {
              color: "rgba(148, 163, 184, 0.25)"
            }
          }
        }
      }
    });
  </script>
</body>
</html>
