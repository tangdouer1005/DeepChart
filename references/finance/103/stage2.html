<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>hd 防御区间比率（DIR） 2016-2024</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 20px;
      background: #f7f7f7;
      color: #222;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #fff;
      padding: 20px 24px 28px;
      border-radius: 8px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.06);
    }
    h1 {
      font-size: 22px;
      margin: 0 0 4px;
    }
    h2 {
      font-size: 14px;
      font-weight: 500;
      margin: 0 0 16px;
      color: #666;
    }
    .chart-wrapper {
      position: relative;
      height: 420px;
    }
    .note {
      margin-top: 10px;
      font-size: 12px;
      color: #777;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>hd 防御区间比率（DIR）变化</h1>
    <h2>2016–2024 财年</h2>
    <div class="chart-wrapper">
      <canvas id="dirChart"></canvas>
    </div>
    <div class="note">
      数据来源：用户提供 | 指标：防御区间比率（RESULT_DIR，单位：百分比）。
    </div>
  </div>

  <script>
    // Data from source
    const fiscalYears = [
      "2016","2017","2018","2019","2020","2021","2022","2023","2024"
    ];
    const dirValues = [
      19.528177731448302,
      20.537095899862013,
      23.481611634946592,
      14.62788514454048,
      16.39332711745884,
      34.908944760699974,
      16.43564085952684,
      16.623751537146454,
      19.75202320965033
    ];

    const ctx = document.getElementById("dirChart").getContext("2d");

    const dirChart = new Chart(ctx, {
      type: "bar",
      data: {
        labels: fiscalYears,
        datasets: [{
          label: "防御区间比率（DIR）",
          data: dirValues,
          backgroundColor: "rgba(54, 162, 235, 0.7)",
          borderColor: "rgba(54, 162, 235, 1)",
          borderWidth: 1.2,
          borderRadius: 5,
          hoverBackgroundColor: "rgba(54, 162, 235, 0.9)"
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          title: {
            display: false
          },
          legend: {
            display: true,
            labels: {
              boxWidth: 14,
              usePointStyle: true
            }
          },
          tooltip: {
            enabled: true,
            callbacks: {
              label: function(context) {
                const value = context.parsed.y;
                return " DIR: " + value.toFixed(2) + " %";
              }
            }
          }
        },
        scales: {
          x: {
            title: {
              display: true,
              text: "财年",
              color: "#444",
              font: {
                size: 12
              }
            },
            grid: {
              display: false
            }
          },
          y: {
            title: {
              display: true,
              text: "防御区间比率（%）",
              color: "#444",
              font: {
                size: 12
              }
            },
            beginAtZero: true,
            ticks: {
              callback: function(value) {
                return value + " %";
              }
            },
            grid: {
              color: "rgba(0,0,0,0.06)"
            }
          }
        },
        interaction: {
          mode: "index",
          intersect: false
        },
        animation: {
          duration: 800,
          easing: "easeOutQuart"
        },
        hover: {
          mode: "index",
          intersect: false
        }
      }
    });
  </script>
</body>
</html>
