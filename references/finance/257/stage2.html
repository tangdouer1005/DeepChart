<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>UNH Altman Z-Score (2016–2024)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Chart.js (latest stable) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 20px;
      background: #f7f7f9;
      color: #222;
    }
    .chart-container {
      max-width: 900px;
      margin: 0 auto;
      background: #ffffff;
      padding: 20px 24px 28px;
      border-radius: 10px;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.08);
    }
    h1 {
      font-size: 1.35rem;
      margin: 0 0 4px;
      text-align: center;
    }
    h2 {
      font-size: 0.95rem;
      font-weight: 500;
      margin: 0 0 16px;
      text-align: center;
      color: #555;
    }
    .note {
      font-size: 0.8rem;
      color: #666;
      margin-top: 8px;
      text-align: center;
    }
    canvas {
      max-width: 100%;
    }
  </style>
</head>
<body>
  <div class="chart-container">
    <h1>UNH Altman Z-Score (奥特曼破产预测模型)</h1>
    <h2>Fiscal Years 2016–2024</h2>
    <canvas id="zScoreChart" aria-label="UNH Altman Z-Score Bar Chart" role="img"></canvas>
    <div class="note">
      Data source: Provided UNH Altman Z-Score (RESULT_Z_Score) for fiscal years 2016–2024.
    </div>
  </div>

  <script>
    // Data from source
    const years = [
      "2016",
      "2017",
      "2018",
      "2019",
      "2020",
      "2021",
      "2022",
      "2023",
      "2024"
    ];

    const zScores = [
      2.450407951287792,
      2.526210230381817,
      2.5846097398187524,
      2.435981156259353,
      2.3661276538149165,
      2.460636608490952,
      2.3864456293521985,
      2.451907578358015,
      2.361650767878764
    ];

    const ctx = document.getElementById("zScoreChart").getContext("2d");

    // Compute min/max for a slightly padded y-axis
    const minVal = Math.min(...zScores);
    const maxVal = Math.max(...zScores);
    const padding = 0.1;
    const yMin = Math.floor((minVal - padding) * 10) / 10;
    const yMax = Math.ceil((maxVal + padding) * 10) / 10;

    const chart = new Chart(ctx, {
      type: "bar",
      data: {
        labels: years,
        datasets: [
          {
            label: "Altman Z-Score",
            data: zScores,
            backgroundColor: "#4f46e5",
            hoverBackgroundColor: "#4338ca",
            borderRadius: 6,
            borderSkipped: false
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        layout: {
          padding: {
            top: 10,
            right: 12,
            bottom: 4,
            left: 8
          }
        },
        plugins: {
          legend: {
            display: true,
            labels: {
              boxWidth: 14,
              boxHeight: 14,
              usePointStyle: true
            }
          },
          tooltip: {
            enabled: true,
            backgroundColor: "rgba(15, 23, 42, 0.95)",
            titleFont: { size: 13, weight: "600" },
            bodyFont: { size: 12 },
            padding: 10,
            callbacks: {
              label: function (context) {
                const value = context.raw;
                return " Altman Z-Score: " + value.toFixed(3);
              }
            }
          },
          title: {
            display: false
          }
        },
        scales: {
          x: {
            grid: {
              display: false
            },
            ticks: {
              font: { size: 11 }
            }
          },
          y: {
            beginAtZero: false,
            min: yMin,
            max: yMax,
            grid: {
              color: "rgba(148, 163, 184, 0.3)"
            },
            ticks: {
              font: { size: 11 },
              callback: function (value) {
                return value.toFixed(1);
              }
            },
            title: {
              display: true,
              text: "Altman Z-Score",
              font: { size: 12, weight: "600" }
            }
          }
        },
        interaction: {
          mode: "nearest",
          axis: "x",
          intersect: true
        },
        animation: {
          duration: 800,
          easing: "easeOutQuart"
        }
      }
    });

    // Make the container height responsive
    function resizeCanvas() {
      const container = document.querySelector(".chart-container");
      const canvas = document.getElementById("zScoreChart");
      // Maintain a ~2:1 width/height ratio within the container
      canvas.parentElement.style.height = Math.max(container.offsetWidth * 0.45, 260) + "px";
    }

    window.addEventListener("load", resizeCanvas);
    window.addEventListener("resize", resizeCanvas);
  </script>
</body>
</html>
