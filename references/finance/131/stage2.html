<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>lly 内部增长率 (IGR) 2016–2024 - Bar Chart</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Chart.js (latest stable) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 24px;
      background-color: #f7f7f9;
      color: #222;
    }
    .chart-wrapper {
      max-width: 900px;
      margin: 0 auto;
    }
    .chart-container {
      position: relative;          /* Required for Chart.js height control */
      width: 100%;
      height: 420px;               /* Fixed, reasonable height to avoid stretching */
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      padding: 20px 24px 28px;
      box-sizing: border-box;
    }
    h1 {
      font-size: 22px;
      margin: 0 0 4px;
    }
    h2 {
      font-size: 15px;
      font-weight: 500;
      margin: 0 0 16px;
      color: #666;
    }
    canvas {
      max-width: 100%;
      max-height: 100%;
    }
    .note {
      font-size: 12px;
      color: #666;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="chart-wrapper">
    <h1>lly 内部增长率 (IGR)</h1>
    <h2>2016–2024 财年变化（柱状图）</h2>
    <div class="chart-container">
      <canvas id="igrChart" aria-label="Internal Growth Rate by Fiscal Year" role="img"></canvas>
    </div>
    <div class="note">
      数据来源：用户提供的 RESULT_IGR（内部增长率），单位为小数形式（0.10 = 10%）。
    </div>
  </div>

  <script>
    // Source data (accurately copied)
    const fiscalYears = [
      "2016","2017","2018","2019","2020","2021","2022","2023","2024"
    ];
    const igrValues = [
      0.0158188170442222,
      -0.0541029337554033,
      0.0211421153603143,
      0.165559638708665,
      0.0888804400172356,
      0.0551668172114101,
      0.0583347150772305,
      0.0210716852939932,
      0.0902904462880628
    ];

    // Convert to percentage for display (e.g., 0.10 => 10)
    const igrPercentValues = igrValues.map(v => v * 100);

    // Colors: negative red, positive blue
    const barColors = igrPercentValues.map(v => v < 0 ? "#e74c3c" : "#3498db");

    const ctx = document.getElementById("igrChart").getContext("2d");

    new Chart(ctx, {
      type: "bar",
      data: {
        labels: fiscalYears,
        datasets: [{
          label: "内部增长率 (IGR)",
          data: igrPercentValues,
          backgroundColor: barColors,
          borderColor: barColors,
          borderWidth: 1,
          borderRadius: 4,
          hoverBorderWidth: 1.5
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false, // Let the parent div control height to avoid stretching
        plugins: {
          legend: {
            display: true,
            labels: {
              boxWidth: 16,
              boxHeight: 16,
              usePointStyle: true
            }
          },
          tooltip: {
            mode: "index",
            intersect: false,
            callbacks: {
              label: function(context) {
                const value = context.raw;
                return " IGR: " + value.toFixed(2) + "%";
              }
            }
          }
        },
        scales: {
          x: {
            title: {
              display: true,
              text: "Fiscal Year (财年)",
              color: "#444",
              font: {
                size: 12
              }
            },
            grid: {
              display: false
            }
          },
          y: {
            title: {
              display: true,
              text: "内部增长率 (%, 百分比)",
              color: "#444",
              font: {
                size: 12
              }
            },
            ticks: {
              callback: function(value) {
                return value + "%";
              }
            },
            // Set a focused range around the data to avoid huge whitespace
            suggestedMin: -10,  // -10%
            suggestedMax: 20,   // 20%
            grid: {
              color: "rgba(0,0,0,0.05)"
            }
          }
        },
        interaction: {
          mode: "nearest",
          axis: "x",
          intersect: false
        },
        animation: {
          duration: 800,
          easing: "easeOutCubic"
        }
      }
    });
  </script>
</body>
</html>
