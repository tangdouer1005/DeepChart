<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>acn 格雷厄姆“烟蒂股”净值 (NNWC) 2016–2024 柱状图</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 20px;
      background-color: #ffffff;
      color: #333;
    }
    h1 {
      font-size: 20px;
      margin-bottom: 6px;
    }
    h2 {
      font-size: 14px;
      font-weight: 400;
      color: #555;
      margin-top: 0;
      margin-bottom: 20px;
    }
    #chartContainer {
      max-width: 900px;
      margin: 0 auto;
      height: 480px; /* 固定高度，避免高度为 0 */
    }
    canvas {
      width: 100% !important;
      height: 100% !important;
    }
    .chart-legend {
      font-size: 12px;
      color: #666;
      margin-top: 8px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="chartContainer">
    <h1>acn 格雷厄姆“烟蒂股”净值 (NNWC) 每股变动</h1>
    <h2>2016–2024 财年（单位：NNWC 每股值）</h2>
    <canvas id="nnwcChart"></canvas>
    <div class="chart-legend">
      提示：将鼠标悬停在柱状上可查看精确数值。
    </div>
  </div>

  <!-- 使用明确版本号的 Chart.js 4 稳定版（无完整性校验） -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <script>
    // 将所有代码包在 try/catch 里，便于在控制台看到错误（如果有）
    try {
      // 源数据（与提供数据完全一致）
      const fiscalYears = [
        "2016","2017","2018","2019","2020","2021","2022","2023","2024"
      ];

      const nnwcPerShare = [
        -0.6640097908880562,
        -1.336033504860067,
        -0.2120201682857437,
        0.7511663173893193,
        -2.8244403594438983,
        -5.282815037600914,
        -4.519685616362578,
        -2.199811217064272,
        -9.28756486460987
      ];

      // 计算合理的 Y 轴范围
      const minValue = Math.min(...nnwcPerShare);
      const maxValue = Math.max(...nnwcPerShare);
      const padding = (maxValue - minValue) * 0.1 || 0.5;
      const suggestedMin = minValue - padding;
      const suggestedMax = maxValue + padding;

      const canvas = document.getElementById("nnwcChart");
      if (!canvas) {
        console.error("未找到 id 为 nnwcChart 的 canvas 元素。");
      } else {
        const ctx = canvas.getContext("2d");

        // 创建柱状图
        new Chart(ctx, {
          type: "bar",
          data: {
            labels: fiscalYears,
            datasets: [
              {
                label: "NNWC 每股值",
                data: nnwcPerShare,
                backgroundColor: nnwcPerShare.map(v =>
                  v >= 0 ? "rgba(46, 125, 50, 0.7)" : "rgba(229, 57, 53, 0.7)"
                ),
                borderColor: nnwcPerShare.map(v =>
                  v >= 0 ? "rgba(27, 94, 32, 1)" : "rgba(183, 28, 28, 1)"
                ),
                borderWidth: 1.2,
                hoverBackgroundColor: nnwcPerShare.map(v =>
                  v >= 0 ? "rgba(46, 125, 50, 0.9)" : "rgba(229, 57, 53, 0.9)"
                ),
                hoverBorderWidth: 1.5
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              title: {
                display: false
              },
              tooltip: {
                enabled: true,
                callbacks: {
                  label: function (context) {
                    const value = context.parsed.y;
                    return " NNWC 每股值: " + value.toFixed(4);
                  }
                }
              },
              legend: {
                display: true,
                labels: {
                  usePointStyle: true,
                  boxWidth: 8
                }
              }
            },
            scales: {
              x: {
                title: {
                  display: true,
                  text: "财年",
                  color: "#555",
                  font: {
                    size: 12
                  }
                },
                grid: {
                  display: false
                }
              },
              y: {
                title: {
                  display: true,
                  text: "NNWC 每股值",
                  color: "#555",
                  font: {
                    size: 12
                  }
                },
                ticks: {
                  callback: function (value) {
                    // value 可能是 number 或 string，统一转换
                    const num = Number(value);
                    return isNaN(num) ? value : num.toFixed(1);
                  }
                },
                suggestedMin: suggestedMin,
                suggestedMax: suggestedMax,
                grid: {
                  color: "rgba(0,0,0,0.06)"
                }
              }
            },
            interaction: {
              mode: "nearest",
              axis: "x",
              intersect: false
            },
            animation: {
              duration: 700,
              easing: "easeOutQuart"
            }
          }
        });
      }
    } catch (e) {
      console.error("图表渲染出错：", e);
    }
  </script>
</body>
</html>
