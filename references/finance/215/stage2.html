<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PG 盈余-现金质量剪刀差 (2016–2024)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Chart.js (latest stable 4.x) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      color-scheme: light dark;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f6f7fb;
      color: #222;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 24px;
      box-sizing: border-box;
    }
    .chart-container {
      max-width: 900px;
      width: 100%;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.12);
      padding: 24px 28px 28px;
      box-sizing: border-box;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 4px;
      font-weight: 600;
      color: #111827;
    }
    .subtitle {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 18px;
    }
    canvas {
      max-height: 480px;
    }
    @media (max-width: 600px) {
      .chart-container {
        padding: 16px;
      }
      h1 {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="chart-container">
    <h1>PG 盈余-现金质量剪刀差 (Earnings Quality Spread)</h1>
    <div class="subtitle">年度变化（2016–2024）</div>
    <canvas id="spreadChart"></canvas>
  </div>

  <script>
    // Data extracted from the source
    const years = [
      "2016",
      "2017",
      "2018",
      "2019",
      "2020",
      "2021",
      "2022",
      "2023",
      "2024",
    ];

    // RESULTS_Spread values
    const spreads = [
      0.0383975435547537,
      -0.0207883914648827,
      0.0428710266592938,
      0.0972129988646344,
      0.0371169872134693,
      0.033874012007983,
      0.0167515802380398,
      0.0184425110381999,
      0.0408472074309516,
    ];

    // Configure Chart.js defaults for a clean design
    Chart.defaults.font.family =
      'system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
    Chart.defaults.plugins.legend.position = "top";
    Chart.defaults.plugins.legend.labels.usePointStyle = true;
    Chart.defaults.plugins.tooltip.mode = "index";
    Chart.defaults.plugins.tooltip.intersect = false;

    const ctx = document.getElementById("spreadChart").getContext("2d");

    // Define gradient colors for positive and negative bars
    const gradientPositive = ctx.createLinearGradient(0, 0, 0, 400);
    gradientPositive.addColorStop(0, "rgba(37, 99, 235, 0.95)");
    gradientPositive.addColorStop(1, "rgba(59, 130, 246, 0.35)");

    const gradientNegative = ctx.createLinearGradient(0, 0, 0, 400);
    gradientNegative.addColorStop(0, "rgba(220, 38, 38, 0.95)");
    gradientNegative.addColorStop(1, "rgba(248, 113, 113, 0.35)");

    // Create arrays to hold per-bar colors based on positive / negative
    const backgroundColors = spreads.map((v) =>
      v >= 0 ? gradientPositive : gradientNegative
    );
    const borderColors = spreads.map((v) =>
      v >= 0 ? "rgba(37, 99, 235, 1)" : "rgba(220, 38, 38, 1)"
    );

    const spreadChart = new Chart(ctx, {
      type: "bar",
      data: {
        labels: years,
        datasets: [
          {
            label: "盈余-现金质量剪刀差",
            data: spreads,
            backgroundColor: backgroundColors,
            borderColor: borderColors,
            borderWidth: 1.2,
            borderRadius: 4,
            hoverBorderWidth: 1.6,
          },
        ],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: {
          mode: "index",
          intersect: false,
        },
        plugins: {
          legend: {
            display: true,
          },
          tooltip: {
            callbacks: {
              label: function (context) {
                const value = context.parsed.y;
                if (value === null || value === undefined) return "";
                // Show as percentage with two decimals
                const pct = (value * 100).toFixed(2) + "%";
                return " " + pct;
              },
            },
          },
          title: {
            display: false,
          },
        },
        scales: {
          x: {
            grid: {
              display: false,
            },
            ticks: {
              maxRotation: 0,
              minRotation: 0,
            },
          },
          y: {
            beginAtZero: true,
            grid: {
              color: "rgba(148, 163, 184, 0.25)",
            },
            ticks: {
              callback: function (value) {
                return (value * 100).toFixed(0) + "%";
              },
            },
            title: {
              display: true,
              text: "剪刀差（%）",
              color: "#4b5563",
            },
          },
        },
        animation: {
          duration: 900,
          easing: "easeOutQuart",
        },
      },
    });
  </script>
</body>
</html>
