<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ACN 防御区间比率 (DIR) 2016–2024</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Chart.js latest stable -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --fg: #1f2933;
      --grid: rgba(148, 163, 184, 0.3);
      --accent: #2563eb;
      --accent-soft: rgba(37, 99, 235, 0.12);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #020617;
        --fg: #e5e7eb;
        --grid: rgba(148, 163, 184, 0.25);
        --accent: #60a5fa;
        --accent-soft: rgba(96, 165, 250, 0.12);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      background: radial-gradient(circle at top, #0f172a 0, #020617 45%, #000 100%);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .chart-wrapper {
      width: 100%;
      max-width: 960px;
      background: rgba(15, 23, 42, 0.9);
      border-radius: 16px;
      box-shadow:
        0 24px 60px rgba(15, 23, 42, 0.85),
        0 0 0 1px rgba(148, 163, 184, 0.3);
      padding: 20px 22px 18px;
      backdrop-filter: blur(16px);
      border: 1px solid rgba(148, 163, 184, 0.5);
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-end;
      gap: 12px;
      padding: 2px 2px 12px;
      border-bottom: 1px solid rgba(51, 65, 85, 0.9);
      margin-bottom: 14px;
    }

    .title-block {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    h1 {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #e5e7eb;
    }

    .subtitle {
      font-size: 0.78rem;
      color: #9ca3af;
    }

    .meta {
      font-size: 0.72rem;
      color: #9ca3af;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .badge {
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.55);
      padding: 2px 8px;
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #cbd5f5;
    }

    .chart-container {
      position: relative;
      width: 100%;
      height: 420px;
    }

    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 10px;
      margin-top: 10px;
      border-top: 1px solid rgba(51, 65, 85, 0.9);
      font-size: 0.72rem;
      color: #9ca3af;
      gap: 8px;
      flex-wrap: wrap;
    }

    footer span strong {
      font-weight: 600;
      color: #e5e7eb;
    }

    .hint {
      opacity: 0.9;
    }

    @media (max-width: 640px) {
      .chart-wrapper {
        padding: 16px 12px 14px;
      }
      header {
        margin-bottom: 10px;
      }
      .chart-container {
        height: 340px;
      }
    }
  </style>
</head>
<body>
  <div class="chart-wrapper">
    <header>
      <div class="title-block">
        <h1>ACN 防御区间比率 (DIR) 变化趋势</h1>
        <div class="subtitle">2016 – 2024 财年 | 单位：天</div>
        <div class="meta">
          <span>数据来源：用户提供财报数据</span>
        </div>
      </div>
      <div class="badge">Line Chart</div>
    </header>

    <div class="chart-container">
      <canvas id="dirChart"></canvas>
    </div>

    <footer>
      <span><strong>交互说明：</strong>将鼠标悬停在折线上可查看每个年份的精确 DIR 数值；可在图例中点击系列名称隐藏/显示数据线。</span>
      <span class="hint">设计原则：干净、易读、突出趋势变化与关键拐点。</span>
    </footer>
  </div>

  <script>
    window.addEventListener("load", function () {
      // Source data
      const years = [
        "2016",
        "2017",
        "2018",
        "2019",
        "2020",
        "2021",
        "2022",
        "2023",
        "2024"
      ];

      const dirValues = [
        135.44848311360414,
        129.71972754686485,
        130.60929843500645,
        140.63968677921685,
        156.97376630688674,
        152.223205659228,
        137.44413573299573,
        140.39962004168538,
        123.22286277565402
      ];

      const ctx = document.getElementById("dirChart").getContext("2d");

      // Safe fallback colors (avoid runtime errors from getComputedStyle)
      let accent = "#2563eb";
      let accentSoft = "rgba(37, 99, 235, 0.12)";
      let gridColor = "rgba(148, 163, 184, 0.3)";

      try {
        const styles = getComputedStyle(document.documentElement);
        accent = styles.getPropertyValue("--accent").trim() || accent;
        accentSoft = styles.getPropertyValue("--accent-soft").trim() || accentSoft;
        gridColor = styles.getPropertyValue("--grid").trim() || gridColor;
      } catch (e) {
        // If getComputedStyle is not available, just use defaults
      }

      // Compute y-axis min/max padding
      const minVal = Math.min(...dirValues);
      const maxVal = Math.max(...dirValues);
      const padding = (maxVal - minVal) * 0.12 || 5;

      new Chart(ctx, {
        type: "line",
        data: {
          labels: years,
          datasets: [
            {
              label: "防御区间比率 (DIR)",
              data: dirValues,
              borderColor: accent,
              backgroundColor: accentSoft,
              pointBackgroundColor: "#e5e7eb",
              pointBorderColor: "#0f172a",
              pointRadius: 4,
              pointHoverRadius: 6,
              pointHoverBorderWidth: 2,
              tension: 0.26,
              fill: true,
              borderWidth: 2.2
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: {
            mode: "index",
            intersect: false
          },
          plugins: {
            legend: {
              display: true,
              labels: {
                usePointStyle: true,
                pointStyle: "line",
                boxWidth: 32,
                color: "#d1d5db",
                font: {
                  size: 11
                }
              }
            },
            tooltip: {
              enabled: true,
              backgroundColor: "rgba(15, 23, 42, 0.96)",
              borderColor: "rgba(148, 163, 184, 0.8)",
              borderWidth: 1,
              padding: 10,
              displayColors: false,
              callbacks: {
                title: (items) => {
                  const item = items[0];
                  return `${item.label} 财年`;
                },
                label: (item) => {
                  const value = item.raw;
                  return `DIR：${Number(value).toFixed(2)} 天`;
                }
              }
            },
            title: {
              display: false
            }
          },
          scales: {
            x: {
              grid: {
                display: false
              },
              ticks: {
                color: "#cbd5f5",
                font: {
                  size: 11
                }
              }
            },
            y: {
              beginAtZero: false,
              min: minVal - padding,
              max: maxVal + padding,
              grid: {
                color: gridColor,
                drawBorder: false
              },
              ticks: {
                color: "#cbd5f5",
                font: {
                  size: 11
                },
                callback: (value) => `${value.toFixed(0)} 天`
              },
              title: {
                display: true,
                text: "防御区间比率（天）",
                color: "#d1d5db",
                font: {
                  size: 11,
                  weight: "600"
                }
              }
            }
          }
        }
      });
    });
  </script>
</body>
</html>
