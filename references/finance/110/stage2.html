<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>hd 资本再投资率 (Reinvestment Rate) 2016–2024</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 24px;
      background-color: #f7f8fa;
      color: #222;
    }

    h1 {
      font-size: 22px;
      margin: 0 0 4px 0;
    }

    h2 {
      font-size: 14px;
      font-weight: 500;
      color: #555;
      margin: 0 0 18px 0;
    }

    .chart-container {
      max-width: 900px;
      margin: 0 auto;
      background: #fff;
      border-radius: 8px;
      padding: 18px 20px 24px 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    /* Fixed-height wrapper to avoid extreme vertical stretching */
    .chart-wrapper {
      position: relative;
      width: 100%;
      height: 420px; /* Reasonable fixed height for readability */
    }

    .meta {
      font-size: 12px;
      color: #666;
      margin-top: 10px;
      line-height: 1.5;
    }

    .meta span.label {
      font-weight: 600;
      color: #444;
    }

    canvas {
      max-width: 100%;
      max-height: 100%;
    }
  </style>
</head>
<body>
  <div class="chart-container">
    <h1>hd 资本再投资率 (Reinvestment Rate)</h1>
    <h2>2016–2024 年度变化趋势</h2>

    <div class="chart-wrapper">
      <canvas id="reinvestmentChart" aria-label="Reinvestment Rate Line Chart" role="img"></canvas>
    </div>

    <div class="meta">
      <div><span class="label">说明：</span>显示 2016 至 2024 财年 hd 的资本再投资率变化，单位为百分比，包含正、负波动。</div>
      <div><span class="label">数据来源：</span>用户提供的财报数据。</div>
      <div><span class="label">交互：</span>悬停可查看精确数值；可通过图例点击隐藏/显示曲线。</div>
    </div>
  </div>

  <!-- Chart.js (latest stable 4.x) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    // Source data (exactly as provided)
    const fiscalYears = [
      "2016","2017","2018","2019",
      "2020","2021","2022","2023","2024"
    ];

    const reinvestmentRates = [
      0.2060662353527701,
      0.1459094588428817,
      0.1618499344459771,
      0.250060040253807,
      0.2636368217879087,
      -0.0592008798869803,
      0.3006649819004104,
      0.5230220953310802,
      0.0524129765871017
    ];

    function formatPercent(value, decimals = 1) {
      if (value === null || value === undefined || isNaN(value)) return "-";
      return (value * 100).toFixed(decimals) + "%";
    }

    const ctx = document.getElementById("reinvestmentChart").getContext("2d");

    new Chart(ctx, {
      type: "line",
      data: {
        labels: fiscalYears,
        datasets: [
          {
            label: "资本再投资率",
            data: reinvestmentRates,
            borderColor: "#2b7cff",
            backgroundColor: "rgba(43,124,255,0.12)",
            pointBackgroundColor: function(context) {
              const v = context.raw;
              return v < 0 ? "#e53935" : "#2b7cff";
            },
            pointBorderColor: "#ffffff",
            pointRadius: 4,
            pointHoverRadius: 6,
            tension: 0.25,
            borderWidth: 2,
            fill: true
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,       // Use the fixed wrapper height
        interaction: {
          mode: "nearest",
          intersect: false
        },
        plugins: {
          legend: {
            display: true,
            labels: {
              usePointStyle: true,
              padding: 16,
              font: {
                size: 12
              }
            }
          },
          tooltip: {
            usePointStyle: true,
            callbacks: {
              label: function(context) {
                const label = context.dataset.label || "";
                const value = context.raw;
                return `${label}: ${formatPercent(value, 2)}`;
              }
            }
          },
          title: {
            display: false
          }
        },
        scales: {
          x: {
            title: {
              display: true,
              text: "财年",
              font: { size: 12 }
            },
            ticks: {
              font: {
                size: 11
              }
            },
            grid: {
              display: false
            }
          },
          y: {
            title: {
              display: true,
              text: "资本再投资率",
              font: { size: 12 }
            },
            ticks: {
              font: {
                size: 11
              },
              callback: function(value) {
                return formatPercent(value, 0);
              }
            },
            grid: {
              color: "rgba(0,0,0,0.06)"
            },
            // Keep a reasonable visible range, with some padding
            suggestedMin: -0.1,  // -10%
            suggestedMax: 0.6    // 60%
          }
        }
      }
    });
  </script>
</body>
</html>
