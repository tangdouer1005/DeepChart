<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>GE 自由现金流收益质量（Quality of Income Ratio）2016-2024</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f7f7f9;
      color: #222;
    }
    h1 {
      font-size: 20px;
      margin-bottom: 4px;
    }
    h2 {
      font-size: 14px;
      font-weight: 400;
      margin-top: 0;
      margin-bottom: 16px;
      color: #555;
    }
    .chart-container {
      position: relative;
      max-width: 900px;
      margin: 0 auto;
      background: #fff;
      padding: 18px 18px 28px 18px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.08);
    }
    canvas {
      max-height: 480px;
    }
    .note {
      max-width: 900px;
      margin: 10px auto 0;
      font-size: 12px;
      color: #666;
      line-height: 1.5;
    }
    .legend-inline {
      font-size: 12px;
      margin-bottom: 6px;
      color: #444;
    }
    .legend-color {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
      background: #2563eb;
    }
  </style>
</head>
<body>
  <div class="chart-container">
    <h1>GE 自由现金流收益质量（Quality of Income Ratio）</h1>
    <h2>2016–2024 年度变化趋势</h2>
    <div class="legend-inline">
      <span class="legend-color"></span>自由现金流收益质量（QoI Ratio）
    </div>
    <canvas id="qoiChart"></canvas>
  </div>

  <div class="note">
    数据来源：提供的财年自由现金流收益质量（Quality of Income Ratio）数据。<br>
    提示：将鼠标悬停在折线节点上可查看具体年份与数值。
  </div>

  <script>
    const ctx = document.getElementById('qoiChart').getContext('2d');

    const data = {
      labels: [
        '2016', '2017', '2018', '2019',
        '2020', '2021', '2022', '2023', '2024'
      ],
      datasets: [{
        label: '自由现金流收益质量（QoI Ratio）',
        data: [
          0.0545933734939759,
          1.8969609261939215,
          0.3730795173499213,
          1.0092038656235618,
          0.9287374128582494,
          0.9748390871854886,
          1.2428571428571429,
          0.8783921302578019,
          0.5928256765261171
        ],
        borderColor: '#2563eb',
        backgroundColor: 'rgba(37, 99, 235, 0.12)',
        tension: 0.25,
        fill: true,
        pointRadius: 4,
        pointHoverRadius: 6,
        pointBackgroundColor: '#2563eb',
        pointBorderWidth: 1.5,
        pointHitRadius: 10
      }]
    };

    const config = {
      type: 'line',
      data: data,
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: {
          mode: 'nearest',
          axis: 'x',
          intersect: false
        },
        plugins: {
          title: {
            display: false
          },
          legend: {
            display: false
          },
          tooltip: {
            backgroundColor: 'rgba(15,23,42,0.92)',
            titleColor: '#f9fafb',
            bodyColor: '#e5e7eb',
            borderColor: 'rgba(148,163,184,0.6)',
            borderWidth: 1,
            padding: 10,
            callbacks: {
              title: (items) => {
                if (!items.length) return '';
                return '财年：' + items[0].label;
              },
              label: (context) => {
                const v = context.parsed.y;
                return ' QoI Ratio：' + (v != null ? v.toFixed(3) : 'N/A');
              }
            }
          }
        },
        scales: {
          x: {
            title: {
              display: true,
              text: '财年',
              color: '#374151',
              font: {
                size: 12
              }
            },
            grid: {
              display: false
            },
            ticks: {
              color: '#4b5563'
            }
          },
          y: {
            title: {
              display: true,
              text: 'QoI Ratio（倍）',
              color: '#374151',
              font: {
                size: 12
              }
            },
            beginAtZero: true,
            grid: {
              color: 'rgba(209, 213, 219, 0.6)'
            },
            ticks: {
              color: '#4b5563'
            }
          }
        }
      }
    };

    new Chart(ctx, config);
  </script>
</body>
</html>
