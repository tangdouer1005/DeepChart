<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>ma 现金循环周期 (CCC) 2016-2023</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, "Noto Sans", sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f7f7f7;
      color: #222;
    }
    h1 {
      font-size: 20px;
      margin-bottom: 4px;
    }
    h2 {
      font-size: 13px;
      margin-top: 0;
      color: #666;
      font-weight: normal;
    }
    .chart-wrapper {
      max-width: 880px;
      margin: 20px auto;
    }
    .chart-container {
      position: relative;
      padding: 16px;
      height: 420px; /* fixed height ensures proper sizing */
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }
    .note {
      font-size: 12px;
      color: #777;
      margin-top: 8px;
    }
    .error-msg {
      color: #b00020;
      font-size: 13px;
      margin-top: 8px;
      display: none;
    }
  </style>
</head>
<body>
  <h1>ma 现金循环周期 (CCC)</h1>
  <h2>2016–2023 年度变化趋势</h2>

  <div class="chart-wrapper">
    <div class="chart-container">
      <canvas id="cccChart"></canvas>
    </div>
    <div class="note">
      数据来源：提供的财年 CCC 结果。单位：天。2018–2019 年暂无数据。
    </div>
    <div id="errorMsg" class="error-msg"></div>
  </div>

  <!-- Use a very stable Chart.js 3.x UMD build, widely supported -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>

  <script>
    (function () {
      const errorBox = document.getElementById('errorMsg');
      function showError(msg) {
        if (errorBox) {
          errorBox.textContent = '渲染错误：' + msg;
          errorBox.style.display = 'block';
        }
        console.error(msg);
      }

      try {
        if (typeof Chart === 'undefined') {
          showError('Chart.js 未正确加载，请检查网络或 CDN。');
          return;
        }

        const canvas = document.getElementById('cccChart');
        if (!canvas) {
          showError('未找到 canvas 元素 #cccChart。');
          return;
        }

        const ctx = canvas.getContext('2d');
        if (!ctx) {
          showError('无法获取 canvas 渲染上下文。');
          return;
        }

        // Data (exactly as provided)
        const fiscalYears = ["2016", "2017", "2020", "2021", "2022", "2023"];
        const cccValues = [
          233.7934561197168,
          195.70784565519395,
          252.4429362076416,
          195.9389832587073,
          155.14316004984937,
          122.3721804614255
        ];

        new Chart(ctx, {
          type: 'line',
          data: {
            labels: fiscalYears,
            datasets: [{
              label: '现金循环周期 (天)',
              data: cccValues,
              borderColor: '#007bff',
              backgroundColor: 'rgba(0, 123, 255, 0.12)',
              pointBackgroundColor: '#007bff',
              pointBorderColor: '#ffffff',
              pointHoverBackgroundColor: '#ffffff',
              pointHoverBorderColor: '#007bff',
              pointRadius: 4,
              pointHoverRadius: 6,
              tension: 0.25,
              borderWidth: 2
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: {
              mode: 'nearest',
              intersect: false
            },
            plugins: {
              legend: {
                display: true,
                labels: {
                  boxWidth: 16,
                  usePointStyle: true
                }
              },
              tooltip: {
                callbacks: {
                  label: function (context) {
                    const value = context.parsed.y;
                    if (value == null || isNaN(value)) return '';
                    return ' ' + value.toFixed(2) + ' 天';
                  }
                }
              }
            },
            scales: {
              x: {
                title: {
                  display: true,
                  text: '财年'
                },
                grid: {
                  display: false
                }
              },
              y: {
                title: {
                  display: true,
                  text: '现金循环周期 (天)'
                },
                ticks: {
                  callback: function (value) {
                    return value + ' 天';
                  }
                },
                grid: {
                  color: 'rgba(0,0,0,0.05)'
                },
                beginAtZero: false
              }
            }
          }
        });
      } catch (e) {
        showError(e && e.message ? e.message : String(e));
      }
    })();
  </script>
</body>
</html>
