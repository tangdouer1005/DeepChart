<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Meta 自由现金流收益质量 (Quality of Income Ratio) 2016–2024</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Chart.js (latest stable) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: 1.5rem;
      background-color: #f8fafc;
      color: #0f172a;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 12px;
      padding: 1.5rem 1.75rem 1.75rem;
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.08);
      box-sizing: border-box;
    }
    h1 {
      font-size: 1.35rem;
      margin: 0 0 0.35rem;
      font-weight: 600;
      color: #020617;
    }
    .subtitle {
      font-size: 0.85rem;
      color: #64748b;
      margin-bottom: 0.9rem;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1.25rem;
      font-size: 0.78rem;
      color: #64748b;
      margin-bottom: 0.75rem;
    }
    .meta span {
      white-space: nowrap;
    }

    /* Chart wrapper with fixed aspect ratio to prevent extreme stretching */
    .chart-wrapper {
      position: relative;
      width: 100%;
      max-width: 860px;
      /* 16:9 aspect ratio */
      aspect-ratio: 16 / 9;
      margin-top: 0.5rem;
    }

    canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }

    @media (max-width: 600px) {
      body {
        padding: 0.75rem;
      }
      .container {
        padding: 1.1rem 1.1rem 1.35rem;
      }
      h1 {
        font-size: 1.1rem;
      }
      .subtitle {
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Meta 自由现金流收益质量 (Quality of Income Ratio)</h1>
    <div class="subtitle">按财年，2016–2024</div>
    <div class="meta">
      <span><strong>指标：</strong>自由现金流 / 净利润</span>
      <span><strong>交互：</strong>悬停查看数值</span>
    </div>

    <div class="chart-wrapper">
      <canvas id="qoiChart"></canvas>
    </div>
  </div>

  <script>
    const ctx = document.getElementById("qoiChart").getContext("2d");

    const labels = [
      "2016",
      "2017",
      "2018",
      "2019",
      "2020",
      "2021",
      "2022",
      "2023",
      "2024"
    ];

    const dataValues = [
      1.0906628749407543,
      1.042534871706561,
      1.0015738333105242,
      1.2215830726275776,
      0.9801178762046896,
      1.0541483918128656,
      1.3413499867127292,
      1.2446922094061226,
      1.0759914229835763
    ];

    const data = {
      labels,
      datasets: [
        {
          label: "自由现金流收益质量 (QoI Ratio)",
          data: dataValues,
          borderColor: "#2563eb",
          backgroundColor: "rgba(37, 99, 235, 0.08)",
          tension: 0.25,
          borderWidth: 2,
          pointRadius: 3.5,
          pointHoverRadius: 5,
          pointBorderWidth: 1.5,
          pointBackgroundColor: "#ffffff",
          pointBorderColor: "#2563eb",
          fill: false
        }
      ]
    };

    const config = {
      type: "line",
      data,
      options: {
        responsive: true,
        maintainAspectRatio: false, // we control aspect via CSS wrapper
        interaction: {
          mode: "nearest",
          axis: "x",
          intersect: false
        },
        plugins: {
          legend: {
            display: true,
            labels: {
              usePointStyle: true,
              pointStyle: "circle",
              padding: 12,
              font: {
                size: 11
              },
              color: "#0f172a"
            }
          },
          tooltip: {
            enabled: true,
            backgroundColor: "rgba(15,23,42,0.94)",
            titleColor: "#e5e7eb",
            bodyColor: "#e5e7eb",
            borderColor: "rgba(148,163,184,0.5)",
            borderWidth: 1,
            padding: 9,
            displayColors: false,
            callbacks: {
              label: (ctx) => {
                const value = ctx.parsed.y;
                return ` QoI Ratio: ${value.toFixed(3)}`;
              },
              title: (ctx) => `财年 ${ctx[0].label}`
            }
          },
          title: {
            display: false
          }
        },
        scales: {
          x: {
            grid: {
              display: false
            },
            ticks: {
              color: "#6b7280",
              font: {
                size: 11
              }
            }
          },
          y: {
            beginAtZero: false,
            suggestedMin: 0.9,
            suggestedMax: 1.4,
            grid: {
              color: "rgba(148,163,184,0.25)"
            },
            ticks: {
              color: "#6b7280",
              font: {
                size: 11
              },
              callback: (value) =>
                (typeof value === "number" ? value.toFixed(1) : value)
            },
            title: {
              display: true,
              text: "QoI Ratio (倍)",
              color: "#4b5563",
              font: {
                size: 11
              }
            }
          }
        }
      }
    };

    new Chart(ctx, config);
  </script>
</body>
</html>
