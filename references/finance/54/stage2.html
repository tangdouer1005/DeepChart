<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>crm 格雷厄姆“烟蒂股”净值 (NNWC) 2016–2024 变化折线图</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Chart.js (latest 4.x) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      color-scheme: light dark;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
      background: #fafafa;
      color: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .chart-container {
      width: min(960px, 95vw);
      background: #ffffff;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.12);
      padding: 20px 24px 28px;
      box-sizing: border-box;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 4px;
      font-weight: 600;
    }
    .subtitle {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 16px;
    }
    canvas {
      max-height: 520px;
    }
    @media (max-width: 600px) {
      .chart-container {
        padding: 14px 14px 18px;
      }
      h1 {
        font-size: 17px;
      }
      .subtitle {
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="chart-container">
    <h1>crm 格雷厄姆“烟蒂股”净值 (NNWC) 2016–2024 变化</h1>
    <div class="subtitle">
      指标：NNWC 每股（RESULT_NNWC_Per_Share，单位：货币单位/股，负值表示净流动资产为负）<br />
      数据来源：用户提供的财报年度数据
    </div>
    <canvas id="nnwcChart"></canvas>
  </div>

  <script>
    // Data from the user (Fiscal Year, RESULT_NNWC_Per_Share)
    const labels = [
      "2016",
      "2017",
      "2018",
      "2019",
      "2020",
      "2021",
      "2022",
      "2023",
      "2024"
    ];

    const nnwcData = [
      -5.157922578051438,
      -5.8381458890601055,
      -3.167811510513233,
      -5.740645161290322,
      -6.209411764705882,
      -3.138709677419355,
      -14.607802874743326,
      -14.13741223671013,
      -11.283536585365852
    ];

    const ctx = document.getElementById("nnwcChart").getContext("2d");

    const nnwcChart = new Chart(ctx, {
      type: "line",
      data: {
        labels,
        datasets: [
          {
            label: "NNWC 每股",
            data: nnwcData,
            borderColor: "#2563eb",
            backgroundColor: "rgba(37, 99, 235, 0.12)",
            pointBackgroundColor: "#1d4ed8",
            pointRadius: 4,
            pointHoverRadius: 6,
            pointHitRadius: 10,
            borderWidth: 2.2,
            tension: 0.25,
            fill: true
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: {
          mode: "nearest",
          axis: "x",
          intersect: false
        },
        plugins: {
          legend: {
            display: true,
            labels: {
              usePointStyle: true,
              pointStyle: "circle",
              font: {
                size: 12
              }
            }
          },
          tooltip: {
            usePointStyle: true,
            padding: 10,
            callbacks: {
              label: function (context) {
                const value = context.parsed.y;
                // format with 3 decimal places for readability
                return `NNWC 每股: ${value.toFixed(3)}`;
              },
              title: function (items) {
                if (!items.length) return "";
                return `财报年度: ${items[0].label}`;
              }
            }
          },
          title: {
            display: false
          }
        },
        scales: {
          x: {
            title: {
              display: true,
              text: "财报年度 (Fiscal Year)",
              color: "#4b5563",
              font: {
                size: 12
              }
            },
            grid: {
              display: false
            }
          },
          y: {
            title: {
              display: true,
              text: "NNWC 每股（负值代表净流动资产为负）",
              color: "#4b5563",
              font: {
                size: 12
              }
            },
            ticks: {
              callback: function (value) {
                return value.toFixed(1);
              }
            },
            grid: {
              color: "rgba(148, 163, 184, 0.25)"
            }
          }
        }
      }
    });
  </script>
</body>
</html>
