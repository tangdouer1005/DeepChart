<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>MSFT 资本再投资率 (2016–2024)</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 24px;
      background-color: #f7f7fa;
      color: #222;
    }
    h1 {
      margin: 0 0 4px 0;
      font-size: 22px;
      font-weight: 600;
    }
    h2 {
      margin: 0 0 18px 0;
      font-size: 13px;
      font-weight: 400;
      color: #666;
    }
    .chart-card {
      max-width: 900px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.1);
      padding: 20px 22px 22px 22px;
      box-sizing: border-box;
    }
    /* Explicitly fix a clean aspect ratio and prevent extreme stretching */
    .chart-wrapper {
      position: relative;
      width: 100%;
      max-width: 860px;
      height: 420px;          /* Fixed, reasonable height */
      margin: 0 auto;
    }
    canvas {
      width: 100% !important;
      height: 100% !important;  /* Match wrapper height */
      display: block;
    }
    .footer-note {
      max-width: 900px;
      margin: 10px auto 0;
      font-size: 11px;
      color: #777;
    }
  </style>
</head>
<body>
  <div class="chart-card">
    <h1>微软 (MSFT) 资本再投资率</h1>
    <h2>Fiscal Years 2016–2024</h2>
    <div class="chart-wrapper">
      <canvas id="reinvestmentChart"></canvas>
    </div>
  </div>
  <div class="footer-note">
    指标：资本再投资率 (Reinvestment Rate)，单位：倍（&gt;1 表示再投资规模超过当期自由现金流；&lt;0 表示净撤资）。
  </div>

  <!-- Chart.js latest stable -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script>
    // Data from source
    const fiscalYears = [
      "2016",
      "2017",
      "2018",
      "2019",
      "2020",
      "2021",
      "2022",
      "2023",
      "2024"
    ];

    const reinvestmentRates = [
      0.9574127710685708,
      0.7765661815103299,
      1.0720960252633962,
      0.2848499905523554,
      0.3375872989653149,
      0.1732975291233515,
      -0.0316223897133238,
      0.213851845268956,
      0.2112270457863167
    ];

    // Color palette: red for negatives, blue for positives
    const backgroundColors = reinvestmentRates.map(v =>
      v < 0 ? "rgba(220, 38, 38, 0.75)" : "rgba(37, 99, 235, 0.75)"
    );
    const borderColors = reinvestmentRates.map(v =>
      v < 0 ? "rgba(185, 28, 28, 1)" : "rgba(30, 64, 175, 1)"
    );

    const ctx = document.getElementById("reinvestmentChart").getContext("2d");

    new Chart(ctx, {
      type: "bar",
      data: {
        labels: fiscalYears,
        datasets: [
          {
            label: "资本再投资率 (Reinvestment Rate)",
            data: reinvestmentRates,
            backgroundColor: backgroundColors,
            borderColor: borderColors,
            borderWidth: 1.4,
            borderRadius: 6,
            hoverBackgroundColor: backgroundColors.map(c => c.replace("0.75", "0.95")),
            hoverBorderWidth: 2
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,  // Let the wrapper control aspect ratio
        plugins: {
          legend: {
            display: true,
            labels: {
              boxWidth: 16,
              boxHeight: 16,
              padding: 12,
              font: {
                size: 12
              }
            }
          },
          tooltip: {
            enabled: true,
            backgroundColor: "rgba(15, 23, 42, 0.96)",
            titleColor: "#f9fafb",
            bodyColor: "#e5e7eb",
            borderColor: "rgba(148, 163, 184, 0.7)",
            borderWidth: 1,
            padding: 10,
            cornerRadius: 8,
            callbacks: {
              label: function (context) {
                const value = context.raw;
                return "  资本再投资率: " + value.toFixed(3);
              },
              afterLabel: function (context) {
                const value = context.raw;
                if (value > 1) {
                  return "  说明：再投资规模 > 当前自由现金流";
                } else if (value < 0) {
                  return "  说明：净撤资或负向再投资";
                }
                return "";
              }
            }
          },
          title: {
            display: false
          }
        },
        scales: {
          x: {
            grid: {
              display: false
            },
            ticks: {
              font: {
                size: 11
              }
            }
          },
          y: {
            beginAtZero: true,
            grid: {
              color: "rgba(148, 163, 184, 0.25)"
            },
            ticks: {
              font: {
                size: 11
              },
              callback: function(value) {
                return value.toFixed(1);
              }
            },
            title: {
              display: true,
              text: "资本再投资率 (倍)",
              font: {
                size: 12,
                weight: "500"
              },
              color: "#374151"
            }
          }
        },
        interaction: {
          mode: "index",
          intersect: false
        },
        animation: {
          duration: 700,
          easing: "easeOutCubic"
        }
      }
    });
  </script>
</body>
</html>
