<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>UNH 格雷厄姆“烟蒂股”净值 (NNWC) 2016–2024</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Chart.js (latest stable) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      color-scheme: light dark;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 16px;
      background: #f5f5f5;
      color: #222;
    }

    h1 {
      font-size: 20px;
      margin-bottom: 4px;
      text-align: center;
    }

    h2 {
      font-size: 14px;
      font-weight: normal;
      margin-top: 0;
      margin-bottom: 16px;
      text-align: center;
      color: #555;
    }

    .chart-wrapper {
      max-width: 900px;
      margin: 0 auto;
    }

    .chart-container {
      position: relative;
      /* Fixed, reasonable height so the chart is not stretched */
      height: 420px;
      max-width: 100%;
      background: #ffffff;
      padding: 16px 18px 20px;
      border-radius: 10px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.05);
      box-sizing: border-box;
    }

    canvas {
      width: 100% !important;
      height: 100% !important;
    }

    .note {
      max-width: 900px;
      margin: 10px auto 0;
      font-size: 12px;
      color: #666;
      text-align: center;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }
      .chart-container {
        height: 360px;
        padding: 12px 12px 16px;
      }
      h1 {
        font-size: 18px;
      }
      h2 {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <div class="chart-wrapper">
    <h1>UNH 格雷厄姆“烟蒂股”净值 (NNWC) 变动</h1>
    <h2>2016–2024 每股 NNWC（单位：与原始数据相同）</h2>
    <div class="chart-container">
      <canvas id="nnwcChart"></canvas>
    </div>
    <div class="note">
      数据来源：用户提供的财报提取数据。数值均为每股 NNWC，负值表示净流动资产为负。
    </div>
  </div>

  <script>
    const ctx = document.getElementById('nnwcChart').getContext('2d');

    const labels = [
      '2016',
      '2017',
      '2018',
      '2019',
      '2020',
      '2021',
      '2022',
      '2023',
      '2024'
    ];

    const dataValues = [
      -50.12603305785124,
      -50.71167512690355,
      -58.29298067141404,
      -71.5248447204969,
      -75.9958376690947,
      -77.3734309623431,
      -95.04105263157896,
      -102.73347547974414,
      -118.30785791173304
    ];

    const backgroundColors = dataValues.map(v => {
      if (v <= -110) return 'rgba(200, 0, 0, 0.8)';
      if (v <= -90)  return 'rgba(230, 60, 60, 0.8)';
      if (v <= -70)  return 'rgba(245, 130, 66, 0.8)';
      return 'rgba(255, 180, 92, 0.85)';
    });

    const borderColors = backgroundColors.map(c =>
      c.replace(/0\.\d+\)$/, '1)')
    );

    new Chart(ctx, {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [{
          label: 'NNWC 每股值',
          data: dataValues,
          backgroundColor: backgroundColors,
          borderColor: borderColors,
          borderWidth: 1.2,
          borderRadius: 4,
          hoverBackgroundColor: 'rgba(44, 120, 201, 0.85)',
          hoverBorderColor: 'rgba(44, 120, 201, 1)'
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false, // we control height via CSS
        plugins: {
          legend: {
            display: false
          },
          tooltip: {
            enabled: true,
            backgroundColor: 'rgba(30, 30, 30, 0.9)',
            titleColor: '#fff',
            bodyColor: '#fff',
            padding: 10,
            cornerRadius: 6,
            callbacks: {
              label: function(context) {
                const value = context.parsed.y;
                return ' NNWC 每股: ' + value.toFixed(2);
              }
            }
          }
        },
        scales: {
          x: {
            grid: {
              display: false
            },
            ticks: {
              maxRotation: 0,
              minRotation: 0,
              autoSkip: false,
              font: {
                size: 12
              }
            }
          },
          y: {
            grid: {
              color: 'rgba(0, 0, 0, 0.05)'
            },
            ticks: {
              font: {
                size: 12
              },
              callback: function(value) {
                return value.toFixed(0);
              }
            },
            title: {
              display: true,
              text: 'NNWC 每股',
              color: '#444',
              font: {
                size: 13,
                weight: '500'
              }
            }
          }
        },
        interaction: {
          mode: 'nearest',
          intersect: true
        },
        animation: {
          duration: 800,
          easing: 'easeOutQuart'
        }
      }
    });
  </script>
</body>
</html>
