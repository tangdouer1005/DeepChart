<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>crm 资本再投资率（2017-2024）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue",
        Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji",
        "Segoe UI Symbol", "Noto Color Emoji";
      margin: 0;
      padding: 20px;
      background-color: #fafafa;
      color: #222;
    }

    h1 {
      font-size: 20px;
      margin-bottom: 4px;
    }

    h2 {
      font-size: 14px;
      font-weight: normal;
      margin-top: 0;
      color: #666;
    }

    .chart-container {
      max-width: 900px;
      margin: 0 auto;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
      padding: 16px 18px 24px;
    }

    .chart-wrapper {
      position: relative;
      height: 480px;
    }

    .note {
      font-size: 12px;
      color: #666;
      margin-top: 10px;
      line-height: 1.5;
    }

    .legend-inline {
      font-size: 12px;
      color: #444;
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .legend-color {
      width: 14px;
      height: 4px;
      border-radius: 4px;
      background: #2563eb;
    }
  </style>
</head>
<body>
  <div class="chart-container">
    <h1>crm 资本再投资率变化趋势</h1>
    <h2>2017 - 2024 财年</h2>

    <div class="chart-wrapper">
      <canvas id="reinvestmentChart"></canvas>
    </div>

    <div class="legend-inline">
      <span class="legend-color"></span>
      <span>资本再投资率（%）</span>
    </div>

    <div class="note">
      数据来源：用户提供的财年结果数据。<br />
      提示：将鼠标悬停在折线上的点，可查看精确数值。
    </div>
  </div>

  <script>
    // Source data (exactly as provided)
    const fiscalYears = [2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024];
    const reinvestmentRateRaw = [
      0.6596020969855834,
      7.579465298962601,
      -0.8320276334177658,
      44.49253496778248,
      -2.444736359850062,
      2.7699702936789463,
      -0.2451676528599605,
      0.2302381569058708
    ];

    // Convert to percentages with two decimals
    const reinvestmentRatePercent = reinvestmentRateRaw.map(v => v);

    const ctx = document.getElementById('reinvestmentChart').getContext('2d');

    const reinvestmentChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: fiscalYears,
        datasets: [
          {
            label: '资本再投资率',
            data: reinvestmentRatePercent,
            borderColor: '#2563eb',
            backgroundColor: 'rgba(37, 99, 235, 0.10)',
            pointBackgroundColor: '#2563eb',
            pointBorderColor: '#ffffff',
            pointHoverRadius: 6,
            pointRadius: 4,
            borderWidth: 2,
            tension: 0.25,
            fill: true
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: {
          mode: 'nearest',
          intersect: false
        },
        plugins: {
          legend: {
            display: false
          },
          title: {
            display: false
          },
          tooltip: {
            usePointStyle: true,
            callbacks: {
              label: function (context) {
                const value = context.parsed.y;
                return ' 资本再投资率: ' + value.toFixed(4);
              }
            }
          }
        },
        scales: {
          x: {
            title: {
              display: true,
              text: '财年',
              color: '#374151',
              font: {
                size: 12
              }
            },
            ticks: {
              maxRotation: 0,
              minRotation: 0,
              color: '#4b5563'
            },
            grid: {
              display: false
            }
          },
          y: {
            title: {
              display: true,
              text: '资本再投资率（单位：与原始数据一致）',
              color: '#374151',
              font: {
                size: 12
              }
            },
            ticks: {
              color: '#4b5563',
              callback: function (value) {
                return value.toFixed(1);
              }
            },
            grid: {
              color: 'rgba(148, 163, 184, 0.2)'
            }
          }
        }
      }
    });
  </script>
</body>
</html>
