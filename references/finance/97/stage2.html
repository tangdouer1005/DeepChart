<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>GOOG Piotroski F-Score (2016–2024)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Chart.js (latest stable 4.x) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background: #f7f7fb;
      color: #222;
      padding: 24px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 14px 30px rgba(15, 23, 42, 0.08);
      padding: 24px 28px 30px;
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 4px;
      font-weight: 600;
      color: #111827;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #6b7280;
      margin-bottom: 16px;
    }

    .note {
      font-size: 0.8rem;
      color: #6b7280;
      margin-top: 12px;
      line-height: 1.4;
    }

    .chart-wrapper {
      position: relative;
      width: 100%;
      height: 420px;
    }

    @media (max-width: 600px) {
      .container {
        padding: 18px 16px 22px;
      }
      h1 {
        font-size: 1.1rem;
      }
      .chart-wrapper {
        height: 340px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>GOOG 皮奥特罗斯基 F-Score（Piotroski F-Score）趋势</h1>
    <div class="subtitle">按财年统计，2016–2024</div>

    <div class="chart-wrapper">
      <canvas id="piotroskiChart"></canvas>
    </div>

    <div class="note">
      注：Piotroski F-Score 为 0–9 的评分，数值越高通常代表财务基本面越强。<br />
      数据来源：用户提供的财报指标汇总。
    </div>
  </div>

  <script>
    // Source data (user-provided)
    const fiscalYears = [
      "2016",
      "2017",
      "2018",
      "2019",
      "2020",
      "2021",
      "2022",
      "2023",
      "2024"
    ];

    const fScores = [6, 5, 7, 6, 5, 8, 6, 8, 8];

    const ctx = document.getElementById("piotroskiChart").getContext("2d");

    const gradient = ctx.createLinearGradient(0, 0, 0, 400);
    gradient.addColorStop(0, "rgba(56, 189, 248, 0.35)");  // top
    gradient.addColorStop(1, "rgba(56, 189, 248, 0.00)");  // bottom

    const chart = new Chart(ctx, {
      type: "line",
      data: {
        labels: fiscalYears,
        datasets: [
          {
            label: "Piotroski F-Score",
            data: fScores,
            tension: 0.25,
            borderColor: "#0ea5e9",
            backgroundColor: gradient,
            borderWidth: 2.5,
            pointBackgroundColor: "#ffffff",
            pointBorderColor: "#0ea5e9",
            pointHoverBackgroundColor: "#0ea5e9",
            pointHoverBorderColor: "#ffffff",
            pointRadius: 4,
            pointHoverRadius: 6,
            pointBorderWidth: 2,
            fill: true
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: {
          mode: "index",
          intersect: false
        },
        plugins: {
          legend: {
            display: true,
            labels: {
              usePointStyle: true,
              padding: 20,
              font: {
                size: 12
              }
            }
          },
          tooltip: {
            backgroundColor: "rgba(15, 23, 42, 0.92)",
            titleColor: "#f9fafb",
            bodyColor: "#e5e7eb",
            borderColor: "#38bdf8",
            borderWidth: 1,
            padding: 10,
            cornerRadius: 8,
            displayColors: false,
            callbacks: {
              title: (items) => `Fiscal Year: ${items[0].label}`,
              label: (item) => `F-Score: ${item.formattedValue}`
            }
          },
          title: {
            display: false
          }
        },
        scales: {
          x: {
            grid: {
              display: false
            },
            ticks: {
              color: "#6b7280"
            }
          },
          y: {
            beginAtZero: true,
            suggestedMax: 9,
            ticks: {
              stepSize: 1,
              color: "#6b7280"
            },
            grid: {
              color: "rgba(148, 163, 184, 0.25)",
              drawBorder: false
            },
            title: {
              display: true,
              text: "Piotroski F-Score (0–9)",
              color: "#4b5563",
              font: {
                size: 12,
                weight: "500"
              }
            }
          }
        }
      }
    });
  </script>
</body>
</html>
