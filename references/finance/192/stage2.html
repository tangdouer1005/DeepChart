<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NVDA 防御区间比率 (DIR) 2016–2024</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Chart.js (latest 4.x) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      color-scheme: light;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background: #f5f5f7;
      color: #111827;
    }
    .chart-wrapper {
      max-width: 900px;
      margin: 0 auto;
    }
    .chart-container {
      position: relative;
      /* Fixed, reasonable height to prevent extreme stretching */
      height: 420px;
      width: 100%;
      background: #ffffff;
      border-radius: 12px;
      padding: 18px 20px 24px;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
      box-sizing: border-box;
    }
    h1 {
      font-size: 1.45rem;
      margin: 0 0 4px;
      font-weight: 600;
    }
    .subtitle {
      font-size: 0.9rem;
      color: #6b7280;
      margin-bottom: 10px;
    }
    .note {
      font-size: 0.78rem;
      color: #6b7280;
      margin-top: 8px;
    }
    canvas {
      /* Let canvas fill the inner container without extra stretch */
      width: 100% !important;
      height: calc(100% - 10px) !important;
    }
    @media (max-width: 600px) {
      body {
        padding: 10px;
      }
      .chart-container {
        height: 360px;
        padding: 14px 14px 18px;
      }
      h1 {
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>
  <div class="chart-wrapper">
    <h1>NVDA 防御区间比率 (DIR)</h1>
    <div class="subtitle">Fiscal Years 2016–2024</div>
    <div class="chart-container">
      <canvas
        id="dirChart"
        aria-label="Bar chart of NVDA Defensive Interval Ratio from 2016 to 2024"
        role="img"
      ></canvas>
    </div>
    <div class="note">
      数据来源：提供的 NVDA 防御区间比率（DIR）年度结果；单位为天（Defensive Interval Ratio, days）。
    </div>
  </div>

  <script>
    // Source data (exactly as provided)
    const labels = [
      "2016",
      "2017",
      "2018",
      "2019",
      "2020",
      "2021",
      "2022",
      "2023",
      "2024"
    ];

    const dirValues = [
      94.26812104152006,
      190.12861736334403,
      295.58041205412053,
      101.76820020222446,
      567.6220267591675,
      98.47154739356009,
      143.63776447578974,
      115.7731868131868,
      225.64704830053668
    ];

    const ctx = document.getElementById("dirChart").getContext("2d");

    // Find min and max for y-axis range
    const minVal = Math.min(...dirValues);
    const maxVal = Math.max(...dirValues);
    const padding = (maxVal - minVal) * 0.1;

    new Chart(ctx, {
      type: "bar",
      data: {
        labels,
        datasets: [
          {
            label: "防御区间比率 (DIR, 天)",
            data: dirValues,
            backgroundColor: "rgba(37, 99, 235, 0.75)",
            borderColor: "#1d4ed8",
            hoverBackgroundColor: "rgba(37, 99, 235, 0.95)",
            borderWidth: 1.2,
            borderRadius: 6,
            maxBarThickness: 48
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false, // Respect the fixed container height
        plugins: {
          legend: {
            display: true,
            labels: {
              font: {
                size: 12
              }
            }
          },
          tooltip: {
            usePointStyle: true,
            callbacks: {
              label: function (context) {
                const value = context.parsed.y;
                return ` DIR: ${value.toFixed(2)} 天`;
              }
            }
          },
          title: {
            display: false
          }
        },
        scales: {
          x: {
            grid: {
              display: false
            },
            ticks: {
              font: {
                size: 11
              }
            }
          },
          y: {
            beginAtZero: false,
            min: Math.max(0, minVal - padding),
            max: maxVal + padding,
            grid: {
              color: "rgba(148, 163, 184, 0.35)"
            },
            ticks: {
              font: {
                size: 11
              },
              callback: function (value) {
                return value.toFixed(0);
              }
            },
            title: {
              display: true,
              text: "防御区间比率 (天)",
              font: {
                size: 12
              }
            }
          }
        },
        interaction: {
          mode: "index",
          intersect: false
        },
        animation: {
          duration: 600,
          easing: "easeOutQuart"
        }
      }
    });
  </script>
</body>
</html>
