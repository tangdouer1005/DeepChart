<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WMT 自由现金流收益质量 (Quality of Income Ratio) 2017–2024</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 24px;
      background: #fafafa;
      color: #222;
    }
    h1 {
      font-size: 20px;
      margin-bottom: 4px;
    }
    h2 {
      font-size: 14px;
      font-weight: 400;
      color: #555;
      margin-top: 0;
      margin-bottom: 16px;
    }
    .chart-container {
      position: relative;
      max-width: 800px;
      height: 420px;          /* Fixed, reasonable height */
      margin: 0 auto;
      background: #fff;
      padding: 16px 20px 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      box-sizing: border-box;
    }
    canvas {
      width: 100% !important;  /* Let Chart.js keep aspect ratio inside this box */
      height: 100% !important;
    }
    .note {
      max-width: 800px;
      margin: 12px auto 0;
      font-size: 12px;
      color: #666;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="chart-container">
    <h1>WMT 自由现金流收益质量</h1>
    <h2>Quality of Income Ratio, Fiscal Years 2017–2024</h2>
    <canvas id="qoiChart"></canvas>
  </div>

  <div class="note">
    数据来源：用户提供的 RESULT_QoI_Ratio（2017–2024）。<br />
    图表说明：自由现金流收益质量（Quality of Income Ratio）接近 1 表示净利润与自由现金流匹配度较高。
  </div>

  <!-- Chart.js (latest stable 4.x from CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    const fiscalYears = ["2017","2018","2019","2020","2021","2022","2023","2024"];
    const qoiValues = [
      0.9643466082085008,
      0.9151004327326744,
      0.8504060058219702,
      0.800348597686579,
      1.0704451038575669,
      0.6606830601092896,
      0.9275810410225352,
      0.9192332432780136
    ];

    const ctx = document.getElementById('qoiChart').getContext('2d');

    new Chart(ctx, {
      type: 'line',
      data: {
        labels: fiscalYears,
        datasets: [{
          label: '自由现金流收益质量 (Quality of Income Ratio)',
          data: qoiValues,
          borderColor: 'rgba(37, 99, 235, 1)',
          backgroundColor: 'rgba(37, 99, 235, 0.12)',
          pointBackgroundColor: 'rgba(37, 99, 235, 1)',
          pointBorderColor: '#ffffff',
          pointBorderWidth: 1.5,
          pointRadius: 4,
          pointHoverRadius: 6,
          pointHoverBorderWidth: 2,
          tension: 0.25,
          fill: true
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,   // use container's 800x420 box, no vertical stretching
        interaction: {
          mode: 'nearest',
          intersect: false
        },
        plugins: {
          legend: {
            display: true,
            labels: {
              usePointStyle: true,
              padding: 16,
              font: {
                size: 12
              }
            }
          },
          tooltip: {
            callbacks: {
              label: function(context) {
                return ' ' + context.dataset.label + ': ' + Number(context.raw).toFixed(3);
              }
            }
          },
          title: {
            display: false
          }
        },
        scales: {
          x: {
            title: {
              display: true,
              text: 'Fiscal Year',
              font: {
                size: 12
              }
            },
            ticks: {
              font: {
                size: 11
              }
            },
            grid: {
              display: false
            }
          },
          y: {
            title: {
              display: true,
              text: 'Quality of Income Ratio',
              font: {
                size: 12
              }
            },
            ticks: {
              font: {
                size: 11
              },
              callback: function(value) {
                return value.toFixed(2);
              }
            },
            grid: {
              color: 'rgba(0,0,0,0.05)'
            },
            suggestedMin: 0.5,
            suggestedMax: 1.2
          }
        }
      }
    });
  </script>
</body>
</html>
