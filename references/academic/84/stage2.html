    {

    {

        "PM_size":"PM1",
        "Season":"Warm",
        "Median":0.5,

        "Q3":0.77
    }
];
        
        const colors = {
            'Cold': '#7aa0c4',
            'Warm': '#d49e56'
        };
        
        const pmOrder = ['PM10', 'PM2.5', 'PM1'];
        const typeOrder = ['Traffic', 'Urban', 'Industrial', 'Suburban', 'Rural'];
        const seasons = ['Cold', 'Warm'];

        const grids = [
            { left: '7%', top: '15%', width: '28%', bottom: '15%' },
            { left: '39%', top: '15%', width: '28%', bottom: '15%' },
            { left: '71%', top: '15%', width: '28%', bottom: '15%' }
        ];
        
        const titles = [
            { text: 'PM₁₀', left: '21%', top: '5%', textAlign: 'center' },
            { text: 'PM₂.₅', left: '53%', top: '5%', textAlign: 'center' },
            { text: 'PM₁', left: '85%', top: '5%', textAlign: 'center' }
        ];
        
        const xAxes = [];
        const yAxes = [];
        const series = [];

        pmOrder.forEach((pm, gridIndex) => {
            xAxes.push({
                gridIndex: gridIndex,
                type: 'category',
                data: typeOrder,
                axisTick: { show: false },
                axisLabel: { interval: 0, fontSize: 11 }
            });
            
            yAxes.push({
                gridIndex: gridIndex,
                type: 'value',
                min: 0,
                max: 8,
                interval: 2,
                name: gridIndex === 0 ? 'OPᵛᴰᵀᵀ (nmol min⁻¹ m⁻³)' : '',
                nameLocation: 'middle',
                nameGap: 40,
                axisLabel: { show: gridIndex === 0 },
                splitLine: { show: true, lineStyle: { type: 'dashed' } }
            });
            
            seasons.forEach(season => {
                const seasonData = [];
                typeOrder.forEach(type => {
                    const row = data.find(d => d.PM_size === pm && d.Type === type && d.Season === season);
                    if (row) {
                        const iqr = row.Q3 - row.Q1;
                        const whislo = Math.max(0, row.Q1 - 1.5 * iqr);
                        const whishi = row.Q3 + 1.5 * iqr;
                        seasonData.push([whislo, row.Q1, row.Median, row.Q3, whishi]);
                    } else {
                        seasonData.push([]);
                    }
                });
                
                series.push({
                    name: season,
                    type: 'boxplot',
                    xAxisIndex: gridIndex,
                    yAxisIndex: gridIndex,
                    data: seasonData,
                    itemStyle: {
                        color: colors[season],
                        borderColor: 'black'
                    },
                    boxWidth: '35%'
                });
            });
        });

        const chart = echarts.init(document.getElementById('chart-container'));

        const option = {
            backgroundColor: 'white',
            grid: grids,
            title: titles,
            xAxis: xAxes,
            yAxis: yAxes,
            legend: {
                data: ['Cold', 'Warm'],
                right: '5%',
                top: '5%',
                itemWidth: 15,
                itemHeight: 10
            },
            series: series,
            graphic: [
                {
                    type: 'text',
                    left: '2%',
                    top: '2%',
                    style: {
                        text: 'b)',
                        font: 'bold 16px Arial'
                    }
                }
            ]
        };

        chart.setOption(option);
    </script>
</body>
</html>
