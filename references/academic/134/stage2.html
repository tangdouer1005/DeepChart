        // 1. Parsing (Adapted from JSON)
        // JSON structure maps directly to our needs.
        
        const data = rawData.map(item => ({
            UF: item.UF,
            Biome: item.Biome,
            Domestic: item.Domestic,
            China: item.China,
            EU: item.EU,
            Other: item["Other countries"]
        }));

        // 2. Sorting
        const biomeOrder = ["AMAZÔNIA", "PANTANAL", "CERRADO", "CAATINGA", "PAMPA", "MATA ATLÂNTICA", "NA"];
        
        data.sort((a, b) => {
            const idxA = biomeOrder.indexOf(a.Biome);
            const idxB = biomeOrder.indexOf(b.Biome);
            if (idxA !== idxB) return idxA - idxB;
            return a.UF.localeCompare(b.UF);
        });

        // 3. Prepare Data
        const categoryData = [];
        const seriesDomestic = [];
        const seriesChina = [];
        const seriesEU = [];
        const seriesOther = [];
        
        let lastBiome = null;
        let biomeStartIndex = 0;
        const biomeRanges = [];
        
        data.forEach(item => {
            if (item.Biome !== lastBiome) {
                if (lastBiome !== null) {
                    biomeRanges.push({
                        name: lastBiome,
                        start: biomeStartIndex,
                        end: categoryData.length - 1
                    });
                    for(let k=0; k<4; k++) {
                        categoryData.push('');
                        seriesDomestic.push(null);
                        seriesChina.push(null);
                        seriesEU.push(null);
                        seriesOther.push(null);
                    }
                    biomeStartIndex = categoryData.length;
                }
                lastBiome = item.Biome;
            }
            
            categoryData.push(item.UF);
            seriesDomestic.push(item.Domestic);
            seriesChina.push(item.China);
            seriesEU.push(item.EU);
            seriesOther.push(item.Other);
        });

        if (lastBiome !== null) {
            biomeRanges.push({
                name: lastBiome,
                start: biomeStartIndex,
                end: categoryData.length - 1
            });
        }

        const biomeAxisData = new Array(categoryData.length).fill('');
        biomeRanges.forEach(range => {
            const mid = Math.floor((range.start + range.end) / 2);
            biomeAxisData[mid] = range.name;
        });

        const option = {
            title: {
                text: '2004',
                top: 20,
                left: 20,
                textStyle: { fontSize: 24 }
            },
            legend: {
