        const rawData = [...data.df_stage1, ...data.df_stage2];

        /* const labelMap = {
            's_human mobility': 'Human mobility',
            // ...
        }; */

        const nodes = new Set();
        const links = [];

        rawData.forEach(item => {
            // Use labels directly from JSON
            const src = item.left_label;
            const dst = item.right_label;
            const total = item.NSF + item.NSFC;
            
            if (total === 0) return; // Skip links with zero total value
            
            const ratio = item.NSF / total; // Proportion of NSF funding

            nodes.add(src);
            nodes.add(dst);
            
            // Interpolate color (Orange #e69f00 -> Grey #f0f0f0 -> Blue #56b4e9)
            let color;
            if(ratio <= 0.5) {
                // Orange to Grey
                const f = ratio * 2;
                const r = Math.round(230 + (240-230)*f);
                const g = Math.round(159 + (240-159)*f);
                const b = Math.round(0 + (240-0)*f);
                color = `rgb(${r},${g},${b})`;
            } else {
                // Grey to Blue
                const f = (ratio - 0.5) * 2;
                const r = Math.round(240 + (86-240)*f);
                const g = Math.round(240 + (180-240)*f);
                const b = Math.round(240 + (233-240)*f);
                color = `rgb(${r},${g},${b})`;
            }

            links.push({
                source: src,
                target: dst,
                value: total,
                lineStyle: { color: color, opacity: 0.6 }
            });
        });

        const chart = echarts.init(document.getElementById('chart-container'));

        const option = {
            backgroundColor: 'white',
            title: {
                text: 'Proportion of NSF-funded proposals',
                left: 'center',
                bottom: 10,
                textStyle: { fontSize: 14 }
            },
            visualMap: {
                min: 0,
                max: 1,
                calculable: true,
                orient: 'horizontal',
                left: 'center',
                bottom: 40,
                inRange: {
                    color: ['#e69f00', '#f0f0f0', '#56b4e9'] // Orange, Grey, Blue
                }
            },
            series: {
                type: 'sankey',
                layout: 'none',
                data: Array.from(nodes).map(name => ({name: name})),
                links: links,
                emphasis: { focus: 'adjacency' },
                lineStyle: { curveness: 0.5 },
                itemStyle: { color: '#a0a0a0' },
                label: { color: 'black', fontSize: 10 }
            }
        };

        chart.setOption(option);
