<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nature Chart 91</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        body { margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #fff; }
        #chart-container { width: 450px; height: 750px; } /* Scaled up for better visibility, approx 1.5x of 3.2x5 inch at 96dpi */
    </style>
</head>
<body>
    <div id="chart-container"></div>
    <script>
        // 1. Data Processing
        
        const data = {"parental": [0.8709716083391996, 1.163636166577947, 0.9655449807231168, 0.8597330379618892, 1.176093947359024, 0.9649672859886522, 0.8904168718543946, 1.0725268751993908, 1.0380790144390275, 1.1453606777036145, 0.8833249802905037, 0.9714125397543188, 0.9924852259159757, 0.9177934727647518, 1.089823273581349, 0.9572414622115824, 0.989919438617107, 1.0536712551188123, 1.2325350499581258, 0.8528342210715382, 0.9148067493803628, 1.2699145962304776, 0.8468665013964249, 0.883764678672027, 1.224122315643644, 0.77936863332052, 0.9970336321197292, 1.0000001351314969, 1.000215886511742, 1.0000899043170297], "ln": [2.850802126911562, 2.831017458797632, 2.937364610340302, 2.1770580978498817, 2.1268461939871037, 2.3192470705407, 4.047197358133228, 2.009758501677493, 2.647457713277039, 4.285395632319021, 3.8618899449324937, 5.009290288466751, 2.2671921259682297, 2.5310387071115925, 2.9477890320349607, 4.813490147713096, 2.0512039066750813, 2.6243034434553247, 3.1159567335299294, 2.4972600558469304, 2.806207692911664, 2.377158080635001, 2.516819306046498, 2.8337094105335874, 3.663191672688194, 2.6744810776251278, 3.168788574091623, 2.7555710244555778, 2.695967051131912, 2.7880997823966487, 2.9460697874311013, 2.682577253048576, 2.662553716454028, 2.071476197899601, 2.0925956049722227, 2.116345859620026, 4.105397133510845, 2.419261893579584, 2.824200471110591, 3.1989135425398, 3.1224259486974386, 1.5357605307222275, 2.27619231605305, 2.3681003175586777, 2.577699599539925, 2.2386721533780003, 2.353859329808663, 2.473936441317873, 5.201513745752616, 2.5844047422525778, 3.3221986518454028, 1.1099025962411833, 1.3041709489940585, 1.794586399282931, 1.8198042685089368, 1.6813632372345209, 1.6071165932144746, 1.7509587691265476, 1.5222738827015716, 1.8334214971755416, 2.5129551901243325, 3.04541240900302, 1.783632147964823, 1.6594961664147203, 2.2613087425334126, 2.413476981833502, 1.263143683138213, 2.698559840287249, 2.2963958768441155, 2.720926327731109, 1.7118141094963657, 2.641496941582993, 4.853379099245915, 2.62824603612458, 3.047416468169401], "means": [1.0001518139384593, 2.6315595502953406], "stds": [0.12624756981115304, 0.8440785778730334]};
        
        const parental = data.parental;
        const ln = data.ln;
        const meanParental = data.means[0];
        const meanLN = data.means[1];
        const stdParental = data.stds[0];
        const stdLN = data.stds[1];


        // 2. Plotting Logic
        const chart = echarts.init(document.getElementById('chart-container'), null, {
            renderer: 'canvas',
        });

        // Seeded random for jitter consistency
        let seed = 0;
        function seededRandom() {
            // Simple LCG
            seed = (seed * 9301 + 49297) % 233280;
            return seed / 233280;
        }

        function normalRandom() {
            let u = 0, v = 0;
            while(u === 0) u = seededRandom();
            while(v === 0) v = seededRandom();
            let num = Math.sqrt( -2.0 * Math.log( u ) ) * Math.cos( 2.0 * Math.PI * v );
            return num;
        }

        const jitterScale = 0.08;
        
        const parentalScatter = parental.map(val => [normalRandom() * jitterScale + 0, val]);
        const lnScatter = ln.map(val => [normalRandom() * jitterScale + 1, val]);

        const option = {
            animation: false,
            grid: {
                left: '15%',
                right: '15%',
                top: '15%', // Adjusted for 'h' and P-value text
                bottom: '15%',
            },
            xAxis: {
                type: 'value',
                min: -0.5,
                max: 1.5,
                splitLine: { show: false },
                axisLine: { show: false }, // Handled by bottom border of plot area or specific drawing
                axisTick: { show: false },
                axisLabel: { 
                    show: true,
                    formatter: function(value) {
                        if (Math.abs(value - 0) < 0.1) return 'Parental';
                        if (Math.abs(value - 1) < 0.1) return 'LN';
                        return '';
                    },
                    rotate: 45,
                    fontSize: 14, // Scaled up slightly
                    margin: 10
                },
                interval: 1 // Force ticks at 0 and 1
            },
            yAxis: {
                type: 'value',
                min: 0,
                max: 6.0,
                interval: 1, // Matplotlib auto ticks roughly
                name: 'Relative FSP1 levels',
                nameLocation: 'middle',
                nameGap: 40,
                nameTextStyle: {
                    fontSize: 14,
                    color: '#000',
                    fontFamily: 'Arial'
                },
                splitLine: {
                    show: true,
                    lineStyle: {
                        color: '#d0d0d0',
                        width: 1, // Scaled width
                        type: 'solid'
                    }
                },
                axisLine: { show: false },
                axisTick: { show: true, length: 6, lineStyle: { width: 1.5 } },
                axisLabel: { fontSize: 12, color: '#000' }
            },
            series: [
                // Bars
                {
                    type: 'bar',
                    data: [
                        { value: [0, meanParental], itemStyle: { color: '#c0c0c0', borderColor: 'black', borderWidth: 1.5 } },
                        { value: [1, meanLN], itemStyle: { color: '#98d68c', borderColor: 'black', borderWidth: 1.5 } }
                    ],
                    barWidth: '60%', // corresponds to width=0.6 in data space (0.6/1.0 unit spacing = 60%)
                    z: 1
                },
                // Error Bars (Custom series)
                {
                    type: 'custom',
                    renderItem: function (params, api) {
                        const xValue = api.value(0);
                        const meanValue = api.value(1);
                        const stdValue = api.value(2);
                        const highPoint = api.coord([xValue, meanValue + stdValue]);
                        const lowPoint = api.coord([xValue, meanValue - stdValue]);
                        const style = api.style({
                            stroke: 'black',
                            fill: null,
                            lineWidth: 1.5
                        });
                        
                        // Cap width
                        // In MPL capsize=6 points. 6 points is roughly 8px.
                        const capWidth = 10; 

                        return {
                            type: 'group',
                            children: [
                                {
                                    type: 'line',
                                    shape: {
                                        x1: highPoint[0] - capWidth / 2, y1: highPoint[1],
                                        x2: highPoint[0] + capWidth / 2, y2: highPoint[1]
                                    },
                                    style: style
                                },
                                {
                                    type: 'line',
                                    shape: {
                                        x1: lowPoint[0] - capWidth / 2, y1: lowPoint[1],
                                        x2: lowPoint[0] + capWidth / 2, y2: lowPoint[1]
                                    },
                                    style: style
                                },
                                {
                                    type: 'line',
                                    shape: {
                                        x1: highPoint[0], y1: highPoint[1],
                                        x2: lowPoint[0], y2: lowPoint[1]
                                    },
                                    style: style
                                }
                            ]
                        };
                    },
                    data: [
                        [0, meanParental, stdParental],
                        [1, meanLN, stdLN]
                    ],
                    z: 3
                },
                // Scatter Points
                {
                    type: 'scatter',
                    data: parentalScatter,
                    itemStyle: {
                        color: '#000000',
                        opacity: 0.9,
                        borderColor: 'none'
                    },
                    symbolSize: 8, // Scaled from s=14 (area) -> radius ~2.1 -> diameter ~4.2. Matplotlib 's' is area in points^2. 14 pts^2 -> r=2.1 pts. In pixels, depends on DPI. @300dpi, 1 pt = 4.16 px. Area = 14 * (4.16)^2 approx 240 px^2. r approx 8-9 px. Diameter ~16px?
                    // Wait, Matplotlib s=14 is usually small. Default is 20. 14 is smaller. 
                    // Let's stick to visual check. 8px diameter seems plausible for web.
                    z: 4
                },
                {
                    type: 'scatter',
                    data: lnScatter,
                    itemStyle: {
                        color: '#1f7a1f',
                        opacity: 0.9,
                        borderColor: 'none'
                    },
                    symbolSize: 8,
                    z: 4
                }
            ],
            graphic: [
                {
                    type: 'text',
                    left: '5%', // Adjust position based on visual testing
                    top: '5%',
                    style: {
                        text: 'h',
                        font: 'bold 24px Arial',
                        fill: 'black'
                    }
                },
                {
                    type: 'text',
                    left: 'center',
                    top: '8%',
                    style: {
                        text: 'P < 1 × 10⁻¹⁵',
                        font: '14px Arial',
                        fill: 'black'
                    }
                }
            ]
        };

        chart.setOption(option);
    </script>
</body>
</html>
