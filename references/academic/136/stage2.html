        // 1. Parsing (Adapted from JSON)
        // JSON objects map directly. 
        // JSON has 'NA' for UF and Biome already where appropriate.
        const data = rawData.map(item => ({
            UF: item.UF,
            Biome: item.Biome,
            Domestic: item.Domestic,
            China: item.China,
            EU: item.EU,
            Other: item["Other countries"]
        }));

        // 2. Sorting
        const biomeOrder = ["AMAZÔNIA", "PANTANAL", "CERRADO", "CAATINGA", "PAMPA", "MATA ATLÂNTICA", "NA"];
        
        data.sort((a, b) => {
            const idxA = biomeOrder.indexOf(a.Biome);
            const idxB = biomeOrder.indexOf(b.Biome);
            if (idxA !== idxB) return idxA - idxB;
            return a.UF.localeCompare(b.UF);
        });

        // 3. Prepare Data
        const categoryData = [];
        const seriesDomestic = [];
        const seriesChina = [];
        const seriesEU = [];
        const seriesOther = [];
        
        const biomeGroups = [];
        let lastBiome = null;
        let currentIndex = 0;
        
        data.forEach(item => {
            if (item.Biome !== lastBiome) {
                if (lastBiome !== null) {
                    // Close previous group
                    biomeGroups[biomeGroups.length - 1].end = currentIndex - 1;
                    
                    // Insert Gap (3 units wide as per python script)
                    for(let k=0; k<3; k++) {
                        categoryData.push('');
                        seriesDomestic.push(null);
                        seriesChina.push(null);
                        seriesEU.push(null);
                        seriesOther.push(null);
                        currentIndex++;
                    }
                }
                // Start new group
                biomeGroups.push({ name: item.Biome, start: currentIndex });
                lastBiome = item.Biome;
            }
            
            categoryData.push(item.UF);
            seriesDomestic.push(item.Domestic);
            seriesChina.push(item.China);
            seriesEU.push(item.EU);
            seriesOther.push(item.Other);
            currentIndex++;
        });
        
        // Close last group
        if (biomeGroups.length > 0) {
            biomeGroups[biomeGroups.length - 1].end = currentIndex - 1;
        }

        // Calculate Graphic Labels
        const totalSectors = categoryData.length;
        const graphics = biomeGroups.map(g => {
            const mid = (g.start + g.end) / 2;
            // Calculate angle in degrees. 
            // 0 index is at 90 degrees (Top). Clockwise.
            const angle = 90 - (mid * 360 / totalSectors);
            const rad = angle * Math.PI / 180;
            
            // Position at radius 440 (88% of 500px)
            const r = 440; 
            const cx = 500;
            const cy = 500;
            
            const x = cx + r * Math.cos(rad);
            const y = cy - r * Math.sin(rad); 
            
            let labelText = g.name.toLowerCase().replace(/(?:^|\s)\w/g, function(a) { return a.toUpperCase(); });
            if(labelText === 'Na') labelText = 'NA';

            return {
                type: 'text',
                left: x,
                top: y,
                style: {
                    text: labelText,
                    textAlign: 'center',
                    textVerticalAlign: 'middle',
                    fontSize: 14,
                    fontWeight: 'bold',
                    fill: '#333'
                }
            };
        });

        const option = {
            graphic: graphics,
            title: {
                text: '2012',
                top: 20,
                left: 20,
                textStyle: { fontSize: 24 }
            },
            legend: {
                bottom: 20,
                data: ['Domestic', 'China', 'Other countries', 'EU']
            },
            polar: {
                radius: ['30%', '80%']
            },
            angleAxis: {
                type: 'category',
                data: categoryData,
                startAngle: 90, 
                clockwise: true,
                axisLabel: {
                    interval: 0,
                    fontSize: 10,
                    color: '#555',
                    margin: 2
                },
                axisTick: { show: false },
                axisLine: { show: false },
                splitLine: { show: false }
            },
            radiusAxis: {
                max: 35,
                axisLabel: { show: true },
                axisLine: { show: false },
                splitLine: { 
                    show: true,
                    lineStyle: { type: 'solid', color: '#ccc' }
                }
            },
            series: [
                {
                    name: 'Domestic',
                    type: 'bar',
                    stack: 'total',
                    coordinateSystem: 'polar',
                    data: seriesDomestic,
                    itemStyle: { color: '#dbe9f6' }
                },
                {
                    name: 'China',
                    type: 'bar',
                    stack: 'total',
                    coordinateSystem: 'polar',
                    data: seriesChina,
                    itemStyle: { color: '#9ecae1' }
                },
                {
                    name: 'EU',
                    type: 'bar',

                    coordinateSystem: 'polar',
                    data: seriesEU,
                    itemStyle: { color: '#4292c6' }
                },
                {
                    name: 'Other countries',
                    type: 'bar',
                    stack: 'total',
                    coordinateSystem: 'polar',
                    data: seriesOther,
                    itemStyle: { color: '#08306b' }
                }
            ]
        };

        const chart = echarts.init(document.getElementById('chart-container'));
        chart.setOption(option);
