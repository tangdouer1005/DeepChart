        // ---------------------------------------------------------
        // 3. Curve Fitting (Nelder-Mead Optimizer & Sigmoid)
        // ---------------------------------------------------------

        function sigmoid(x, bottom, top, log_ec50, hill_slope) {
            return bottom + (top - bottom) / (1 + Math.pow(10, (log_ec50 - x) * hill_slope));
        }

        // Simple Nelder-Mead Optimizer
        // Ported/Adapted for JS
        function fmin(f, x0) {
            // Parameters
            const rho = 1, chi = 2, psi = 0.5, sigma = 0.5;
            const tol = 1e-4;
            const maxIter = 1000;
            
            const n = x0.length;
            // Create initial simplex
            let simplex = [];
            simplex.push({ x: x0.slice(), fx: f(x0) });
            
            for (let i = 0; i < n; i++) {
                let x = x0.slice();
                x[i] = x[i] !== 0 ? x[i] * 1.05 : 0.00025;
                simplex.push({ x: x, fx: f(x) });
            }

            for (let iter = 0; iter < maxIter; iter++) {
                // Sort simplex
                simplex.sort((a, b) => a.fx - b.fx);
                
                if (Math.abs(simplex[n].fx - simplex[0].fx) < tol) break;

                // Centroid of best n vertices
                const centroid = new Array(n).fill(0);
                for (let i = 0; i < n; i++) {
                    for (let j = 0; j < n; j++) {
                        centroid[j] += simplex[i].x[j];
                    }
                }
                for (let j = 0; j < n; j++) centroid[j] /= n;

                // Reflect
                const xr = new Array(n);
                for (let j = 0; j < n; j++) xr[j] = centroid[j] + rho * (centroid[j] - simplex[n].x[j]);
                const fxr = f(xr);

                if (fxr < simplex[0].fx) {
                    // Expand
                    const xe = new Array(n);
                    for (let j = 0; j < n; j++) xe[j] = centroid[j] + chi * (xr[j] - centroid[j]);
                    const fxe = f(xe);
                    if (fxe < fxr) {
                        simplex[n] = { x: xe, fx: fxe };
                    } else {
                        simplex[n] = { x: xr, fx: fxr };
                    }
                } else if (fxr < simplex[n - 1].fx) {
                    simplex[n] = { x: xr, fx: fxr };
                } else {
                    // Contract
                    let xc = new Array(n);
                    let fxc;
                    if (fxr < simplex[n].fx) {
                        // Outside contraction
                        for (let j = 0; j < n; j++) xc[j] = centroid[j] + psi * (xr[j] - centroid[j]);
                        fxc = f(xc);
                        if (fxc <= fxr) {
                            simplex[n] = { x: xc, fx: fxc };
                        } else {
                            // Shrink
                            shrink();
                        }
                    } else {
                        // Inside contraction
                        for (let j = 0; j < n; j++) xc[j] = centroid[j] - psi * (centroid[j] - simplex[n].x[j]);
                        fxc = f(xc);
                        if (fxc < simplex[n].fx) {
                            simplex[n] = { x: xc, fx: fxc };
                        } else {
                            shrink();
                        }
                    }
                }

                function shrink() {
                    for (let i = 1; i < n + 1; i++) {
                        for (let j = 0; j < n; j++) {
                            simplex[i].x[j] = simplex[0].x[j] + sigma * (simplex[i].x[j] - simplex[0].x[j]);
                        }
                        simplex[i].fx = f(simplex[i].x);
                    }
                }
            }
            return simplex[0].x;
        }

        function fitCurve(xData, yData) {
            // Objective function: Sum of Squared Errors
            const objective = (params) => {
                const [bottom, top, log_ec50, hill_slope] = params;
                let sse = 0;
                for (let i = 0; i < xData.length; i++) {
                    const pred = sigmoid(xData[i], bottom, top, log_ec50, hill_slope);
                    sse += Math.pow(yData[i] - pred, 2);
                }
                return sse;
            };

            // Initial guess: [min, max, median, 1.0]
            const yMin = Math.min(...yData);
            const yMax = Math.max(...yData);
            const xSorted = [...xData].sort((a, b) => a - b);
            const median = xSorted[Math.floor(xSorted.length / 2)];
            
            const p0 = [yMin, yMax, median, 1.0];
            
            return fmin(objective, p0);
        }
