</head>

                },
                {

                {

                },
                {
                    "Date": "2021-03-02 00:00:00",
                    "E_solar [kWh]": 118.593,
                    "E_fuel [kWh]": 7.28012,

                    "Fuel system efficiency (Gibbs) [%]": 5.00232,

                },
                {
                    "Date": "2021-03-05 00:00:00",
                    "E_solar [kWh]": 4.20444,
                    "E_fuel [kWh]": 0.2585,
                    "E_heat [kWh]": 1.33517,
                    "Fuel system efficiency (Gibbs) [%]": 4.9503,
                    "Heat system efficiency [%]": 30.766,
                    "IPEC device efficiency (Gibbs) [%]": 18.6162,
                    "Fuel system efficiency (HHV) [%]": 5.95645,
                    "IPEC device efficiency (HHV) [%]": 22.4,
                    "DateLabel": "05 Mar. 2021"
                },
                {
                    "Date": "2021-03-12 00:00:00",
                    "E_solar [kWh]": 22.4122,
                    "E_fuel [kWh]": 1.67846,
                    "E_heat [kWh]": 5.83005,
                    "Fuel system efficiency (Gibbs) [%]": 6.12886,
                    "Heat system efficiency [%]": 25.6151,
                    "IPEC device efficiency (Gibbs) [%]": 22.6054,
                    "Fuel system efficiency (HHV) [%]": 7.37457,
                    "IPEC device efficiency (HHV) [%]": 27.2,
                    "DateLabel": "12 Mar. 2021"
                }
            ]
        };
        
                const data = chartData.plot_data;
        
                const dateLabels = data.map(row => row.DateLabel);

        const chart = echarts.init(document.getElementById('chart-container'));

        const color_solar = '#d9d9d9';  // Light Grey
        const color_fuel_bar = '#f4cccc'; // Light Red/Pink
        const color_heat_bar = '#cfe2f3'; // Light Blue
        
        const color_heat_line = '#666666'; // Dark Grey
        const color_fuel_line = '#cc4125'; // Red
        const color_ipec_line = '#3d85c6'; // Blue

        const option = {
            backgroundColor: 'white',
            tooltip: {
                trigger: 'axis',
                axisPointer: { type: 'shadow' }
            },
            legend: {
                data: [
                    { name: 'Solar (input)', icon: 'rect' },
                    { name: 'Fuel (output)', icon: 'rect' },
                    { name: 'Heat (output)', icon: 'rect' },
                    { name: 'Heat system efficiency', icon: 'diamond' },
                    { name: 'Fuel system efficiency', icon: 'triangle' },
                    { name: 'IPEC device efficiency', icon: 'triangle' }
                ],
                left: 'center',
                top: 10,
                itemGap: 15,
                textStyle: { fontSize: 11, color: 'black' }
            },
            grid: {
                left: '10%',
                right: '10%',
                bottom: '15%',
                containLabel: true
            },
            xAxis: {
                type: 'category',
                data: dateLabels,
                axisLabel: {
                    rotate: 90,
                    color: 'black',
                    fontSize: 10
                },
                axisLine: { lineStyle: { color: 'black' } },
                axisTick: { alignWithLabel: true }
            },
            yAxis: [
                {
                    type: 'value',
                    name: 'Energy (kWh)',
                    position: 'left',
                    min: 0, max: 300, interval: 100,
                    axisLabel: { color: 'black', fontSize: 11 },
                    axisLine: { lineStyle: { color: 'black' } },
                    splitLine: { show: false }
                },
                {
                    type: 'value',
                    name: 'Efficiency (%)',
                    position: 'right',
                    min: 0, max: 40, interval: 5,
                    axisLabel: { color: 'black', fontSize: 11 },
                    axisLine: { lineStyle: { color: 'black' } },
                    splitLine: { show: false }
                }
            ],
            series: [
                {
                    name: 'Solar (input)',
                    type: 'bar',
                    barWidth: '30%',
                    data: data.map(row => row['E_solar [kWh]']),
                    itemStyle: { color: color_solar, borderColor: 'black', borderWidth: 0.8 },
                    yAxisIndex: 0
                },
                {
                    name: 'Fuel (output)',
                    type: 'bar',
                    barWidth: '30%',
                    stack: 'energy_output', // Stack Fuel and Heat
                    data: data.map(row => row['E_fuel [kWh]']),
                    itemStyle: { color: color_fuel_bar, borderColor: 'black', borderWidth: 0.8 },
                    yAxisIndex: 0
                },
                {
                    name: 'Heat (output)',
                    type: 'bar',
                    barWidth: '30%',
                    stack: 'energy_output',
                    data: data.map(row => row['E_heat [kWh]']),
                    itemStyle: { color: color_heat_bar, borderColor: 'black', borderWidth: 0.8 },
                    yAxisIndex: 0
                },
                {
                    name: 'Heat system efficiency',
                    type: 'line',
                    data: data.map(row => row['Heat system efficiency [%]']),
                    yAxisIndex: 1,
                    symbol: 'rect', // Square marker
                    symbolSize: 6,
                    itemStyle: { color: color_heat_line, borderColor: color_heat_line },
                    lineStyle: { width: 1.5, color: color_heat_line }
                },
                {
                    name: 'Fuel system efficiency',
                    type: 'line',
                    data: data.map(row => row['Fuel system efficiency (HHV) [%]']),
                    yAxisIndex: 1,
                    symbol: 'triangle', // HHV
                    symbolSize: 7,
                    itemStyle: { color: color_fuel_line, borderColor: color_fuel_line },
                    lineStyle: { width: 1.5, color: color_fuel_line }
                },
                {
                    name: 'Fuel system efficiency (Gibbs)', // Separate legend entry for Gibbs
                    type: 'line',
                    data: data.map(row => row['Fuel system efficiency (Gibbs) [%]']),
                    yAxisIndex: 1,
                    symbol: 'triangle', // Triangle marker
                    symbolSize: 7,
                    itemStyle: { color: color_fuel_line, borderColor: color_fuel_line },
                    lineStyle: { width: 1.5, type: 'dashed', color: color_fuel_line },
                    legendHoverLink: false, // Don't highlight line if main fuel legend is hovered
                    showInLegend: false // Hide from legend
                },
                {
                    name: 'IPEC device efficiency',
                    type: 'line',
                    data: data.map(row => row['IPEC device efficiency (HHV) [%]']),
                    yAxisIndex: 1,
                    symbol: 'triangle', // Triangle marker
                    symbolSize: 7,
                    itemStyle: { color: color_ipec_line, borderColor: color_ipec_line },
                    lineStyle: { width: 1.5, color: color_ipec_line }
                },
                {
                    name: 'IPEC device efficiency (Gibbs)', // Separate legend entry for Gibbs
                    type: 'line',
                    data: data.map(row => row['IPEC device efficiency (Gibbs) [%]']),
                    yAxisIndex: 1,
                    symbol: 'triangle', // Triangle marker
                    symbolSize: 7,
                    itemStyle: { color: color_ipec_line, borderColor: color_ipec_line },
                    lineStyle: { width: 1.5, type: 'dashed', color: color_ipec_line },
                    legendHoverLink: false, // Don't highlight line if main ipec legend is hovered
                    showInLegend: false // Hide from legend
                }
            ]
        };

        chart.setOption(option); // Initial chart render

        // Function to create and update graphic elements (annotations)
        function updateGraphicElements() {
            // Index for annotation (around 2021-03-05, which is index 11)
            // data.length - 2 is 11 (13 elements, 0-indexed)
            const idx_anno = data.length - 2; 

            // Get data values for annotations
            const y_enthalpy = data[idx_anno]['IPEC device efficiency (HHV) [%]'];
            const y_gibbs = data[idx_anno]['IPEC device efficiency (Gibbs) [%]'];

            return [
                { type: 'text', left: 10, top: 10, style: { text: 'a', font: 'bold 24px Arial' } },
                // Annotations for Enthalpy/Gibbs
                // Enthalpy (solid blue line)
                {
                    type: 'text',
                    x: chart.convertToPixel('grid', [idx_anno, y_enthalpy])[0] - 100, // Roughly position
                    y: chart.convertToPixel('grid', [idx_anno, y_enthalpy])[1] - 30,
                    style: { text: 'Enthalpy', fontSize: 12, color: '#222222' }
                },
                // Gibbs (dashed blue line)
                {
                    type: 'text',
                    x: chart.convertToPixel('grid', [idx_anno, y_gibbs])[0] - 80,
                    y: chart.convertToPixel('grid', [idx_anno, y_gibbs])[1] + 20,
                    style: { text: 'Gibbs', fontSize: 12, color: '#222222' }
                },
                {
                    type: 'line',
                    shape: {
                        x1: chart.convertToPixel('grid', [idx_anno, y_enthalpy])[0] - 80,
                        y1: chart.convertToPixel('grid', [idx_anno, y_enthalpy])[1] - 20,
                        x2: chart.convertToPixel('grid', [idx_anno, y_enthalpy])[0] - 10,
                        y2: chart.convertToPixel('grid', [idx_anno, y_enthalpy])[1] - 5
                    },
                    style: { stroke: '#274e13', lineWidth: 1.5, arrow: { show: true } }
                },
                {
                    type: 'line',
                    shape: {
                        x1: chart.convertToPixel('grid', [idx_anno, y_gibbs])[0] - 60,
                        y1: chart.convertToPixel('grid', [idx_anno, y_gibbs])[1] + 10,
                        x2: chart.convertToPixel('grid', [idx_anno, y_gibbs])[0] - 10,
                        y2: chart.convertToPixel('grid', [idx_anno, y_gibbs])[1] + 5
                    },
                    style: { stroke: '#274e13', lineWidth: 1.5, arrow: { show: true } }
                }
            ];
        }

        // Apply graphic elements after the chart has rendered
        chart.setOption({ graphic: updateGraphicElements() });

        // Update graphic elements on resize
        window.addEventListener('resize', () => {
            chart.resize();
            chart.setOption({ graphic: updateGraphicElements() });
        });
    </script>
</body>
</html>
