        const rawData = chartData.plot_data.map(d => ({
            model: d["Model"],
            cat: d["Task Category"],
            auroc: d["AUROC"],
            k_sites: d["k_Sites"]
        })).filter(d => d.k_sites != null && !isNaN(d.k_sites));

        const colors = {
            'Morphology': '#563668',
            'Biomarker': '#BC6C93',
            'Prognosis': '#8E4D56'
        };

        // Linear Regression Helper
        function linearRegression(x, y) {
            const n = x.length;
            let sumX = 0, sumY = 0, sumXY = 0, sumXX = 0;
            for (let i = 0; i < n; i++) {
                sumX += x[i];
                sumY += y[i];
                sumXY += x[i] * y[i];
                sumXX += x[i] * x[i];
            }
            const slope = (n * sumXY - sumX * sumY) / (n * sumXX - sumX * sumX);
            const intercept = (sumY - slope * sumX) / n;
            return { slope, intercept };
        }

        const categories = ['Morphology', 'Biomarker', 'Prognosis'];
        const series = [];

        categories.forEach(cat => {
            const catData = rawData.filter(d => d.cat === cat && !isNaN(d.k_sites))
                                   .map(d => [d.k_sites, d.auroc]);
            
            // Sort by X
            catData.sort((a, b) => a[0] - b[0]);

            const xValues = catData.map(d => d[0]);
            const yValues = catData.map(d => d[1]);

            // Calculate Stats using JSON
            const stat = chartData.stats_data.find(s => s.category === cat);
            const r = stat ? stat.r : 0;
            const p = stat ? stat.p : 0;
            
            let pStr = p.toFixed(2);
            if (cat === 'Morphology') pStr = p.toFixed(3);

            const label = `${cat} (r = ${r.toFixed(2)}, P = ${pStr})`;

            // Calculate Regression Line Points
            // Range 0 to 180
            const reg = linearRegression(xValues, yValues);
            const lineData = [
                [0, reg.intercept],
                [180, reg.slope * 180 + reg.intercept]
            ];

            // Scatter Series
            series.push({
                name: label,
                type: 'scatter',
                data: catData,
                itemStyle: { color: colors[cat], opacity: 0.9, borderColor: 'none' },
                symbolSize: 10,
                z: 10
            });

            // Regression Line Series
            series.push({
                name: label, // Same name to be linked conceptually, but we filter legend
                type: 'line',
                data: lineData,
                symbol: 'none',
                lineStyle: { color: colors[cat], width: 2 },
                silent: true,
                tooltip: { show: false },
                z: 1
            });
        });

        const option = {
