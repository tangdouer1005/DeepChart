        const errorData = [];
        const scatterData = [];

        stageOrder.forEach((stage, idx) => {
            const data = groupedData[stage];
            barData.push({
                value: data.mean,
                itemStyle: { color: '#E0E0E0', borderColor: 'black', borderWidth: 1 } // Light grey bars
            });

            errorData.push([idx, data.mean - data.sem, data.mean + data.sem]);

            data.values.forEach(val => {
                const jitter = (Math.random() - 0.5) * 0.4; // Adjust jitter strength
                scatterData.push({
                    value: [idx + jitter, val],
                    itemStyle: { color: customPalette[stage], opacity: 0.5, borderColor: '#404040', borderWidth: 1 }, // Custom color for points
                    symbolSize: 10
                });
            });
        });

        const option = {
            backgroundColor: 'white',
            grid: { top: 60, bottom: 60, left: 80, right: 80 },
            xAxis: {
                type: 'category',
                data: stageOrder,
                axisLabel: { color: 'black', fontSize: 12 },
                axisLine: { lineStyle: { color: 'black' } },
                axisTick: { show: true }
            },
            yAxis: {
                type: 'value',
                name: 'Plate waste amount (g per capita per meal)',
                nameLocation: 'middle',
                nameGap: 50,
                min: 0,
                max: 320,
                interval: 40,
                axisLabel: { color: 'black', fontSize: 12 },
                axisLine: { lineStyle: { color: 'black' } },
                axisTick: { show: true },
                splitLine: { show: false }
            },
            series: [
                {
                    type: 'bar',
                    data: barData,
                    barWidth: '50%',
                    z: 1
                },
                {
                    type: 'custom',
                    renderItem: function(params, api) {
                        const xVal = api.value(0);
                        const low = api.value(1);
                        const high = api.value(2);
                        const style = api.style({ stroke: 'black', lineWidth: 1 });
                        const xCoord = api.coord([xVal, high])[0];
                        const lowCoord = api.coord([xVal, low]);
                        const highCoord = api.coord([xVal, high]);
                        const capSize = 10;

                        return {
                            type: 'group',
                            children: [
                                { type: 'line', shape: { x1: lowCoord[0], y1: lowCoord[1], x2: highCoord[0], y2: highCoord[1] }, style: style },
                                { type: 'line', shape: { x1: xCoord - capSize/2, y1: lowCoord[1], x2: xCoord + capSize/2, y2: lowCoord[1] }, style: style },
                                { type: 'line', shape: { x1: xCoord - capSize/2, y1: highCoord[1], x2: xCoord + capSize/2, y2: highCoord[1] }, style: style }
                            ]
                        };
                    },
                    data: errorData,
                    z: 2
                },
                {
                    type: 'scatter',
                    data: scatterData,
                    symbolSize: 10,
                    z: 3
                }
            ],
            graphic: [
                {
                    type: 'text',
                    left: 10, top: 10,
                    style: { text: 'a', font: 'bold 20px Arial', fill: 'black' }
                }
            ]
        };

        chart.setOption(option);
    </script>
</body>
</html>
