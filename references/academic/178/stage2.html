        const nsfData = data.df_nsf;

            };

        const nsfcScatter = nsfcData.map(d => {

            };

        // --- Statistics Helper ---
        const Stat = {
            sum: function(arr) { return arr.reduce((a, b) => a + b, 0); },
            mean: function(arr) { return this.sum(arr) / arr.length; },
            median: function(arr) {
                const sorted = [...arr].sort((a, b) => a - b);
                const mid = Math.floor(sorted.length / 2);
                return sorted.length % 2 !== 0 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
            },
            variance: function(arr) {
                const m = this.mean(arr);
                return this.sum(arr.map(v => (v - m) ** 2)) / (arr.length - 1);
            },
            stddev: function(arr) { return Math.sqrt(this.variance(arr)); },
            covariance: function(arr1, arr2) {
                const m1 = this.mean(arr1);
                const m2 = this.mean(arr2);
                let sum = 0;
                for (let i = 0; i < arr1.length; i++) {
                    sum += (arr1[i] - m1) * (arr2[i] - m2);
                }
                return sum / (arr1.length - 1);
            },
            corrcoeff: function(arr1, arr2) {
                const cov = this.covariance(arr1, arr2);
                const std1 = this.stddev(arr1);
                const std2 = this.stddev(arr2);
                return cov / (std1 * std2);
            },
            // Log Gamma Function (Lanczos approximation)
            logGamma: function(x) {
                const c = [76.18009172947146, -86.50532032941677, 24.01409824083091,
                     -1.231739572450155, 0.1208650973866179e-2, -0.5395239384953e-5];
                let step = 2.5066282746310005;
                let z = x;
                let s = step;
                for (let i = 0; i < 6; i++) {
                    z += 1;
                    s += c[i] / z;
                }
                return (x + 0.5) * Math.log(x + 5.5) - (x + 5.5) + Math.log(s / x);
            },
            // Regularized Incomplete Beta Function
            betainc: function(x, a, b) {
                if (x === 0 || x === 1) return x;
                if (x > (a + 1) / (a + b + 2)) return 1 - this.betainc(1 - x, b, a);
                
                const lbeta = this.logGamma(a) + this.logGamma(b) - this.logGamma(a + b);
                const front = Math.exp(Math.log(x) * a + Math.log(1 - x) * b - lbeta) / a;
                
                let f = 1.0, c = 1.0, d = 0.0;
                for (let i = 1; i <= 200; i++) {
                    let m = Math.floor(i / 2);
                    let numer;
                    if (i % 2 === 0) {
                        numer = m * (b - m) * x / ((a + 2 * m - 1) * (a + 2 * m));
                    } else {
                        numer = -(a + m) * (a + b + m) * x / ((a + 2 * m) * (a + 2 * m + 1));
                    }
                    d = 1.0 + numer * d;
                    if (Math.abs(d) < 1e-30) d = 1e-30;
                    d = 1.0 / d;
                    c = 1.0 + numer / c;
                    if (Math.abs(c) < 1e-30) c = 1e-30;
                    const cd = c * d;
                    f *= cd;
                    if (Math.abs(1.0 - cd) < 1e-8) break;
                }
                return front * (f - 1.0 + 1.0);
            },
            // Student's t CDF
            tCdf: function(t, df) {
                const x = df / (df + t * t);
                return 1 - 0.5 * this.betainc(x, df / 2, 0.5);
            },
            // Student's t Inverse CDF (Approximation for 95% CI/two-tailed 0.05)
            tCrit95: function(df) {
                // Table lookup for two-tailed alpha=0.05
                if (df >= 100) return 1.984;
                if (df >= 80) return 1.990;
                if (df >= 60) return 2.000;
                if (df >= 50) return 2.009;
                if (df >= 40) return 2.021;
                if (df >= 30) return 2.042;
                if (df >= 20) return 2.086;
                if (df >= 10) return 2.228;
                return 2.571; // df=5 or fallback
            }
        };

        // Statistics and Regression Analysis
        function calculateStats(data) {
            try {
                if (!data || data.length < 2) return null;
                const x = data.map(d => d.value[0]);
                const y = data.map(d => d.value[1]);
                const n = x.length;

                // 1. Basic Correlation and P-value
                const r = Stat.corrcoeff(x, y);
                if (isNaN(r)) return null;

                // t-statistic for correlation
                const t_r = r * Math.sqrt((n - 2) / (1 - r * r));
                const p = 2 * (1 - Stat.tCdf(Math.abs(t_r), n - 2));

                // 2. Linear Regression (OLS)
                const xMean = Stat.mean(x);
                const yMean = Stat.mean(y);
                
                // Sxx = sum((x - xMean)^2)
                const Sxx = Stat.sum(x.map(v => Math.pow(v - xMean, 2)));
                // Sxy = sum((x - xMean)(y - yMean))
                const Sxy = Stat.sum(x.map((v, i) => (v - xMean) * (y[i] - yMean)));
                
                if (Sxx === 0) return null; // Avoid division by zero

                const slope = Sxy / Sxx;
                const intercept = yMean - slope * xMean;

                // 3. Confidence Interval Prep
                // Calculate Standard Error of Estimate (SE)
                const yPred = x.map(v => slope * v + intercept);
                const SSE = Stat.sum(y.map((v, i) => Math.pow(v - yPred[i], 2)));
                const se = Math.sqrt(SSE / (n - 2));

                // Critical t value for 95% CI
                const tCrit = Stat.tCrit95(n - 2);

                // 4. Generate Line and Band Points
                // Plot range
                const plotMinX = -0.05;
                const plotMaxX = 1.05;
                const steps = 100;
                const stepSize = (plotMaxX - plotMinX) / steps;
                
                const lineData = [];
                const bandData = [];

                for (let i = 0; i <= steps; i++) {
                    const cx = plotMinX + i * stepSize;
                    const cy = slope * cx + intercept;
                    
                    // CI Width Formula: t * SE * sqrt(1/n + (x - x_bar)^2 / Sxx)
                    const dist = se * Math.sqrt(1/n + Math.pow(cx - xMean, 2) / Sxx);
                    const ciVal = tCrit * dist;
                    
                    lineData.push([cx, cy]);
                    // Store [x, yMin, yMax] for custom renderer
                    bandData.push([cx, cy - ciVal, cy + ciVal]);
                }

                return {
                    r, p, slope, intercept,
                    lineData, bandData
                };
            } catch (e) {
                console.error("Calculation failed", e);
                return null;
            }
        }

        const statsNSF_calc = calculateStats(nsfScatter) || { r:0, p:0, lineData: [], bandData: [] };
        const statsNSFC_calc = calculateStats(nsfcScatter) || { r:0, p:0, lineData: [], bandData: [] };

        const statsNSF = {
            ...statsNSF_calc,
            r: data.r_nsf,
            p: data.p_nsf
        };
        const statsNSFC = {
            ...statsNSFC_calc,
            r: data.r_nsfc,
            p: data.p_nsfc
        };

        // Medians
        /* const allGdp = [...nsfData.map(d=>d.gdp), ...nsfcData.map(d=>d.gdp)];
        const allFund = [...nsfData.map(d=>d.fund), ...nsfcData.map(d=>d.fund)];
        const medianGdp = Stat.median(allGdp);
        const medianFund = Stat.median(allFund); */
        
        const medianGdp = data.median_gdp;
        const medianFund = data.median_fund;

        const chart = echarts.init(document.getElementById('chart-container'));

        // Custom Render Function Factory
        // Using closure to access bandData, avoiding params.data.customData usage
        function createRenderItem(bandData) {
            return function(params, api) {
                if (!bandData || bandData.length === 0) return;
                
                var pointsLower = [];
                var pointsUpper = [];
                
                for (var i = 0; i < bandData.length; i++) {
                    var pt = bandData[i];
                    var x = pt[0];
                    var yLo = pt[1];
                    var yHi = pt[2];
                    
                    var ptLo = api.coord([x, yLo]);
                    var ptHi = api.coord([x, yHi]);
                    
                    if (isNaN(ptLo[0]) || isNaN(ptLo[1]) || isNaN(ptHi[0]) || isNaN(ptHi[1])) continue;

                    pointsLower.push(ptLo);
                    pointsUpper.push(ptHi);
                }
                
                if (pointsLower.length === 0) return;

                var polygonPoints = pointsLower.concat(pointsUpper.reverse());
                
                return {
                    type: 'polygon',
                    shape: {
                        points: polygonPoints
                    },
                    style: api.style({
                        fill: api.visual('color'),
                        stroke: null,
                        opacity: 0.2
                    })
                };
            };
        }

        const option = {
            backgroundColor: 'white',
            grid: { top: 50, right: 50, bottom: 50, left: 60 },
            xAxis: {
                name: 'GDP (normalized)',
                nameLocation: 'middle',
                nameGap: 30,
                type: 'value',
                min: -0.05, max: 1.05,
                splitLine: { show: true, lineStyle: { color: '#E0E0E0' } },
                axisLine: { show: true, lineStyle: { color: 'black' } }
            },
            yAxis: {
                name: 'Funds (normalized)',
                nameLocation: 'middle',
                nameGap: 40,
                type: 'value',
                min: -0.15, max: 1.05,
                splitLine: { show: true, lineStyle: { color: '#E0E0E0' } },
                axisLine: { show: true, lineStyle: { color: 'black' } }
            },
            legend: {
                bottom: 20, right: 20,
                orient: 'vertical',
                data: [
                    { name: `NSF (r=${statsNSF.r.toFixed(3)}, P=${statsNSF.p.toFixed(3)})`, icon: 'circle' },
                    { name: `NSFC (r=${statsNSFC.r.toFixed(3)}, P=${statsNSFC.p.toFixed(3)})`, icon: 'circle' }
                ],
                textStyle: { fontSize: 12 }
            },
            series: [
                // NSF Band (Custom)
                {
                    name: `NSF (r=${statsNSF.r.toFixed(3)}, P=${statsNSF.p.toFixed(3)})`,
                    type: 'custom',
                    renderItem: createRenderItem(statsNSF.bandData),
                    itemStyle: { color: '#1f77b4' },
                    data: [[0,0]], // Dummy data to trigger renderItem once
                    z: 1,
                    silent: true,
                    tooltip: { show: false }
                },
                // NSFC Band (Custom)
                {
                    name: `NSFC (r=${statsNSFC.r.toFixed(3)}, P=${statsNSFC.p.toFixed(3)})`,
                    type: 'custom',
                    renderItem: createRenderItem(statsNSFC.bandData),
                    itemStyle: { color: '#ff7f0e' },
                    data: [[0,0]], // Dummy data
                    z: 1,
                    silent: true,
                    tooltip: { show: false }
                },

                // NSF Line
                {
                    type: 'line',
                    data: statsNSF.lineData,
                    symbol: 'none',
                    lineStyle: { color: '#1f77b4', width: 2 },
                    z: 2,
                    silent: true
                },
                // NSFC Line
                {
                    type: 'line',
                    data: statsNSFC.lineData,
                    symbol: 'none',
                    lineStyle: { color: '#ff7f0e', width: 2 },
                    z: 2,
                    silent: true
                },
                // NSF Scatter
                {
                    name: `NSF (r=${statsNSF.r.toFixed(3)}, P=${statsNSF.p.toFixed(3)})`,
                    type: 'scatter',
                    data: nsfScatter,
                    itemStyle: { color: 'transparent', borderColor: '#1f77b4', borderWidth: 1.5 },
                    symbolSize: 8,
                    label: {
                        show: true,
                        formatter: '{b}',
                        position: 'top',
                        color: 'black',
                        fontSize: 10
                    },
                    z: 3
                },
                // NSFC Scatter
                {
                    name: `NSFC (r=${statsNSFC.r.toFixed(3)}, P=${statsNSFC.p.toFixed(3)})`,
                    type: 'scatter',
                    data: nsfcScatter,
                    itemStyle: { color: 'transparent', borderColor: '#ff7f0e', borderWidth: 1.5 },
                    symbolSize: 8,
                    label: {
                        show: true,
                        formatter: '{b}',
                        position: 'top',
                        color: 'black',
                        fontSize: 10
                    },
                    z: 3
                },
                // Median Lines
                {
                    type: 'line',
                    markLine: {
                        silent: true,
                        symbol: 'none',
                        data: [
                            { xAxis: medianGdp, label: { formatter: 'GDP\nmedian', position: 'end' } },
                            { yAxis: medianFund, label: { formatter: 'Funds\nmedian', position: 'end' } }
                        ],
                        lineStyle: { type: 'dashed', color: 'gray', width: 1.5 }
                    }
                }
            ]
        };

        chart.setOption(option);
    </script>
