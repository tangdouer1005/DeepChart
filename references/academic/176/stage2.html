<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nature Chart Reproduction</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
    <style>
        body { margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #ffffff; font-family: Arial, sans-serif; }
        #chart-container { width: 800px; height: 800px; }
    </style>
</head>
<body>
    <div id="chart-container"></div>
    <script>
        // Data
        const data = {
    "labels": [
        "Exploring social and behavioral impacts",
        "Enhancing urban efficiency",
        "Deploying smart city infrastructure",
        "Data-driven hypothesis testing",
        "Commercial products or services",
        "Collaboration with industry and government",
        "Building practical solutions",
        "Understanding urban dynamics",
        "Theoretical framework development",
        "Technological innovation",
        "System integration",
        "Supporting scalability and commercialization",
        "Modeling and simulation",
        "Quantitative and qualitative analysis",
        "Prototyping and testing",
        "New theoretical insights",
        "Multidisciplinary collaboration",
        "Iterative design and development",
        "Investigating long-term trends",
        "Improved city services",
        "Identification of knowledge gaps",
        "Guidance for policymakers",
        "Functioning prototypes or systems",
        "Frameworks and models"
    ],
    "nsf_values": [
        87,
        91,
        7,
        95,
        105,
        8,
        23,
        103,
        14,
        1,
        88,
        9,
        101,
        21,
        17,
        111,
        11,
        11,
        87,
        92,
        87,
        25,
        20,
        86
    ],
    "nsfc_values": [
        8,
        28,
        87,
        56,
        60,
        72,
        112,
        82,
        86,
        70,
        5,
        81,
        3,
        80,
        83,
        12,
        98,
        109,
        3,
        25,
        14,
        143,
        88,
        98
    ]
};

        /* const nsfData = [86,87,91,7,95,105,8,23,103,14,1,88,9,101,21,17,111,11,11,87,92,87,25,20];
        const nsfcData = [98,8,28,87,56,60,72,112,82,86,70,5,81,3,80,83,12,98,109,3,25,14,143,88];
        const labels = [ ... ]; */

        // Shift data to match Python script logic (start from F2 at top clockwise)
        // Original: [F1, F2, ..., F24]
        // Shifted: [F2, F3, ..., F24, F1]
        // Note: ECharts polar angle starts from 12 o'clock if startAngle is 90 and clockwise is true.
        // Python code: starts at North, clockwise.
        // First sector (0-15deg) contains F2?
        // Python: angles = np.linspace(0, 2pi) + shift.
        // labels_shifted = labels_ordered[1:] + labels_ordered[:1] -> F2 is first.
        
        // const labelsShifted = [...labels.slice(1), labels[0]];
        // const nsfShifted = [...nsfData.slice(1), nsfData[0]];
        // const nsfcShifted = [...nsfcData.slice(1), nsfcData[0]];

        const labelsShifted = data.labels;
        const nsfShifted = data.nsf_values;
        const nsfcShifted = data.nsfc_values;

        const chart = echarts.init(document.getElementById('chart-container'));

        const option = {
            backgroundColor: 'white',
            legend: {
                data: ['NSF (n = 179)', 'NSFC (n = 196)'],
                bottom: 20,
                left: 20,
                orient: 'vertical',
                itemWidth: 15,
                itemHeight: 15,
                textStyle: { fontSize: 14 }
            },
            polar: {
                radius: ['0%', '70%'],
                center: ['50%', '50%']
            },
            angleAxis: {
                type: 'category',
                data: labelsShifted,
                startAngle: 90 + (360/24/2), // Center the first sector at 12 o'clock?
                // Python: angles = linspace(0, 2pi) + pi/24. 0 is North.
                // ECharts: 90 is North. Clockwise true.
                // We want first item centered at first sector.
                // Sector 1: 0 - 15 deg (clockwise from top). Center 7.5 deg.
                // ECharts bar on category axis centers on tick.
                // So if we set startAngle to 90, the first item is at 90 (North).
                // But we want it in the sector?
                // If boundaryGap is true (default), item is between ticks.
                // The first item F2 will be between 90 and (90-15). Center 82.5.
                // Python code centers at 7.5 deg clockwise from North.
                // So 90 - 7.5 = 82.5 deg.
                // If boundaryGap is true, and we have 24 items, each is 15 deg.
                // First item is at index 0. ECharts places index 0 at startAngle + halfBand? Or just startAngle?
                // Actually, ECharts polar bar places bars centered on the angle if axis is value, or in band if category.
                // Let's use startAngle 90.
                clockwise: true,
                boundaryGap: true, // Bars between ticks
                axisLine: { show: false },
                axisTick: { show: true, alignWithLabel: false, interval: 0, lineStyle: { color: 'gray' } },
                axisLabel: {
                    interval: 0,
                    fontSize: 11,
                    formatter: function(value, index) {
                        return value; // Formatting handled by ECharts auto-rotate usually, but polar labels are tricky
                    },
                    margin: 10 // Distance from axis
                },
                splitLine: { show: true, lineStyle: { color: 'gray', width: 0.5 } }
            },
            radiusAxis: {
                min: 0,
                max: 160,
                axisLabel: { show: false },
                axisLine: { show: false },
                axisTick: { show: false },
                splitLine: { show: false } // We draw custom circles
            },
            series: [
                {
                    type: 'bar',
                    name: 'NSF (n = 179)',
                    data: nsfShifted,
                    coordinateSystem: 'polar',
                    itemStyle: { color: '#9ebcda', opacity: 0.9 },
                    barGap: 0, // Bars side by side? Or overlapping?
                    // Python code: ax.bar(angles - width/2) and ax.bar(angles + width/2). Side by side.
                    // ECharts: if multiple series on category polar, they stack or dodge?
                    // Default is dodge (side-by-side) if stack is not set.
                    barWidth: '40%' // Adjust width
                },
                {
                    type: 'bar',
                    name: 'NSFC (n = 196)',
                    data: nsfcShifted,
                    coordinateSystem: 'polar',
                    itemStyle: { color: '#fdbf6f', opacity: 0.9 },
                    barWidth: '40%'
                },
                // Custom rings
                {
                    type: 'custom',
                    coordinateSystem: 'polar',
                    renderItem: function(params, api) {
                        // Draw dashed circles at 80 and 100
                        const center = api.coord([0, 0]); // Center of polar
                        const r80 = api.coord([0, 80])[2]; // Radius for value 80
                        const r100 = api.coord([0, 100])[2];
                        const r160 = api.coord([0, 160])[2];
                        
                        return {
                            type: 'group',
                            children: [
                                {
                                    type: 'circle',
                                    shape: { cx: center[0], cy: center[1], r: r80 },
                                    style: { fill: 'none', stroke: '#5B9BD5', lineWidth: 1, lineDash: [4, 4] }
                                },
                                {
                                    type: 'circle',
                                    shape: { cx: center[0], cy: center[1], r: r100 },
                                    style: { fill: 'none', stroke: '#ED7D31', lineWidth: 1, lineDash: [4, 4] }
                                },
                                {
                                    type: 'circle',
                                    shape: { cx: center[0], cy: center[1], r: r160 },
                                    style: { fill: 'none', stroke: 'black', lineWidth: 1 }
                                }
                            ]
                        };
                    },
                    data: [0], // Run once
                    z: 0
                }
            ],
            graphic: [
                {
                    type: 'text',
                    left: 0,
                    top: 0,
                    style: {
                        text: 'a',
                        font: 'bold 24px Arial',
                        fill: 'black'
                    }
                }
            ]
        };

        chart.setOption(option);
    </script>
</body>
</html>
