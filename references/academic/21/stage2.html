        const rawData = chartData.plot_data.map(d => ({
            model: d["Model"],
            cat: d["Task Category"],
            auroc: d["Average Downstream Performance (AUROC)"],
            patients: d["Pretraining Dataset (k Patients)"]
        })).filter(d => d.patients != null && !isNaN(d.patients));

        const colors = {
            'Morphology': '#5D3A75', // Purple
            'Biomarker': '#C06C84',  // Pink/Red
            'Prognosis': '#8C4646'   // Brown/Red
        };

        // Linear Regression Helper
        function linearRegression(x, y) {
            const n = x.length;
            let sumX = 0, sumY = 0, sumXY = 0, sumXX = 0;
            for (let i = 0; i < n; i++) {
                sumX += x[i];
                sumY += y[i];
                sumXY += x[i] * y[i];
                sumXX += x[i] * x[i];
            }
            const slope = (n * sumXY - sumX * sumY) / (n * sumXX - sumX * sumX);
            const intercept = (sumY - slope * sumX) / n;
            return { slope, intercept };
        }

        const categories = ['Morphology', 'Biomarker', 'Prognosis'];
        const series = [];

        categories.forEach(cat => {
            const catData = rawData.filter(d => d.cat === cat && !isNaN(d.patients))
                                   .map(d => [d.patients, d.auroc]);
            
            // Sort by X for line drawing order (optional but good practice)
            catData.sort((a, b) => a[0] - b[0]);

            const xValues = catData.map(d => d[0]);
            const yValues = catData.map(d => d[1]);

            // Calculate Stats using JSON data
            const stat = chartData.stats_data.find(s => s.category === cat);
            const r = stat ? stat.r : 0;
            const p = stat ? stat.p : 0;
            
            let pStr = p.toFixed(2);
            if (cat === 'Morphology') pStr = p.toFixed(3);
            if (cat === 'Biomarker') pStr = p.toFixed(1);

            const label = `${cat} (r = ${r.toFixed(2)}, P = ${pStr})`;

            // Calculate Regression Line Points
            const reg = linearRegression(xValues, yValues);
            // Points at extreme ends of x-axis or just data range? 
            // Usually regression lines span the data range or slightly more.
            // Let's use 0 to 350 to cover the whole chart width as is common in trend lines
            const lineData = [
                [0, reg.intercept],
                [350, reg.slope * 350 + reg.intercept]
            ];

            // Scatter Series
            series.push({
                name: label,
                type: 'scatter',
                data: catData,
                itemStyle: { color: colors[cat], opacity: 0.9 },
                symbolSize: 15,
                z: 10
            });

            // Regression Line Series
            series.push({
                name: label, // Same name to link in legend (though ECharts treats scatter/line separate usually)
                type: 'line',
                data: lineData,
                symbol: 'none',
                lineStyle: { color: colors[cat], width: 3 },
                silent: true,
                tooltip: { show: false },
                z: 1
            });
        });
