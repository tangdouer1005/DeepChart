<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nature Chart Reproduction</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
    <style>
        body { margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #ffffff; font-family: Arial, sans-serif; }
        #chart-container { width: 500px; height: 800px; }
    </style>
</head>
<body>
    <div id="chart-container"></div>
    <script>
        const data = [
    {
        "state":"AZ",
        "number_of_HighAging_CBG":256,
        "mean_coeff":0.0416104,
        "lower_diff":0.0301044,
        "upper_diff":0.0301044
    },
    {
        "state":"CA",
        "number_of_HighAging_CBG":204,
        "mean_coeff":0.02642,
        "lower_diff":0.02931166,
        "upper_diff":0.0293117
    },
    {
        "state":"FL",
        "number_of_HighAging_CBG":816,
        "mean_coeff":0.101302,
        "lower_diff":0.0156139,
        "upper_diff":0.015614
    },
    {
        "state":"IL",
        "number_of_HighAging_CBG":35,
        "mean_coeff":0.113924,
        "lower_diff":0.0686203,
        "upper_diff":0.06862
    },
    {
        "state":"MA",
        "number_of_HighAging_CBG":33,
        "mean_coeff":0.0225781,
        "lower_diff":0.0737867,
        "upper_diff":0.0737866
    },
    {
        "state":"MD",
        "number_of_HighAging_CBG":37,
        "mean_coeff":0.0645935,
        "lower_diff":0.0665685,
        "upper_diff":0.0665685
    },
    {
        "state":"MI",
        "number_of_HighAging_CBG":30,
        "mean_coeff":-0.038676,
        "lower_diff":0.078907,
        "upper_diff":0.0789073
    },
    {
        "state":"NJ",
        "number_of_HighAging_CBG":104,
        "mean_coeff":-0.00339812,
        "lower_diff":0.03716238,
        "upper_diff":0.03716242
    },
    {
        "state":"NV",
        "number_of_HighAging_CBG":37,
        "mean_coeff":0.173388,
        "lower_diff":0.0756044,
        "upper_diff":0.075604
    },
    {
        "state":"NY",
        "number_of_HighAging_CBG":72,
        "mean_coeff":0.0142738,
        "lower_diff":0.0485962,
        "upper_diff":0.0485962
    },
    {
        "state":"OH",
        "number_of_HighAging_CBG":36,
        "mean_coeff":0.0139469,
        "lower_diff":0.0664242,
        "upper_diff":0.0664243
    },
    {
        "state":"PA",
        "number_of_HighAging_CBG":48,
        "mean_coeff":0.0611535,
        "lower_diff":0.05751848,
        "upper_diff":0.0575185
    },
    {
        "state":"SC",
        "number_of_HighAging_CBG":35,
        "mean_coeff":-0.0208797,
        "lower_diff":0.0685779,
        "upper_diff":0.0685778
    },
    {
        "state":"TX",
        "number_of_HighAging_CBG":54,
        "mean_coeff":-0.040371,
        "lower_diff":0.059456,
        "upper_diff":0.059456
    },
    {
        "state":"VA",
        "number_of_HighAging_CBG":32,
        "mean_coeff":0.0733137,
        "lower_diff":0.0677873,
        "upper_diff":0.0677873
    },
    {
        "state":"WA",
        "number_of_HighAging_CBG":30,
        "mean_coeff":0.127218,
        "lower_diff":0.0793767,
        "upper_diff":0.079376
    }
];

        // Sort by state ascending (A-Z) to match python sort
        data.sort((a, b) => a.state.localeCompare(b.state));

        const states = data.map(d => d.state);
        const scatterData = data.map(d => [d.mean_coeff, d.state, d.number_of_HighAging_CBG]);
        
        // Custom error bar data: [x, y, low, high]
        // Calculated from mean_coeff +/- diffs
        const errorData = data.map((d, i) => [
            d.mean_coeff, 
            i, 
            d.mean_coeff - d.lower_diff, 
            d.mean_coeff + d.upper_diff
        ]);

        const chart = echarts.init(document.getElementById('chart-container'));

        const option = {
            backgroundColor: 'white',
            title: {
                text: 'HCS',
                left: 'center',
                top: 10,
                textStyle: { fontSize: 16 }
            },
            grid: {
                top: 50,
                bottom: 60,
                left: 60,
                right: 40
            },
            xAxis: {
                name: 'Coefficient of high-ageing CBGs',
                nameLocation: 'middle',
                nameGap: 30,
                type: 'value',
                min: -0.3,
                max: 0.3,
                interval: 0.1,
                splitLine: { show: false },
                axisLine: { show: true, lineStyle: { color: 'black' } },
                axisLabel: { color: 'black' },
                nameTextStyle: { fontSize: 14 }
            },
            yAxis: {
                name: 'State',
                nameLocation: 'middle',
                nameGap: 40,
                type: 'category',
                data: states,
                axisLine: { show: true, lineStyle: { color: 'black' } },
                axisTick: { show: true, alignWithLabel: true },
                axisLabel: { color: 'black', fontSize: 12 },
                nameTextStyle: { fontSize: 14 }
            },
            series: [
                {
                    // Vertical reference line at x=0
                    type: 'line',
                    markLine: {
                        symbol: 'none',
                        data: [{ xAxis: 0 }],
                        lineStyle: {
                            color: '#D32F2F',
                            type: 'dashed',
                            width: 1.5
                        },
                        label: { show: false },
                        animation: false
                    }
                },
                {
                    type: 'custom',
                    name: 'error_bar',
                    itemStyle: {
                        normal: {
                            borderWidth: 1.5,
                            stroke: 'black'
                        }
                    },
                    renderItem: function (params, api) {
                        const xValue = api.value(0);
                        const yValue = api.value(1);
                        const low = api.value(2);
                        const high = api.value(3);
                        
                        const start = api.coord([low, yValue]);
                        const end = api.coord([high, yValue]);
                        
                        // Height of the caps
                        const halfHeight = 4;

                        const style = api.style({
                            stroke: 'black',
                            lineWidth: 1
                        });

                        return {
                            type: 'group',
                            children: [
                                {
                                    type: 'line',
                                    shape: {
                                        x1: start[0], y1: start[1],
                                        x2: end[0], y2: end[1]
                                    },
                                    style: style
                                },
                                {
                                    type: 'line',
                                    shape: {
                                        x1: start[0], y1: start[1] - halfHeight,
                                        x2: start[0], y2: start[1] + halfHeight
                                    },
                                    style: style
                                },
                                {
                                    type: 'line',
                                    shape: {
                                        x1: end[0], y1: end[1] - halfHeight,
                                        x2: end[0], y2: end[1] + halfHeight
                                    },
                                    style: style
                                }
                            ]
                        };
                    },
                    data: errorData,
                    z: 2
                },
                {
                    type: 'scatter',
                    name: 'scatter',
                    data: scatterData,
                    symbolSize: function (val) {
                        // Python code: sizes = number * 0.25 (Area in points^2)
                        // ECharts symbolSize is diameter in pixels.
                        // D = 2 * sqrt(Area / pi) = 2 * sqrt( (N * 0.25) / pi ) approx 0.56 * sqrt(N)
                        // Using 0.6 multiplier for slightly better visibility while maintaining relative scale.
                        return Math.sqrt(val[2]) * 0.6; 
                    },
                    itemStyle: {
                        color: 'black'
                    },
                    z: 3
                }
            ],
            graphic: [
                {
                    type: 'text',
                    left: 0,
                    top: 0,
                    style: {
                        text: 'a',
                        font: 'bold 20px Arial',
                        fill: 'black'
                    }
                }
            ]
        };

        chart.setOption(option);
    </script>
</body>
</html>
