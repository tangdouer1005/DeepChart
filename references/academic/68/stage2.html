    <script>

        // 4. Optimization (Nelder-Mead)
        function sigmoid(x, params) {
            const [Top, Bottom, LogIC50, HillSlope] = params;
            return Bottom + (Top - Bottom) / (1 + Math.pow(10, (LogIC50 - x) * HillSlope));
        }

        function minimize(func, x0) {
            // Simple Nelder-Mead implementation
            const dim = x0.length;
            const alpha = 1, gamma = 2, rho = 0.5, sigma = 0.5;
            const tol = 1e-6;
            const maxIter = 5000;
            
            let simplex = [];
            simplex.push({ p: x0.slice(), v: func(x0) });
            
            for (let i = 0; i < dim; i++) {
                let p = x0.slice();
                p[i] = p[i] !== 0 ? p[i] * 1.05 : 0.00025;
                simplex.push({ p: p, v: func(p) });
            }
            
            simplex.sort((a, b) => a.v - b.v);
            
            for (let iter = 0; iter < maxIter; iter++) {
                const best = simplex[0];
                const worst = simplex[dim];
                const secondWorst = simplex[dim - 1];
                
                let centroid = new Array(dim).fill(0);
                // Correct centroid calculation
                centroid.fill(0);
                for (let i = 0; i < dim; i++) {
                     for (let j = 0; j < dim; j++) {
                         centroid[j] += simplex[i].p[j];
                     }
                }
                for (let j = 0; j < dim; j++) centroid[j] /= dim;
                
                let xr = new Array(dim);
                for (let j = 0; j < dim; j++) xr[j] = centroid[j] + alpha * (centroid[j] - worst.p[j]);
                let vr = func(xr);
                
                if (vr >= best.v && vr < secondWorst.v) {
                    simplex[dim] = { p: xr, v: vr };
                } else if (vr < best.v) {
                    let xe = new Array(dim);
                    for (let j = 0; j < dim; j++) xe[j] = centroid[j] + gamma * (xr[j] - centroid[j]);
                    let ve = func(xe);
                    simplex[dim] = (ve < vr) ? { p: xe, v: ve } : { p: xr, v: vr };
                } else {
                    let xc = new Array(dim);
                    let vc;
                    if (vr < worst.v) {
                         for (let j = 0; j < dim; j++) xc[j] = centroid[j] + rho * (xr[j] - centroid[j]);
                         vc = func(xc);
                         if (vc < vr) {
                             simplex[dim] = { p: xc, v: vc };
                         } else {
                             shrink();
                         }
                    } else {
                        for (let j = 0; j < dim; j++) xc[j] = centroid[j] + rho * (worst.p[j] - centroid[j]);
                        vc = func(xc);
                        if (vc < worst.v) {
                            simplex[dim] = { p: xc, v: vc };
                        } else {
                            shrink();
                        }
                    }
                }
                
                simplex.sort((a, b) => a.v - b.v);
                if (Math.abs(simplex[0].v - simplex[dim].v) < tol) break;
            }
            
            function shrink() {
                for (let i = 1; i <= dim; i++) {
                    for (let j = 0; j < dim; j++) {
                        simplex[i].p[j] = simplex[0].p[j] + sigma * (simplex[i].p[j] - simplex[0].p[j]);
                    }
                    simplex[i].v = func(simplex[i].p);
                }
            }
            
            return simplex[0].p;
        }

        // 5. Main Logic
        // Helper to convert JSON format to internal structure (array of objects)
        function getGroup(label) {
            const group = chartData.find(g => g.label === label);
            if (!group) return [];
            return group.LogConc.map((logC, i) => ({
                LogConc: logC,
                mean: group.mean[i],
                sem: group.sem[i]
            }));
        }

        const vehicleData = getGroup("Vehicle");
        const vehicleNtData = getGroup("Vehicle + 100 nM NT");
        const sbiData = getGroup("SBI-553 + 100 nM NT");
        const sr14Data = getGroup("SR14 + 100 nM NT");

        const color_vehicle = '#808080';
        const color_vehicle_nt = '#0000CD';
        const color_sbi = '#B030B0';
        const color_sr14 = '#FF8C00';

        const traces = [];

        // Plot Vehicle
        if (vehicleData.length > 0) {
            const mean_vehicle = vehicleData.reduce((acc, d) => acc + d.mean, 0) / vehicleData.length;
            traces.push({
                x: vehicleData.map(d => d.LogConc),
                y: vehicleData.map(d => d.mean),
                type: 'scatter',
                mode: 'markers',
                marker: { color: color_vehicle, size: 8 },
                error_y: {
                    type: 'data',
                    array: vehicleData.map(d => d.sem),
                    visible: true,
                    color: color_vehicle,
                    thickness: 1,
                    width: 0
                },
                name: 'Vehicle',
                showlegend: false
            });
            traces.push({
                x: [-12, -3.5],
                y: [mean_vehicle, mean_vehicle],
                type: 'scatter',
                mode: 'lines',
                line: { color: color_vehicle, width: 2 },
                showlegend: false,
                hoverinfo: 'none'
            });
        }

        // Plot Vehicle + NT
        if (vehicleNtData.length > 0) {
            const mean_vehicle_nt = vehicleNtData.reduce((acc, d) => acc + d.mean, 0) / vehicleNtData.length;
            traces.push({
                x: vehicleNtData.map(d => d.LogConc),
                y: vehicleNtData.map(d => d.mean),
                type: 'scatter',
                mode: 'markers',
                marker: { color: color_vehicle_nt, size: 8 },
                error_y: {
                    type: 'data',
                    array: vehicleNtData.map(d => d.sem),
                    visible: true,
                    color: color_vehicle_nt,
                    thickness: 1,
                    width: 0
                },
                name: 'Vehicle + 100 nM NT',
                showlegend: false
            });
            traces.push({
                x: [-12, -3.5],
                y: [mean_vehicle_nt, mean_vehicle_nt],
                type: 'scatter',
                mode: 'lines',
                line: { color: color_vehicle_nt, width: 2 },
                showlegend: false,
                hoverinfo: 'none'
            });
        }

        // Fit and Plot SBI
        if (sbiData.length > 4) {
            const yMax = Math.max(...sbiData.map(d => d.mean));
            const yMin = Math.min(...sbiData.map(d => d.mean));
            const p0 = [yMax, yMin, -8, 1];
            
            const costFunc = (params) => {
                return sbiData.reduce((sum, d) => {
                    const pred = sigmoid(d.LogConc, params);
                    return sum + Math.pow(d.mean - pred, 2);
                }, 0);
            };
            
            const popt = minimize(costFunc, p0);
            
            const minX = Math.min(...sbiData.map(d => d.LogConc));
            const maxX = Math.max(...sbiData.map(d => d.LogConc));
            const step = (maxX - minX) / 100;
            const xFitPlot = [];
            const yFitPlot = [];
            for (let i = 0; i <= 100; i++) {
                const x = minX + i * step;
                xFitPlot.push(x);
                yFitPlot.push(sigmoid(x, popt));
            }
            
            traces.push({
                x: xFitPlot,
                y: yFitPlot,
                type: 'scatter',
                mode: 'lines',
                line: { color: color_sbi, width: 2 },
                showlegend: false,
                hoverinfo: 'none'
            });
        }
        traces.push({
            x: sbiData.map(d => d.LogConc),

        });

        // Fit and Plot SR14
        if (sr14Data.length > 4) {
            const yMax = Math.max(...sr14Data.map(d => d.mean));
            const yMin = Math.min(...sr14Data.map(d => d.mean));
            const p0 = [yMax, yMin, -7, 1];
            
            const costFunc = (params) => {
                return sr14Data.reduce((sum, d) => {
                    const pred = sigmoid(d.LogConc, params);
                    return sum + Math.pow(d.mean - pred, 2);
                }, 0);
            };
            
            const popt = minimize(costFunc, p0);
            
            const minX = Math.min(...sr14Data.map(d => d.LogConc));
            const maxX = Math.max(...sr14Data.map(d => d.LogConc));
            const step = (maxX - minX) / 100;
            const xFitPlot = [];
            const yFitPlot = [];
            for (let i = 0; i <= 100; i++) {
                const x = minX + i * step;
                xFitPlot.push(x);
                yFitPlot.push(sigmoid(x, popt));
            }
            
            traces.push({
                x: xFitPlot,
                y: yFitPlot,
                type: 'scatter',
                mode: 'lines',
                line: { color: color_sr14, width: 2 },
                showlegend: false,
                hoverinfo: 'none'
            });
        }
        traces.push({
            x: sr14Data.map(d => d.LogConc),
            y: sr14Data.map(d => d.mean),
            type: 'scatter',
            mode: 'markers',
            marker: { color: color_sr14, size: 8 },
            error_y: {
                type: 'data',
                array: sr14Data.map(d => d.sem),
                visible: true,
                color: color_sr14,
                thickness: 1,
                width: 0
            },
            name: 'SR14 + 100 nM NT',
            showlegend: false
        });

        const layout = {
            width: 500,
            height: 400,
            showlegend: false,
            xaxis: {
                range: [-12, -3.5],
                tickvals: [-12, -10, -8, -6, -4],

            yaxis: {
