        // ---------------------------------------------------------
        // 2. Data Processing Logic
        // ---------------------------------------------------------
        
        const colors = {
            'Traffic': '#A89968',
            'Urban': '#7BAF68',
            'Industrial': '#E696A2',
            'Suburban': '#7FB2E5',
            'Rural': '#D49ED8',
            'Default': '#808080'
        };

        // ---------------------------------------------------------
        // 3. ECharts Logic
        // ---------------------------------------------------------
        
        var chartDom = document.getElementById('chart');
        var myChart = echarts.init(chartDom);
        var option;

        const pmSizes = ['PM10', 'PM2.5', 'PM1'];
        
        // Calculate Grid Layout (Total 100%, match ratios 10 : 3.5 : 1.2)
        // Approx: 68% : 24% : 8%
        const gridDefs = [
            { left: '5%', width: '63%', bottom: '20%', containLabel: true },
            { left: '72%', width: '20%', bottom: '20%', containLabel: true },
            { left: '94%', width: '6%', bottom: '20%', containLabel: true }
        ];

        const xAxisDefs = [];
        const yAxisDefs = [];
        const seriesDefs = [];

        // Error bar render item function
        function renderErrorBar(params, api) {
            var xValue = api.value(0);
            var highPoint = api.coord([xValue, api.value(1)]);
            var lowPoint = api.coord([xValue, api.value(2)]);
            var halfWidth = api.size([1, 0])[0] * 0.1; // Width of error bar cap
            var style = api.style({
                stroke: 'gray',
                fill: null,
                lineWidth: 1
            });
            return {
                type: 'group',
                children: [{
                    type: 'line',
                    transition: ['shape'],
                    shape: {
                        x1: highPoint[0] - halfWidth, y1: highPoint[1],
                        x2: highPoint[0] + halfWidth, y2: highPoint[1]
                    },
                    style: style
                }, {
                    type: 'line',
                    transition: ['shape'],
                    shape: {
                        x1: highPoint[0], y1: highPoint[1],
                        x2: lowPoint[0], y2: lowPoint[1]
                    },
                    style: style
                }, {
                    type: 'line',
                    transition: ['shape'],
                    shape: {
                        x1: lowPoint[0] - halfWidth, y1: lowPoint[1],
                        x2: lowPoint[0] + halfWidth, y2: lowPoint[1]
                    },
                    style: style
                }]
            };
        }

        pmSizes.forEach((pmSize, idx) => {
            // Data is already sorted in JSON
            const filtered = sourceData[pmSize];
            const xLabels = filtered.map(d => d.Station);
            
            // Series Data Preparation
            const barData = [];
            const errorData = [];
            const scatterData = [];
            const tagsData = [];

            filtered.forEach((d, i) => {
                const color = colors[d.Site_type] || colors['Default'];
                
                // Bar Data with specific styles
                let itemStyle = { color: color };
                
                // Hatching for Valley
                if (d.Site_topography === 'Valley') {
                    itemStyle.decal = {
                        symbol: 'rect', // Basic shape
                        symbolSize: 1, // small size to create lines
                        rotation: Math.PI / 4, // 45 degree
                        color: 'white',
                        dashArrayX: [1, 0], // Solid line
                        dashArrayY: [2, 5], // Gap between lines
                        opacity: 0.6
                    };
                }

                barData.push({
                    value: d.OP_DTT_v_mean,
                    itemStyle: itemStyle
                });

                // Error Bar Data
                const high = d.OP_DTT_v_mean + d.OP_DTT_v_SD;
                const low = Math.max(0, d.OP_DTT_v_mean - d.OP_DTT_v_SD);
                errorData.push([i, high, low]);

                // Scatter Data
                scatterData.push([i, d.PM_mass_mean]);

                // Tag Data
                const tag = d.tag;
                if (tag) {
                    tagsData.push([i, 0.2, tag]); // y position near bottom
                }
            });

            // X Axis
            xAxisDefs.push({
                type: 'category',
                data: xLabels,
                gridIndex: idx,
                axisLabel: { rotate: 90, interval: 0, fontSize: 10 },
                axisTick: { alignWithLabel: true }
            });

            // Y Axes (Left and Right per grid)
            // Left (Bar)
            yAxisDefs.push({
                type: 'value',
                gridIndex: idx,
                min: 0,
                max: 7,
                show: idx === 0, // Only show label on first plot
                name: idx === 0 ? 'OP_v DTT (nmolDTT min⁻¹ m⁻³)' : '',
                nameLocation: 'middle',
                nameGap: 40,
                splitLine: { show: false }
            });
            
            // Right (Scatter)
            yAxisDefs.push({
                type: 'value',
                gridIndex: idx,
                min: 0,
                max: 70,
                show: idx === 2, // Only show label on last plot
                name: idx === 2 ? 'PM (μg m⁻³)' : '',
                nameLocation: 'middle',
                nameGap: 40,
                nameRotate: -90,
                position: 'right',
                splitLine: { show: false }
            });

            // Series
            // 1. Bar Series
            seriesDefs.push({
                name: 'OP_DTT',
                type: 'bar',
                xAxisIndex: idx,
                yAxisIndex: idx * 2,
                data: barData,
                z: 2
            });

            // 2. Error Bar (Custom)
            seriesDefs.push({
                type: 'custom',
                xAxisIndex: idx,
                yAxisIndex: idx * 2,
                renderItem: renderErrorBar,
                data: errorData,
                z: 3
            });

            // 3. Scatter Series
            seriesDefs.push({
                name: 'PM Mass',
                type: 'scatter',
                xAxisIndex: idx,
                yAxisIndex: idx * 2 + 1, // Use right y-axis
                data: scatterData,
                symbolSize: 8,
                itemStyle: {
                    color: 'black',
                    borderColor: 'white',
                    borderWidth: 1
                },
                z: 4
            });

            // 4. Tags (Asterisks) - Using Scatter with Labels
            seriesDefs.push({
                type: 'scatter',
                xAxisIndex: idx,
                yAxisIndex: idx * 2,
                data: tagsData.map(item => ({
                    value: [item[0], item[1]],
                    label: {
                        show: true,
                        formatter: item[2],
                        position: 'right',
                        rotate: 90,
                        color: 'black',
                        fontSize: 10,
                        fontWeight: 'bold',
                        distance: 5
                    }
                })),
                symbolSize: 0, // Invisible points
                z: 5
            });
        });

        // Add Titles via Graphic elements or just title option (but title is global or array in ECharts 5)
        // ECharts supports array of titles
        const titleDefs = [
            { text: 'PM10', left: '33%', top: '5%', textAlign: 'center' },
            { text: 'PM2.5', left: '81%', top: '5%', textAlign: 'center' },
            { text: 'PM1', left: '97%', top: '5%', textAlign: 'center' },
            { text: 'b', left: '2%', top: '2%', textStyle: { fontSize: 24, fontWeight: 'bold' } }
        ];

        option = {
            backgroundColor: '#fff',
            title: titleDefs,
            grid: gridDefs,
            xAxis: xAxisDefs,
            yAxis: yAxisDefs,
            series: seriesDefs,
            animation: false // Static reproduction
        };

        myChart.setOption(option);
    </script>
