            yAxis: {

                inverse: true,
                axisLabel: { color: 'black' },
                axisLine: { show: false },
                axisTick: { show: false },
                splitLine: { show: false }

            series: [{
                type: 'heatmap',
                data: heatmapData,
                label: {
                    show: true,
                    formatter: function(params) {

                    },
                    color: 'auto'

                }

            ]
        };

            return params.value[2] > 0.65 ? 'white' : 'black';
        };

        chart.setOption(option);
