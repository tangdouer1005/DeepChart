        const rawData = chartData.plot_data.map(d => ({
            size: d["Size"],
            model: d["Model_ID"],
            auroc: d["AUROC"]
        }));

        // Determine order by 300 patients desc
        const model300 = rawData.filter(d => d.size === '300 patients').sort((a,b) => b.auroc - a.auroc);
        const orderedModels = model300.map(d => d.model);

        const seriesData = {
            '300 patients': [],
            '150 patients': [],
            '75 patients': []
        };

        orderedModels.forEach(m => {
            const d300 = rawData.find(d => d.model === m && d.size === '300 patients');
            const d150 = rawData.find(d => d.model === m && d.size === '150 patients');
            const d75 = rawData.find(d => d.model === m && d.size === '75 patients');
            
            seriesData['300 patients'].push(d300 ? d300.auroc : null);
            seriesData['150 patients'].push(d150 ? d150.auroc : null);
            seriesData['75 patients'].push(d75 ? d75.auroc : null);
        });
