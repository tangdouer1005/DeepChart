        const data = chartData;
        
        // Sorting Logic (from 131.html)
        const biomeOrder = ["AMAZÔNIA", "PANTANAL", "CERRADO", "CAATINGA", "PAMPA", "MATA ATLÂNTICA"];
        
        data.sort((a, b) => {
            const idxA = biomeOrder.indexOf(a.Biome);
            const idxB = biomeOrder.indexOf(b.Biome);
            if (idxA !== idxB) return idxA - idxB;
            return a.UF.localeCompare(b.UF);
        });

        // 3. Prepare Data
        const categoryData = [];
        const seriesDomestic = [];
        const seriesChina = [];
        const seriesEU = [];
        const seriesOther = [];
        
        const biomeGroups = [];
        let groupStartIndex = 0;
        let lastBiome = null;
        
        data.forEach(item => {
            if (item.Biome !== lastBiome) {
                if (lastBiome !== null) {
                    // Record end of previous group (before gaps)
                    const groupEndIndex = categoryData.length - 1;
                    biomeGroups.push({
                        name: lastBiome,
                        start: groupStartIndex,
                        end: groupEndIndex
                    });

                    // Add gaps
                    for(let k=0; k<4; k++) {
                        categoryData.push('');
                        seriesDomestic.push(null);
                        seriesChina.push(null);
                        seriesEU.push(null);
                        seriesOther.push(null);
                    }
                    
                    // Update start index for next group
                    groupStartIndex = categoryData.length;
                }
                lastBiome = item.Biome;
            }
            
            categoryData.push(item.UF);
            seriesDomestic.push(item.Domestic_million);
            seriesChina.push(item.China_million);
            seriesEU.push(item.EU_million);
            seriesOther.push(item.Other_countries_million);
        });

        // Handle last group
        if (lastBiome !== null) {
             const groupEndIndex = categoryData.length - 1;
             biomeGroups.push({
                 name: lastBiome,
                 start: groupStartIndex,
                 end: groupEndIndex
             });
        }

        // Calculate Graphic Labels
        const totalSectors = categoryData.length;
        const graphics = biomeGroups.map(g => {
            const mid = (g.start + g.end) / 2;
            // startAngle 90, clockwise.
            const angleDeg = 90 - (mid * 360 / totalSectors);
            const rad = angleDeg * Math.PI / 180;
            
            // Radius: 80% of 500px is 400px. Add padding.
            const r = 440; 
            const cx = 500;
            const cy = 500;
            
            const x = cx + r * Math.cos(rad);
            const y = cy - r * Math.sin(rad); 
            
            return {
                type: 'text',
                left: x,
                top: y,
                style: {
                    text: g.name.replace("AMAZÔNIA", "Amazônia"),
                    textAlign: 'center',
                    textVerticalAlign: 'middle',
                    fontSize: 14,
                    fontWeight: 'bold',
                    fill: '#333'
                }
            };
        });

        const option = {
            graphic: graphics,
            title: {
                text: '2012',
                top: 20,
                left: 20,
                textStyle: { fontSize: 24 }
            },
            legend: {
                bottom: 20,
                data: ['Domestic', 'China', 'EU', 'Other']
            },
            polar: {
                radius: ['20%', '80%']
            },
            angleAxis: {
                type: 'category',
                data: categoryData,
                startAngle: 90, 
                clockwise: true,
                axisLabel: {
                    interval: 0,
                    fontSize: 10,
                    color: '#555',
                    margin: 2
                },
                axisTick: { show: false },
                axisLine: { show: false },
                splitLine: { show: false }
            },
            radiusAxis: {
                max: 6.5,
                axisLabel: { show: true },
                axisLine: { show: false },
                splitLine: {
                    show: true,
                    lineStyle: { type: 'solid', color: '#ccc' }
                }
            },
            series: [
                {
                    name: 'Domestic',
                    type: 'bar',
                    stack: 'total',
                    coordinateSystem: 'polar',
                    data: seriesDomestic,
                    itemStyle: { color: '#f4a259' }
                },
                {
                    name: 'China',
                    type: 'bar',
                    stack: 'total',
                    coordinateSystem: 'polar',
                    data: seriesChina,
                    itemStyle: { color: '#4f6d7a' }
                },
                {
                    name: 'EU',
                    type: 'bar',
                    stack: 'total',
                    coordinateSystem: 'polar',
                    data: seriesEU,
                    itemStyle: { color: '#a4c5c6' }
                },
                {
                    name: 'Other',
                    type: 'bar',
                    stack: 'total',
                    coordinateSystem: 'polar',
                    data: seriesOther,
                    itemStyle: { color: '#e07a5f' }
                }
            ]
        };

        const chart = echarts.init(document.getElementById('chart-container'));
        chart.setOption(option);
