        const data = jsonData.data;
        const models = jsonData.models;
        const colors = ['#9e2a2b', '#6d9dc5', '#1f4e79', '#d16045'];

        function formatLabel(name) {
            let s = name.replace(/_/g, ' ');
            s = s.replace('Lung', 'LUAD');
            s = s.replace('LEFT RIGHT', 'sidedness');
            s = s.replace('CANCER TYPE', 'subtyping');
            s = s.replace('isMSIH', 'MSI');
            s = s.replace('N STATUS', 'N-status');
            s = s.replace('M STATUS', 'M-status');
            
            const parts = s.split(' ');
            if (parts.length > 2) return parts.slice(0, 2).join(' ') + '\n' + parts.slice(2).join(' ');
            if (parts.length === 2 && s.length > 10) return parts[0] + '\n' + parts[1];
            return s;
        }

        const indicator = data.map(row => {
            return {
                name: formatLabel(row.Task),
                max: row.axis_top,
                min: row.axis_bottom,
                color: 'white',
                category: row.category
            };
        });

        const seriesData = models.map((m, i) => ({
            name: m,
            value: data.map(row => row[m]),
            itemStyle: { color: colors[i] },
            lineStyle: { width: 2 },
            symbol: 'circle',
            symbolSize: 6
        }));

            backgroundColor: 'white',
            title: {
                text: 'Ensembles versus two best foundation models',
                left: 'center',
                top: 20

            radar: {
                indicator: indicator,
                shape: 'polygon',
                center: ['50%', '55%'],
                radius: '70%',
                splitNumber: 5,
                axisName: {
                    formatter: function(value, indicator) {
                        const cat = indicator.category;
                        const colorMap = {
                            'Morphology': '{morph|' + value + '}',
                            'Biomarkers': '{bio|' + value + '}',
                            'Prognosis': '{prog|' + value + '}'
                        };
                        return colorMap[cat] || value;
