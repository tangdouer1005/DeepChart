<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nature Chart Reproduction</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jstat@latest/dist/jstat.min.js"></script>
    <style>
        body { margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #ffffff; font-family: Arial, sans-serif; }
        #chart-container { width: 500px; height: 500px; }
    </style>
</head>
<body>
    <div id="chart-container"></div>
    <script>
        
        const data = {
    "means": {
        "WT saline": 154.9232777777778,
        "WT K": 117.980485,
        "A1ko saline": 148.10421,
        "A1ko K": 136.9572,
        "A2a ko saline": 152.48250000000002,
        "A2a ko K": 141.01749999999998
    },
    "sems": {
        "WT saline": 6.443748081559242,
        "WT K": 4.982821565334428,
        "A1ko saline": 10.152610778715985,
        "A1ko K": 8.613801135129341,
        "A2a ko saline": 18.983222456196117,
        "A2a ko K": 11.665165443380069
    },
    "raw_data": {
        "WT saline": [
            163.926,
            164.714,
            141.336,
            130.72,
            178.996,
            160.724,
            151.167,
            102.942,
            178.892,
            165.005,
            146.067,
            198.72,
            178.15,
            93.44,
            158.86,
            171.53,
            175.43,
            128.0
        ],
        "WT K": [
            146.915,
            130.208,
            133.681,
            118.735,
            87.1218,
            144.446,
            101.561,
            137.995,
            151.035,
            130.827,
            110.871,
            62.9039,
            138.84,
            124.06,
            100.39,
            118.43,
            104.59,
            97.0,
            108.0,
            112.0
        ],
        "A1ko saline": [
            93.4671,
            141.638,
            164.543,
            157.607,
            201.418,
            148.003,
            165.569,
            167.359,
            141.59,
            99.848
        ],
        "A1ko K": [
            168.582,
            167.291,
            82.285,
            112.291,
            121.264,
            152.277,
            150.877,
            146.772,
            120.345,
            147.588
        ],
        "A2a ko saline": [
            89.33,
            143.23,
            183.09,
            54.72,
            167.68,
            201.62,
            181.81,
            198.38
        ],
        "A2a ko K": [
            144.37,
            153.87,
            154.22,
            139.03,
            74.62,
            123.2,
            147.89,
            190.94
        ]
    },
    "columns": [
        "WT saline",
        "WT K",
        "A1ko saline",
        "A1ko K",
        "A2a ko saline",
        "A2a ko K"
    ],
    "comparisons": [
        {
            "col1_idx": 0,
            "col2_idx": 1,
            "col1": "WT saline",
            "col2": "WT K",
            "p_val": 5.298867419257434e-05
        },
        {
            "col1_idx": 2,
            "col2_idx": 3,
            "col1": "A1ko saline",
            "col2": "A1ko K",
            "p_val": 0.4134499359653607
        },
        {
            "col1_idx": 4,
            "col2_idx": 5,
            "col1": "A2a ko saline",
            "col2": "A2a ko K",
            "p_val": 0.6148831638224621
        }
    ]
};

        const columns = data.columns;
        
        const stats = {};
        if (data.means && data.sems && data.raw_data) {
            columns.forEach(col => {
                stats[col] = { 
                    mean: data.means[col], 
                    sem: data.sems[col], 
                    arr: data.raw_data[col] 
                };
            });
        } else {
            console.error("JSON data missing required fields (means, sems, raw_data)");
        }

        const annotations = [];
        const sigY = 165;
        
        if (data.comparisons) {
            data.comparisons.forEach(comp => {
                const idx1 = comp.col1_idx;
                const idx2 = comp.col2_idx;
                const pVal = comp.p_val;
                
                let sigText = "";
                if (pVal < 0.001) sigText = "***";
                else if (pVal < 0.01) sigText = "**";
                else if (pVal < 0.05) sigText = "*";
                else sigText = `P = ${pVal.toFixed(2)}`;

                annotations.push({ x1: idx1, x2: idx2, y: sigY, text: sigText });
            });
        }

        // Mapping to chart columns (inserting gaps)
        // Original: 0,1 | 2,3 | 4,5
        // Chart: 0,1, gap, 3,4, gap, 6,7 (indices: 0,1,2,3,4,5,6,7)
        // Indices in chart:
        // WT: 0, 1
        // Gap: 2
        // A1: 3, 4
        // Gap: 5
        // A2: 6, 7
        
        const chartCols = [];
        const chartColors = [];
        const colMap = {};
        
        const palette = [
            '#000000', '#9F2B2B', 
            '#4D4D4D', '#EE5C5C', 
            '#808080', '#F28C8C'
        ];
        
        let cIdx = 0;
        let oIdx = 0;
        
        // Pair 1
        chartCols.push(columns[0]); chartColors.push(palette[0]); colMap[0] = 0;
        chartCols.push(columns[1]); chartColors.push(palette[1]); colMap[1] = 1;
        // Gap
        chartCols.push(null); chartColors.push('transparent');
        
        // Pair 2
        chartCols.push(columns[2]); chartColors.push(palette[2]); colMap[2] = 3;
        chartCols.push(columns[3]); chartColors.push(palette[3]); colMap[3] = 4;
        // Gap
        chartCols.push(null); chartColors.push('transparent');
        
        // Pair 3
        chartCols.push(columns[4]); chartColors.push(palette[4]); colMap[4] = 6;
        chartCols.push(columns[5]); chartColors.push(palette[5]); colMap[5] = 7;
        
        const mappedAnnotations = annotations.map(a => ({
            x1: colMap[a.x1],
            x2: colMap[a.x2],
            y: a.y,
            text: a.text
        }));
        
        const scatterData = [];
        columns.forEach((col, idx) => {
            const cIdx = colMap[idx];
            stats[col].arr.forEach(val => {
                const jitter = (Math.random() - 0.5) * 0.3;
                scatterData.push([cIdx + jitter, val]);
            });
        });

        const chart = echarts.init(document.getElementById('chart-container'));

        const option = {
            animation: false,
            backgroundColor: 'white',
            grid: { top: 50, right: 20, bottom: 100, left: 60 },
            xAxis: {
                type: 'category',
                data: chartCols.map(c => c || ''),
                axisLabel: { show: false },
                axisTick: { show: false },
                axisLine: { show: true, lineStyle: { color: 'black' } }
            },
            yAxis: {
                type: 'value',
                max: 210,
                interval: 50,
                axisLabel: { color: 'black', fontSize: 12 },
                name: 'Immobility time (s)',
                nameLocation: 'middle',
                nameGap: 40,
                nameTextStyle: { color: 'black', fontSize: 14 },
                splitLine: { show: false },
                axisLine: { show: true, lineStyle: { color: 'black' } }
            },
            series: [
                {
                    type: 'bar',
                    data: chartCols.map((col, i) => {
                        if (!col) return { value: 0, itemStyle: { opacity: 0 } };
                        return { value: stats[col].mean, itemStyle: { color: chartColors[i] } };
                    }),
                    barWidth: '70%',
                    z: 1
                },
                {
                    type: 'custom',
                    renderItem: function(params, api) {
                        const colName = chartCols[params.dataIndex];
                        if (!colName) return;
                        const x = api.value(0);
                        const mean = stats[colName].mean;
                        const sem = stats[colName].sem;
                        const p1 = api.coord([x, mean - sem]);
                        const p2 = api.coord([x, mean + sem]);
                        const style = api.style({ stroke: '#555555', lineWidth: 1.5 });
                        return { type: 'line', shape: { x1: p1[0], y1: p1[1], x2: p2[0], y2: p2[1] }, style: style };
                    },
                    data: chartCols.map((c, i) => [i, 0]),
                    z: 2
                },
                {
                    type: 'scatter',
                    symbolSize: 6,
                    itemStyle: { color: '#555555', opacity: 0.8 },
                    data: scatterData,
                    z: 3
                },
                {
                    type: 'custom',
                    renderItem: function(params, api) {
                        const ann = mappedAnnotations[params.dataIndex];
                        const p1 = api.coord([ann.x1, ann.y]);
                        const p2 = api.coord([ann.x2, ann.y]);
                        const style = api.style({ stroke: 'black', lineWidth: 1, fill: null });
                        return {
                            type: 'group',
                            children: [
                                { type: 'line', shape: { x1: p1[0], y1: p1[1], x2: p2[0], y2: p2[1] }, style: style },
                                { type: 'text', style: { text: ann.text, x: (p1[0]+p2[0])/2, y: p1[1]-5, textAlign: 'center', textVerticalAlign: 'bottom', fill: 'black', font: '12px Arial' } }
                            ]
                        };
                    },
                    data: mappedAnnotations.map((a, i) => i),
                    z: 4
                }
            ],
            graphic: [
                { type: 'text', left: 0, top: 0, style: { text: 'd', font: 'bold 20px Arial' } },
                { type: 'text', left: 10, bottom: 65, style: { text: 'CRS', textAlign: 'right', font: '12px Arial' } },
                { type: 'text', left: 10, bottom: 45, style: { text: 'Ketamine', textAlign: 'right', font: '12px Arial' } },
                
                { type: 'line', shape: { x1: 75, y1: 460, x2: 155, y2: 460 }, style: { stroke: 'black' } }, 
                { type: 'text', left: 115, bottom: 20, style: { text: 'WT', textAlign: 'center', font: '12px Arial' } },

                { type: 'line', shape: { x1: 205, y1: 460, x2: 285, y2: 460 }, style: { stroke: 'black' } },
                { type: 'text', left: 245, bottom: 20, style: { text: 'Adora1-/-', textAlign: 'center', font: '12px Arial' } },
                
                { type: 'line', shape: { x1: 335, y1: 460, x2: 415, y2: 460 }, style: { stroke: 'black' } },
                { type: 'text', left: 375, bottom: 20, style: { text: 'Adora2a-/-', textAlign: 'center', font: '12px Arial' } }
            ]
        };

        const row1 = ['+', '+', '', '+', '+', '', '+', '+'];
        // Unicode minus for style
        const m = '\u2212';
        const row2 = [m, '+', '', m, '+', '', m, '+'];

        option.xAxis = [
            option.xAxis,
            { type: 'category', data: row1, position: 'bottom', offset: 15, axisLine: {show: false}, axisTick: {show: false}, axisLabel: { color: 'black' } },
            { type: 'category', data: row2, position: 'bottom', offset: 35, axisLine: {show: false}, axisTick: {show: false}, axisLabel: { color: 'black', fontSize: 14 } }
        ];
        option.series.forEach(s => s.xAxisIndex = 0);

        chart.setOption(option);
    </script>
</body>
</html>
