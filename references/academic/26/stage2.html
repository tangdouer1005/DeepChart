        const modelOrder = [
            "PRISM", "CONCH", "MADELEINE", "Virchow2", "UNI",
            "Hibou-B", "DinoSSLPath", "BiomedCLIP", "Panakeia*",
            "ProvGigaPath-S", "H-optimus-0", "Kaiko", "ProvGigaPath-T",
            "Virchow", "CTransPath", "Hibou-L", "PLIP", "CHIEF", "Phikon"
        ];
        
        const modelGroups = {};
        modelOrder.forEach(model => {
            modelGroups[model] = chartData.plot_data
                .filter(d => d.Model === model)
                .map(d => d.AUROC);
        });

        // Boxplot data calculation
        const boxplotData = modelOrder.map((model, index) => {
            const arr = modelGroups[model].sort((a,b) => a-b);
            if (arr.length === 0) return [];
            const q1 = jStat.percentile(arr, 0.25);
            const median = jStat.median(arr);
            const q3 = jStat.percentile(arr, 0.75);
            const min = arr[0];
            const max = arr[arr.length - 1];
            return [min, q1, median, q3, max];
        });

        // Pre-calculate violin density data externally
        const violinDataList = modelOrder.map((model) => {
            const modelAurocs = modelGroups[model];
            if (modelAurocs.length < 2) return null;

            // Manual KDE
            const bandwidth = 0.05; // Smoothing factor
            const steps = 50;
            const minVal = 0.35;
            const maxVal = 1.0;
            const stepSize = (maxVal - minVal) / steps;
            const densityData = [];
            
            for (let i = 0; i <= steps; i++) {
                const y = minVal + i * stepSize;
                let density = 0;
                modelAurocs.forEach(val => {
                    // Gaussian kernel
                    const u = (y - val) / bandwidth;
                    density += Math.exp(-0.5 * u * u) / (Math.sqrt(2 * Math.PI));
                });
                densityData.push([y, density]);
            }
            return densityData;
        });

        const chart = echarts.init(document.getElementById('chart-container'));

        const option = {
            backgroundColor: 'white',
            title: {
                text: 'Downstream training with 75 patients',
                left: 'center',
                top: 10
            },
            grid: { top: 60, right: 20, bottom: 80, left: 60 },
            xAxis: {
                type: 'category',
                data: modelOrder,
                axisLabel: { rotate: 60, color: 'black', fontSize: 10 },
                axisLine: { show: true, lineStyle: { color: 'black' } },
                axisTick: { show: false }
            },
            yAxis: {
                type: 'value',
                min: 0.35,
                max: 1.0,
                interval: 0.1,
                name: 'Distribution of AUROC scores\nacross 29 tasks',
                nameLocation: 'middle',
                nameGap: 40,
                splitLine: { show: true, lineStyle: { color: '#E0E0E0' } },
                axisLine: { show: true, lineStyle: { color: 'black' } },
                axisLabel: { color: 'black' }
            },
            series: [
                {
                    name: 'AUROC Distribution',
                    type: 'boxplot',
                    data: boxplotData,
                    itemStyle: {
                        borderColor: 'white',
                        borderWidth: 1.5,
                        color: 'transparent'
                    },
                    medianStyle: {
                        color: 'white',
                        width: 1.5
                    },
                    whiskerStyle: {
                        color: 'white',
                        width: 1.0
                    },
                    outliers: { // No outliers shown in original
                        show: false
                    },
                    z: 10,
                    boxWidth: [10, 10]
                },
                // Violin plot part (using custom series for density)
                {
                    name: 'Violin Density',
                    type: 'custom',
                    renderItem: function(params, api) {
                        const x = api.value(0);
                        // retrieve densityData from external variable using dataIndex
                        const density = violinDataList[params.dataIndex];
                        
                        if (!density) return;

                        const points = [];
                        let maxDensity = 0;
                        density.forEach(item => {
                            maxDensity = Math.max(maxDensity, item[1]);
                        });

                        // Scale density width based on max density for consistent violin shape
                        const scaleFactor = 20; // Adjust this for width of violins
                        
                        // Top half
                        for (let i = 0; i < density.length; i++) {
                            const p = density[i];
                            // p[0] is Y value (AUROC). p[1] is density (Width).
                            
                            // Map Y value (p[0]) to coordinate
                            const ptY = api.coord([x, p[0]])[1];
                            const ptX = api.coord([x, p[0]])[0]; // Center X
                            
                            // Width offset
                            const width = p[1] * scaleFactor / (maxDensity || 1);
                            points.push([ptX + width, ptY]);
                        }
                        // Bottom half (mirror)
                        for (let i = density.length - 1; i >= 0; i--) {
                            const p = density[i];
                            const ptY = api.coord([x, p[0]])[1];
                            const ptX = api.coord([x, p[0]])[0];
                            const width = p[1] * scaleFactor / (maxDensity || 1);
                            points.push([ptX - width, ptY]);
                        }
                        
                        // Get color from itemStyle
                        const style = api.style({ opacity: 0.7 });
                        style.stroke = style.fill; // Ensure stroke matches fill

                        return {
                            type: 'polygon',
                            shape: { points: points },
                            style: style
                        };
                    },
                    encode: {
                        x: 0,
                        y: 1
                    },
                    data: modelOrder.map((model, modelIdx) => {
                        const modelAurocs = modelGroups[model];
                        
                        // Palette logic from Python
                        const palette = [
                            "#444444", "#a84c3a", "#a84c3a", "#a84c3a", "#a84c3a",
                            "#a84c3a", "#1f77b4", "#1f77b4", "#1f77b4", "#1f77b4",
                            "#d29574", "#d29574", "#d29574", "#444444", "#444444",
                            "#1f77b4", "#1f77b4", "#1f77b4", "#1f77b4"
                        ];
                        const color = palette[modelIdx % palette.length];

                        return {
                            value: [modelIdx, modelAurocs.length > 0 ? jStat.median(modelAurocs) : 0],
                            itemStyle: { color: color }
                        };
                    }),
                    z: 0 // Draw below boxplot
                }
            ]
        };

        chart.setOption(option);
