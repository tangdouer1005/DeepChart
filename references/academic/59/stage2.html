        const seriesList = jsonData.datasets;

        const chart = echarts.init(document.getElementById('chart-container'));

        const echartsSeries = [];

        seriesList.forEach(s => {
            // Filter out NaN values explicitly from s.x, s.y, s.y_err
            const cleanX = [];
            const cleanY = [];
            const cleanYErr = [];
            for (let i = 0; i < s.x.length; i++) {
                if (!isNaN(s.x[i]) && !isNaN(s.y[i])) {
                    cleanX.push(s.x[i]);
                    cleanY.push(s.y[i]);
                    cleanYErr.push(isNaN(s.y_err[i]) ? 0 : s.y_err[i]); // Ensure y_err is a number
                }
            }

            const plotData = cleanX.map((val, i) => [val, cleanY[i]]);
            const errorData = cleanX.map((val, i) => [val, cleanY[i], cleanYErr[i]]);
            
            // For smooth lines, use x_smooth and y_smooth if available, otherwise fallback to clean plotData
            const smoothData = (s.x_smooth && s.y_smooth) 
                ? s.x_smooth.map((val, i) => (isNaN(val) || isNaN(s.y_smooth[i]) ? null : [val, s.y_smooth[i]])).filter(Boolean)
                : plotData; // Fallback to plotData if smooth data not provided or invalid

            // Scatter
            echartsSeries.push({
                name: s.name,
                type: 'scatter',
                data: plotData,
                itemStyle: { color: s.color },
                symbolSize: 8,
                z: 2
            });

            // Error bars (Custom)
            echartsSeries.push({
                type: 'custom',
                name: s.name + '_error',
                renderItem: function(params, api) {
                    const xVal = api.value(0);
                    const yVal = api.value(1);
                    const sem = api.value(2); // This is y_err now
                    const high = yVal + sem;
                    const low = yVal - sem;
                    
                    const style = api.style({ stroke: s.color, lineWidth: 1.5 });
                    const p1 = api.coord([xVal, high]);
                    const p2 = api.coord([xVal, low]);
                    const capSize = 4;

                    // Safety checks for p1 and p2
                    if (!p1 || !p2 || p1.length < 2 || p2.length < 2) {
                        return { type: 'group', children: [] };
                    }

                    return {
                        type: 'group',
                        children: [
                            { type: 'line', shape: { x1: p1[0], y1: p1[1], x2: p2[0], y2: p2[1] }, style: style },
                            { type: 'line', shape: { x1: p1[0]-capSize, y1: p1[1], x2: p1[0]+capSize, y2: p1[1] }, style: style },
                            { type: 'line', shape: { x1: p2[0]-capSize, y1: p2[1], x2: p2[0]+capSize, y2: p2[1] }, style: style }
                        ]
                    };
                },
                data: errorData,
                z: 3,
                silent: true
            });

            // Line (Simple smooth connection as approx for fit)
            echartsSeries.push({
                name: s.name + '_line',
                type: 'line',
                data: smoothData,
                smooth: true,
                showSymbol: false,
                lineStyle: { color: s.color, width: 2 },
                z: 1,
                silent: true
            });
        });

        const option = {
            backgroundColor: 'white',
            grid: { top: 60, bottom: 60, left: 60, right: 20 },
            xAxis: {
                type: 'value',
                min: -13, max: -3,
                interval: 2,
                axisLabel: { color: 'black', fontSize: 12 },
                axisLine: { lineStyle: { color: 'black' } },
                axisTick: { show: true, inside: true }
            },
            yAxis: {
                type: 'value',
                min: -0.1, max: 0.6,
                interval: 0.2,
                axisLabel: { color: 'black', fontSize: 12 },
                axisLine: { lineStyle: { color: 'black' } },
                axisTick: { show: true, inside: true },
                splitLine: { show: false }
            },
            legend: {
                data: seriesList.map(s => s.name),
                left: 'right',
                top: 'middle',
                orient: 'vertical',
                textStyle: { fontSize: 12 },
                itemGap: 15
            },
            series: echartsSeries,
            graphic: [
                {
                    type: 'line',
                    shape: { x1: '10%', y1: '78.5%', x2: '95%', y2: '78.5%' }, // Approx zero line
                    style: { stroke: 'black', lineDash: [5, 5], lineWidth: 0.8 },
                    z: 0
                },
                {
                    type: 'text',
                    left: 70, top: 70,
                    style: { text: 'G₁₁', font: '16px Arial', fill: 'black' }
                }
            ]
        };

        chart.setOption(option);
