        const series = [];
        const markers = ['circle', 'rect', 'rect', 'rect', 'rect'];

        chartData.forEach((dataset, idx) => {
            const label = dataset.label;
            const color = dataset.color;
            // Map JSON data to [x, y, err], filtering out NaNs
            const data = dataset.x_log
                .map((x, i) => [x, dataset.y_mean[i], dataset.y_sem[i]])
                .filter(d => d[0] !== null && !isNaN(d[0]) && d[1] !== null && !isNaN(d[1]))
                .sort((a,b)=>a[0]-b[0]);

            // Error bars
            series.push({
                type: 'custom',
                name: label,
                itemStyle: { color: color, borderWidth: 1.5 },
                renderItem: function (params, api) {
                    const xValue = api.value(0);
                    const yValue = api.value(1);
                    const lowPoint = api.coord([xValue, yValue - api.value(2)]);
                    const highPoint = api.coord([xValue, yValue + api.value(2)]);
                    const style = api.style({ stroke: api.visual('color'), fill: null });
                    return {
                        type: 'group',
                        children: [
                            { type: 'line', shape: { x1: lowPoint[0], y1: lowPoint[1], x2: highPoint[0], y2: highPoint[1] }, style: style },
                            { type: 'line', shape: { x1: lowPoint[0]-3, y1: lowPoint[1], x2: lowPoint[0]+3, y2: lowPoint[1] }, style: style },
                            { type: 'line', shape: { x1: highPoint[0]-3, y1: highPoint[1], x2: highPoint[0]+3, y2: highPoint[1] }, style: style }
                        ]
                    };
                },
                data: data,
                z: 10
            });

            // Scatter
            series.push({
                type: 'scatter',
                name: label,
                data: data,
                symbol: markers[idx % markers.length],
                itemStyle: { color: color },
                symbolSize: 8,
                z: 10
            });

            // Spline
            series.push({
                type: 'line',
                name: label,
                data: data.map(d => [d[0], d[1]]),
                smooth: true,
                showSymbol: false,
                lineStyle: { color: color, width: 2 },
                z: 5
            });
        });

        const chart = echarts.init(document.getElementById('chart-container'));

        const option = {
            backgroundColor: 'white',
            grid: { top: 50, right: 50, bottom: 50, left: 60 },
            xAxis: {
                type: 'value',
                min: -15, max: -3,
                interval: 2,
                axisLine: { show: true, lineStyle: { color: 'black' } },
                axisLabel: { color: 'black', fontSize: 12 },
                axisTick: { show: true, inside: true },
                splitLine: { show: false }
            },
            yAxis: {
                type: 'value',
                min: -0.05, max: 0.35,
                axisLine: { show: true, lineStyle: { color: 'black' } },
                axisLabel: { color: 'black', fontSize: 12 },
                axisTick: { show: true, inside: true },
                splitLine: { show: false },
                name: 'G protein activation\n(-Δ Net BRET)',
                nameLocation: 'middle',
                nameGap: 40,
                nameTextStyle: { color: 'black', fontSize: 14 }
            },
            series: [
                ...series,
                {
                    type: 'line',
                    markLine: {
                        symbol: 'none',
                        lineStyle: { type: 'dashed', color: 'black', width: 1 },
                        data: [{ yAxis: 0 }]
                    }
                }
            ],
            graphic: [
                {
                    type: 'text',
                    left: 70,
                    top: 60,
                    style: {
                        text: 'G11',
                        font: '14px Arial',
                        fill: 'black'
                    }
                }
            ]
        };

        chart.setOption(option);
    </script>
</body>
</html>
