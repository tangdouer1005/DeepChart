        // 1. Parsing (Adapted from JSON)
        const data = rawData.map(item => ({
            UF: item.UF,
            Biome: item.Biome,
            Domestic: item.Domestic,
            China: item.China,
            EU: item.EU,
            Other: item["Other countries"]
        }));

        // 2. Sorting
        const biomeOrder = ["AMAZÔNIA", "PANTANAL", "CERRADO", "CAATINGA", "PAMPA", "MATA ATLÂNTICA", "NA"];
        
        data.sort((a, b) => {
            const idxA = biomeOrder.indexOf(a.Biome);
            const idxB = biomeOrder.indexOf(b.Biome);
            if (idxA !== idxB) return idxA - idxB;
            return a.UF.localeCompare(b.UF);
        });

        // 3. Prepare Data with Groups and Gaps
        const categoryData = [];
        const seriesDomestic = [];
        const seriesChina = [];
        const seriesEU = [];
        const seriesOther = [];
        
        const biomeGroups = [];
        let lastBiome = null;
        let currentIndex = 0;
        
        data.forEach(item => {
            if (item.Biome !== lastBiome) {
                if (lastBiome !== null) {
                    // Close previous group
                    if(biomeGroups.length > 0) {
                        biomeGroups[biomeGroups.length - 1].end = currentIndex - 1;
                    }
                    
                    // Insert gap (4 empty bars)
                    for(let k=0; k<4; k++) {
                        categoryData.push('');
                        seriesDomestic.push(null);
                        seriesChina.push(null);
                        seriesEU.push(null);
                        seriesOther.push(null);
                        currentIndex++;
                    }
                }
                // Start new group
                biomeGroups.push({ name: item.Biome, start: currentIndex });
                lastBiome = item.Biome;
            }
            
            categoryData.push(item.UF);
            seriesDomestic.push(item.Domestic);
            seriesChina.push(item.China);
            seriesEU.push(item.EU);
            seriesOther.push(item.Other);
            currentIndex++;
        });
        
        // Close last group
        if (biomeGroups.length > 0) {
            biomeGroups[biomeGroups.length - 1].end = currentIndex - 1;
        }

        // 4. Calculate Graphic Labels for Biomes
        const totalSectors = categoryData.length;
        const graphics = biomeGroups.map(g => {
            const mid = (g.start + g.end) / 2;
            
            const angleDeg = 90 - (mid * 360 / totalSectors);
            const rad = angleDeg * Math.PI / 180;
            
            const r = 440; 
            const cx = 500;
            const cy = 500;
            
            const x = cx + r * Math.cos(rad);
            const y = cy - r * Math.sin(rad); 
            
            // Format Label: Title Case
            let labelText = g.name.toLowerCase().replace(/(?:^|\s)\w/g, function(a) { return a.toUpperCase(); });
            if (g.name === 'NA') labelText = 'NA';
            if (g.name === 'MATA ATLÂNTICA') labelText = 'Mata Atlântica'; // Special handling
            
            return {
                type: 'text',
                left: x,
                top: y,
                style: {
                    text: labelText,
                    textAlign: 'center',
                    textVerticalAlign: 'middle',
                    fontSize: 14,
                    fontWeight: 'bold',
                    fill: '#333'
                }
            };
        });

        const option = {
            graphic: graphics,
            title: {
                text: '2016',
                top: 20,
                left: 20,
                textStyle: { fontSize: 24 }
            },
            legend: {
                bottom: 20,
                data: ['Domestic', 'China', 'EU', 'Other countries']
            },
            polar: {

            },
            angleAxis: {

                data: categoryData,
                startAngle: 90, 
                clockwise: true,
                axisLabel: {

                    fontSize: 10,
                    color: '#555',

                },
                axisTick: { show: false },
                axisLine: { show: false },
                splitLine: { show: false }
            },
            radiusAxis: {

                axisLine: { show: false },
                splitLine: {

                    lineStyle: { type: 'solid', color: '#ccc' }
                }
            },
            series: [

                    data: seriesDomestic,

                },
                {

                },

                },

                    type: 'bar',

                    coordinateSystem: 'polar',
                    data: seriesOther,
                    itemStyle: { color: '#08306b' }
                }
            ]
        };
