<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nature Chart Reproduction</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jstat@latest/dist/jstat.min.js"></script>
    <style>
        body { margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #ffffff; font-family: Arial, sans-serif; }
        #chart-container { width: 400px; height: 500px; }
    </style>
</head>
<body>
    <div id="chart-container"></div>
    <script>
        
        const data = {
    "data": {
        "K5": [
            11.2415,
            8.60784,
            5.80698,
            4.37638,
            8.25921,
            6.33075,
            7.57759,
            6.90356,
            11.2284,
            11.5802,
            7.55002,
            12.2143,
            5.02523
        ],
        "DCK5": [
            22.4507,
            14.6416,
            21.3465,
            22.6102,
            12.2284,
            19.2196,
            26.028,
            23.0144
        ],
        "K10": [
            17.7663,
            11.6146,
            20.4368,
            11.9981,
            21.3436,
            23.2706,
            18.3738,
            19.8777,
            21.0958,
            21.2376,
            14.488,
            15.5358,
            11.0808
        ],
        "DCK10": [
            40.1504,
            35.3579,
            31.5678,
            31.5956,
            39.3495,
            32.4771,
            34.131
        ]
    },
    "comparisons": [
        {
            "name": "K5 vs DCK5",
            "p_val": 3.348223338363239e-07
        },
        {
            "name": "K10 vs DCK10",
            "p_val": 2.5894814999517137e-08
        }
    ]
};

        function calculateBoxPlotData(arr) {
            arr.sort((a, b) => a - b);
            const q1 = jStat.percentile(arr, 0.25);
            const median = jStat.percentile(arr, 0.5);
            const q3 = jStat.percentile(arr, 0.75);
            const min = arr[0];
            const max = arr[arr.length - 1];
            return [min, q1, median, q3, max];
        }

        const groups = ['K5', 'DCK5', 'K10', 'DCK10'];
        const boxData = groups.map(g => calculateBoxPlotData(data.data[g]));

        const annotations = [];
        const sigY = 45;

        data.comparisons.forEach((comp, i) => {
            const pVal = comp.p_val;
            let sigText = "";
            if (pVal < 0.001) sigText = "***";
            else if (pVal < 0.01) sigText = "**";
            else if (pVal < 0.05) sigText = "*";
            else sigText = `P = ${pVal.toFixed(2)}`;
            
            annotations.push({ y: sigY, text: sigText });
        });

        const colors = ['#F09494', '#408598', '#A62B2B', '#20637D'];
        
        // Chart uses gaps. 
        // 9.py: positions = [1, 2, 4, 5]. Gap at 3.
        // ECharts Category axis: 0, 1, 2(gap), 3, 4.
        const chartCols = [0, 1, null, 2, 3];
        const chartBoxData = [boxData[0], boxData[1], [0,0,0,0,0], boxData[2], boxData[3]];
        const chartColors = [colors[0], colors[1], 'transparent', colors[2], colors[3]];
        
        const chartAnnotations = annotations.map((a, i) => ({
            x1: i === 0 ? 0 : 3,
            x2: i === 0 ? 1 : 4,
            y: a.y,
            text: a.text
        }));

        const chart = echarts.init(document.getElementById('chart-container'));

        const option = {
            backgroundColor: 'white',
            grid: { top: 50, right: 20, bottom: 80, left: 60 },
            xAxis: {
                type: 'category',
                data: ['Ketamine', 'DCK', '', 'Ketamine', 'DCK'],
                axisLabel: { color: 'black', rotate: 45 },
                axisTick: { show: false },
                axisLine: { show: true, lineStyle: { color: 'black' } }
            },
            yAxis: {
                type: 'value',
                max: 48,
                name: 'Ado peak (ΔF/F %)',
                nameLocation: 'middle',
                nameGap: 40,
                splitLine: { show: false },
                axisLine: { show: true, lineStyle: { color: 'black' } },
                axisLabel: { color: 'black' }
            },
            series: [
                {
                    type: 'boxplot',
                    data: chartBoxData.map((d, i) => ({
                        value: d,
                        itemStyle: {
                            color: 'white', // Interior
                            borderColor: chartColors[i],
                            borderWidth: 2
                        }
                    })),
                    z: 1
                },
                {
                    type: 'custom',
                    renderItem: function(params, api) {
                        const ann = chartAnnotations[params.dataIndex];
                        if(!ann) return;
                        const p1 = api.coord([ann.x1, ann.y]);
                        const p2 = api.coord([ann.x2, ann.y]);
                        const style = api.style({ stroke: 'black', lineWidth: 1 });
                        return {
                            type: 'group',
                            children: [
                                { type: 'line', shape: { x1: p1[0], y1: p1[1], x2: p2[0], y2: p2[1] }, style: style },
                                { type: 'text', style: { text: ann.text, x: (p1[0]+p2[0])/2, y: p1[1]-5, textAlign: 'center', textVerticalAlign: 'bottom', fill: 'black', font: '14px Arial' } }
                            ]
                        };
                    },
                    data: [0, 1], // Dummy
                    z: 2
                }
            ],
            graphic: [
                { type: 'text', left: 0, top: 0, style: { text: 'c', font: 'bold 20px Arial' } },
                // Vertical separator line (at index 2)
                { type: 'line', shape: { x1: 200, y1: 50, x2: 200, y2: 420 }, style: { stroke: 'black', lineDash: [4, 4] } },
                
                // Group labels
                { type: 'line', shape: { x1: 85, y1: 470, x2: 175, y2: 470 }, style: { stroke: 'black' } },
                { type: 'text', left: 130, bottom: 5, style: { text: '5 mg kg⁻¹', textAlign: 'center', font: '12px Arial' } },
                
                { type: 'line', shape: { x1: 235, y1: 470, x2: 325, y2: 470 }, style: { stroke: 'black' } },
                { type: 'text', left: 280, bottom: 5, style: { text: '10 mg kg⁻¹', textAlign: 'center', font: '12px Arial' } }
            ]
        };

        chart.setOption(option);
    </script>
</body>
</html>
