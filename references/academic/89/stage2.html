        const parentalRaw = Object.values(jsonData.Parental).filter(v => v !== null);
        const lnRaw = Object.values(jsonData.LN).filter(v => v !== null);

        // 2. Calculations
        function calculateMean(data) {
            return data.reduce((sum, val) => sum + val, 0) / data.length;
        }

        function calculateStd(data, mean) {
            const squareDiffs = data.map(val => Math.pow(val - mean, 2));
            const avgSquareDiff = squareDiffs.reduce((sum, val) => sum + val, 0) / (data.length - 1);
            return Math.sqrt(avgSquareDiff);
        }

        const meanParental = calculateMean(parentalRaw);
        const stdParental = calculateStd(parentalRaw, meanParental);
        const meanLn = calculateMean(lnRaw);
        const stdLn = calculateStd(lnRaw, meanLn);

        // 3. ECharts Setup
        const chartDom = document.getElementById('chart-container');
        const myChart = echarts.init(chartDom);

        // Prepare Scatter Data with Jitter
        // We want 'Parental' at x=0, 'LN' at x=1. 
        // We'll add random jitter between -0.15 and 0.15
        function makeScatterData(data, xIndex) {
            return data.map(val => {
                const jitter = (Math.random() - 0.5) * 0.3; // -0.15 to 0.15
                return [xIndex + jitter, val];
            });
        }

        const parentalScatter = makeScatterData(parentalRaw, 0);
        const lnScatter = makeScatterData(lnRaw, 1);

        const option = {
            backgroundColor: 'white',
            grid: {
                top: '15%',
                bottom: '15%',
                left: '20%',
                right: '10%',
                containLabel: false
            },
            xAxis: {
                type: 'category',
                data: ['Parental', 'LN'],
                axisLine: {
                    lineStyle: { color: 'black' }
                },
                axisLabel: {
                    color: 'black',
                    fontSize: 12,
                    rotate: 45,
                    margin: 14 // adjust for rotation
                },
                axisTick: {
                    alignWithLabel: true
                }
            },
            yAxis: {
                type: 'value',
                min: 0,
                max: 1.5,
                interval: 0.5,
                name: 'Relative GCLC levels',
                nameLocation: 'middle',
                nameGap: 40,
                nameTextStyle: {
                    color: 'black',
                    fontSize: 12
                },
                axisLine: {
                    show: true,
                    lineStyle: { color: 'black' }
                },
                axisLabel: {
                    color: 'black',
                    fontSize: 11,
                    formatter: function (value) {
                        return value.toFixed(1);
                    }
                },
                splitLine: { show: false }
            },
            series: [
                // 1. Bars
                {
                    type: 'bar',
                    data: [
                        { value: meanParental, itemStyle: { color: '#d9d9d9', borderColor: 'black', borderWidth: 1 } },
                        { value: meanLn, itemStyle: { color: '#98c992', borderColor: 'black', borderWidth: 1 } }
                    ],
                    barWidth: '60%',
                    z: 1
                },
                // 2. Error Bars (Custom Series)
                {
                    type: 'custom',
                    renderItem: function (params, api) {
                        const xValue = api.value(0);
                        const meanValue = api.value(1);
                        const stdValue = api.value(2);
                        
                        const pointStart = api.coord([xValue, meanValue - stdValue]);
                        const pointEnd = api.coord([xValue, meanValue + stdValue]);
                        
                        // Error bar cap width
                        const capWidth = 10; 

                        return {
                            type: 'group',
                            children: [
                                {
                                    type: 'line',
                                    shape: {
                                        x1: pointStart[0], y1: pointStart[1],
                                        x2: pointEnd[0], y2: pointEnd[1]
                                    },
                                    style: {
                                        stroke: 'black',
                                        lineWidth: 1.5
                                    }
                                },
                                {
                                    type: 'line',
                                    shape: {
                                        x1: pointStart[0] - capWidth / 2, y1: pointStart[1],
                                        x2: pointStart[0] + capWidth / 2, y2: pointStart[1]
                                    },
                                    style: {
                                        stroke: 'black',
                                        lineWidth: 1.5
                                    }
                                },
                                {
                                    type: 'line',
                                    shape: {
                                        x1: pointEnd[0] - capWidth / 2, y1: pointEnd[1],
                                        x2: pointEnd[0] + capWidth / 2, y2: pointEnd[1]
                                    },
                                    style: {
                                        stroke: 'black',
                                        lineWidth: 1.5
                                    }
                                }
                            ]
                        };
                    },
                    data: [
                        [0, meanParental, stdParental],
                        [1, meanLn, stdLn]
                    ],
                    z: 3
                },
                // 3. Scatter Points (Swarm)
                {
                    type: 'scatter',
                    data: parentalScatter,
                    itemStyle: {
                        color: 'black'
                    },
                    symbolSize: 5,
                    z: 2
                },
                {
                    type: 'scatter',
                    data: lnScatter,
                    itemStyle: {
                        color: '#3a8e3a'
                    },
                    symbolSize: 5,
                    z: 2
                }
            ],
            graphic: [
                // Significance Line
                {
                    type: 'line',
                    shape: {
                        x1: 0, y1: 0, x2: 0, y2: 0 // Will update in onresize or leave relative
                    },
                    // Using direct coordinate conversion might be tricky in 'graphic' component without listening to events.
                    // Better to use a 'markLine' or 'custom' series for the line to be tied to axes.
                    // Let's use another custom series item for the significance bracket to ensure it moves with zoom/resize.
                },
                // Text 'f'
                {
                    type: 'text',
                    left: '5%',
                    top: '2%',
                    style: {
                        text: 'f',
                        fontSize: 20,
                        fontWeight: 'bold',
                        fill: 'black'
                    }
                }
            ]
        };

        // Add Significance Line and Text as a Custom Series to stick to coordinates
        option.series.push({
            type: 'custom',
            renderItem: function (params, api) {
                // Coordinates for [0, 1.35] and [1, 1.35]
                const p1 = api.coord([0, 1.35]);
                const p2 = api.coord([1, 1.35]);

                return {
                    type: 'group',
                    children: [
                        {
                            type: 'line',
                            shape: {
                                x1: p1[0], y1: p1[1],
                                x2: p2[0], y2: p2[1]
                            },
                            style: {
                                stroke: 'black',
                                lineWidth: 1
                            }
                        },
                        {
                            type: 'text',
                            style: {
                                text: 'P < 1 × 10⁻¹⁵',
                                fontSize: 11,
                                textAlign: 'center',
                                fill: 'black',
                                x: (p1[0] + p2[0]) / 2,
                                y: p1[1] - 5 // Slightly above
                            }
                        }
                    ]
                };
            },
            data: [[0]] // Dummy data to trigger render
        });

        myChart.setOption(option);
    </script>
