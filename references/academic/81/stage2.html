        const df = sourceData;
        
        // Colors
        const colors = {
            'PM1': '#4e79a7',
            'PM2.5': '#d38d5f',
            'PM10': '#6a9f58'
        };
        const siteTypeOrder = ['Traffic', 'Urban', 'Suburban', 'Rural'];
        const siteTypeLabels = {'Traffic': 'T', 'Urban': 'U', 'Suburban': 'SU', 'Rural': 'R'};
        const pmOrder = ['PM1', 'PM2.5', 'PM10'];

        // Layout calc
        let currentX = 0;
        const barWidth = 0.8;
        const groupGap = 0.5;
        const typeGap = 1.5;
        
        const barData = [];
        const errorData = [];
        const scatterData = [];
        const siteTypeCenters = [];
        const dividers = [];

        siteTypeOrder.forEach((type, i) => {
            const siteData = df.filter(d => d.Site_type === type);
            // Get unique stations
            const stations = [];
            siteData.forEach(d => {
                if (!stations.includes(d.Station)) stations.push(d.Station);
            });
            
            const startX = currentX;
            
            stations.forEach(station => {
                let stationData = siteData.filter(d => d.Station === station);
                // Sort
                stationData.sort((a, b) => pmOrder.indexOf(a.PM_size) - pmOrder.indexOf(b.PM_size));
                
                stationData.forEach(row => {
                    const color = colors[row.PM_size];
                    
                    barData.push({
                        value: [currentX, row.OP_AA_m_mean],
                        itemStyle: { color: color }
                    });
                    
                    // Error bar: [x, low, high]
                    errorData.push([
                        currentX, 
                        row.OP_AA_m_mean - row.OP_AA_m_SD,
                        row.OP_AA_m_mean + row.OP_AA_m_SD
                    ]);
                    
                    scatterData.push({
                        value: [currentX, row.PM_mass_mean],
                        itemStyle: { color: color, borderColor: 'black', borderWidth: 1 }
                    });
                    
                    currentX += 1;
                });
                
                currentX += groupGap;
            });
            
            const endX = currentX - groupGap;
            siteTypeCenters.push({
                x: (startX + endX) / 2 - 0.5,
                label: siteTypeLabels[type]
            });
            
            if (i < siteTypeOrder.length - 1) {
                dividers.push(currentX - (groupGap/2) + (typeGap/2) - 0.5);
            }
            
            currentX += typeGap;
        });

        const chart = echarts.init(document.getElementById('chart-container'));

        const option = {
            backgroundColor: 'white',
            grid: { top: 80, bottom: 50, left: 60, right: 60 },
            xAxis: {
                type: 'value',
                show: false,
                min: -0.5,
                max: currentX
            },
            yAxis: [
                {
                    type: 'value',
                    name: 'OPᴬᴬₘ (nmolAA min⁻¹ μg⁻¹)',
                    nameLocation: 'middle',
                    nameGap: 40,
                    min: 0,
                    max: 0.25,
                    splitLine: { show: true, lineStyle: { type: 'dashed' } },
                    axisLabel: { color: 'black' }
                },
                {
                    type: 'value',
                    name: 'PM (μg m⁻³)',
                    nameLocation: 'middle',
                    nameGap: 40,
                    min: 0,
                    max: 50,
                    splitLine: { show: false },
                    axisLabel: { color: 'black' }
                }
            ],
            series: [
                {
                    type: 'bar',
                    data: barData,
                    barWidth: '80%',
                    yAxisIndex: 0,
                    z: 2
                },
                {
                    type: 'custom',
                    renderItem: function(params, api) {
                        const xValue = api.value(0);
                        const low = api.value(1);
                        const high = api.value(2);
                        const style = api.style({ stroke: 'gray', lineWidth: 1.5 });
                        const xCoord = api.coord([xValue, high])[0]; // x is same for low/high
                        const lowCoord = api.coord([xValue, low]);
                        const highCoord = api.coord([xValue, high]);
                        
                        return {
                            type: 'group',
                            children: [
                                { type: 'line', shape: { x1: lowCoord[0], y1: lowCoord[1], x2: highCoord[0], y2: highCoord[1] }, style: style },
                                { type: 'line', shape: { x1: xCoord-5, y1: lowCoord[1], x2: xCoord+5, y2: lowCoord[1] }, style: style },
                                { type: 'line', shape: { x1: xCoord-5, y1: highCoord[1], x2: xCoord+5, y2: highCoord[1] }, style: style }
                            ]
                        };
                    },
                    data: errorData,
                    yAxisIndex: 0,
                    z: 3
                },
                {
                    type: 'scatter',
                    data: scatterData,
                    symbolSize: 10,
                    yAxisIndex: 1,
                    z: 4
                }
            ],
            graphic: [

                ...siteTypeCenters.map(s => ({
                    type: 'text',
                    left: 60 + (s.x + 0.5) * (880 / (currentX + 0.5)),
                    top: 50,
                    style: { text: s.label, font: 'bold 14px Arial', textAlign: 'center' }
                })),
                // Dividers
                ...dividers.map(d => ({
                    type: 'line',
                    shape: {
                        x1: 60 + (d + 0.5) * (880 / (currentX + 0.5)), 
                        y1: 80, 
                        x2: 60 + (d + 0.5) * (880 / (currentX + 0.5)), 
                        y2: 450 
                    },
                    style: { stroke: 'gray', lineWidth: 2 }
                })),
                // 'a)' label
                {
                    type: 'text',
                    left: 20, top: 20,
                    style: { text: 'a)', font: 'bold 16px Arial' }
                }
            ],
            legend: {
                data: [
                    {name: 'PM1', icon: 'rect', itemStyle: {color: colors['PM1']}},
                    {name: 'PM2.5', icon: 'rect', itemStyle: {color: colors['PM2.5']}},
                    {name: 'PM10', icon: 'rect', itemStyle: {color: colors['PM10']}},
                    {name: 'PM mass\nconcentration', icon: 'circle', itemStyle: {color: 'white', borderColor: 'black', borderWidth: 1}}
                ],
                right: 60, top: 30,
                orient: 'horizontal'
            }
        };
        
        // Add dummy series for legend
        option.series.push(
            {name: 'PM1', type: 'bar', data: [], color: colors['PM1']},
            {name: 'PM2.5', type: 'bar', data: [], color: colors['PM2.5']},
            {name: 'PM10', type: 'bar', data: [], color: colors['PM10']},
            {name: 'PM mass\nconcentration', type: 'scatter', data: [], itemStyle: {color: 'white', borderColor: 'black', borderWidth: 1}}
        );

        chart.setOption(option);
