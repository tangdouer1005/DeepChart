        // 2. Statistics Functions
        function getMean(data) {
            if (!data || !data.length) return 0;
            return data.reduce((a, b) => a + b, 0) / data.length;
        }

        function getVariance(data, mean) {
            if (!data || data.length <= 1) return 0;
            return data.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / (data.length - 1);
        }

        function getSEM(data) {
            if (!data || data.length <= 1) return 0;
            const mean = getMean(data);
            const variance = getVariance(data, mean);
            return Math.sqrt(variance) / Math.sqrt(data.length);
        }

        function getStarFromPValue(p) {
            if (p < 0.001) return '***';
            if (p < 0.01) return '**';
            if (p < 0.05) return '*';
            return "";
        }


        // 3. Data Processing
        
        const proteins = ['G15', 'Gi1', 'Gi2', 'GoA', 'GoB', 'Gg', 'G12', 'G13'];
        const plotData = [];

        // Map from protein name to data object for easy lookup
        const dataMap = {};
        sourceData.forEach(item => {
            dataMap[item.protein] = item;
        });

        proteins.forEach(proteinName => {
            if (!dataMap[proteinName]) return;
            const item = dataMap[proteinName];

            plotData.push({
                protein: proteinName,
                ntsr1: item.ntsr1,
                noNtsr1: item.no_ntsr1,
                pValue: item.p_value
            });
        });

        // 4. Prepare Plotly Traces
        const xProts = plotData.map(d => d.protein);
        const yMeanNtsr1 = plotData.map(d => getMean(d.ntsr1));
        const ySemNtsr1 = plotData.map(d => getSEM(d.ntsr1));
        const yMeanNoNtsr1 = plotData.map(d => getMean(d.noNtsr1));
        const ySemNoNtsr1 = plotData.map(d => getSEM(d.noNtsr1));

        const xIndices = xProts.map((_, i) => i);
        const barOffset = 0.35 / 2; // 0.175
        const trace1X = xIndices.map(i => i - barOffset);
        const trace2X = xIndices.map(i => i + barOffset);
        
        // Trace 1: NTSR1 Bars
        const trace1 = {
            x: trace1X,
            y: yMeanNtsr1,
            type: 'bar',
            name: 'Cells with NTSR1',
            width: 0.35,
            marker: { color: '#9932CC' },
            error_y: {
                type: 'data',
                array: ySemNtsr1,
                visible: true,
                color: 'black',
                thickness: 1,
                width: 3
            }
        };

        // Trace 2: No NTSR1 Bars
        const trace2 = {
            x: trace2X,
            y: yMeanNoNtsr1,
            type: 'bar',
            name: 'Cell without NTSR1',
            width: 0.35,
            marker: { 
                color: 'white',
                line: { color: '#9932CC', width: 1.5 }
            },
            error_y: {
                type: 'data',
                array: ySemNoNtsr1,
                visible: true,
                color: '#9932CC',
                thickness: 1,
                width: 3
            }
        };
        
        const xScatter1 = [];
        const yScatter1 = [];
        const xScatter2 = [];
        const yScatter2 = [];

        // Now Scatters
        plotData.forEach((d, i) => {
            // NTSR1 Scatter
            if (d.ntsr1) {
                d.ntsr1.forEach(y => {
                    const jitter = (Math.random() - 0.5) * 0.1; // -0.05 to 0.05
                    xScatter1.push(i - barOffset + jitter);
                    yScatter1.push(y);
                });
            }
            // No NTSR1 Scatter
            if (d.noNtsr1) {
                d.noNtsr1.forEach(y => {
                    const jitter = (Math.random() - 0.5) * 0.1;
                    xScatter2.push(i + barOffset + jitter);
                    yScatter2.push(y);
                });
            }
        });

        const traceScatter1 = {
            x: xScatter1,
            y: yScatter1,
            mode: 'markers',
            type: 'scatter',
            marker: { color: 'white', line: { color: 'gray', width: 0.8 }, size: 6 },
            showlegend: false,
            hoverinfo: 'y'
        };

        const traceScatter2 = {
            x: xScatter2,
            y: yScatter2,
            mode: 'markers',
            type: 'scatter',
            marker: { color: 'white', line: { color: '#9932CC', width: 0.8 }, size: 6 },
            showlegend: false,
            hoverinfo: 'y'
        };

        const data = [trace1, trace2, traceScatter1, traceScatter2];

        // 5. Annotations (Stars and Family Groups)
        const annotations = [];
        const shapes = [];

        // Stars
        plotData.forEach((d, i) => {
            const star = getStarFromPValue(d.pValue);
            if (star) {
                const maxVal = Math.max(
                    (d.ntsr1 && d.ntsr1.length ? Math.max(...d.ntsr1) : 0),
                    (d.noNtsr1 && d.noNtsr1.length ? Math.max(...d.noNtsr1) : 0)
                );
                let bracketY = maxVal + 0.03;
                if (bracketY < 0.05) bracketY = 0.05;
                if (['G12', 'G13'].includes(d.protein)) bracketY += 0.02;

                const x1 = i - barOffset;
                const x2 = i + barOffset;

                // Bracket line
                shapes.push({
                    type: 'path',
                    path: `M ${x1} ${bracketY - 0.01} L ${x1} ${bracketY} L ${x2} ${bracketY} L ${x2} ${bracketY - 0.01}`,
                    line: { color: 'black', width: 1 }
                });

                // Star Text
                annotations.push({
                    x: i,
                    y: bracketY,
                    text: star,
                    showarrow: false,
                    yshift: 5,
                    font: { size: 14, color: 'black', family: 'Arial', weight: 'bold' }
                });
            }
        });

        // Family Groups
        const families = [
            {name: 'Gq', start: 0, end: 0},
            {name: 'Gi/o', start: 1, end: 5},
            {name: 'G12/13', start: 6, end: 7}
        ];

        families.forEach(f => {
            const xStart = f.start - 0.3;
            const xEnd = f.end + 0.3;
            const lineY = -0.12; 

            shapes.push({
                type: 'line',
                x0: xStart, x1: xEnd,
                y0: lineY, y1: lineY,
                line: { color: 'black', width: 2 },
                xref: 'x', yref: 'y'
            });

            annotations.push({
                x: (xStart + xEnd) / 2,
                y: lineY - 0.05,
                text: f.name,
                showarrow: false,
                yshift: 0, 
                font: { size: 12, color: 'black', weight: 'bold' },
                xref: 'x', yref: 'y',
                valign: 'top'
            });
        });
        
        // "Family" label
        annotations.push({

            showarrow: false,
            font: { size: 12, color: 'black', weight: 'bold' },

        // "e" label (Top Left)

            font: { size: 24, weight: 'bold', color: 'black' },
