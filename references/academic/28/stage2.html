// -------------------------------------------------------------------
// Helper to parse CSV data
// -------------------------------------------------------------------
function parseCSV(csv) {
    const lines = csv.trim().split('\n');
    const header = lines[0].split(',').map(h => h.trim());
    const data = [];
    
    for (let i = 1; i < lines.length; i++) {
        const parts = lines[i].split(',').map(s => s.trim());
        const entry = {};
        header.forEach((h, idx) => {
            entry[h] = parts[idx];
        });
        // Convert numbers
        entry['300 patients'] = parseFloat(entry['300 patients']);
        entry['150 patients'] = parseFloat(entry['150 patients']);
        entry['75 patients'] = parseFloat(entry['75 patients']);
        data.push(entry);
    }
    return data;
}

const data = parseCSV(csvData);

// -------------------------------------------------------------------
// Function to generate violin plot options for a given target column
// -------------------------------------------------------------------
function generateOptions(targetCol, titleText) {
    // 1. Group data by Model
    const modelGroups = {};
    data.forEach(item => {
        const m = item.Model;
        if (!modelGroups[m]) modelGroups[m] = [];
        modelGroups[m].push(item[targetCol]);
    });

    // 2. Calculate Median for sorting
    const modelMedians = [];
    Object.keys(modelGroups).forEach(m => {
        const values = modelGroups[m];
        // Filter out NaN values
        const cleanValues = values.filter(v => !isNaN(v));
        cleanValues.sort((a, b) => a - b);
        
        if (cleanValues.length === 0) {
            modelMedians.push({ model: m, median: NaN });
            return;
        }

        const median = jStat.median(cleanValues);
        modelMedians.push({ model: m, median: median });
    });

    // Sort descending by median
    modelMedians.sort((a, b) => {
        if (isNaN(a.median) && isNaN(b.median)) return 0;
        if (isNaN(a.median)) return 1;
        if (isNaN(b.median)) return -1;
        return b.median - a.median;
    });
    const sortedModels = modelMedians.map(item => item.model);

    // 3. Prepare Boxplot and Violin Data
    const boxData = [];
    const violinDataList = [];

    sortedModels.forEach((m) => {
        const values = modelGroups[m].filter(v => !isNaN(v));
        values.sort((a, b) => a - b);

        // Boxplot Data
        if (values.length === 0) {
            boxData.push([NaN, NaN, NaN, NaN, NaN]);
            violinDataList.push(null);
            return;
        }
        
        const min = values[0];
        const max = values[values.length - 1];
        const q1 = jStat.percentile(values, 0.25);
        const median = jStat.median(values);
        const q3 = jStat.percentile(values, 0.75);
        
        boxData.push([min, q1, median, q3, max]);

        // KDE for Violin
        if (values.length < 2) {
            violinDataList.push(null);
            return;
        }

        const bandwidth = 0.05; 
        const steps = 50;
        const minVal = 0.35;
        const maxVal = 1.0;
        const stepSize = (maxVal - minVal) / steps;
        const densityData = [];
        
        for (let i = 0; i <= steps; i++) {
            const y = minVal + i * stepSize;
            let density = 0;
            values.forEach(val => {
                const u = (y - val) / bandwidth;
                density += Math.exp(-0.5 * u * u) / (Math.sqrt(2 * Math.PI));
            });
            densityData.push([y, density]);
        }
        violinDataList.push(densityData);
    });

    // Color palette (RdBu-like, for 19 models)
    const palette = [
        '#8e0c13', '#a31216', '#b81b1a', '#cd261e', '#da3e20',
        '#e45622', '#ed6e25', '#f38a29', '#f7a630', '#fbc24a',
        '#f7d774', '#eef0f2', '#cfdaed', '#b0c6e6', '#91b2df',
        '#739ed7', '#568ac0', '#3b76a7', '#22618d'
    ];
    
    function getColor(index) {
        return palette[index % palette.length];
    }

    return {
        backgroundColor: 'white',
        title: {
            text: titleText,
            left: 'center',
            top: 10
        },
        tooltip: {
            trigger: 'item',
            axisPointer: {
                type: 'shadow'
            }
        },
        grid: {
            left: '5%',
            right: '5%',
            top: '10%',
            bottom: '20%',
            containLabel: true
        },
        xAxis: {
            type: 'category',
            data: sortedModels,
            axisLabel: {
                rotate: 45,
                interval: 0,
                color: 'black',
                fontSize: 10
            },
            axisLine: { lineStyle: { color: '#ccc' } },
            axisTick: { show: false }
        },
        yAxis: {
            type: 'value',
            name: 'Distribution of AUROC scores\nacross 29 tasks',
            nameLocation: 'middle',
            nameGap: 50,
            min: 0.35,
            max: 1.0,
            splitLine: {
                show: true,
                lineStyle: {
                    type: 'dashed',
                    color: '#eee'
                }
            },
            axisLine: { lineStyle: { color: '#ccc' } },
            axisLabel: { color: 'black', fontSize: 10 }
        },
        series: [
            {
                name: 'boxplot',
                type: 'boxplot',
                data: boxData.map((item, index) => {
                    return {
                        value: item,
                        itemStyle: {
                            color: getColor(index, boxData.length), // Violin fill color
                            borderColor: '#333' // Boxplot border color
                        }
                    };
                }),
                itemStyle: {
                    borderColor: 'black', // Median/whisker color
                    borderWidth: 1.5
                },
                boxWidth: [5, 10], // Narrow boxplot
                z: 10
            },
            {
                name: 'Violin Density',
                type: 'custom',
                renderItem: function(params, api) {
                    const x = api.value(0);
                    const density = violinDataList[params.dataIndex];
                    
                    if (!density) return;

                    const points = [];
                    let maxDensity = 0;
                    density.forEach(item => {
                        maxDensity = Math.max(maxDensity, item[1]);
                    });

                    // Scale factor for violin width
                    const scaleFactor = 15; 
                    
                    // Top half
                    for (let i = 0; i < density.length; i++) {
                        const p = density[i];
                        const ptY = api.coord([x, p[0]])[1];
                        const ptX = api.coord([x, p[0]])[0]; 
                        const width = p[1] * scaleFactor / (maxDensity || 1);
                        points.push([ptX + width, ptY]);
                    }
                    // Bottom half (mirror)
                    for (let i = density.length - 1; i >= 0; i--) {
                        const p = density[i];
                        const ptY = api.coord([x, p[0]])[1];
                        const ptX = api.coord([x, p[0]])[0];
                        const width = p[1] * scaleFactor / (maxDensity || 1);
                        points.push([ptX - width, ptY]);
                    }
                    
                    const style = api.style({ opacity: 0.8 });
                    style.stroke = style.fill;

                    return {
                        type: 'polygon',
                        shape: { points: points },
                        style: style
                    };
                },
                encode: {
                    x: 0,
                    y: 1
                },
                data: sortedModels.map((item, index) => {
                    return {
                        value: [index, 0],
                        itemStyle: {
                            color: getColor(index)
                        }
                    };
                }),
                z: 0
            }
        ]
    };
}

// Initialize chart
const myChart = echarts.init(document.getElementById('chart-container'));
const option = generateOptions('300 patients', 'Downstream training with 300 patients');
myChart.setOption(option);

window.addEventListener('resize', function() {
    myChart.resize();
