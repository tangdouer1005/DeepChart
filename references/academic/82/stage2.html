        const df = sourceData;
        
        const colors = {
            'PM1': '#4E79A7',
            'PM2.5': '#F28E2B',
            'PM10': '#59A14F'
        };
        const stationOrder = [
            'BERN', 'ZURICH', 'BCN', 'MRS-lcp', 'PARIS-lcpp', 'PARIS-lh', 
            'ATH', 'KRAK', 'BASEL', 'MGD', 'PAYRN', 'MSY', 'OPE'
        ];
        const pmOrder = ['PM1', 'PM2.5', 'PM10'];

        const barData = [];
        const errorData = [];
        const scatterData = [];
        
        let currentX = 0;
        const barWidth = 0.22;
        
        stationOrder.forEach((station, i) => {
            const stationData = df.filter(d => d.Station === station);
            stationData.sort((a, b) => pmOrder.indexOf(a.PM_size) - pmOrder.indexOf(b.PM_size));
            
            const nBars = stationData.length;
            const totalWidth = nBars * barWidth;
            const startOffset = -totalWidth / 2 + barWidth / 2;
            
            stationData.forEach((row, j) => {
                const offset = startOffset + j * barWidth;
                const xPos = i + offset;
                const color = colors[row.PM_size];
                
                barData.push({
                    value: [xPos, row.OP_DTT_m_mean],
                    itemStyle: { color: color }
                });
                
                errorData.push([
                    xPos,
                    row.OP_DTT_m_mean - row.OP_DTT_m_SD,
                    row.OP_DTT_m_mean + row.OP_DTT_m_SD
                ]);
                
                scatterData.push({
                    value: [xPos, row.PM_mass_mean],
                    itemStyle: { color: color, borderColor: 'black', borderWidth: 1 }
                });
            });
        });

        const chart = echarts.init(document.getElementById('chart-container'));

        const option = {
            backgroundColor: 'white',
            grid: { top: 80, bottom: 80, left: 60, right: 60 },
            xAxis: {
                type: 'value',
                min: -0.6,
                max: stationOrder.length - 0.4,
                interval: 1,
                axisLabel: {
                    formatter: function (value) {
                        return stationOrder[value];
                    },
                    rotate: 60,
                    color: 'black'
                },
                axisTick: { show: false },
                splitLine: { show: false }
            },
            yAxis: [
                {
                    type: 'value',
                    name: 'OPᴰᵀᵀₘ (nmolDTT min⁻¹ μg⁻¹)',
                    nameLocation: 'middle',
                    nameGap: 45,
                    min: 0,
                    max: 0.25,
                    splitLine: { show: true, lineStyle: { type: 'dashed' } },
                    axisLabel: { color: 'black' }
                },
                {
                    type: 'value',
                    name: 'PM (μg m⁻³)',
                    nameLocation: 'middle',
                    nameGap: 45,
                    min: 0,
                    max: 50,
                    splitLine: { show: false },
                    axisLabel: { color: 'black' }
                }
            ],
            series: [
                {
                    type: 'custom',
                    data: barData,
                    renderItem: function(params, api) {
                        const xVal = api.value(0);
                        const yVal = api.value(1);
                        const start = api.coord([xVal - barWidth/2, 0]);
                        const size = api.size([barWidth, yVal]);
                        return {
                            type: 'rect',
                            shape: {
                                x: start[0],
                                y: start[1] - size[1], // y grows down
                                width: size[0],
                                height: size[1]
                            },
                            style: api.style()
                        };
                    },
                    z: 2
                },
                {
                    type: 'custom',
                    renderItem: function(params, api) {
                        const xValue = api.value(0);
                        const low = api.value(1);
                        const high = api.value(2);
                        const style = api.style({ stroke: 'gray', lineWidth: 1.5 });
                        const xCoord = api.coord([xValue, high])[0];
                        const lowCoord = api.coord([xValue, low]);
                        const highCoord = api.coord([xValue, high]);
                        
                        return {
                            type: 'group',
                            children: [
                                { type: 'line', shape: { x1: lowCoord[0], y1: lowCoord[1], x2: highCoord[0], y2: highCoord[1] }, style: style },
                                { type: 'line', shape: { x1: xCoord-5, y1: lowCoord[1], x2: xCoord+5, y2: lowCoord[1] }, style: style },
                                { type: 'line', shape: { x1: xCoord-5, y1: highCoord[1], x2: xCoord+5, y2: highCoord[1] }, style: style }
                            ]
                        };
                    },
                    data: errorData,
                    z: 3
                },

                    type: 'scatter',
                    data: scatterData,
                    yAxisIndex: 1,
                    symbolSize: 10,
                    z: 4
                }

                    left: 20, top: 20,
                    style: { text: 'b)', font: 'bold 16px Arial' }
