        const colors = {
            'CH4': '#5D94C3',
            'CO2': '#9EB9D9',

            'Residential': '#F4B95A',
            'Industrial': '#A6A6A6',
            'Solid waste': '#F2D675',
            'Waste water': '#556B2F',
            'Other': '#D3D3D3'
        };

        function getColor(name) {
            if (colors[name]) return colors[name];
            if (name.includes('Energy') || name.includes('Ener')) return '#D6DBDF';
            if (name.includes('Industrial')) return '#85929E';
            if (name.includes('Chemicals')) return '#AED6F1';
            if (name.includes('Residential')) return '#5DADE2';
            return '#D7DBDD';
        }

        
        // Reconstruct Nodes and Links from aggregated layers
        const rawLinks = chartData.links;
        const layers = [];
        if (rawLinks) {
            rawLinks.forEach(l => {
                if (!layers[l.layer]) layers[l.layer] = [];
                layers[l.layer].push(l);
            });
        }
        const nodes = new Set();
        const linksArray = [];
        
        function addLinkObj(s, t, v) {
            nodes.add(s);
            nodes.add(t);
            linksArray.push({ source: s, target: t, value: v });
        }

        if (layers[0]) layers[0].forEach(l => addLinkObj("L0_" + l.source, "L1_" + l.target, l.value));
        if (layers[1]) layers[1].forEach(l => addLinkObj("L1_" + l.source, "L2_" + l.target, l.value));
        if (layers[2]) layers[2].forEach(l => addLinkObj("L2_" + l.source, "L3_" + l.target, l.value));
        if (layers[3]) layers[3].forEach(l => addLinkObj("L3_" + l.source, "L4_" + l.target, l.value));

        const nodesArray = Array.from(nodes).map(id => {
            const parts = id.split('_');
            const layer = parseInt(parts[0].replace('L', ''));
            const name = parts.slice(1).join('_');
            return {
                name: id,
                realName: name,
                itemStyle: {
                    color: getColor(name)
                },
                depth: layer 
            };
        });

        const totalFlux = chartData.total_flux || 0;

        const option = {
            title: {
                text: '', 
            },
            tooltip: {
                trigger: 'item',
                triggerOn: 'mousemove'
            },
            series: [
                {
                    type: 'sankey',
                    data: nodesArray,
                    links: linksArray,
                    left: '2%',
                    right: '15%',
                    top: '10%',
                    bottom: '5%',
                    nodeWidth: 20,
                    nodeGap: 8,
                    layoutIterations: 32,
                    draggable: false,
                    label: {
                        show: true,
                        position: 'right',
                        formatter: function(params) {
                            const node = params.data;
                            const name = node.realName;
                            const val = params.value;
                            const pct = (val / totalFlux * 100).toFixed(1);
                            if (parseFloat(pct) < 1) return '';
                            // Specific renames for display
                            let dispName = name;
                            if (name.includes("Ener for")) dispName = name.replace("Ener for", "Energy for");
                            if (name.includes("Enteric")) dispName = "Enteric ferment";
                            
                            return `${dispName} (${pct}%)`;
                        },
                        fontSize: 10
                    },
                    lineStyle: {
                        color: 'source',
                        opacity: 0.4,
                        curveness: 0.5
                    }
                }
            ],
            graphic: [
                { type: 'text', left: '2%', top: '6%', style: { text: 'Gases', fontWeight: 'bold' } },
                { type: 'text', left: '22%', top: '6%', style: { text: 'Sectors', fontWeight: 'bold' } },
                { type: 'text', left: '42%', top: '6%', style: { text: 'Stages', fontWeight: 'bold' } },
                { type: 'text', left: '62%', top: '6%', style: { text: 'Categories', fontWeight: 'bold' } },
                { type: 'text', left: '82%', top: '6%', style: { text: 'Gases', fontWeight: 'bold' } },
                // Label 'b'
                { type: 'text', left: '1%', top: '2%', style: { text: 'b', fontSize: 24, fontWeight: 'bold' } }
            ]
        };

        const chart = echarts.init(document.getElementById('chart-container'));
        chart.setOption(option);
