        // Process data: Convert to percentage and normalize stage names
        /* rawData.forEach(d => {
            d.value = d.value * 100;
            // Capitalize first letter
            d.Stage = d.Stage.charAt(0).toUpperCase() + d.Stage.slice(1);
        }); */

        const categories = ['Preschool', 'Primary school', 'Secondary school', 'University'];
        const colors = {
            'Preschool': '#7aa0c4',       
            'Primary school': '#cbb6d9', 
            'Secondary school': '#fcfcbd', 
            'University': '#c48a69'       
        };

        const chart = echarts.init(document.getElementById('chart-container'));

        // Prepare data
        const boxplotData = [];
        const scatterData = [];
        const errorData = [];

        categories.forEach((cat, idx) => {
            const values = rawData.filter(d => d.Stage === cat).map(d => d.value);
            
            const n = values.length;
            const mean = values.reduce((a, b) => a + b, 0) / n;
            
            // Standard Error
            const std = Math.sqrt(values.map(x => Math.pow(x - mean, 2)).reduce((a, b) => a + b) / (n - 1));
            const se = std / Math.sqrt(n);
            const ci = se; // Python code uses 'se'

            boxplotData.push({
                value: mean,
                itemStyle: {
                    color: '#e0e0e0',
                    borderColor: 'black',
                    borderWidth: 1
                }
            });

            errorData.push({
                x: idx,
                low: mean - ci,
                high: mean + ci
            });

            values.forEach(v => {
                const jitter = (Math.random() - 0.5) * 0.5;
                scatterData.push({
                    value: [idx + jitter, v],
                    itemStyle: {
                        color: colors[cat],
                        borderColor: '#404040',
                        borderWidth: 1,
                        opacity: 0.6
                    }
                });
            });
        });

        const option = {
            animation: false,
            backgroundColor: 'white',
            grid: {
                top: 50,
                bottom: 50,
                left: 60,
                right: 20
            },
            xAxis: {
                type: 'category',
                data: ['Preschool', 'Primary\nschool', 'Secondary\nschool', 'University'],
                axisLabel: { color: 'black', fontSize: 14, interval: 0 },
                axisLine: { show: true, lineStyle: { color: 'black' } },
                axisTick: { show: false }
            },
            yAxis: {
                type: 'value',
                name: 'Plate waste rate (%)',
                nameLocation: 'middle',
                nameGap: 40,
                min: 0,
                max: 80,
                interval: 10,
                axisLabel: { color: 'black' },
                axisLine: { show: true, lineStyle: { color: 'black' } },
                splitLine: { show: false }
            },
            series: [
                {
                    type: 'bar',
                    data: boxplotData,
                    barWidth: '60%',
                    z: 1
                },
                {
                    type: 'custom',
                    renderItem: function (params, api) {
                        const idx = params.dataIndex;
                        const err = errorData[idx];
                        const x = api.coord([err.x, 0])[0];
                        const yHigh = api.coord([err.x, err.high])[1];
                        const yLow = api.coord([err.x, err.low])[1];
                        
                        const capWidth = 10;

                        return {
                            type: 'group',
                            children: [
                                {
                                    type: 'line',
                                    shape: { x1: x, y1: yHigh, x2: x, y2: yLow },
                                    style: { stroke: 'black', lineWidth: 1.2 }
                                },
                                {
                                    type: 'line',
                                    shape: { x1: x - capWidth/2, y1: yHigh, x2: x + capWidth/2, y2: yHigh },
                                    style: { stroke: 'black', lineWidth: 1.2 }
                                },
                                {
                                    type: 'line',
                                    shape: { x1: x - capWidth/2, y1: yLow, x2: x + capWidth/2, y2: yLow },
                                    style: { stroke: 'black', lineWidth: 1.2 }
                                }
                            ]
                        };
                    },
                    data: errorData,
                    z: 3
                },
                {
                    type: 'scatter',
                    data: scatterData,
                    symbolSize: 9,
                    z: 2
                }
            ],
            graphic: [
                {
                    type: 'text',
                    left: 0,
                    top: 0,
                    style: {
                        text: 'd',
                        font: 'bold 20px Arial',
                        fill: 'black'
                    }
                }
            ]
        };

        chart.setOption(option);
    </script>
