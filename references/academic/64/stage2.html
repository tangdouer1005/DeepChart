        const colors = ['#000099', '#E0B0FF', '#DA70D6', '#9932CC', '#4B0082'];
        const markers = ['circle', 'rect', 'rect', 'rect', 'rect'];

        const chart = echarts.init(document.getElementById('chart-container'));

        const series = [];

        chartData.forEach((dataset, i) => {
            const label = dataset.label;
            const color = colors[i];
            
            // Map JSON data to [x, y, err]
            const data = dataset.x_vals.map((x, idx) => [x, dataset.y_mean[idx], dataset.y_sem[idx]]).sort((a,b) => a[0] - b[0]);
            
            if (data.length === 0) return;

            // 1. Scatter Points (Means)
            series.push({
                name: label,
                type: 'scatter',
                data: data.map(d => [d[0], d[1]]),
                symbol: markers[i],
                symbolSize: 8,
                itemStyle: { color: color },
                z: 10
            });

            // 2. Error Bars (Custom Series)
            series.push({
                type: 'custom',
                name: label + '_error',
                itemStyle: {
                    borderWidth: 1.5,
                    stroke: color
                },
                renderItem: function (params, api) {
                    const xValue = api.value(0);
                    const meanValue = api.value(1);
                    const semValue = api.value(2);
                    
                    const highPoint = api.coord([xValue, meanValue + semValue]);
                    const lowPoint = api.coord([xValue, meanValue - semValue]);
                    
                    const halfWidth = 3; // pixels
                    
                    const style = api.style({
                        stroke: color,
                        fill: null
                    });

                    return {
                        type: 'group',
                        children: [
                            {
                                type: 'line',
                                shape: {
                                    x1: highPoint[0], y1: highPoint[1],
                                    x2: lowPoint[0], y2: lowPoint[1]
                                },
                                style: style
                            },
                            {
                                type: 'line',
                                shape: {
                                    x1: highPoint[0] - halfWidth, y1: highPoint[1],
                                    x2: highPoint[0] + halfWidth, y2: highPoint[1]
                                },
                                style: style
                            },
                            {
                                type: 'line',
                                shape: {
                                    x1: lowPoint[0] - halfWidth, y1: lowPoint[1],
                                    x2: lowPoint[0] + halfWidth, y2: lowPoint[1]
                                },
                                style: style
                            }
                        ]
                    };
                },
                data: data,
                z: 9,
                silent: true,
                tooltip: { show: false } 
            });

            // 3. Smooth Line
            series.push({
                name: label + '_fit',
                type: 'line',
                data: data.map(d => [d[0], d[1]]),
                smooth: true,
                symbol: 'none',
                lineStyle: { color: color, width: 1.5 },
                z: 1,
                silent: true
            });
        });

        const option = {
            backgroundColor: 'white',
            grid: { top: 40, bottom: 40, left: 50, right: 20 },
            xAxis: {
                type: 'value',
                min: -15, max: -3,
                interval: 2,
                axisLabel: { color: 'black', fontSize: 12 },
                axisLine: { lineStyle: { color: 'black' } },
                axisTick: { show: true, alignWithLabel: true, inside: true },
                splitLine: { show: false }
            },
            yAxis: {
                type: 'value',
                min: -0.05, max: 0.35,
                interval: 0.1,
                axisLabel: { color: 'black', fontSize: 12 },
                axisLine: { show: false }, // Matplotlib plot shows no y-axis line, just ticks? No, usually box.
                // Python: ax.spines['right'].set_visible(False), ax.spines['top'].set_visible(False)
                // Left and Bottom are visible.
                axisLine: { lineStyle: { color: 'black' }, show: true },
                axisTick: { show: true, inside: true },
                splitLine: { show: false }
            },
            graphic: [
                 // Title G11
                {
                    type: 'text',
                    left: '5%', top: '5%',
                    style: { text: 'G₁₁', font: '14px sans-serif', fill: 'black' }
                },
                // Dashed line at y=0
                {
                    type: 'line',
                    shape: { x1: 50, y1: 0, x2: 580, y2: 0 }, // We need to coordinate this with axis...
                    // Easier to use markLine in a series, but let's use a dummy series for the ref line
                },
                // Arrow
                // Hard to position exactly without coordinate conversion.
                // ECharts allows graphic elements with position relative to chart.
            ],
            series: [
                ...series,
                {
                    // Reference line y=0
                    type: 'line',
                    data: [[-15, 0], [-3, 0]],
                    symbol: 'none',
                    lineStyle: { color: 'black', type: 'dashed', width: 0.8 },
                    z: 0,
                    silent: true

        // Add custom Arrow via graphic component, but it's hard to map data coords to pixels easily in 'graphic'.

        option.xAxis.name = 'Log [NT], M';
        option.xAxis.nameLocation = 'middle';
        option.xAxis.nameGap = 25;
        
        // Y Axis name is missing in Python script explicitly?

        chart.setOption(option);
