        const data = chartData.data;
        const biomeOrder = chartData.biome_order;

        // Sort data based on Biome order and then UF
        data.sort((a, b) => {
            const idxA = biomeOrder.indexOf(a.Biome);
            const idxB = biomeOrder.indexOf(b.Biome);
            if (idxA !== idxB) return idxA - idxB;
            return a.UF.localeCompare(b.UF);
        });

        // 3. Prepare Data
        const categoryData = [];
        const seriesDomestic = [];
        const seriesChina = [];
        const seriesEU = [];
        const seriesOther = [];
        
        let lastBiome = null;
        const biomeRanges = [];
        let currentBiomeStartIdx = 0;
        
        data.forEach(item => {
            if (item.Biome !== lastBiome) {
                if (lastBiome !== null) {
                    biomeRanges.push({
                        name: lastBiome,
                        start: currentBiomeStartIdx,
                        end: categoryData.length - 1
                    });
                    
                    for(let k=0; k<4; k++) {
                        categoryData.push('');
                        seriesDomestic.push(null);
                        seriesChina.push(null);
                        seriesEU.push(null);
                        seriesOther.push(null);
                    }
                    currentBiomeStartIdx = categoryData.length;
                }
                lastBiome = item.Biome;
            }
            
            categoryData.push(item.UF);
            seriesDomestic.push(item.Domestic);
            seriesChina.push(item.China);
            seriesEU.push(item.EU);
            seriesOther.push(item.Other_countries);
        });
        
        if (lastBiome !== null) {
             biomeRanges.push({
                name: lastBiome,
                start: currentBiomeStartIdx,
                end: categoryData.length - 1
            });
        }

        // 4. Generate Graphic Elements
        const graphicElements = [];
        const totalAngles = categoryData.length;
        const angleStep = 360 / totalAngles;
        
        biomeRanges.forEach(range => {
            const startAngleDeg = 90 - range.start * angleStep;
            const endAngleDeg = 90 - (range.end + 1) * angleStep;
            const midAngleDeg = (startAngleDeg + endAngleDeg) / 2;
            
            // Text Calculation
            const rText = 440; // Outer label radius (referencing 133.html)

            const radText = midAngleDeg * Math.PI / 180;
            // Coordinates
            const xText = 500 + rText * Math.cos(radText); 
            const yText = 500 - rText * Math.sin(radText); 
            
            graphicElements.push({
                type: 'text',
                left: xText,
                top: yText,
                style: {
                    text: range.name,
                    textAlign: 'center',
                    textVerticalAlign: 'middle',
                    fill: '#333',
                    font: 'bold 14px sans-serif'
                }
            });
        });

        const option = {
            title: {
                text: '2008',
                top: 20,
                left: 20,
                textStyle: { fontSize: 24 }
            },
            legend: {
                bottom: 20,
                data: ['Domestic', 'China', 'EU', 'Other']
            },
            graphic: graphicElements,
            polar: {
                radius: ['20%', '80%']
            },
            angleAxis: {
                type: 'category',
                data: categoryData,
                startAngle: 90, 
                clockwise: true,
                axisLabel: {

                    fontSize: 10,

                    margin: 2

                axisTick: { show: false },
                axisLine: { show: false },

            },
            radiusAxis: {

                axisLine: { show: false },
                splitLine: {

                    lineStyle: { type: 'solid', color: '#ccc' }
                }
            },
            series: [

                },

                    coordinateSystem: 'polar',
                    data: seriesOther,
                    itemStyle: { color: '#d77668' }
                }
            ]
