<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nature Chart Reproduction</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>

    <style>
        body { margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #ffffff; font-family: Arial, sans-serif; }
        #chart-container { width: 700px; height: 500px; }
    </style>
</head>
<body>
    <div id="chart-container"></div>
    <script>
        const jsonData = {
    "raw_data": {
        "DMSO": [
            33.9,
            34.6,
            42.6,
            39.4
        ],
        "Rap_40nM": [
            33.7,
            40.1,
            35.5,
            37.1
        ],
        "Rap_100nM": [
            35.7,
            36.2,
            36.8,
            36.0
        ],
        "Rap_200nM": [
            37.2,
            36.7,
            37.6,
            37.7
        ],
        "LY_1uM": [
            31.7,
            40.0,
            37.7,
            40.1
        ],
        "LY_5uM": [
            41.5,
            42.6,
            43.4,
            40.3
        ],
        "LY_10uM": [
            34.4,
            38.7,
            39.9,
            37.4
        ],
        "MK_0.2uM": [
            50.3,
            48.4,
            49.7,
            51.7
        ],
        "MK_1uM": [
            46.8,
            41.7,
            46.0,
            47.6
        ]
    },
    "means": {
        "DMSO": 37.625,
        "Rap_40nM": 36.6,
        "Rap_100nM": 36.175,
        "Rap_200nM": 37.3,
        "LY_1uM": 37.375,
        "LY_5uM": 41.95,
        "LY_10uM": 37.6,
        "MK_0.2uM": 50.02499999999999,
        "MK_1uM": 45.525
    },
    "stds": {
        "DMSO": 4.120173944548135,
        "Rap_40nM": 2.715388247255506,
        "Rap_100nM": 0.4645786621588763,
        "Rap_200nM": 0.45460605656619485,
        "LY_1uM": 3.9423977475642924,
        "LY_5uM": 1.347837774610383,
        "LY_10uM": 2.3650229033422354,
        "MK_0.2uM": 1.3696106502701186,
        "MK_1uM": 2.6323310328806784
    },
    "p_values": {
        "DMSO_vs_MK_0.2uM": 0.0012467311954675578,
        "DMSO_vs_MK_1uM": 0.01787532334066616
    },
    "columns": [
        "DMSO",
        "Rap_40nM",
        "Rap_100nM",
        "Rap_200nM",
        "LY_1uM",
        "LY_5uM",
        "LY_10uM",
        "MK_0.2uM",
        "MK_1uM"
    ]
};
        const rawData = jsonData.raw_data;
        const categories = jsonData.columns;

        // Stats are pre-calculated in jsonData
        const means = jsonData.means;
        const stds = jsonData.stds;

        // Colors (Edge, Face)
        // Note: Face colors in python had alpha=0.6 applied. 
        // We will apply opacity in itemStyle.
        const colorPalette = [
            { edge: '#4D4D4D', face: '#808080' }, // DMSO
            { edge: '#D68CA0', face: '#EBCBD5' }, // Rap 40nM
            { edge: '#C96685', face: '#E0A8B8' }, // Rap 100nM
            { edge: '#B84070', face: '#D690A8' }, // Rap 200nM
            { edge: '#7DA6C2', face: '#CBE0EE' }, // LY 1uM
            { edge: '#6B9AC9', face: '#B5CEE6' }, // LY 5uM
            { edge: '#3B5998', face: '#8FA0C8' }, // LY 10uM
            { edge: '#9E9AC8', face: '#D6D4E8' }, // MK 0.2uM
            { edge: '#5E3C99', face: '#9E8CBF' }  // MK 1uM
        ];

        const chart = echarts.init(document.getElementById('chart-container'));

        // Prepare Series Data
        const barData = categories.map((cat, i) => ({
            value: means[cat],
            itemStyle: {
                color: colorPalette[i].face,
                borderColor: colorPalette[i].edge,
                borderWidth: 2,
                opacity: 0.6
            }
        }));

        const errorData = categories.map((cat, i) => [i, means[cat], stds[cat], colorPalette[i].edge]);

        const scatterData = [];
        categories.forEach((cat, i) => {
            rawData[cat].forEach(val => {
                scatterData.push({
                    value: [i, val], // No jitter in x to match python "x_values = np.full_like(..., i)"
                    itemStyle: {
                        color: colorPalette[i].edge,
                        opacity: 1
                    }
                });
            });
        });

        const getPText = (group1, group2) => {
            const key = `${group1}_vs_${group2}`;
            const pVal = jsonData.p_values[key];
            if (pVal < 0.0001) return "P < 0.0001";
            return `P = ${pVal.toFixed(4)}`;
        };

        // Annotations
        const ann1 = { start: 0, end: 7, y: 56, text: getPText('DMSO', 'MK_0.2uM') };
        const ann2 = { start: 0, end: 8, y: 65, text: getPText('DMSO', 'MK_1uM') };
        
        const annotations = [ann1, ann2];

        const option = {
            backgroundColor: 'white',
            title: {
                text: 'IFNγ⁺TNFα⁺',
                left: 'center',
                top: 20,
                textStyle: {
                    color: 'black',
                    fontSize: 16,
                    fontWeight: 'normal'
                }
            },
            grid: {
                top: 80,
                bottom: 50,
                left: 60,
                right: 20
            },
            xAxis: {
                type: 'category',
                data: categories,
                axisLabel: { show: false },
                axisTick: { 
                    show: true,
                    length: 5,
                    lineStyle: { color: 'black', width: 1.5 }
                },
                axisLine: {
                    lineStyle: { color: 'black', width: 1.5 }
                }
            },
            yAxis: {
                name: '% of live CD8⁺',
                nameLocation: 'middle',
                nameGap: 40,
                nameTextStyle: {
                    color: 'black',
                    fontSize: 14
                },
                type: 'value',
                min: 0,
                max: 75,
                interval: 20,
                axisLabel: {
                    color: 'black',
                    fontSize: 12
                },
                axisLine: {
                    show: true, // Python "left spine visible"
                    lineStyle: { color: 'black', width: 1.5 }
                },
                axisTick: {
                    show: true,
                    lineStyle: { color: 'black' }
                },
                splitLine: { show: false }
            },
            series: [
                // Bar Chart
                {
                    type: 'bar',
                    data: barData,
                    barWidth: '65%',
                    z: 1,
                    animation: false
                },
                // Scatter Points
                {
                    type: 'scatter',
                    data: scatterData,
                    symbolSize: 8,
                    z: 3,
                    animation: false
                },
                // Error Bars (Custom)
                {
                    type: 'custom',
                    renderItem: function (params, api) {
                        const xValue = api.value(0);
                        const mean = api.value(1);
                        const std = api.value(2);
                        const color = api.value(3); // Edge color passed in data
                        
                        const highPoint = api.coord([xValue, mean + std]);
                        const lowPoint = api.coord([xValue, mean - std]); // Matplotlib errorbar draws both up and down from y.
                        
                        const capWidth = 10; // Pixels
                        
                        const style = {
                            stroke: color,
                            lineWidth: 2
                        };
                        
                        return {
                            type: 'group',
                            children: [
                                // Vertical line
                                {
                                    type: 'line',
                                    shape: {
                                        x1: highPoint[0], y1: highPoint[1],
                                        x2: lowPoint[0], y2: lowPoint[1]
                                    },
                                    style: style
                                },
                                // Top cap
                                {
                                    type: 'line',
                                    shape: {
                                        x1: highPoint[0] - capWidth/2, y1: highPoint[1],
                                        x2: highPoint[0] + capWidth/2, y2: highPoint[1]
                                    },
                                    style: style
                                },
                                // Bottom cap
                                {
                                    type: 'line',
                                    shape: {
                                        x1: lowPoint[0] - capWidth/2, y1: lowPoint[1],
                                        x2: lowPoint[0] + capWidth/2, y2: lowPoint[1]
                                    },
                                    style: style
                                }
                            ]
                        };
                    },
                    data: errorData,
                    z: 2,
                    animation: false
                },
                // Statistical Annotations (Custom)
                {
                    type: 'custom',
                    name: 'Statistical Annotations',
                    renderItem: (params, api) => {
                        const children = [];
                        const bracketHeight = 5; // Height of the vertical part of the bracket in pixels
                        const textOffset = 5; // Offset for text above the bracket

                        annotations.forEach(ann => {
                            const p1 = api.coord([ann.start, ann.y]);
                            const p2 = api.coord([ann.end, ann.y]);
                            
                            const x1 = p1[0];
                            const x2 = p2[0];
                            const y = p1[1];

                            // Bracket lines
                            children.push({
                                type: 'polyline',
                                shape: {
                                    points: [
                                        [x1, y],
                                        [x1, y - bracketHeight],
                                        [x2, y - bracketHeight],
                                        [x2, y]
                                    ]
                                },
                                style: {
                                    stroke: 'black',
                                    lineWidth: 1,
                                    fill: null
                                },
                                z: 10
                            });

                            // Text
                            children.push({
                                type: 'text',
                                x: (x1 + x2) / 2,
                                y: y - bracketHeight - textOffset,
                                style: {
                                    text: ann.text,
                                    fill: 'black',
                                    fontSize: 12,
                                    align: 'center',
                                    verticalAlign: 'bottom'
                                },
                                z: 10
                            });
                        });
                        return {
                            type: 'group',
                            children: children
                        };
                    },
                    data: [0], // Dummy data to trigger renderItem once
                    z: 10,
                    animation: false
                }
            ]
        };

        chart.setOption(option);



    </script>
</body>
</html>
