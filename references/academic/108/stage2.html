<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nature Chart Reproduction</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
    <style>
        body { margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #ffffff; font-family: Arial, sans-serif; }
        #chart-container { width: 1000px; height: 500px; }
    </style>
</head>
<body>
    <div id="chart-container"></div>
    <script>
        const rawData = [
    [
        100.859599,
        120.057307,
        67.6217765,
        26.0744986,
        103.724928,
        100.865801,
        91.3419913,
        93.5064935,
        15.8008658,
        87.012987,
        105.707763,
        111.415525,
        60.2739726,
        24.4292237,
        108.219178,
        100.149158,
        94.8220754,
        58.3848285,
        33.0279139,
        93.5435755
    ],
    [
        99.1404011,
        122.922636,
        65.6160458,
        27.2206304,
        112.320917,
        100.649351,
        88.7445887,
        89.3939394,
        18.1818182,
        82.4675325,
        99.3150685,
        107.990868,
        60.9589041,
        25.5707763,
        109.13242,
        104.197741,
        101.214575,
        54.9754954,
        33.2409972,
        91.4127424
    ],
    [
        100.0,
        121.776504,
        63.8968481,
        29.7994269,
        105.157593,
        98.9177489,
        85.2813853,
        92.6406926,
        16.6666667,
        78.1385281,
        94.9771689,
        102.283105,
        52.9680365,
        22.8310502,
        97.716895,
        95.6744087,
        94.6089921,
        50.0745792,
        29.1924142,
        98.0183252
    ]
];

        // Calculate means
        const colMeans = [];
        const numCols = rawData[0].length;
        for (let j = 0; j < numCols; j++) {
            let sum = 0;
            for (let i = 0; i < rawData.length; i++) {
                sum += rawData[i][j];
            }
            colMeans.push(sum / rawData.length);
        }

        // Prepare heatmap data [x, y, value]
        const heatmapData = colMeans.map((val, idx) => [idx, 0, val]);

        // Annotations
        const annotations = [
            { groupIdx: 0, x1: 0, x2: 3, text: 'P = 3 × 10⁻¹¹', h: 1.5 },
            { groupIdx: 0, x1: 3, x2: 4, text: 'P = 1.2 × 10⁻¹¹', h: 0.5 },
            { groupIdx: 1, x1: 5, x2: 8, text: 'P = 1.6 × 10⁻¹¹', h: 1.5 },
            { groupIdx: 1, x1: 8, x2: 9, text: 'P = 1.7 × 10⁻¹⁰', h: 0.5 },
            { groupIdx: 2, x1: 10, x2: 13, text: 'P = 1.1 × 10⁻⁸', h: 1.5 },
            { groupIdx: 2, x1: 13, x2: 14, text: 'P = 5.6 × 10⁻⁹', h: 0.5 },
            { groupIdx: 3, x1: 15, x2: 18, text: 'P = 2.2 × 10⁻⁹', h: 1.5 },
            { groupIdx: 3, x1: 18, x2: 19, text: 'P = 5.3 × 10⁻⁹', h: 0.5 }
        ];

        // Table Matrix
        const rowLabels = ["Vehicle", "BSO (100 µM)", "FSP1 inhibitors", "Liproxstatin-1 (1 µM)"];
        const groupPattern = [
            ["+", "-", "-", "-", "-"], // Vehicle
            ["-", "-", "+", "+", "+"], // BSO
            ["-", "+", "-", "+", "+"], // Inhibitor (Cols should be Veh, Inh, BSO, Inh+BSO, Inh+BSO+Lip?)
            // Wait, Python script logic:
            // Group is 5 columns.
            // Row 1 (Vehicle): Only Col 0 is +
            // Row 2 (BSO): Col 2, 3, 4 are + ?
            // Let's re-verify from 108.py comment or matrix:
            // Python: 
            // ["+", "-", "-", "-", "-"], # Vehicle Row -> Col 0 is Vehicle.
            // ["-", "-", "+", "+", "+"], # BSO Row -> Col 2 (BSO), 3 (Inh+BSO??), 4 (Triple??)
            // The columns labels in Python:
            // 0: Veh
            // 1: Inh
            // 2: BSO
            // 3: Inh+BSO
            // 4: Inh+BSO+Liprox
            //
            // Row 2 (BSO): Should be + for Col 2, 3, 4. Yes.
            // Row 3 (Inh): Should be + for Col 1, 3, 4. Yes.
            // Row 4 (Liprox): Should be + for Col 4. Yes.
            ["-", "-", "-", "-", "+"]  // Liprox
        ];
        // Python matrix construction was row-based iteration.
        // Full matrix:
        // Row 0: + - - - - | + - - - - | ...
        // Row 1: - - + + + | - - + + + | ...
        // Row 2: - + - + + | - + - + + | ...
        // Row 3: - - - - + | - - - - + | ...

        const fullMatrix = [];
        for (let r = 0; r < 4; r++) {
            const row = [];
            for (let g = 0; g < 4; g++) {
                row.push(...groupPattern[r]);
            }
            fullMatrix.push(row);
        }

        const chart = echarts.init(document.getElementById('chart-container'));

        const option = {
            backgroundColor: 'white',
            grid: { top: 100, right: 150, bottom: 200, left: 60 },
            xAxis: {
                type: 'category',
                data: Array.from({length: 20}, (_, i) => i),
                axisLine: { show: false },
                axisTick: { show: false },
                axisLabel: { show: false },
                splitLine: { show: false }
            },
            yAxis: {
                type: 'category',
                data: ['21% O₂'],
                axisLine: { show: true, lineStyle: { color: 'black' } }, // Left spine
                axisTick: { show: true },
                axisLabel: { color: 'black', fontSize: 12 }
            },
            visualMap: {
                min: 25, max: 100,
                calculable: true,
                orient: 'vertical',
                right: 20,
                top: 50,
                inRange: { color: ['#440154', '#21918c', '#fde725'] }, // Viridis
                formatter: function (value) { return value.toFixed(0); }
            },
            series: [
                {
                    type: 'heatmap',
                    data: heatmapData,
                    itemStyle: { borderColor: 'black', borderWidth: 1 },
                    label: { show: false }
                },
                {
                    type: 'custom',
                    renderItem: function (params, api) {
                        const ann = annotations[params.dataIndex];
                        const x1 = ann.x1;
                        const x2 = ann.x2;
                        const p1 = api.coord([x1, 0]);
                        const p2 = api.coord([x2, 0]);
                        
                        // Coord 0 is center. Top edge is screen Y - height/2.
                        // Actually with yAxis category, 0 is at band center.
                        // We need Y relative to grid.
                        const gridRect = params.coordSys;
                        const topY = gridRect.y; // Top of grid
                        
                        const hScale = 15; // px per unit h
                        const yBase = topY - (ann.h * hScale);
                        
                        return {
                            type: 'group',
                            children: [
                                {
                                    type: 'polyline',
                                    shape: {
                                        points: [
                                            [p1[0], yBase + 5],
                                            [p1[0], yBase],
                                            [p2[0], yBase],
                                            [p2[0], yBase + 5]
                                        ]
                                    },
                                    style: { stroke: 'black', lineWidth: 1, fill: null }
                                },
                                {
                                    type: 'text',
                                    style: {
                                        text: ann.text,
                                        x: (p1[0] + p2[0]) / 2,
                                        y: yBase - 5,
                                        textAlign: 'center',
                                        textVerticalAlign: 'bottom',
                                        fill: 'black',
                                        fontSize: 10
                                    }
                                }
                            ]
                        };
                    },
                    data: annotations,
                    z: 5
                }
            ],
            graphic: [
                { type: 'text', left: 0, top: 0, style: { text: 'e', font: 'bold 24px Arial' } },
                // Vertical Separators
                {
                    type: 'line',
                    shape: { x1: 0, y1: 0, x2: 0, y2: 400 }, // Relative to what?
                    // Let's use percentage or calculate from grid.
                    // Grid left 60, width ~790. 20 cols -> 39.5 each.
                    // Lines at x=5, 10, 15.
                    // x=5: 60 + 5*39.5 = 257.5
                    // y: top=100 (heatmap top) to bottom (table bottom).
                    // Table height: 4 rows * 30px = 120px? 
                    // Let's estimate bottom y around 450.
                }
            ]
        };
        
        // Add Grid lines and Table
        const gridLeft = 60;
        const gridRight = 150; // padding right
        const containerWidth = 1000;
        const plotWidth = containerWidth - gridLeft - gridRight; // 790
        const colWidth = plotWidth / 20;
        const gridTop = 100;
        const gridBottom = 600 - 200; // 400
        const gridHeight = gridBottom - gridTop; // 300? No grid.height is not explicit.
        // Heatmap height is just one row. ECharts will use available height?
        // yAxis is category with 1 item.
        // So heatmap height fills the grid.
        // But we want heatmap to be square cells?
        // Python: ax.set_aspect('equal').
        // Here we just set grid height to match col width?
        // colWidth ~ 39.5. Height = 39.5.
        // Update grid bottom.
        
        const cellH = colWidth;
        const heatmapBottom = gridTop + cellH;
        option.grid.height = cellH;
        option.grid.bottom = undefined; // override
        
        // Add Table Text
        const tableTop = heatmapBottom + 20;
        const rowH = 30;
        
        // Rows
        for(let r=0; r<4; r++) {
            // Label
            option.graphic.push({
                type: 'text',
                right: 20, // Inside container
                top: tableTop + r * rowH,
                style: { text: '+ ' + rowLabels[r], textAlign: 'left', fontSize: 11 }
            });
            // Signs
            for(let c=0; c<20; c++) {
                const txt = fullMatrix[r][c];
                const weight = txt === '+' ? 'bold' : 'normal';
                option.graphic.push({
                    type: 'text',
                    left: gridLeft + c * colWidth + colWidth/2,
                    top: tableTop + r * rowH,
                    style: { text: txt, textAlign: 'center', fontWeight: weight, fontSize: 11 }
                });
            }
        }
        
        // Group Separators
        const lineBottom = tableTop + 4 * rowH + 10;
        const separators = [5, 10, 15];
        separators.forEach(idx => {
            const x = gridLeft + idx * colWidth;
            option.graphic.push({
                type: 'line',
                shape: { x1: x, y1: gridTop, x2: x, y2: lineBottom },
                style: { stroke: 'black', lineWidth: 1 }
            });
        });
        
        // Group Labels
        const groupLabels = ["iFSP1 (10 µM)", "FSEN1 (10 µM)", "icFSP1 (15 µM)", "viFSP1 (15 µM)"];
        groupLabels.forEach((lbl, i) => {
            const xCenter = gridLeft + (i * 5 + 2.5) * colWidth;
            option.graphic.push({
                type: 'text',
                left: xCenter,
                top: lineBottom + 5,
                style: { text: lbl, textAlign: 'center', fontSize: 12 }
            });
            // Line
            option.graphic.push({
                type: 'line',
                shape: { 
                    x1: gridLeft + i*5*colWidth + 5, 
                    y1: lineBottom, 
                    x2: gridLeft + (i+1)*5*colWidth - 5, 
                    y2: lineBottom 
                },
                style: { stroke: 'black', lineWidth: 1 }
            });
        });

        chart.setOption(option);
    </script>
</body>
</html>
