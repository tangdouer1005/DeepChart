        // 3. Curve Fitting (Simplified Nelder-Mead)
function sigmoid(x, Top, Bottom, LogEC50, HillSlope) {
            return Bottom + (Top - Bottom) / (1 + Math.pow(10, (LogEC50 - x) * HillSlope));
        }

        function sumSquaredErrors(params, x, y) {
            const [Top, Bottom, LogEC50, HillSlope] = params;
            let sum = 0;
            for (let i = 0; i < x.length; i++) {
                const pred = sigmoid(x[i], Top, Bottom, LogEC50, HillSlope);
                sum += Math.pow(y[i] - pred, 2);
            }
            return sum;
        }

        // Simple Nelder-Mead implementation
        function nelderMead(f, x0, args) {
            const dim = x0.length;
            const res = [[x0, f(x0, ...args)]];
            
            // Create initial simplex
            for (let i = 0; i < dim; i++) {
                const x = [...x0];
                x[i] = x[i] !== 0 ? x[i] * 1.05 : 0.00025;
                res.push([x, f(x, ...args)]);
            }

            // Iterate
            const maxIter = 1000;
            const alpha = 1, gamma = 2, rho = 0.5, sigma = 0.5;
            
            for (let iter = 0; iter < maxIter; iter++) {
                res.sort((a, b) => a[1] - b[1]);
                
                const best = res[0];
                const worst = res[dim];
                const secondWorst = res[dim - 1];

                // Centroid
                const x0_center = [];
                for (let j = 0; j < dim; j++) {
                    let sum = 0;
                    for (let i = 0; i < dim; i++) {
                        sum += res[i][0][j];
                    }
                    x0_center.push(sum / dim);
                }

                // Reflection
                const xr = x0_center.map((val, j) => x0_center[j] + alpha * (x0_center[j] - worst[0][j]));
                const fr = f(xr, ...args);

                if (best[1] <= fr && fr < secondWorst[1]) {
                    res[dim] = [xr, fr];
                    continue;
                }

                // Expansion
                if (fr < best[1]) {
                    const xe = x0_center.map((val, j) => x0_center[j] + gamma * (xr[j] - x0_center[j]));
                    const fe = f(xe, ...args);
                    if (fe < fr) res[dim] = [xe, fe];
                    else res[dim] = [xr, fr];
                    continue;
                }

                // Contraction
                const xc = x0_center.map((val, j) => x0_center[j] + rho * (worst[0][j] - x0_center[j]));
                const fc = f(xc, ...args);
                if (fc < worst[1]) {
                    res[dim] = [xc, fc];
                    continue;
                }

                // Shrink
                for (let i = 1; i <= dim; i++) {
                    res[i][0] = res[i][0].map((val, j) => best[0][j] + sigma * (val - best[0][j]));
                    res[i][1] = f(res[i][0], ...args);
                }
            }
            res.sort((a, b) => a[1] - b[1]);
            return res[0][0];
        }

        function getFittedCurve(xData, yData, initialGuess, color) {
            // Check if we should fit
            // Python script has try-except.
            try {
                // If no initial guess, use defaults
                const guess = initialGuess || [
                    Math.max(...yData), 
                    Math.min(...yData), 
                    xData.reduce((a,b)=>a+b,0)/xData.length, 
                    1.0
                ];
                
                const popt = nelderMead(sumSquaredErrors, guess, [xData, yData]);

                // Generate smooth line
                const xSmooth = [];
                const minX = Math.min(...xData) - 0.5;
                const maxX = Math.max(...xData) + 0.5;
                const steps = 100;
                for(let i=0; i<=steps; i++) {
                    xSmooth.push(minX + (maxX - minX) * (i/steps));
                }
                const ySmooth = xSmooth.map(x => sigmoid(x, ...popt));
                
                return { x: xSmooth, y: ySmooth };

            } catch (e) {
                console.warn("Fit failed", e);
                // Fallback: horizontal line at mean
                const mean = yData.reduce((a,b)=>a+b,0)/yData.length;
                return { 
                    x: [Math.min(...xData)-0.5, Math.max(...xData)+0.5], 
                    y: [mean, mean] 
                };
            }
        }

        // 4. Build Plot Traces
        const traces = [];

        function addTrace(data, name, color, initialGuess) {
            if (!data) return;
            
            // Scatter points

                y: data.y,
                error_y: {
                    type: 'data',

                    thickness: 1.5,
                    width: 3

                mode: 'markers',

            // Fitted line
            const fit = getFittedCurve(data.x, data.y, initialGuess, color);

                x: fit.x,
                y: fit.y,
                mode: 'lines',
                line: { color: color, width: 2 },
                showlegend: false,
                hoverinfo: 'skip'
            });
        }
