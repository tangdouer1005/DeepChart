        // ---------------------------------------------------------
        // 2. Data Processing Logic
        // ---------------------------------------------------------
        
        function getValid(arr) {
            if (!arr) return [];
            return arr.filter(v => typeof v === 'number' && !isNaN(v));
        }

        function mean(arr) {
            const valid = getValid(arr);
            if (valid.length === 0) return 0;
            return valid.reduce((a, b) => a + b, 0) / valid.length;
        }

        function stdDev(arr) {
            const valid = getValid(arr);
            const n = valid.length;
            if (n < 2) return 0;
            const m = mean(valid);
            const sumSq = valid.reduce((a, b) => a + Math.pow(b - m, 2), 0);
            return Math.sqrt(sumSq / (n - 1));
        }

        function sem(arr) {
            const valid = getValid(arr);
            const n = valid.length;
            if (n < 2) return 0;
            return stdDev(valid) / Math.sqrt(n);
        }

        // ---------------------------------------------------------
        // 3. Prepare Plotly Data
        // ---------------------------------------------------------
        
        const gProteins = sourceData.proteins;
        const controlMean = sourceData.control_mean;

        const xVals = gProteins.map((_, i) => i);
        
        const annotations = [];
        const shapes = [];

        // Colors
        const colorNT = '#0014a8';
        const colorSBI = '#9b30d9';
        const width = 0.35; // Bar width

        // Trace Data
        const traceNT = {
            x: xVals.map(x => x - width/2), // Shift left
            y: [],
            error_y: { type: 'data', array: [], visible: true, color: 'black', thickness: 1, width: 3 },
            type: 'bar',
            name: 'NT',
            marker: { color: colorNT },
            width: width
        };

        const traceSBI = {
            x: xVals.map(x => x + width/2), // Shift right
            y: [],
            error_y: { type: 'data', array: [], visible: true, color: 'black', thickness: 1, width: 3 },
            type: 'bar',
            name: 'SBI-553',
            marker: { color: colorSBI },
            width: width
        };

        const traceJitterNT = {
            x: [],
            y: [],
            mode: 'markers',
            type: 'scatter',
            marker: { size: 6, color: 'rgba(0,0,0,0)', line: { color: colorNT, width: 1.5 } },
            showlegend: false,
            hoverinfo: 'none'
        };

        const traceJitterSBI = {
            x: [],
            y: [],
            mode: 'markers',
            type: 'scatter',
            marker: { size: 6, color: 'rgba(0,0,0,0)', line: { color: colorSBI, width: 1.5 } },

            hoverinfo: 'none'

            const protein = gProteins[i];
            const d = sourceData.data[protein];

            const ntVals = getValid(d.nt_values);
            const sbiVals = getValid(d.sbi_values);
            
            const mNT = mean(ntVals);
            const mSBI = mean(sbiVals);
            const sNT = sem(ntVals);
            const sSBI = sem(sbiVals);
            
            traceNT.y.push(mNT);
            traceNT.error_y.array.push(sNT);
            
            traceSBI.y.push(mSBI);
            traceSBI.error_y.array.push(sSBI);

            // Jitter points
            const jitterRange = 0.2; // roughly width/2
            ntVals.forEach(v => {
                const jit = (Math.random() - 0.5) * 0.2;
                traceJitterNT.x.push((i - width/2) + jit);
                traceJitterNT.y.push(v);
            });
            sbiVals.forEach(v => {
                const jit = (Math.random() - 0.5) * 0.2;
                traceJitterSBI.x.push((i + width/2) + jit);
                traceJitterSBI.y.push(v);
            });

            // Statistical Annotations using provided p-values
            
            const pNT = d.p_nt_vs_ctrl;
            const pSBI = d.p_sbi_vs_ctrl;
            const pComp = d.p_nt_vs_sbi;

            // Stars on Bars (if significantly > control mean)
            const ntHeight = mNT + sNT;
            const sbiHeight = mSBI + sSBI;
            const xNT = i - width/2;
            const xSBI = i + width/2;
            
            // Note: JSON p-values are already adjusted/final?
            // The Python script logic was:
            // if sig_nt and nt_means[i] > control_mean: add_star
            // sig_nt = '*' if p_nt < 0.05 else ''
            
            if (pNT < 0.05 && mNT > controlMean) {
                annotations.push({
                    x: xNT,
                    y: ntHeight + 1,
                    text: '<b>*</b>', // Bold star
                    showarrow: false,
                    font: { size: 16, color: 'black' },
                    yanchor: 'bottom'
                });
            }
            if (pSBI < 0.05 && mSBI > controlMean) {
                annotations.push({
                    x: xSBI,
                    y: sbiHeight + 1,
                    text: '<b>*</b>', // Bold star
                    showarrow: false,
                    font: { size: 16, color: 'black' },
                    yanchor: 'bottom'
                });
            }

            // Brackets (Only for specific proteins: Gi3, Go, G12, G13)
            const bracketProteins = ['Gi3', 'Go', 'G12', 'G13'];
            if (bracketProteins.includes(protein)) {
                const bY = Math.max(ntHeight, sbiHeight) + 4;
                const label = pComp < 0.05 ? '*' : 'n.s.';
                
                // Draw bracket shape
                shapes.push({
                    type: 'path',
                    path: `M ${xNT} ${bY} V ${bY+0.5} H ${xSBI} V ${bY}`,
                    line: { color: 'black', width: 1 }
                });
                
                // Label
                annotations.push({
                    x: (xNT + xSBI) / 2,
                    y: bY + 1.5,
                    text: label,
                    showarrow: false,
                    font: { size: 10, color: 'black' },
                    yanchor: 'bottom'
                });
            }
        }

        // ---------------------------------------------------------
        // 4. Family Grouping (Lines and Text below X-axis)
        // ---------------------------------------------------------
        const families = [

            { start: 3, end: 6, label: "Gi/o" },

        traceNT.showlegend = false;
