<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nature Chart Reproduction</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
    <style>
        body { margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #ffffff; font-family: Arial, sans-serif; }
        #chart-container { width: 400px; height: 600px; }
    </style>
</head>
<body>
    <div id="chart-container"></div>
    <script>
        const jsonData = [
    {
        "Category": "MSW-SAF",
        "central estimate": 102.7,
        "low": 33.1,
        "high": 197.0
    },
    {
        "Category": "MSW-H2",
        "central estimate": 170.7,
        "low": 69.4,
        "high": 306.6
    },
    {
        "Category": "MSW-PTL",
        "central estimate": 177.0,
        "low": 81.7,
        "high": 395.3
    }
];

        const data = jsonData.map(d => ({
            category: d.Category,
            central: d["central estimate"],
            low: d.low,
            high: d.high
        }));
        
        const colors = {
            'MSW-SAF': '#46636E',
            'MSW-H2': '#D6A659',
            'MSW-PTL': '#8B3A3A'
        };

        const categories = data.map(d => d.category);
        const scatterData = data.map((d, i) => ({
            value: [i, d.central],
            itemStyle: { color: colors[d.category] },
            name: d.category
        }));
        
        const errorData = data.map((d, i) => [i, d.central, d.low, d.high]);

        const chart = echarts.init(document.getElementById('chart-container'));

        const option = {
            backgroundColor: 'white',
            grid: { top: 50, right: 20, bottom: 50, left: 80 },
            xAxis: {
                type: 'category',
                data: categories,
                show: false
            },
            yAxis: {
                name: 'GHG mitigation potential per ton\nMSW (kgCO₂e t⁻¹)',
                nameLocation: 'middle',
                nameGap: 50,
                type: 'value',
                min: 0,
                max: 450,
                interval: 50,
                splitLine: { show: false },
                axisLine: { show: true, lineStyle: { color: 'black' } },
                axisLabel: { color: 'black' },
                axisTick: { show: true, inside: true }
            },
            series: [
                {
                    type: 'custom',
                    name: 'error',
                    itemStyle: {
                        borderWidth: 1.5,
                        stroke: '#421C1C'
                    },
                    renderItem: function (params, api) {
                        const xValue = api.value(0);
                        const low = api.value(2);
                        const high = api.value(3);
                        const start = api.coord([xValue, low]);
                        const end = api.coord([xValue, high]);
                        const halfWidth = 5;
                        
                        const style = api.style({
                            stroke: '#421C1C',
                            lineWidth: 1.5
                        });
                        
                        return {
                            type: 'group',
                            children: [
                                {
                                    type: 'line',
                                    shape: {
                                        x1: start[0], y1: start[1],
                                        x2: end[0], y2: end[1]
                                    },
                                    style: style
                                },
                                {
                                    type: 'line',
                                    shape: {
                                        x1: start[0] - halfWidth, y1: start[1],
                                        x2: start[0] + halfWidth, y2: start[1]
                                    },
                                    style: style
                                },
                                {
                                    type: 'line',
                                    shape: {
                                        x1: end[0] - halfWidth, y1: end[1],
                                        x2: end[0] + halfWidth, y2: end[1]
                                    },
                                    style: style
                                }
                            ]
                        };
                    },
                    data: errorData,
                    z: 1
                },
                {
                    type: 'scatter',
                    data: scatterData,
                    symbolSize: 25,
                    label: {
                        show: true,
                        formatter: function(params) {
                            let name = params.name;
                            if (name === 'MSW-H2') return 'MSW-H₂';
                            return name;
                        },
                        position: 'top',
                        distance: 10,
                        fontSize: 14,
                        color: 'inherit',
                        fontWeight: 'bold'
                    },
                    z: 2
                }
            ],
            graphic: [
                {
                    type: 'text',
                    left: 0,
                    top: 0,
                    style: {
                        text: 'b',
                        font: 'bold 24px Arial',
                        fill: 'black'
                    }
                }
            ]
        };

        chart.setOption(option);
    </script>
</body>
</html>
