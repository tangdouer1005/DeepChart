        const gfsData = jsonData.map(d => ({ x: d.percent_high_aging, y: d.fairness_index }));

        // --- 1. Linear Regression & CI Calculation ---
        const n = gfsData.length;
        let sumX = 0, sumY = 0, sumXY = 0, sumXX = 0;
        gfsData.forEach(p => {
            sumX += p.x;
            sumY += p.y;
            sumXY += p.x * p.y;
            sumXX += p.x * p.x;
        });

        const meanX = sumX / n;
        const meanY = sumY / n;
        const Sxx = sumXX - n * meanX * meanX;
        const Sxy = sumXY - n * meanX * meanY;
        const slope = Sxy / Sxx;
        const intercept = meanY - slope * meanX;

        // Calculate Standard Error of Estimate (Se)
        let sse = 0;
        gfsData.forEach(p => {
            const yPred = slope * p.x + intercept;
            sse += Math.pow(p.y - yPred, 2);
        });
        const se = Math.sqrt(sse / (n - 2));
        
        // t-value for 95% CI (approx 1.96 for large n) 
        const tVal = 1.96; 

        // Generate points for the regression line and CI band
        // We span the range of X values shown on axis
        const startX = -1;
        const endX = 39;
        const step = 0.5;
        const regressionData = [];
        const ciData = []; // will store [x, yLower, yUpper] 

        for (let x = startX; x <= endX; x += step) {
            const yPred = slope * x + intercept;
            
            // Standard error of the mean response at x
            const seMean = se * Math.sqrt(1/n + Math.pow(x - meanX, 2) / Sxx);
            const margin = tVal * seMean;
            
            regressionData.push([x, yPred]);
            ciData.push([x, yPred - margin, yPred + margin]);
        }

        // Prepare polygon data for custom series
        // The polygon points go from left to right for upper bound, then right to left for lower bound
        const polygonPoints = [];
        for (let i = 0; i < ciData.length; i++) {
            polygonPoints.push([ciData[i][0], ciData[i][2]]); // Upper
        }
        for (let i = ciData.length - 1; i >= 0; i--) {
            polygonPoints.push([ciData[i][0], ciData[i][1]]); // Lower
        }

        // Scatter Data
        const scatterData = gfsData.map(p => [p.x, p.y]);

        const chart = echarts.init(document.getElementById('chart-container'));

        const option = {
            backgroundColor: 'white',
            title: {
                text: 'GFS',
                left: 'center',
                top: 10,
                textStyle: {
                    fontSize: 16,
                    color: 'black',
                    fontFamily: 'Arial'
                }
            },
            grid: { top: 50, right: 20, bottom: 60, left: 60 },
            xAxis: {
                name: 'Percentage of high-ageing\nCBGs',
                nameLocation: 'middle',
                nameGap: 30,
                type: 'value',
                min: -2,
                max: 38,
                interval: 10,
                splitLine: { show: false },
                axisLine: { show: true, lineStyle: { color: 'black' } },
                axisLabel: { color: 'black' },
                axisTick: { show: true }
            },
            yAxis: {
                name: 'ΔF̄', 
                nameLocation: 'middle',
                nameGap: 40,
                type: 'value',
                min: -1.1,
                max: 1.1,
                interval: 0.5,
                splitLine: { show: false },
                axisLine: { show: true, lineStyle: { color: 'black' } },
                axisLabel: { color: 'black', formatter: (value) => value.toFixed(1) },
                axisTick: { show: true }
            },
            series: [
                {
                    // Confidence Interval Band
                    type: 'custom',
                    name: 'confidence-band',
                    renderItem: function (params, api) {
                        const points = [];
                        for (let i = 0; i < polygonPoints.length; i++) {
                            points.push(api.coord(polygonPoints[i]));
                        }
                        return {
                            type: 'polygon',
                            shape: {
                                points: points
                            },
                            style: api.style({
                                fill: '#A696C6',
                                opacity: 0.2, // Translucent
                                stroke: 'none'
                            })
                        };
                    },
                    data: [0], // Dummy data to trigger render
                    z: 0
                },
                {
                    // Scatter Plot
                    type: 'scatter',
                    data: scatterData,
                    itemStyle: {
                        color: '#A696C6',
                        opacity: 0.8,
                        borderColor: 'white',
                        borderWidth: 0.8
                    },
                    symbolSize: 8,
                    z: 10
                },
                {
                    // Regression Line
                    type: 'line',
                    data: regressionData,
                    symbol: 'none',
                    lineStyle: {
                        color: '#9E8CC2',
                        width: 3
                    },
                    z: 20
                }
            ],
            graphic: [
                {
                    type: 'text',
                    left: 0,
                    top: 0,
                    style: {
                        text: 'd',
                        font: 'bold 20px Arial',
                        fill: 'black'
                    }
                }
            ]
        };

        chart.setOption(option);
    </script>
