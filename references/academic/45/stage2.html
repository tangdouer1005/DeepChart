<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nature Chart Reproduction</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
    <style>
        body { margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #ffffff; font-family: Arial, sans-serif; }
        #chart-container { width: 700px; height: 500px; }
    </style>
</head>
<body>
    <div id="chart-container"></div>
    <script>
        const jsonData = [
    {
        "Current_Density": 50,
        "20C_mean": -1.9566666666666668,
        "20C_std": 0.011547005383792526,
        "35C_mean": -1.8566666666666667,
        "35C_std": 0.011547005383792525,
        "50C_mean": -1.8233333333333335,
        "50C_std": 0.020816659994661344
    },
    {
        "Current_Density": 100,
        "20C_mean": -2.02,
        "20C_std": 0.020000000000000018,
        "35C_mean": -1.9366666666666665,
        "35C_std": 0.011547005383792525,
        "50C_mean": -1.8966666666666665,
        "50C_std": 0.005773502691896263
    },
    {
        "Current_Density": 200,
        "20C_mean": -2.1533333333333333,
        "20C_std": 0.015275252316519383,
        "35C_mean": -2.01,
        "35C_std": 0.010000000000000009,
        "50C_mean": -1.9533333333333334,
        "50C_std": 0.005773502691896263
    },
    {
        "Current_Density": 300,
        "20C_mean": -2.23,
        "20C_std": 0.020000000000000018,
        "35C_mean": -2.0766666666666667,
        "35C_std": 0.005773502691896391,
        "50C_mean": -2.02,
        "50C_std": 0.010000000000000009
    },
    {
        "Current_Density": 400,
        "20C_mean": -2.283333333333333,
        "20C_std": 0.015275252316519383,
        "35C_mean": -2.1366666666666667,
        "35C_std": 0.005773502691896391,
        "50C_mean": -2.0766666666666667,
        "50C_std": 0.015275252316519383
    },
    {
        "Current_Density": 500,
        "20C_mean": -2.33,
        "20C_std": 0.020000000000000018,
        "35C_mean": -2.1766666666666663,
        "35C_std": 0.005773502691896391,
        "50C_mean": -2.1299999999999994,
        "50C_std": 0.020000000000000018
    },
    {
        "Current_Density": 600,
        "20C_mean": -2.376666666666667,
        "20C_std": 0.03055050463303896,
        "35C_mean": -2.216666666666667,
        "35C_std": 0.005773502691896391,
        "50C_mean": -2.17,
        "50C_std": 0.020000000000000018
    },
    {
        "Current_Density": 700,
        "20C_mean": -2.4233333333333333,
        "20C_std": 0.03511884584284239,
        "35C_mean": -2.2533333333333334,
        "35C_std": 0.005773502691896135,
        "50C_mean": -2.2099999999999995,
        "50C_std": 0.020000000000000018
    },
    {
        "Current_Density": 800,
        "20C_mean": -2.466666666666667,
        "20C_std": 0.03055050463303896,
        "35C_mean": -2.3066666666666666,
        "35C_std": 0.005773502691896391,
        "50C_mean": -2.25,
        "50C_std": 0.01732050807568866
    }
];

        const x_20 = jsonData.map(item => item.Current_Density);
        const y_20 = jsonData.map(item => item['20C_mean']);
        const err_20 = jsonData.map(item => item['20C_std']);
        
        const x_35 = jsonData.map(item => item.Current_Density);
        const y_35 = jsonData.map(item => item['35C_mean']);
        const err_35 = jsonData.map(item => item['35C_std']);

        const x_50 = jsonData.map(item => item.Current_Density);
        const y_50 = jsonData.map(item => item['50C_mean']);
        const err_50 = jsonData.map(item => item['50C_std']);

        // Colors
        const c_20 = '#4F627C'; 
        const c_20_face = '#788CA8';
        const c_35 = '#8FA3C2';
        const c_35_face = '#BCCBE3';
        const c_50 = '#BC8071';
        const c_50_face = '#D9AFA6';

        const chart = echarts.init(document.getElementById('chart-container'));

        const series = [
            // 20°C Series
            {
                name: '20 °C',
                type: 'line',
                data: x_20.map((cd, i) => [cd, y_20[i]]),
                symbol: 'circle',
                symbolSize: 10,
                itemStyle: {
                    color: c_20,
                    borderColor: c_20,
                    borderWidth: 1,
                    areaStyle: { opacity: 0 }
                },
                lineStyle: { color: c_20, width: 1.5 },
                z: 3
            },
            {
                type: 'custom',
                name: '20 °C Error',
                renderItem: (params, api) => {
                    const x = api.value(0);
                    const meanVal = api.value(1);
                    const stdVal = api.value(2);
                    
                    const highPoint = api.coord([x, meanVal + stdVal]);
                    const lowPoint = api.coord([x, meanVal - stdVal]);
                    const capHalfWidth = api.size([5, 0])[0];

                    const style = api.style({ stroke: 'black', lineWidth: 1.5 });
                    return {
                        type: 'group',
                        children: [
                            { type: 'line', shape: { x1: highPoint[0], y1: highPoint[1], x2: lowPoint[0], y2: lowPoint[1] }, style: style },
                            { type: 'line', shape: { x1: highPoint[0] - capHalfWidth, y1: highPoint[1], x2: highPoint[0] + capHalfWidth, y2: highPoint[1] }, style: style },
                            { type: 'line', shape: { x1: lowPoint[0] - capHalfWidth, y1: lowPoint[1], x2: lowPoint[0] + capHalfWidth, y2: lowPoint[1] }, style: style }
                        ]
                    };
                },
                data: x_20.map((cd, i) => ([cd, y_20[i], err_20[i]])),
                z: 4
            },

            // 35°C Series
            {
                name: '35 °C',
                type: 'line',
                data: x_35.map((cd, i) => [cd, y_35[i]]),
                symbol: 'triangle',
                symbolSize: 10,
                itemStyle: {
                    color: c_35,
                    borderColor: c_35,
                    borderWidth: 1,
                    areaStyle: { opacity: 0 }
                },
                lineStyle: { color: c_35, width: 1.5 },
                z: 1
            },
            {
                type: 'custom',
                name: '35 °C Error',
                renderItem: (params, api) => {
                    const x = api.value(0);
                    const meanVal = api.value(1);
                    const stdVal = api.value(2);
                    
                    const highPoint = api.coord([x, meanVal + stdVal]);
                    const lowPoint = api.coord([x, meanVal - stdVal]);
                    const capHalfWidth = api.size([5, 0])[0];

                    const style = api.style({ stroke: 'black', lineWidth: 1.5 });
                    return {
                        type: 'group',
                        children: [
                            { type: 'line', shape: { x1: highPoint[0], y1: highPoint[1], x2: lowPoint[0], y2: lowPoint[1] }, style: style },
                            { type: 'line', shape: { x1: highPoint[0] - capHalfWidth, y1: highPoint[1], x2: highPoint[0] + capHalfWidth, y2: highPoint[1] }, style: style },
                            { type: 'line', shape: { x1: lowPoint[0] - capHalfWidth, y1: lowPoint[1], x2: lowPoint[0] + capHalfWidth, y2: lowPoint[1] }, style: style }
                        ]
                    };
                },
                data: x_35.map((cd, i) => ([cd, y_35[i], err_35[i]])),
                z: 2
            },

            // 50°C Series
            {
                name: '50 °C',
                type: 'line',
                data: x_50.map((cd, i) => [cd, y_50[i]]),
                symbol: 'diamond',
                symbolSize: 9,
                itemStyle: {
                    color: c_50,
                    borderColor: c_50,
                    borderWidth: 1,
                    areaStyle: { opacity: 0 }
                },
                lineStyle: { color: c_50, width: 1.5 },
                z: 0
            },
            {
                type: 'custom',
                name: '50 °C Error',
                renderItem: (params, api) => {
                    const x = api.value(0);
                    const meanVal = api.value(1);
                    const stdVal = api.value(2);
                    
                    const highPoint = api.coord([x, meanVal + stdVal]);
                    const lowPoint = api.coord([x, meanVal - stdVal]);
                    const capHalfWidth = api.size([5, 0])[0];

                    const style = api.style({ stroke: 'black', lineWidth: 1.5 });
                    return {
                        type: 'group',
                        children: [
                            { type: 'line', shape: { x1: highPoint[0], y1: highPoint[1], x2: lowPoint[0], y2: lowPoint[1] }, style: style },
                            { type: 'line', shape: { x1: highPoint[0] - capHalfWidth, y1: highPoint[1], x2: highPoint[0] + capHalfWidth, y2: highPoint[1] }, style: style },
                            { type: 'line', shape: { x1: lowPoint[0] - capHalfWidth, y1: lowPoint[1], x2: lowPoint[0] + capHalfWidth, y2: lowPoint[1] }, style: style }
                        ]
                    };
                },
                data: x_50.map((cd, i) => ([cd, y_50[i], err_50[i]])),
                z: -1
            }
        ];

        const option = {
            animation: false,
            backgroundColor: 'white',
            grid: { top: 60, right: 20, bottom: 60, left: 80 },
            xAxis: {
                type: 'value',
                name: 'Current density (mA cm⁻²)',
                nameLocation: 'middle',
                nameGap: 30,
                min: 0,
                max: 850,
                interval: 100,
                axisLabel: { color: 'black', fontSize: 12 },
                axisLine: { lineStyle: { color: 'black' } },
                axisTick: { alignWithLabel: true }
            },
            yAxis: {
                type: 'value',
                name: 'Cell voltage (V)',
                nameLocation: 'middle',
                nameGap: 40,
                nameTextStyle: { color: 'black', fontSize: 14 },
                min: -2.7, // Visual top
                max: -1.7, // Visual bottom
                inverse: true, // Invert axis
                interval: 0.2,
                axisLabel: { color: 'black', fontSize: 12 },
                axisLine: { lineStyle: { color: 'black' } },
                splitLine: { show: false }
            },
            legend: {
                data: ['20 °C', '35 °C', '50 °C'],
                left: 'left',
                top: 20,
                orient: 'vertical',
                textStyle: { fontSize: 12 }
            },
            series: series,
            graphic: [
                {
                    type: 'text',
                    left: 10,
                    top: 10,
                    style: {
                        text: 'c',
                        font: 'bold 24px Arial',
                        fill: 'black'
                    }
                }
            ]
        };

        chart.setOption(option);
    </script>
</body>
</html>
