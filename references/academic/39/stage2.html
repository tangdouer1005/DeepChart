<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nature Chart Reproduction</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jstat@latest/dist/jstat.min.js"></script>
    <style>
        body { margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #ffffff; font-family: Arial, sans-serif; }
        #chart-container { width: 500px; height: 600px; }
    </style>
</head>
<body>
    <div id="chart-container"></div>
    <script>
        const jsonData = [
    {
        "Electrolyte": "LiAsF6 electrolyte",
        "measurement #1": 2.9,
        "measurement #2": 2.6,
        "measurement #3": 2.6,
        "measurement #4": 2.7,
        "Experimental_Mean": 2.7,
        "Experimental_Std": 0.14142135623730942,
        "Simulation_Mean": 2.05,
        "Label": "AsF₆"
    },
    {
        "Electrolyte": "LiPF6 electrolyte",
        "measurement #1": 3.0,
        "measurement #2": 3.3,
        "measurement #3": 2.8,
        "measurement #4": 3.3,
        "Experimental_Mean": 3.0999999999999996,
        "Experimental_Std": 0.2449489742783178,
        "Simulation_Mean": 2.32,
        "Label": "PF₆"
    },
    {
        "Electrolyte": "LiFSI electrolyte",
        "measurement #1": 3.2,
        "measurement #2": 3.1,
        "measurement #3": 3.3,
        "measurement #4": 3.0,
        "Experimental_Mean": 3.1500000000000004,
        "Experimental_Std": 0.12909944487358052,
        "Simulation_Mean": 2.65,
        "Label": "FSI"
    },
    {
        "Electrolyte": "LiTFSI electrolyte",
        "measurement #1": 3.9,
        "measurement #2": 3.4,
        "measurement #3": 3.0,
        "measurement #4": 3.7,
        "Experimental_Mean": 3.5,
        "Experimental_Std": 0.3915780041490244,
        "Simulation_Mean": 2.75,
        "Label": "TFSI"
    },
    {
        "Electrolyte": "LiClO4 electrolyte",
        "measurement #1": 4.1,
        "measurement #2": 4.8,
        "measurement #3": 4.2,
        "measurement #4": 3.8,
        "Experimental_Mean": 4.225,
        "Experimental_Std": 0.4193248541803042,
        "Simulation_Mean": 2.95,
        "Label": "ClO₄"
    },
    {
        "Electrolyte": "LiBF4 electrolyte",
        "measurement #1": 3.9,
        "measurement #2": 4.1,
        "measurement #3": 5.4,
        "measurement #4": 4.4,
        "Experimental_Mean": 4.45,
        "Experimental_Std": 0.6658328118479395,
        "Simulation_Mean": 3.15,
        "Label": "BF₄"
    },
    {
        "Electrolyte": "LiDFOB electrolyte",
        "measurement #1": 4.7,
        "measurement #2": 4.5,
        "measurement #3": 4.9,
        "measurement #4": 5.4,
        "Experimental_Mean": 4.875,
        "Experimental_Std": 0.3862210075418824,
        "Simulation_Mean": 3.4,
        "Label": "DFOB"
    },
    {
        "Electrolyte": "LiNO3 electrolyte",
        "measurement #1": 5.2,
        "measurement #2": 5.2,
        "measurement #3": 6.2,
        "measurement #4": 5.3,
        "Experimental_Mean": 5.4750000000000005,
        "Experimental_Std": 0.48562674281111556,
        "Simulation_Mean": 4.32,
        "Label": "NO₃"
    }
];

        const experimentalData = [];
        const simulationData = [];
        const errorData = [];
        const labels = [];

        jsonData.forEach((item, i) => {
            labels.push(item.Label);
            
            const mean = item.Experimental_Mean;
            const std = item.Experimental_Std;
            const sim = item.Simulation_Mean;
            
            experimentalData.push([i, mean]);
            simulationData.push([i, sim]);
            
            errorData.push({
                value: [i, mean, std],
                itemStyle: { color: '#333333' }
            });
        });

        const chart = echarts.init(document.getElementById('chart-container'));

        const option = {
            backgroundColor: 'white',
            legend: {
                bottom: 10,
                right: 10,
                orient: 'vertical',
                data: ['Simulation (MD)', 'Experimental (cryo-TEM)'],
                textStyle: { fontSize: 11 }
            },
            grid: { top: 50, right: 20, bottom: 80, left: 60 },
            xAxis: {
                type: 'category',
                data: labels,
                axisLabel: { color: 'black', rotate: 45, fontSize: 12 },
                axisLine: { show: true, lineStyle: { color: 'black' } },
                splitLine: { show: false },
                name: 'Anion',
                nameLocation: 'middle',
                nameGap: 50,
                axisTick: { show: true, alignWithLabel: true }
            },
            yAxis: {
                type: 'value',
                name: 'Cluster diameter (nm)',
                nameLocation: 'middle',
                nameGap: 40,
                min: 1.0,
                max: 6.0,
                axisLabel: { color: 'black' },
                axisLine: { show: true, lineStyle: { color: 'black' } },
                splitLine: { show: false },
                axisTick: { show: true }
            },
            series: [
                {
                    name: 'Simulation (MD)',
                    type: 'scatter',
                    data: simulationData,
                    symbol: 'circle',
                    symbolSize: 15,
                    itemStyle: { color: 'gray', borderColor: 'dimgray', borderWidth: 1 },
                    z: 3
                },
                {
                    name: 'Experimental (cryo-TEM)',
                    type: 'scatter',
                    data: experimentalData,
                    symbol: 'diamond',
                    symbolSize: 15,
                    itemStyle: { color: '#aaccff', borderColor: '#4477aa', borderWidth: 1 },
                    z: 4
                },
                {
                    type: 'custom',
                    renderItem: function (params, api) {
                        const xVal = api.value(0);
                        const yVal = api.value(1);
                        const err = api.value(2);
                        
                        const top = api.coord([xVal, yVal + err]);
                        const bottom = api.coord([xVal, yVal - err]);
                        
                        const style = api.style({ stroke: '#333333', lineWidth: 1 });
                        
                        return {
                            type: 'group',
                            children: [
                                { type: 'line', shape: { x1: top[0], y1: top[1], x2: bottom[0], y2: bottom[1] }, style: style },
                                { type: 'line', shape: { x1: top[0]-3, y1: top[1], x2: top[0]+3, y2: top[1] }, style: style },
                                { type: 'line', shape: { x1: bottom[0]-3, y1: bottom[1], x2: bottom[0]+3, y2: bottom[1] }, style: style }
                            ]
                        };
                    },
                    data: errorData,
                    z: 5
                }
            ],
            graphic: [
                { type: 'text', left: 0, top: 0, style: { text: 'b', font: 'bold 20px Arial' } }
            ]
        };

        chart.setOption(option);
    </script>
</body>
</html>
