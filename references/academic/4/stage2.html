    },
    "columns": [
        "WT naive",
        "WT saline",
        "WT K",
        "A1 ko naive",

    ],
    "comparisons": [
        {
            "col1_idx": 0,
            "col2_idx": 1,
            "col1": "WT naive",
            "col2": "WT saline",
            "p_val": 5.403952453882359e-06
        },
        {
            "col1_idx": 1,
            "col2_idx": 2,
            "col1": "WT saline",
            "col2": "WT K",
            "p_val": 0.0010777515811896492
        },
        {
            "col1_idx": 3,
            "col2_idx": 4,
            "col1": "A1 ko naive",
            "col2": "A1ko saline",
            "p_val": 0.026952492116580948
        },
        {
            "col1_idx": 4,
            "col2_idx": 5,
            "col1": "A1ko saline",
            "col2": "A1ko K",
            "p_val": 0.5686359313990721
        },
        {
            "col1_idx": 6,
            "col2_idx": 7,
            "col1": "A2a ko naive",
            "col2": "A2a ko saline",
            "p_val": 0.02627694885737223
        },
        {
            "col1_idx": 7,
            "col2_idx": 8,
            "col1": "A2a ko saline",
            "col2": "A2a ko K",
            "p_val": 0.9055807837761114
        }
    ]
};

        const columns = chartData.columns;
        
        const stats = {};
        columns.forEach(col => {
            const arr = chartData.raw_data[col];
            stats[col] = { 
                mean: chartData.means[col], 
                sem: chartData.sems[col], 
                arr: arr
            };
        });

        const annotations = [];
        const yBase = 105;

        // Map comparisons to rotation
        // (4,5) and (7,8) get 45 deg
        chartData.comparisons.forEach(comp => {
            const idx1 = comp.col1_idx;
            const idx2 = comp.col2_idx;
            const pVal = comp.p_val;
            
            let rot = 0;
            if ((idx1 === 4 && idx2 === 5) || (idx1 === 7 && idx2 === 8)) {
                rot = 45;
            }
            
            let sigText = "";
            if (pVal < 0.001) sigText = "***";
            else if (pVal < 0.01) sigText = "**";
            else if (pVal < 0.05) sigText = "*";
            else sigText = `P = ${pVal.toFixed(2)}`;

            annotations.push({ x1: idx1, x2: idx2, y: yBase, text: sigText, rot: rot });
        });

        const colors = [
            '#3E7D91', '#1A1A1A', '#9E2A2B',
            '#3E7D91', '#4D4D4D', '#E6554D',
            '#6ECCE5', '#808080', '#F08080'
        ];
        
        const chartDataCols = [];
        const chartColors = [];
        const chartScatter = [];
        let colMap = {}; 

        let currentChartIdx = 0;
        let originalIdx = 0;
        
        for(let g=0; g<3; g++) {
            for(let c=0; c<3; c++) {
                chartDataCols.push(columns[originalIdx]);
                chartColors.push(colors[originalIdx]);
                colMap[originalIdx] = currentChartIdx;
                
                stats[columns[originalIdx]].arr.forEach(val => {
                    const jitter = (Math.random() - 0.5) * 0.3;
                    chartScatter.push([currentChartIdx + jitter, val]);
                });
                
                originalIdx++;
                currentChartIdx++;
            }
            if(g < 2) {
                chartDataCols.push(null); 
                chartColors.push('transparent');
                currentChartIdx++;
            }
        }
        
        const mappedAnnotations = annotations.map(a => ({
            x1: colMap[a.x1],
            x2: colMap[a.x2],
            y: a.y,
            text: a.text,
            rot: a.rot
        }));

        const chart = echarts.init(document.getElementById('chart-container'));

        const option = {
            animation: false,
            backgroundColor: 'white',
            grid: { top: 50, right: 20, bottom: 100, left: 60 },
            xAxis: {
                type: 'category',
                data: chartDataCols.map(c => c || ''),
                axisLabel: { show: false },
                axisTick: { show: false },
                axisLine: { show: true, lineStyle: { color: 'black' } }
            },
            yAxis: {
                type: 'value',
                max: 135,
                interval: 20,
                axisLabel: { color: 'black', fontSize: 12 },
                name: 'Sucrose preference (%)',
                nameLocation: 'middle',
                nameGap: 40,
                nameTextStyle: { color: 'black', fontSize: 14 },
                splitLine: { show: false },
                axisLine: { show: true, lineStyle: { color: 'black' } }
            },
            series: [
                {
                    type: 'bar',
                    data: chartDataCols.map((col, i) => {
                        if (!col) return { value: 0, itemStyle: { opacity: 0 } };
                        return { value: stats[col].mean, itemStyle: { color: chartColors[i] } };
                    }),
                    barWidth: '70%',
                    z: 1
                },
                {
                    type: 'custom',
                    renderItem: function(params, api) {
                        const idx = params.dataIndex;
                        const colName = chartDataCols[idx];
                        if (!colName) return;
                        
                        const x = api.value(0);
                        const mean = stats[colName].mean;
                        const sem = stats[colName].sem;
                        const p1 = api.coord([x, mean - sem]);
                        const p2 = api.coord([x, mean + sem]);
                        const style = api.style({ stroke: 'gray', lineWidth: 1.5 });
                        return { type: 'line', shape: { x1: p1[0], y1: p1[1], x2: p2[0], y2: p2[1] }, style: style };
                    },
                    data: chartDataCols.map((c, i) => [i, 0]), 
                    z: 2
                },
                {
                    type: 'scatter',
                    symbolSize: 6,
                    itemStyle: { color: '#555555', opacity: 0.8 },
                    data: chartScatter,
                    z: 3
                },
                {
                    type: 'custom',
                    renderItem: function(params, api) {
                        const ann = mappedAnnotations[params.dataIndex];
                        const p1 = api.coord([ann.x1, ann.y]);
                        const p2 = api.coord([ann.x2, ann.y]);
                        const style = api.style({ stroke: 'black', lineWidth: 1, fill: null });
                        
                        const children = [
                            { type: 'polyline', shape: { points: [[p1[0], p1[1]+2], [p1[0], p1[1]], [p2[0], p2[1]], [p2[0], p2[1]+2]] }, style: style }
                        ];
                        
                        const tx = (p1[0]+p2[0])/2;
                        const ty = p1[1]-2;
                        
                        children.push({
                             type: 'text', 
                             rotation: ann.rot * Math.PI / 180, 
                             style: { 
                                 text: ann.text, 
                                 x: tx, 
                                 y: ty, 
                                 textAlign: ann.rot ? 'left' : 'center', 
                                 textVerticalAlign: 'bottom', 
                                 fill: 'black', 
                                 font: '12px Arial' 
                             } 
                        });
                        
                        return { type: 'group', children: children };
                    },
                    data: mappedAnnotations.map((a, i) => i), 
                    z: 4
                }
            ],
            graphic: [
                { type: 'text', left: 0, top: 0, style: { text: 'c', font: 'bold 20px Arial' } },
                { type: 'text', left: 20, bottom: 65, style: { text: 'CRS', textAlign: 'right', font: '12px Arial' } },
                { type: 'text', left: 20, bottom: 45, style: { text: 'Ketamine', textAlign: 'right', font: '12px Arial' } },
                
                { type: 'line', shape: { x1: 95, y1: 470, x2: 215, y2: 470 }, style: { stroke: 'black' } }, 
                { type: 'text', left: 155, bottom: 10, style: { text: 'WT', textAlign: 'center', font: '12px Arial' } },

                { type: 'line', shape: { x1: 255, y1: 470, x2: 375, y2: 470 }, style: { stroke: 'black' } }, 
                { type: 'text', left: 315, bottom: 10, style: { text: 'Adora1-/-', textAlign: 'center', font: '12px Arial' } },
                
                { type: 'line', shape: { x1: 415, y1: 470, x2: 535, y2: 470 }, style: { stroke: 'black' } }, 
                { type: 'text', left: 475, bottom: 10, style: { text: 'Adora2a-/-', textAlign: 'center', font: '12px Arial' } }
            ]
        };
        
        const row1 = ['–', '+', '+', '', '–', '+', '+', '', '–', '+', '+'];
        const row2 = ['–', '–', '+', '', '–', '–', '+', '', '–', '–', '+'];
        
        option.xAxis = [
            option.xAxis,
            { type: 'category', data: row1, position: 'bottom', offset: 15, axisLine: {show: false}, axisTick: {show: false}, axisLabel: { color: 'black' } },
            { type: 'category', data: row2, position: 'bottom', offset: 35, axisLine: {show: false}, axisTick: {show: false}, axisLabel: { color: 'black' } }
        ];
        option.series.forEach(s => s.xAxisIndex = 0);

        chart.setOption(option);
    </script>
</body>
</html>
