        // 1. Parsing (Adapted from JSON)
        // JSON data is already number and scaled (if applicable), we just need to map it.
        // The original code handled 'nan' strings, but JSON has null or valid strings.
        // JSON uses unicode for Biome names (e.g. AMAZ\u00d4NIA), which is fine in JS strings.
        
        const data = rawData.map(item => {
            return {
                UF: item.UF === 'nan' ? 'NA' : item.UF,
                Biome: item.Biome === 'nan' ? 'NA' : item.Biome,
                Domestic: item.Domestic,
                China: item.China,
                EU: item.EU,
                Other: item.Other_countries
            };
        });

        // 2. Sorting
        const biomeOrder = ["AMAZÔNIA", "PANTANAL", "CERRADO", "CAATINGA", "PAMPA", "MATA ATLÂNTICA", "NA"];
        
        data.sort((a, b) => {
            const idxA = biomeOrder.indexOf(a.Biome);
            const idxB = biomeOrder.indexOf(b.Biome);
            if (idxA !== idxB) return idxA - idxB;
            return a.UF.localeCompare(b.UF);
        });

        // 3. Prepare Data
        const categoryData = [];
        const seriesDomestic = [];
        const seriesChina = [];
        const seriesEU = [];
        const seriesOther = [];
        
        const biomeGroups = [];
        let lastBiome = null;
        let currentIndex = 0;
        
        data.forEach(item => {
            if (item.Biome !== lastBiome) {
                if (lastBiome !== null) {
                    // Close previous group
                    biomeGroups[biomeGroups.length - 1].end = currentIndex - 1;
                    
                    for(let k=0; k<4; k++) {
                        categoryData.push('');
                        seriesDomestic.push(null);
                        seriesChina.push(null);
                        seriesEU.push(null);
                        seriesOther.push(null);
                        currentIndex++;
                    }
                }
                // Start new group
                biomeGroups.push({ name: item.Biome, start: currentIndex });
                lastBiome = item.Biome;
            }
            
            categoryData.push(item.UF);
            seriesDomestic.push(item.Domestic);
            seriesChina.push(item.China);
            seriesEU.push(item.EU);
            seriesOther.push(item.Other);
            currentIndex++;
        });
        
        // Close last group
        if (biomeGroups.length > 0) {
            biomeGroups[biomeGroups.length - 1].end = currentIndex - 1;
        }

        // Calculate Graphic Labels
        const totalSectors = categoryData.length;
        const graphics = biomeGroups.map(g => {
            const mid = (g.start + g.end) / 2;
            // Calculate angle in degrees. 
            // 0 index is at 90 degrees (Top). Clockwise.
            const angle = 90 - (mid * 360 / totalSectors);
            const rad = angle * Math.PI / 180;
            
            // Position at radius 440 (88% of 500px)
            const r = 440; 
            const cx = 500;
            const cy = 500;
            
            // Convert polar to cartesian
            const x = cx + r * Math.cos(rad);
            const y = cy - r * Math.sin(rad); // Screen Y is down
            
            return {
                type: 'text',
                left: x,
                top: y,
                style: {
                    text: g.name,
                    textAlign: 'center',
                    textVerticalAlign: 'middle',
                    fontSize: 14,
                    fontWeight: 'bold',
                    fill: '#333'
                }
            };
        });

        const option = {
            graphic: graphics,
            title: {
                text: '2020',
                top: 20,
                left: 20,
                textStyle: { fontSize: 24 }
            },
            legend: {
                bottom: 20,
                data: ['Domestic', 'China', 'EU', 'Other']
            },
            polar: {
                radius: ['20%', '80%']
            },
            angleAxis: {
                type: 'category',
                data: categoryData,
                startAngle: 90, 
                clockwise: true,
                axisLabel: {
                    interval: 0,
                    fontSize: 10,
                    color: '#555',
                    margin: 2
                },
                axisTick: { show: false },
                axisLine: { show: false },
                splitLine: { show: false }
            },
            radiusAxis: {
                max: 6.5,
                axisLabel: { show: true },
                axisLine: { show: false },
                splitLine: { 
                    show: true,
                    lineStyle: { type: 'solid', color: '#ccc' }
                }
            },
            series: [
                {
                    name: 'Domestic',
                    type: 'bar',
                    stack: 'total',
                    coordinateSystem: 'polar',
                    data: seriesDomestic,
                    itemStyle: { color: '#9ecae1' }
                },
                {
                    name: 'China',
                    type: 'bar',
                    stack: 'total',
                    coordinateSystem: 'polar',
                    data: seriesChina,
                    itemStyle: { color: '#5f9ea0' }
                },
                {
                    name: 'EU',
                    type: 'bar',
                    stack: 'total',
                    coordinateSystem: 'polar',
                    data: seriesEU,
                    itemStyle: { color: '#fdbf6f' }
                },
                {
                    name: 'Other',
                    type: 'bar',
                    stack: 'total',
                    coordinateSystem: 'polar',
                    data: seriesOther,
                    itemStyle: { color: '#d0746c' }
                }
            ]
        };
