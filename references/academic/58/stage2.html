        const parseDatasets = (csvText) => {
            const lines = csvText.trim().split('\n').filter(l => l.trim().length > 0 && !l.startsWith('|:'));
            
            const cleanAndNum = (val) => {
                const num = parseFloat(val);
                return isNaN(num) ? null : num;
            };

            const datasets = {};

            const extractData = (startLineIdx, endLineIdx, colIndexConc, colIndexDataStart, colIndexDataEnd) => {
                const results = [];
                for(let i = startLineIdx; i <= endLineIdx; i++) {
                    const line = lines[i];
                    if(!line) continue;
                    const parts = line.split('|');
                    
                    const concVal = parts[colIndexConc] ? parts[colIndexConc].trim() : '';
                    const conc = cleanAndNum(concVal);
                    if (conc === null) continue;

                    const vals = [];
                    for(let j = colIndexDataStart; j <= colIndexDataEnd; j++) {
                        if(parts[j]) {
                            const v = cleanAndNum(parts[j].trim());
                            if(v !== null) vals.push(v);
                        }
                    }
                    if(vals.length > 0) {
                        results.push({ conc: conc, vals: vals });
                    }
                }
                return processDataForPlot(results);
            };

            let header1Index = -1;
            let header2Index = -1;
            
            for(let i=0; i<lines.length; i++) {
                if(lines[i].includes('Log [NT], M')) header1Index = i;
                if(lines[i].includes('Log [SBI-553], M')) header2Index = i;
            }

            if(header1Index !== -1) {
                const start = header1Index + 2;
                const end = start + 7;
                datasets['NT'] = extractData(start, end, 1, 2, 10);
                datasets['SR'] = extractData(start, end, 12, 13, 21);
            }

            if(header2Index !== -1) {
                const start = header2Index + 2;
                const end = start + 6;
                datasets['SBI'] = extractData(start, end, 1, 2, 10);
                datasets['PD'] = extractData(start, end, 12, 13, 21);
            }

            return datasets;
        };

        const processDataForPlot = (data) => {
            const processed = data.map(row => {
                const vals = row.vals.map(v => -1 * v);
                const mean = jStat.mean(vals);
                const sem = jStat.stdev(vals, true) / Math.sqrt(vals.length);
                return { log_conc: Math.log10(row.conc), mean: mean, sem: sem, vals: vals };
            });
            return processed.sort((a, b) => a.log_conc - b.log_conc);
        }; 
        
        const datasets = parseDatasets(csvData);

        const styles = {
            'NT': { color: '#0000B2', name: 'NT' },
            'PD': { color: '#4C9F70', name: 'PD149163' },
            'SR': { color: '#B200B2', name: 'SR142948A' },
            'SBI': { color: '#F59B00', name: 'SBI-553' }
        };

        const chart = echarts.init(document.getElementById('chart-container'));

        const series = [];

        ['NT', 'PD', 'SBI', 'SR'].forEach(key => {
            const data = datasets[key];
            if (!data) return;

            const plotData = data.map(d => [d.log_conc, d.mean]);
            const errorData = data.map(d => [d.log_conc, d.mean, d.sem]);
            const style = styles[key];

            series.push({
                name: style.name,
                type: 'scatter',
                data: plotData,
                itemStyle: { color: style.color, borderColor: style.color },
                symbolSize: 8,
                z: 5
            });

            series.push({
                type: 'custom',
                name: style.name + ' Error',
                renderItem: (params, api) => {
                    const x = api.value(0);
                    const y = api.value(1);
                    const sem = api.value(2);

                    if (x === undefined || y === undefined || isNaN(x) || isNaN(y)) {
                        return { type: 'group', children: [] };
                    }

                    const highPoint = api.coord([x, y + sem]);
                    const lowPoint = api.coord([x, y - sem]);
                    
                    if (!highPoint || !lowPoint) return { type: 'group', children: [] };

                    const capHalfWidth = 2.5; 
                    const styleItem = api.style({ stroke: style.color, lineWidth: 1.5 });
                    
                    return {
                        type: 'group',
                        children: [
                            { type: 'line', shape: { x1: highPoint[0], y1: highPoint[1], x2: lowPoint[0], y2: lowPoint[1] }, style: styleItem },
                            { type: 'line', shape: { x1: highPoint[0] - capHalfWidth, y1: highPoint[1], x2: highPoint[0] + capHalfWidth, y2: highPoint[1] }, style: styleItem },
                            { type: 'line', shape: { x1: lowPoint[0] - capHalfWidth, y1: lowPoint[1], x2: lowPoint[0] + capHalfWidth, y2: lowPoint[1] }, style: styleItem }
                        ]
                    };
                },
                data: errorData,
                z: 6
            });

            series.push({
                name: style.name + ' Curve',
                type: 'line',
                data: plotData,
                smooth: true,
                showSymbol: false,
                lineStyle: { color: style.color, width: 2 },
                z: 4
            });
        });

        const option = {
            animation: false,
            backgroundColor: 'white',
            grid: { top: 60, right: 20, bottom: 60, left: 80 },
            xAxis: {
                type: 'value',
                min: -12.5,
                max: -3.5,
                interval: 2,
                axisLabel: { color: 'black', fontSize: 12 },
                axisLine: { lineStyle: { color: 'black', width: 1 } },
                axisTick: { alignWithLabel: true, length: 4, width: 1, lineStyle: { color: 'black' } },
                splitLine: { show: false }
            },
            yAxis: {
                type: 'value',
                name: 'Transducer activation\n(± Δ Net BRET)',
                nameLocation: 'middle',
                nameGap: 50,
                nameTextStyle: { color: 'black', fontSize: 14, align: 'center' },
                min: -0.1,
                max: 0.6,
                interval: 0.2,
                axisLabel: { color: 'black', fontSize: 12 },
                axisLine: { lineStyle: { color: 'black', width: 1 } },
                axisTick: { show: true, lineStyle: { color: 'black' } },
                splitLine: { show: false },
                markLine: {
                    symbol: 'none',
                    lineStyle: { type: 'dashed', color: 'black', width: 0.8 },
                    data: [{ yAxis: 0 }],
                    animation: false,
                    silent: true
                }
            },
            legend: {
                data: ['NT', 'PD149163', 'SR142948A', 'SBI-553'],
                left: 'right',
                top: 'middle',
                orient: 'vertical',
                textStyle: { fontSize: 12 },
                itemGap: 15
            },
            series: series,
            graphic: [
                {
                    type: 'group',
                    id: 'gq-label-group',
                    left: '5%',
                    top: '5%',
                    children: [
                        { type: 'text', style: { text: 'G', font: '16px Arial', fill: 'black' }, left: 0, top: 0 },
                        { type: 'text', style: { text: 'q', font: '12px Arial', fill: 'black' }, left: 12, top: 5 }
                    ]
                }
            ]
        };
        
        chart.setOption(option);
