<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nature Chart Reproduction</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
    <style>
        body { margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #fff; }
        #chart {
            width: 500px;
            height: 500px;
        }
    </style>
</head>
<body>
    <div id="chart"></div>
    <script>
        // 1. Source Data (Embedded from JSON)
        const chartData = [
    {
        "label": "0 \u00b5M",
        "x": [
            -5.0,
            -6.0,
            -7.0,
            -8.0,
            -9.0,
            -10.0,
            -11.0,
            -12.0
        ],
        "y": [
            0.27037370210000006,
            0.2630359197875,
            0.2654965532125,
            0.16328170592500002,
            0.07960161071124999,
            0.010396724351249999,
            0.00176614074755,
            0.0036362499999999997
        ],
        "err": [
            0.0100276137635035,
            0.009074735663819824,
            0.009616475741737128,
            0.031024078676584414,
            0.026223510403049974,
            0.007560480601928367,
            0.005083117180574142,
            0.004021572021283419
        ]
    },
    {
        "label": "30 \u00b5M",
        "x": [
            -5.0,
            -6.0,
            -7.0,
            -8.0,
            -9.0,
            -10.0,
            -11.0,
            -12.0
        ],
        "y": [
            0.21992177733749999,
            0.2109508447625,
            0.20580506995,
            0.13631016585,
            0.08203085291750001,
            0.046397528887500004,
            0.04347753120287501,
            0.0422346316225
        ],
        "err": [
            0.008287799482789352,
            0.0058916863503217206,
            0.006110810434581999,
            0.00899953315461237,
            0.009684107608393548,
            0.011075326310247399,
            0.009428140571105179,
            0.005071732183257464
        ]
    }
];

        // Process Data
        const group0 = chartData.find(d => d.label === '0 \u00b5M');
        const group30 = chartData.find(d => d.label === '30 \u00b5M');

        // Map to [x, y, err] and Sort
        const data0 = group0.x.map((x, i) => [x, group0.y[i], group0.err[i]]).sort((a,b)=>a[0]-b[0]);
        const data30 = group30.x.map((x, i) => [x, group30.y[i], group30.err[i]]).sort((a,b)=>a[0]-b[0]);

        // Initialize ECharts
        const chart = echarts.init(document.getElementById('chart'));

        // Custom Error Bar Render Function
        function renderErrorBar(params, api) {
            const xValue = api.value(0);
            const yValue = api.value(1);
            const err = api.value(2);
            
            const high = yValue + err;
            const low = yValue - err;
            
            const bottom = api.coord([xValue, low]);
            const top = api.coord([xValue, high]);
            
            const style = api.style({
                stroke: api.visual('color'),
                fill: null,
                lineWidth: 1.5
            });
            
            const width = 6; // Cap width
            
            return {
                type: 'group',
                children: [
                    // Vertical line
                    {
                        type: 'line',
                        shape: {
                            x1: top[0], y1: top[1],
                            x2: bottom[0], y2: bottom[1]
                        },
                        style: style
                    },
                    // Top cap
                    {
                        type: 'line',
                        shape: {
                            x1: top[0] - width / 2, y1: top[1],
                            x2: top[0] + width / 2, y2: top[1]
                        },
                        style: style
                    },
                    // Bottom cap
                    {
                        type: 'line',
                        shape: {
                            x1: bottom[0] - width / 2, y1: bottom[1],
                            x2: bottom[0] + width / 2, y2: bottom[1]
                        },
                        style: style
                    }
                ]
            };
        }

        const option = {
            backgroundColor: '#fff',
            grid: {
                top: '10%',
                right: '10%',
                bottom: '15%',
                left: '15%',
                containLabel: false
            },
            xAxis: {
                type: 'value',
                min: -15,
                max: -3,
                interval: 2,
                splitLine: { show: false },
                axisLine: { 
                    show: true,
                    lineStyle: { color: 'black' }
                },
                axisTick: { 
                    show: true, 
                    inside: true, 
                    length: 4,
                    lineStyle: { width: 1 }
                },
                axisLabel: {
                    color: 'black',
                    fontSize: 12,
                    formatter: function(value) {
                        return value.toString();
                    }
                }
            },
            yAxis: {
                type: 'value',
                min: -0.05,
                max: 0.4,
                interval: 0.1,
                splitLine: { show: false },
                axisLine: { 
                    show: true,
                    lineStyle: { color: 'black' }
                },
                axisTick: { 
                    show: true, 
                    inside: true,
                    length: 4,
                    lineStyle: { width: 1 }
                },
                axisLabel: {
                    color: 'black',
                    fontSize: 12,
                    formatter: function(value) {
                        return value.toFixed(1);
                    }
                }
            },
            series: [
                // 30 uM Curve (Purple) - Background "Glow"
                {
                    type: 'line',
                    data: data30.map(d => [d[0], d[1]]),
                    symbol: 'none',
                    smooth: true,
                    lineStyle: {
                        color: '#9400D3',
                        width: 12, 
                        opacity: 0.2
                    },
                    z: 1,
                    silent: true
                },
                // 30 uM Curve (Purple) - Main Line
                {
                    type: 'line',
                    data: data30.map(d => [d[0], d[1]]),
                    symbol: 'none',
                    smooth: true,
                    lineStyle: {
                        color: '#9400D3',
                        width: 1.5
                    },
                    z: 2
                },
                // 0 uM Curve (Blue)
                {
                    type: 'line',
                    data: data0.map(d => [d[0], d[1]]),
                    symbol: 'none',
                    smooth: true,
                    lineStyle: {
                        color: '#00008B',
                        width: 1.5
                    },
                    z: 2
                },
                // 0 uM Scatter
                {
                    name: '0 µM',
                    type: 'scatter',
                    data: data0.map(d => [d[0], d[1]]), 
                    itemStyle: {
                        color: '#00008B'
                    },
                    symbolSize: 6,
                    z: 3
                },
                // 0 uM Error Bars
                {
                    type: 'custom',
                    renderItem: renderErrorBar,
                    itemStyle: { color: '#00008B' },
                    data: data0,
                    z: 3,
                    silent: true
                },
                // 30 uM Scatter
                {
                    name: '30 µM',
                    type: 'scatter',
                    data: data30.map(d => [d[0], d[1]]),
                    itemStyle: {
                        color: '#9400D3'
                    },
                    symbol: 'rect', // Square
                    symbolSize: 6,
                    z: 3
                },
                // 30 uM Error Bars
                {
                    type: 'custom',
                    renderItem: renderErrorBar,
                    itemStyle: { color: '#9400D3' },
                    data: data30,
                    z: 3,
                    silent: true
                },
                // Dashed Line at y=0
                {
                    type: 'line',
                    markLine: {
                        symbol: 'none',
                        data: [
                            { yAxis: 0 }
                        ],
                        lineStyle: {
                            type: 'dashed',
                            color: 'black',
                            width: 0.8
                        },
                        silent: true,
                        label: { show: false }
                    }
                },
                // Arrows (using markLine)
                {
                    type: 'line',
                    markLine: {
                        symbol: ['none', 'arrow'],
                        symbolSize: 10,
                        data: [
                            // Up Arrow at x ~ -13.5
                            [
                                { coord: [-13.5, 0.01] },
                                { coord: [-13.5, 0.06] }
                            ],
                            // Down Arrow at x ~ -4
                            [
                                { coord: [-4, 0.26] },
                                { coord: [-4, 0.22] }
                            ]
                        ],
                        lineStyle: {
                            color: '#BA55D3',
                            width: 3,
                            type: 'solid'
                        },
                        silent: true
                    }
                }
            ],
            graphic: [
                {
                    type: 'text',
                    left: '6%', 
                    top: '6%',
                    style: {
                        text: 'Gi1', 
                        fill: 'black',
                        font: '14px sans-serif'
                    }
                }
            ]
        };

        chart.setOption(option);
    </script>
</body>
</html>
