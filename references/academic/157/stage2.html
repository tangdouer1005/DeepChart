        "central estimate of SAF cost": -3047.2,

    }
];

        function getSeriesData(groupName) {
            return jsonData.filter(d => d.Group === groupName)
                           .sort((a, b) => a.Year - b.Year);
        }

        const dataHigh = getSeriesData('high estimate of CORSIA offset cost');
        const dataMed = getSeriesData('central estimate of CORSIA offset cost');
        const dataLow = getSeriesData('low estimate of CORSIA offset cost');

        const years = [2027, 2028, 2029, 2030, 2031, 2032, 2033, 2034, 2035];

        const central_high = dataHigh.map(d => d['central estimate of SAF cost']);
        const low_high = dataHigh.map(d => d['low SAF cost']);
        const high_high = dataHigh.map(d => d['high SAF cost']);

        const central_med = dataMed.map(d => d['central estimate of SAF cost']);
        const low_med = dataMed.map(d => d['low SAF cost']);
        const high_med = dataMed.map(d => d['high SAF cost']);

        const central_low = dataLow.map(d => d['central estimate of SAF cost']);
        const low_low = dataLow.map(d => d['low SAF cost']);
        const high_low = dataLow.map(d => d['high SAF cost']);

        const chart = echarts.init(document.getElementById('chart-container'));

        const option = {
            backgroundColor: 'white',
            grid: { top: 50, right: 100, bottom: 50, left: 80 },
            legend: {
                data: ['High offset price', 'Low offset price', 'Medium offset price'],
                bottom: 10,
                left: 10,
                orient: 'vertical',
                title: { text: 'China-S2', left: '0' } // ECharts doesn't support legend title natively like this, handle via graphic
            },
            xAxis: {
                type: 'category',
                data: years,
                axisLabel: { color: 'black' },
                axisLine: { show: true, lineStyle: { color: 'black' } },
                axisTick: { show: true, alignWithLabel: true }
            },
            yAxis: {
                type: 'value',
                name: 'Net costs of max usage of SAF (million US$)',
                nameLocation: 'middle',
                nameGap: 50,
                min: -4000,
                max: 6000,
                axisLabel: { 
                    color: 'black',
                    formatter: function(value) {
                        return value.toLocaleString();
                    }
                },
                axisLine: { show: true, lineStyle: { color: 'black' } },
                splitLine: { show: false }
            },
            series: [
                // High offset price (Yellow)
                {
                    name: 'High offset price',
                    type: 'line',
                    data: central_high,
                    lineStyle: { color: '#EDD968', width: 3 },
                    symbol: 'none',
                    z: 1
                },
                {
                    name: 'High offset price CI',
                    type: 'custom',
                    renderItem: function (params, api) {
                        const points = [];
                        for (let i = 0; i < years.length; i++) {
                            points.push(api.coord([i, high_high[i]]));
                        }
                        for (let i = years.length - 1; i >= 0; i--) {
                            points.push(api.coord([i, low_high[i]]));
                        }
                        return {
                            type: 'polygon',
                            shape: { points: points },
                            style: api.style({ fill: '#F9F0C2', stroke: 'none', opacity: 0.5 })
                        };
                    },
                    data: [0],
                    z: 0
                },
                // Medium offset price (Pink)
                {
                    name: 'Medium offset price',
                    type: 'line',
                    data: central_med,
                    lineStyle: { color: '#E67E83', width: 3 },
                    symbol: 'none',
                    z: 2
                },
                {
                    name: 'Medium offset price CI',
                    type: 'custom',
                    renderItem: function (params, api) {
                        const points = [];
                        for (let i = 0; i < years.length; i++) {
                            points.push(api.coord([i, high_med[i]]));
                        }
                        for (let i = years.length - 1; i >= 0; i--) {
                            points.push(api.coord([i, low_med[i]]));
                        }
                        return {
                            type: 'polygon',
                            shape: { points: points },
                            style: api.style({ fill: '#F2D4D7', stroke: 'none', opacity: 0.5 })
                        };
                    },
                    data: [0],
                    z: 0
                },
                // Low offset price (Blue)
                {
                    name: 'Low offset price',
                    type: 'line',
                    data: central_low,
                    lineStyle: { color: '#2B5576', width: 3 },
                    symbol: 'none',
                    z: 3
                },
                {
                    name: 'Low offset price CI',
                    type: 'custom',
                    renderItem: function (params, api) {
                        const points = [];
                        for (let i = 0; i < years.length; i++) {
                            points.push(api.coord([i, high_low[i]]));
                        }
                        for (let i = years.length - 1; i >= 0; i--) {
                            points.push(api.coord([i, low_low[i]]));
                        }
                        return {
                            type: 'polygon',
                            shape: { points: points },
                            style: api.style({ fill: '#DCE6F1', stroke: 'none', opacity: 0.5 })
                        };
                    },
                    data: [0],
                    z: 0
                }
            ],
            graphic: [
                { type: 'text', left: 10, top: 10, style: { text: 'a', font: 'bold 24px Arial' } },
                { type: 'text', left: 80, bottom: 100, style: { text: 'China-S2', font: 'bold 14px Arial' } },
                // Annotations
                { type: 'text', right: 30, top: '65%', style: { text: '-10.9 B', fill: '#EDD968', font: '14px Arial' } },
                { type: 'text', right: 30, top: '55%', style: { text: '-2.2 B', fill: '#E67E83', font: '14px Arial' } },
                { type: 'text', right: 30, top: '45%', style: { text: '5.3 B', fill: '#2B5576', font: '14px Arial' } },
                // Zero line
                {
                    type: 'line',
                    shape: { x1: 80, y1: 370, x2: 700, y2: 370 }, // Approx y for 0
                    style: { stroke: 'grey', lineWidth: 1, lineDash: [4, 4] },
                    // Better to find y pixel for 0 value
                    // Hardcoded here for simplicity in this prompt context, but convertToPixel is better in full app
                }
            ]
        };
        
        // Correct Zero Line placement
        // In a real browser environment, we'd use convertToPixel after setOption.
        // For static gen, we rely on ECharts rendering logic. 
        // We can add a markLine to a series instead of graphic line for accuracy.
        option.series[0].markLine = {
            symbol: 'none',
            label: { show: false },
            lineStyle: { type: 'dotted', color: 'grey', width: 1.5 },
            data: [{ yAxis: 0 }]
        };

        chart.setOption(option);
    </script>
</body>
</html>
