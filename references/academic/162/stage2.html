    {

    {

    },
    {

        "Year": 2035,
        "Central": -2387.5,
        "Low": -3499.9,
        "High": 185.1
    }
].map(d => { d.Scenario = d.Group; return d; });

        const colors = {
            'high estimate of CORSIA offset cost': {line: '#dede5d', fill: '#fcf5c9', text: '#bcbc40'}, // Yellow
            'low estimate of CORSIA offset cost': {line: '#3b5b7e', fill: '#dbe9f6', text: '#3b5b7e'},  // Dark Blue
            'central estimate of CORSIA offset cost': {line: '#e77f82', fill: '#eaccd4', text: '#e77f82'} // Red/Pink
        };

        const scenarioConfig = {
            'high estimate of CORSIA offset cost': {
                label: 'High offset price',
                annotation: '-12.4 B',
                annotationY: -1800, // Visual adjustment from Python
                zorder: 1 // Lowest
            },
            'low estimate of CORSIA offset cost': { // Fix case from python script to match data
                label: 'Low offset price',
                annotation: '6.8 B',
                annotationY: 1400,
                zorder: 2 // Middle
            },
            'central estimate of CORSIA offset cost': {
                label: 'Medium offset price',
                annotation: '-2.1 B',
                annotationY: -300,
                zorder: 3 // Highest
            }
        };

        const chart = echarts.init(document.getElementById('chart-container'));

        const series = [];
        const uniqueScenarios = [...new Set(df.map(d => d.Scenario))];

        uniqueScenarios.forEach(sc => {
            const config = scenarioConfig[sc];
            if (!config) return;

            const subset = df.filter(d => d.Scenario === sc).sort((a,b) => a.Year - b.Year);
            if (subset.length === 0) return;

            const centralData = subset.map(d => [d.Year, d.Central]);
            const lowData = subset.map(d => [d.Year, d.Low]);
            const highData = subset.map(d => [d.Year, d.High]);
            
            // MarkArea data needs to be structured as [[{xAxis:X1, yAxis:Y1}, {xAxis:X2, yAxis:Y2}]] for an area.
            // For fill_between like effect with multiple years, use custom series or combine two lines.
            // ECharts fill_between usually expects `areaStyle`.

            // Central Line
            series.push({
                name: config.label,
                type: 'line',
                data: centralData,
                lineStyle: {
                    width: 3,
                    color: colors[sc].line
                },
                showSymbol: false,
                z: config.zorder * 10,
                markPoint: {
                    data: [
                        {
                            xAxis: subset[subset.length-1].Year, // Last year
                            yAxis: config.annotationY !== undefined ? config.annotationY : subset[subset.length-1].Central,
                            value: config.annotation,
                            symbolSize: 0, // invisible point
                            label: {
                                show: true,
                                position: 'right', // or custom position
                                formatter: config.annotation,
                                color: colors[sc].text, // Annotation text color
                                fontSize: 12,
                                offset: [20, 0] // Offset from the actual point
                            }
                        }
                    ],
                    animation: false
                }
            });

            // Confidence Interval
            series.push({
                name: config.label + ' CI',
                type: 'custom',
                renderItem: function (params, api) {
                    const points = [];
                    for (let i = 0; i < subset.length; i++) {
                        points.push(api.coord([subset[i].Year, subset[i].High]));
                    }
                    for (let i = subset.length - 1; i >= 0; i--) {
                        points.push(api.coord([subset[i].Year, subset[i].Low]));
                    }
                    return {
                        type: 'polygon',
                        shape: { points: points },
                        style: api.style({ fill: colors[sc].fill, stroke: 'none', opacity: 0.5 })
                    };
                },
                data: [0],
                z: config.zorder * 10 - 1
            });
        });

        const option = {
            backgroundColor: 'white',
            grid: { top: 80, bottom: 80, left: 80, right: 80 },
            xAxis: {
                type: 'value',
                min: 2027,
                max: 2035,
                interval: 1,
                axisLabel: { color: 'black' },
                axisLine: { lineStyle: { color: 'black' } },
                axisTick: { show: true }
            },
            yAxis: {
                type: 'value',
                name: 'Net costs of max usage of SAF (million US$)',
                nameLocation: 'middle',
                nameGap: 50,
                min: -4000,
                max: 6000,
                interval: 1000,
                axisLabel: {
                    color: 'black',
                    formatter: function (value) {
                        return value.toLocaleString();
                    }
                },
                axisLine: { lineStyle: { color: 'black' } },
                axisTick: { show: true },
                splitLine: { show: false }
            },
            legend: {
                data: uniqueScenarios.map(sc => scenarioConfig[sc] ? scenarioConfig[sc].label : null).filter(Boolean),
                top: 80, left: 80,
                orient: 'vertical',
                itemGap: 10,
                textStyle: { fontSize: 12 },
                inactiveColor: '#ccc'
            },
            series: series,
            graphic: [
                {
                    type: 'line',
                    shape: { x1: 80, y1: 300, x2: 720, y2: 300 }, // Horizontal line at y=0. Approx for pixels.
                    style: { stroke: 'gray', lineDash: [5, 5] },
                    z: 0
                },
                {
                    type: 'text',
                    left: 10, top: 10,
                    style: { text: 'f', font: 'bold 20px Arial', fill: 'black' }
                }
            ]
        };

        chart.setOption(option);
    </script>
</body>
</html>
