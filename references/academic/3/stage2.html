    "columns": [
        "WT naive",
        "WT saline",

        "A1 ko naive",
        "A1ko saline",
        "A1ko K",
        "A2a ko naive",
        "A2a ko saline",

    ],
    "comparisons": [
        {
            "group_start": 0,
            "group_end": 3,
            "col1_idx": 0,
            "col2_idx": 1,
            "col1": "WT naive",
            "col2": "WT saline",
            "p_val": 5.403952453882359e-06
        },
        {

        {

        },
        {

            "group_end": 9,
            "col1_idx": 6,
            "col2_idx": 7,
            "col1": "A2a ko naive",
            "col2": "A2a ko saline",
            "p_val": 0.02627694885737223
        },
        {
            "group_start": 6,
            "group_end": 9,
            "col1_idx": 7,
            "col2_idx": 8,
            "col1": "A2a ko saline",
            "col2": "A2a ko K",
            "p_val": 0.9055807837761114
        }
    ]
};

        const columns = chartData.columns;
        
        const stats = {};
        columns.forEach(col => {
            const arr = chartData.raw_data[col];
            // Variance not provided in JSON but means/sems are. 
            // We need raw data for finding max value for bracket positioning.
            // variance is not needed for stats unless used for calculation, but we have p-values.
            stats[col] = { 
                mean: chartData.means[col], 
                sem: chartData.sems[col], 
                arr: arr
            };
        });

        const annotations = [];
        let groupMaxH = {0:0, 1:0, 2:0}; // Groups: 0-2, 3-5, 6-8

        // Calculate max height per group for bracket base
        [0, 1, 2].forEach(gIdx => {
            const start = gIdx * 3;
            const end = start + 3;
            let maxVal = 0;
            for(let i=start; i<end; i++) {
                const s = stats[columns[i]];
                maxVal = Math.max(maxVal, s.mean + s.sem);
                // Also check raw data max (though usually mean+sem is close to top for error bars, raw points might be higher)
                // In old code: s.arr.forEach(v => maxVal = Math.max(maxVal, v));
                s.arr.forEach(v => maxVal = Math.max(maxVal, v));
            }
            groupMaxH[gIdx] = maxVal + 5;
        });

        chartData.comparisons.forEach(comp => {
            const idx1 = comp.col1_idx;
            const idx2 = comp.col2_idx;
            const pVal = comp.p_val;
            
            let sigText = "";
            if (pVal < 0.001) sigText = "***";
            else if (pVal < 0.01) sigText = "**";
            else if (pVal < 0.05) sigText = "*";
            else sigText = `P = ${pVal.toFixed(2)}`;

            const groupIdx = Math.floor(idx1 / 3);
            const yPos = groupMaxH[groupIdx];
            groupMaxH[groupIdx] += 12; // stack

            annotations.push({ x1: idx1, x2: idx2, y: yPos, text: sigText });
        });

        const colors = [
            '#468FA3', '#1A1A1A', '#9E2A2B',
            '#5DAcc0', '#444444', '#E85A55',
            '#66C2D9', '#808080', '#F08080'
        ];

        const chart = echarts.init(document.getElementById('chart-container'));
        
        const scatterData = [];
        columns.forEach((col, idx) => {
            stats[col].arr.forEach(val => {
                const jitter = (Math.random() - 0.5) * 0.3;
                scatterData.push([idx + jitter, val]);
            });
        });

        const option = {
            animation: false,
            backgroundColor: 'white',
            grid: { top: 50, right: 20, bottom: 100, left: 60 },
            xAxis: [
                { type: 'category', data: columns, show: false }, 
                {
                    type: 'category', 
                    data: ['-', '+', '+', '-', '+', '+', '-', '+', '+'], 
                    position: 'bottom', offset: 15, 
                    axisLine: {show: false}, axisTick: {show: false}, 
                    axisLabel: { color: 'black' } 
                }, // CRS
                {
                    type: 'category', 
                    data: ['-', '-', '+', '-', '-', '+', '-', '-', '+'], 
                    position: 'bottom', offset: 35, 
                    axisLine: {show: false}, axisTick: {show: false}, 
                    axisLabel: { color: 'black' } 
                } // Ketamine
            ],
            yAxis: {
                type: 'value',
                max: 145,
                axisLabel: { color: 'black', fontSize: 12 },
                name: 'Immobility time (s)',
                nameLocation: 'middle',
                nameGap: 40,
                nameTextStyle: { color: 'black', fontSize: 14 },
                splitLine: { show: false },
                axisLine: { show: true, lineStyle: { color: 'black' } } 
            },
            series: [
                {
                    type: 'bar',
                    data: columns.map((col, i) => ({ value: stats[col].mean, itemStyle: { color: colors[i] } })),
                    barWidth: '70%',
                    z: 1,
                    xAxisIndex: 0
                },
                {
                    type: 'custom',
                    renderItem: function(params, api) {
                        const x = api.value(0);
                        const mean = api.value(1);
                        const sem = api.value(2);
                        const p1 = api.coord([x, mean - sem]);
                        const p2 = api.coord([x, mean + sem]);
                        const style = api.style({ stroke: 'gray', lineWidth: 1.5 });
                        return { type: 'line', shape: { x1: p1[0], y1: p1[1], x2: p2[0], y2: p2[1] }, style: style };
                    },
                    data: columns.map((col, i) => [i, stats[col].mean, stats[col].sem]),
                    z: 2,
                    xAxisIndex: 0
                },
                {
                    type: 'scatter',
                    symbolSize: 6,
                    itemStyle: { color: '#555555', opacity: 0.7 },
                    data: scatterData,
                    z: 3,
                    xAxisIndex: 0
                },
                {
                    type: 'custom',
                    renderItem: function(params, api) {
                        const ann = annotations[params.dataIndex];
                        const p1 = api.coord([ann.x1, ann.y]);
                        const p2 = api.coord([ann.x2, ann.y]);
                        const style = api.style({ stroke: 'black', lineWidth: 1, fill: null });
                        return {
                            type: 'group',
                            children: [
                                { type: 'polyline', shape: { points: [[p1[0], p1[1]+2], [p1[0], p1[1]], [p2[0], p2[1]], [p2[0], p2[1]+2]] }, style: style },
                                { type: 'text', style: { text: ann.text, x: (p1[0]+p2[0])/2, y: p1[1]-2, textAlign: 'center', textVerticalAlign: 'bottom', fill: 'black', font: '10px Arial' } }
                            ]
                        };
                    },
                    data: annotations.map((a, i) => i), // Dummy data
                    z: 4,
                    xAxisIndex: 0
                }
            ],
            graphic: [
                // 'b' label
                { type: 'text', left: 0, top: 0, style: { text: 'b', font: 'bold 20px Arial' } },
                // X-axis table
                // Rows: CRS, Ketamine
                { type: 'text', left: 20, bottom: 65, style: { text: 'CRS', textAlign: 'right', font: '12px Arial' } },
                { type: 'text', left: 20, bottom: 45, style: { text: 'Ketamine', textAlign: 'right', font: '12px Arial' } },
                // Group labels (WT, Adora1, Adora2a)
                { type: 'line', shape: { x1: 95, y1: 470, x2: 215, y2: 470 }, style: { stroke: 'black' } }, 
                { type: 'text', left: 155, bottom: 10, style: { text: 'WT', textAlign: 'center', font: '12px Arial' } },

                { type: 'line', shape: { x1: 235, y1: 470, x2: 355, y2: 470 }, style: { stroke: 'black' } }, 
                { type: 'text', left: 295, bottom: 10, style: { text: 'Adora1-/-', textAlign: 'center', font: '12px Arial' } },
                
                { type: 'line', shape: { x1: 375, y1: 470, x2: 495, y2: 470 }, style: { stroke: 'black' } }, 
                { type: 'text', left: 435, bottom: 10, style: { text: 'Adora2a-/-', textAlign: 'center', font: '12px Arial' } }
            ]

        chart.setOption(option);
    </script>
