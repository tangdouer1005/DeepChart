};

        const corrMatrix = corrData.data;
        const columns = corrData.columns;
        
        // Prepare Heatmap Data (Upper Triangle + Diagonal)
        const heatmapData = [];
        // x axis: j, y axis: i.
        // We want upper triangle: j >= i (if y-axis is inverted 0 at top)
        for (let i = 0; i < columns.length; i++) {
            for (let j = i; j < columns.length; j++) { 
                heatmapData.push([j, i, corrMatrix[i][j]]);
            }
        }

        // 4. ECharts Configuration
        const chart = echarts.init(document.getElementById('chart-container'));

        const xLabels = columns; // Reuse columns from JSON
        
        // Rich text formatting for labels to approximate the Python output
        const richLabels = {
            'Eb': 'Eb Li+ binding energy',
            'sigma_ion': 'σ_ion ionic conductivity',
            'Initial R_interface': 'Initial R_interface\ninitial interfacial resistance',
            'eta_15th': 'η_15th Li||Li overpotential at 15th cycle',
            'J_crit': 'J_crit. critical current density',
            'F%': 'F% F1s atomic percentage',
            'C%': 'C% C1s atomic percentage',
            'O%': 'O% O1s atomic percentage',
            'R_interface': 'R_interface interfacial resistance at 15th cycle'
        };

        const yLabels = xLabels.map(label => richLabels[label] || label);

        const option = {
            backgroundColor: 'white',
            grid: { 
                top: 200,    // Increased space for X-axis labels
                bottom: 20, 
                left: 320,   // Space for Y-axis labels and Colorbar
                right: 50 
            },
            xAxis: {
                type: 'category',
                data: xLabels,
                position: 'top',
                axisLabel: { 
                    rotate: 90, 
                    align: 'right', // Change to right to make labels extend upwards
                    verticalAlign: 'bottom', // Align bottom of label to the tick mark
                    color: 'black', 
                    fontSize: 12,
                    formatter: function(value) {
                         // Simple replacement for math symbols
                        if(value === 'sigma_ion') return 'σ_ion';
                        if(value === 'eta_15th') return 'η_15th';
                        if(value === 'Eb') return 'Eb';
                        if(value === 'J_crit.') return 'J_crit.';
                        return value;
                    }
                },
                axisTick: { show: false },
                axisLine: { show: false },
                splitArea: { show: false }
            },
            yAxis: {
                type: 'category',
                data: yLabels,
                inverse: true, // Put first item at the top
                axisLabel: { 
                    rotate: 0, 
                    align: 'right', 
                    color: 'black', 
                    fontSize: 12,
                    formatter: function(value) {
                        return value;
                    }
                },
                axisTick: { show: false },
                axisLine: { show: false },
                splitArea: { show: false }
            },
            visualMap: {
                min: -1, 
                max: 1,
                calculable: true,
                orient: 'vertical',
                left: 20,
                bottom: 0, 
                top: 'center', // Center vertically relative to container?
                itemHeight: 300,
                inRange: { 
                    color: ['#b2182b', '#fddbc7', '#ffffff', '#d1e5f0', '#2166ac'] 
                },
                text: ['1.0', '-1.0'], // Text on ends
                textStyle: { color: 'black' },
                precision: 1,
                handleIcon: 'none' // Remove the drag handles for cleaner look
            },
            series: [{
                type: 'heatmap',
                data: heatmapData,
                label: {
                    show: true,
                    formatter: function(params) {
                        return params.value[2].toFixed(2);
                    },
                    color: 'black',
                    fontSize: 10
                },
                itemStyle: {
                    borderColor: 'white',
                    borderWidth: 1
                },
                emphasis: {
                    itemStyle: {
                        shadowBlur: 10,
                        shadowColor: 'rgba(0, 0, 0, 0.5)'
                    }
                }
            }],
            graphic: [
                { 
                    type: 'text', 
                    left: 10, 
                    top: 10, 
                    style: { text: 'a', font: 'bold 30px Arial', fill: 'black' } 
                },
                {
                    type: 'text',
                    left: 80, // Near the visualMap
                    top: '90%', // Below visualMap
                    style: { 
                        text: 'Spearman coefficient', 
                        textAlign: 'center', 
                        fill: 'black', 
                        fontSize: 14 
                    }
                }
            ]
        };

        chart.setOption(option);
