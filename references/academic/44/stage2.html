<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nature Chart Reproduction</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
    <style>
        body { margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #ffffff; font-family: Arial, sans-serif; }
        #chart-container { width: 700px; height: 500px; }
    </style>
</head>
<body>
    <div id="chart-container"></div>
    <script>
        const jsonData = [
    {
        "Current_Density": 50,
        "IrOx_mean": -2.1133333333333333,
        "IrOx_std": 0.015275252316519383,
        "NiFe-B_mean": -1.9566666666666668,
        "NiFe-B_std": 0.011547005383792526
    },
    {
        "Current_Density": 100,
        "IrOx_mean": -2.2,
        "IrOx_std": 0.010000000000000009,
        "NiFe-B_mean": -2.02,
        "NiFe-B_std": 0.020000000000000018
    },
    {
        "Current_Density": 200,
        "IrOx_mean": -2.2866666666666666,
        "IrOx_std": 0.015275252316519385,
        "NiFe-B_mean": -2.1533333333333333,
        "NiFe-B_std": 0.015275252316519383
    },
    {
        "Current_Density": 300,
        "IrOx_mean": -2.3633333333333333,
        "IrOx_std": 0.020816659994661382,
        "NiFe-B_mean": -2.23,
        "NiFe-B_std": 0.020000000000000018
    },
    {
        "Current_Density": 400,
        "IrOx_mean": -2.44,
        "IrOx_std": 0.020000000000000018,
        "NiFe-B_mean": -2.283333333333333,
        "NiFe-B_std": 0.015275252316519383
    },
    {
        "Current_Density": 500,
        "IrOx_mean": -2.5033333333333334,
        "IrOx_std": 0.025166114784235735,
        "NiFe-B_mean": -2.33,
        "NiFe-B_std": 0.020000000000000018
    },
    {
        "Current_Density": 600,
        "IrOx_mean": -2.5666666666666664,
        "IrOx_std": 0.03055050463303896,
        "NiFe-B_mean": -2.376666666666667,
        "NiFe-B_std": 0.03055050463303896
    },
    {
        "Current_Density": 700,
        "IrOx_mean": -2.603333333333333,
        "IrOx_std": 0.03055050463303896,
        "NiFe-B_mean": -2.4233333333333333,
        "NiFe-B_std": 0.03511884584284239
    },
    {
        "Current_Density": 800,
        "IrOx_mean": -2.6366666666666667,
        "IrOx_std": 0.03214550253664317,
        "NiFe-B_mean": -2.466666666666667,
        "NiFe-B_std": 0.03055050463303896
    }
];

        const currentDensity = jsonData.map(item => item.Current_Density);
        const irox_mean = jsonData.map(item => item.IrOx_mean);
        const irox_std = jsonData.map(item => item.IrOx_std);
        const nife_mean = jsonData.map(item => item['NiFe-B_mean']);
        const nife_std = jsonData.map(item => item['NiFe-B_std']);

        // Colors
        const irox_edge = '#5C7495';
        const irox_face = '#BCC8D9';
        const nife_edge = '#B87466';
        const nife_face = '#E8CFCB';

        const chart = echarts.init(document.getElementById('chart-container'));

        const series = [
            {
                name: 'IrOx',
                type: 'line',
                data: currentDensity.map((cd, i) => [cd, irox_mean[i]]),
                symbol: 'circle',
                symbolSize: 10,
                itemStyle: {
                    color: irox_edge,
                    borderColor: irox_edge,
                    borderWidth: 1,
                    areaStyle: { opacity: 0 }
                },
                lineStyle: { color: irox_edge, width: 1.5 },
                z: 2
            },
            {
                type: 'custom',
                name: 'IrOx Error',
                renderItem: (params, api) => {
                    const x = api.value(0);
                    const meanVal = api.value(1);
                    const stdVal = api.value(2);
                    
                    const highPoint = api.coord([x, meanVal + stdVal]);
                    const lowPoint = api.coord([x, meanVal - stdVal]);
                    const capHalfWidth = api.size([5, 0])[0];

                    const style = api.style({ stroke: 'black', lineWidth: 1.5 });
                    return {
                        type: 'group',
                        children: [
                            { type: 'line', shape: { x1: highPoint[0], y1: highPoint[1], x2: lowPoint[0], y2: lowPoint[1] }, style: style },
                            { type: 'line', shape: { x1: highPoint[0] - capHalfWidth, y1: highPoint[1], x2: highPoint[0] + capHalfWidth, y2: highPoint[1] }, style: style },
                            { type: 'line', shape: { x1: lowPoint[0] - capHalfWidth, y1: lowPoint[1], x2: lowPoint[0] + capHalfWidth, y2: lowPoint[1] }, style: style }
                        ]
                    };
                },
                data: currentDensity.map((cd, i) => ([cd, irox_mean[i], irox_std[i]])),
                z: 3
            },
            {
                name: 'NiFe-B',
                type: 'line',
                data: currentDensity.map((cd, i) => [cd, nife_mean[i]]),
                symbol: 'circle',
                symbolSize: 10,
                itemStyle: {
                    color: nife_edge,
                    borderColor: nife_edge,
                    borderWidth: 1,
                    areaStyle: { opacity: 0 }
                },
                lineStyle: { color: nife_edge, width: 1.5 },
                z: 1
            },
            {
                type: 'custom',
                name: 'NiFe-B Error',
                renderItem: (params, api) => {
                    const x = api.value(0);
                    const meanVal = api.value(1);
                    const stdVal = api.value(2);
                    
                    const highPoint = api.coord([x, meanVal + stdVal]);
                    const lowPoint = api.coord([x, meanVal - stdVal]);
                    const capHalfWidth = api.size([5, 0])[0];

                    const style = api.style({ stroke: 'black', lineWidth: 1.5 });
                    return {
                        type: 'group',
                        children: [
                            { type: 'line', shape: { x1: highPoint[0], y1: highPoint[1], x2: lowPoint[0], y2: lowPoint[1] }, style: style },
                            { type: 'line', shape: { x1: highPoint[0] - capHalfWidth, y1: highPoint[1], x2: highPoint[0] + capHalfWidth, y2: highPoint[1] }, style: style },
                            { type: 'line', shape: { x1: lowPoint[0] - capHalfWidth, y1: lowPoint[1], x2: lowPoint[0] + capHalfWidth, y2: lowPoint[1] }, style: style }
                        ]
                    };
                },
                data: currentDensity.map((cd, i) => ([cd, nife_mean[i], nife_std[i]])),
                z: 0
            }
        ];

        const option = {
            animation: false,
            backgroundColor: 'white',
            grid: { top: 60, right: 20, bottom: 60, left: 80 },
            xAxis: {
                type: 'value',
                name: 'Current density (mA cm⁻²)',
                nameLocation: 'middle',
                nameGap: 30,
                min: 0,
                max: 850,
                interval: 100,
                axisLabel: { color: 'black', fontSize: 12 },
                axisLine: { lineStyle: { color: 'black' } },
                axisTick: { alignWithLabel: true }
            },
            yAxis: {
                type: 'value',
                name: 'Cell voltage (V)',
                nameLocation: 'middle',
                nameGap: 40,
                nameTextStyle: { color: 'black', fontSize: 14 },
                min: -2.8, // Visual top is -2.8
                max: -1.8, // Visual bottom is -1.8
                inverse: true, // Invert axis so -1.8 is at the bottom, -2.8 at the top
                interval: 0.2,
                axisLabel: { color: 'black', fontSize: 12 },
                axisLine: { lineStyle: { color: 'black' } },
                splitLine: { show: false }
            },
            legend: {
                data: ['IrOx', 'NiFe-B'],
                left: 'left',
                top: 20,
                orient: 'vertical',
                textStyle: { fontSize: 12 }
            },
            series: series,
            graphic: [
                {
                    type: 'text',
                    left: 10,
                    top: 10,
                    style: {
                        text: 'a',
                        font: 'bold 24px Arial',
                        fill: 'black'
                    }
                }
            ]
        };

        chart.setOption(option);
    </script>
</body>
</html>
