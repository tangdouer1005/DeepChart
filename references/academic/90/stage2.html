        "LN9 1315BL": [

        "LN9 1358IR": [
            2.720926327731109,

            2.641496941582993,
            4.853379099245915,
            2.62824603612458,
            3.047416468169401
        ]
    },
    "p_values": {
        "LN1 18IL": 0.091610521392838,
        "LN7 1112AR": 3.2727e-11,
        "LN7 1120BL": 4e-15,
        "LN7 1134BL": 2.9e-13,
        "LN8 1194BR": 1.81e-13,
        "LN8 1198AR": 1.7e-14,
        "LN8 1205BL": 0.000454712621187,
        "LN9 1315BL": 0.000273075453655,
        "LN9 1358IR": 4.998e-11
    }
};

        // 2. Process Data
        const groupNames = [
            "B16-F0", "LN1 18IL", "LN7 1112AR", "LN7 1120BL", "LN7 1134BL", 
            "LN8 1194BR", "LN8 1198AR", "LN8 1205BL", "LN9 1315BL", "LN9 1358IR"
        ];
        
        const groupsData = groupNames.map(name => jsonData.group_data[name] || []);
        const pValueMap = jsonData.p_values;

        // Calculate Stats
        const processedData = groupNames.map((name, i) => {
            const data = groupsData[i];
            const mean = data.reduce((a, b) => a + b, 0) / data.length;
            const std = Math.sqrt(data.map(x => Math.pow(x - mean, 2)).reduce((a, b) => a + b, 0) / (data.length - 1));
            return {
                name: name,
                displayName: name.replace(/ /g, '-') ,
                data: data,
                mean: mean,
                std: std,
                colorType: name.includes('B16-F0') ? 'gray' : (name.includes('LN1') ? 'pink' : 'green')
            };
        });

        // 3. ECharts Setup
        const chartDom = document.getElementById('chart-container');
        const myChart = echarts.init(chartDom);

        const barData = [];
        const errorBarData = [];
        const scatterData = [];
        const pValueAnnotations = [];

        processedData.forEach((group, index) => {
            // 1. Bar Data
            let barColor = '#8CC686'; // Green
            let dotColor = '#2E7D32'; // Dark Green
            
            if (group.colorType === 'gray') {
                barColor = '#D9D9D9';
                dotColor = 'black';
            } else if (group.colorType === 'pink') {
                barColor = '#EDA6E6';
                dotColor = 'black';
            }

            barData.push({
                value: group.mean,
                itemStyle: {
                    color: barColor,
                    borderColor: 'black',
                    borderWidth: 1
                }
            });

            // 2. Error Bar Data
            errorBarData.push([index, group.mean, group.std]);

            // 3. Scatter Data (Jitter)
            group.data.forEach(val => {
                let u = 0, v = 0;
                while(u === 0) u = Math.random(); 
                while(v === 0) v = Math.random();
                let num = Math.sqrt( -2.0 * Math.log( u ) ) * Math.cos( 2.0 * Math.PI * v );
                let jitter = num * 0.08; 
                if (jitter > 0.2) jitter = 0.2;
                if (jitter < -0.2) jitter = -0.2;

                scatterData.push({
                    value: [index + jitter, val],
                    itemStyle: { color: dotColor }
                });
            });

            // 4. P-Value Annotation
            if (pValueMap[group.name] !== undefined) {
                const p = pValueMap[group.name];
                let pText = '';
                
                if (p < 0.001) {
                    const exponent = Math.floor(Math.log10(p));
                    let mantissa = p / Math.pow(10, exponent);
                    let mantissaStr = Math.abs(mantissa - Math.round(mantissa)) < 0.05 ? Math.round(mantissa) : mantissa.toFixed(1);
                    pText = `P = ${mantissaStr} × 10^{${exponent}}`;
                } else {
                     const digits = -Math.floor(Math.log10(p));
                     pText = `P = ${p.toFixed(digits)}`;
                }
                
                const maxDataVal = Math.max(...group.data, group.mean + group.std);
                
                pValueAnnotations.push({
                    xIndex: index,
                    yVal: maxDataVal + 0.5,
                    text: pText
                });
            }
        });

        const option = {
            backgroundColor: 'white',
            grid: {
                top: '15%',
                bottom: '20%',
                left: '10%',
                right: '5%',
                containLabel: false
            },
            xAxis: {
                type: 'category',
                data: processedData.map(d => d.displayName),
                axisLine: {
                    show: true,
                    lineStyle: { color: 'black' }
                },
                axisLabel: {
                    color: 'black',
                    fontSize: 12,
                    rotate: 45,
                    margin: 10,
                    align: 'right',
                    verticalAlign: 'top'
                },
                axisTick: {
                    alignWithLabel: true,
                    lineStyle: { color: 'black' }
                }
            },
            yAxis: {
                type: 'value',
                name: 'Relative FSP1 levels',
                nameLocation: 'middle',
                nameGap: 50,
                nameTextStyle: {
                    color: 'black',
                    fontSize: 14
                },
                min: 0,
                max: 10, 
                interval: 1,
                axisLine: {
                    show: false
                },
                axisLabel: {
                    color: 'black',
                    fontSize: 12
                },
                splitLine: { show: false }
            },
            series: [
                {
                    type: 'bar',
                    data: barData,
                    barWidth: '60%',
                    z: 1
                },
                {
                    type: 'custom',
                    renderItem: function (params, api) {
                        const xValue = api.value(0);
                        const meanValue = api.value(1);
                        const stdValue = api.value(2);
                        
                        const pointStart = api.coord([xValue, meanValue - stdValue]);
                        const pointEnd = api.coord([xValue, meanValue + stdValue]);
                        const capWidth = 10; 

                        return {
                            type: 'group',
                            children: [
                                {
                                    type: 'line',
                                    shape: { x1: pointStart[0], y1: pointStart[1], x2: pointEnd[0], y2: pointEnd[1] },
                                    style: { stroke: 'black', lineWidth: 1.5 }
                                },
                                {
                                    type: 'line',
                                    shape: { x1: pointStart[0] - capWidth / 2, y1: pointStart[1], x2: pointStart[0] + capWidth / 2, y2: pointStart[1] },
                                    style: { stroke: 'black', lineWidth: 1.5 }
                                },
                                {
                                    type: 'line',
                                    shape: { x1: pointEnd[0] - capWidth / 2, y1: pointEnd[1], x2: pointEnd[0] + capWidth / 2, y2: pointEnd[1] },
                                    style: { stroke: 'black', lineWidth: 1.5 }
                                }
                            ]
                        };
                    },
                    data: errorBarData,
                    z: 3
                },
                {
                    type: 'scatter',
                    data: scatterData,
                    symbolSize: 8,
                    z: 2
                }
            ],
            graphic: [
                {
                    type: 'text',
                    left: '2%',
                    top: '2%',
                    style: {
                        text: 'g',
                        fontSize: 24,
                        fontWeight: 'bold',
                        fill: 'black'
                    }
                }
            ]
        };

        // Add P-value annotations
        option.series.push({
            type: 'custom',
            renderItem: function (params, api) {
                const xIdx = api.value(0);
                const yPos = api.value(1);
                const pTextIdx = api.value(2);
                
                const point = api.coord([xIdx, yPos]);
                const textObj = pValueAnnotations[pTextIdx];
                let formattedText = textObj.text.replace(/\^\{(\-?\d+)\}/, '{sup|$1}');
                
                return {
                    type: 'text',
                    x: point[0],
                    y: point[1],
                    rotation: Math.PI / 2, // 90 degrees (reading top-to-bottom or bottom-to-top depending on orientation)
                                         // Standard for this type of plot in papers is often reading Bottom-to-Top (CCW).
                                         // -Math.PI/2 is CCW.
                                         // Let's stick to Python's likely default which is text drawn vertically.
                                         // If we want it to read from bottom to top, use -Math.PI / 2.
                    style: {
                        text: formattedText,
                        fontSize: 10,
                        fill: 'black',
                        textAlign: 'left',
                        textVerticalAlign: 'middle',
                        rich: {
                            sup: {
                                fontSize: 8,
                                verticalAlign: 'top'
                            }
                        }
                    }
                };
            },
            data: pValueAnnotations.map((item, idx) => [item.xIndex, item.yVal, idx]),
            z: 4
        });

        // Add the top significance line
        option.series.push({
            type: 'custom',
            renderItem: function (params, api) {
                const startPt = api.coord([2, 8.5]);
                const endPt = api.coord([9, 8.5]);
                
                return {
                    type: 'group',
                    children: [
                        {
                            type: 'line',
                            shape: { x1: startPt[0], y1: startPt[1], x2: endPt[0], y2: endPt[1] },
                            style: { stroke: 'black', lineWidth: 1 }
                        },
                        {
                            type: 'text',
                            x: (startPt[0] + endPt[0]) / 2,
                            y: startPt[1] - 5,
                            style: {
                                text: 'P < 1 × 10{sup|-15}',
                                fontSize: 12,
                                textAlign: 'center',
                                fill: 'black',
                                rich: {
                                    sup: { fontSize: 9, verticalAlign: 'top' }
                                }
                            }
                        }
                    ]
                };
            },
            data: [[0]]
        });

        myChart.setOption(option);
    </script>
