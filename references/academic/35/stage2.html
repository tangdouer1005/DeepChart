        const pValues = pValueData.p_values;
        const columns = pValueData.columns;
        
        // Prepare Heatmap Data (Upper Triangle + Diagonal)
        const heatmapData = [];
        for (let i = 0; i < columns.length; i++) {
            for (let j = i; j < columns.length; j++) {
                let val = pValues[i][j];
                // Diagonal should be handled as special or just data.
                // In Python script: if i==j: facecolor grey, text "--".
                // In ECharts, we can map diagonal to a specific value or handle in formatter/visualMap.
                // We'll pass the raw value.
                heatmapData.push([j, i, val]);
            }
        }

        const chart = echarts.init(document.getElementById('chart-container'));

        // Reuse rich labels from previous if possible, but keys might differ slightly.
        const richLabels = {
            'Li+ binding energy': 'Eb Li+ binding energy', // Updated key
            'Ionic conductivity': 'σ_ion ionic conductivity', // Updated key
            'Initial R_interface': 'Initial R_interface\ninitial interfacial resistance',
            'eta_15th': 'η_15th Li||Li overpotential at 15th cycle',
            'J_crit': 'J_crit. critical current density',
            'F%': 'F% F1s atomic percentage',
            'C%': 'C% C1s atomic percentage',
            'O%': 'O% O1s atomic percentage',
            'R_interface': 'R_interface interfacial resistance at 15th cycle'
        };

        const xLabels = columns;
        const yLabels = xLabels.map(label => richLabels[label] || label);

        const option = {
            backgroundColor: 'white',
            grid: { 
                top: 200, 
                bottom: 20, 
                left: 320, 
                right: 50 
            },
            xAxis: {
                type: 'category',
                data: xLabels,
                position: 'top',
                axisLabel: { 
                    rotate: 90, 
                    align: 'right', 
                    verticalAlign: 'bottom',
                    color: 'black', 
                    fontSize: 12,
                    formatter: function(value) {
                        if(value === 'Ionic conductivity') return 'σ_ion'; // Updated
                        if(value === 'eta_15th') return 'η_15th';
                        if(value === 'Li+ binding energy') return 'Eb'; // Updated
                        if(value === 'J_crit') return 'J_crit.';
                        return value;
                    }
                },
                axisTick: { show: false },
                axisLine: { show: false },
                splitArea: { show: false }
            },
            yAxis: {
                type: 'category',
                data: yLabels,
                inverse: true,
                axisLabel: { 
                    rotate: 0, 
                    align: 'right',
                    color: 'black', 
                    fontSize: 12
                },
                axisTick: { show: false },
                axisLine: { show: false },
                splitArea: { show: false }
            },
            visualMap: {
                type: 'piecewise',
                orient: 'vertical',
                left: 20,
                bottom: 0,
                top: 'center',
                itemWidth: 20,
                itemHeight: 20,
                pieces: [
                    {gt: 0.1, label: '> 0.1', color: '#FFFFFF'},
                    {gt: 0.01, lte: 0.1, label: '0.01 - 0.1', color: '#DEEBF7'},
                    {gt: 0.001, lte: 0.01, label: '0.001 - 0.01', color: '#C6DBEF'},
                    {gt: 0.0001, lte: 0.001, label: '1e-4 - 1e-3', color: '#9ECAE1'},
                    {gt: 0.00001, lte: 0.0001, label: '1e-5 - 1e-4', color: '#6BAED6'},
                    {gt: 0.000001, lte: 0.00001, label: '1e-6 - 1e-5', color: '#4292C6'},
                    {gt: 0.0000001, lte: 0.000001, label: '1e-7 - 1e-6', color: '#2171B5'},
                    {lte: 0.0000001, label: '< 1e-7', color: '#084594'}
                ],
                textStyle: { color: 'black' },
                showLabel: true // Show labels defined in pieces
            },
            series: [{
                type: 'heatmap',
                data: heatmapData,
                label: {
                    show: true,
                    formatter: function(params) {
                        const val = params.value[2];
                        const xIndex = params.value[0];
                        const yIndex = params.value[1];
                        
                        // Diagonal handling
                        if (xIndex === yIndex) {
                            return '--';
                        }
                        
                        if (isNaN(val)) return '';
                        
                        if (val < 0.01) return '<0.01';
                        return val.toFixed(2);
                    },
                    color: 'inherit', // Should contrast automatically? No, ECharts doesn't always do this well.
                    // We need to set color dynamically or based on value.
                    // Since we can't easily set color callback here for text color in ECharts < 5.0 (check version), 
                    // we might need to rely on visualMap text color or fixed color.
                    // Python script sets text color based on background.
                    // Dark background -> White text. Light background -> Black text.
                    // 0.0001 and below are darkish.
                },
                itemStyle: {
                    borderColor: 'white',
                    borderWidth: 1
                }
            }],
            graphic: [
                { 
                    type: 'text', 
                    left: 10, 
                    top: 10, 
                    style: { text: 'b', font: 'bold 30px Arial', fill: 'black' } 
                },
                {
                    type: 'text',
                    left: 20, 
                    top: '85%', // Above visualMap roughly
                    style: { 
                        text: 'P value', 
                        fill: 'black', 
                        fontSize: 14 
                    }
                }
            ]
        };
        
        // Manual color correction for labels if possible
        // ECharts label color callback available?
        // In recent versions yes.
        option.series[0].label.color = function(params) {
             const val = params.value[2];
             const xIndex = params.value[0];
             const yIndex = params.value[1];
             if (xIndex === yIndex) return 'black';
             if (val <= 0.0001) return 'white';
             return 'black';
        };
        
        // Handle Diagonal Color Manually
        // We can't easily override itemStyle color per data point in heatmap without using data object.
        // Let's map data to objects.
        option.series[0].data = heatmapData.map(item => {
            const x = item[0];
            const y = item[1];
            const val = item[2];
            if (x === y) {
                return {
                    value: [x, y, val],
                    itemStyle: { color: '#808080' },
                    label: { color: 'black' }
                };
            }
            return [x, y, val];
        });

        chart.setOption(option);
