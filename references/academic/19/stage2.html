            "model_labels": {
                "ProvGigaPath": "Giga-\nPath",
                "DinoSSLPath": "Dino-\nSSLPath",

                "Panakeia*": "Pana-\nkeia*",
                "CTransPath": "CTrans-\nPath",
                "BiomedCLIP": "Biomed-\nCLIP"
            }
        };
        
                const orderedModels = chartData.order;
                const groups = ['Above 0.7', '0.6 - 0.7', 'Below 0.6'];
                const tasks = ['Morphology', 'Biomarker', 'Prognosis'];
                
                const groupColors = {
                    'Above 0.7': '#331052',
                    '0.6 - 0.7': '#7A4B85',
                    'Below 0.6': '#D8BFD8'
                };
                
                const series = [];
                const gridRows = 3;
                const gridCols = 5;
                
                orderedModels.forEach((model, index) => {
                    const modelSummary = chartData.summary.find(s => s.Model === model);
                    const modelBreakdown = chartData.breakdown.find(b => b.Model === model);
                    
                    if (!modelSummary || !modelBreakdown) return;
                    
                    const data = [];
                    
                    groups.forEach((g, gIdx) => {
                        const gColor = groupColors[g];
                        const gValue = modelSummary[g];
                        
                        const children = [];
                        tasks.forEach((t, tIdx) => {
                            const key = `('${g}', '${t}')`;
                            const val = modelBreakdown[key];
                            if (val > 0) {
                                children.push({
                                    name: t,
                                    value: val,
                                    itemStyle: {
                                        color: gColor,
                                        opacity: tIdx === 0 ? 1 : (tIdx === 1 ? 0.7 : 0.4)
                                    },
                                    label: { show: val > 1, formatter: '{c}', position: 'inside', fontSize: 8, color: 'white' }
                                });
                            }
                        });
                        
                        if (gValue > 0) {
                            data.push({
                                name: g,
                                value: gValue,
                                itemStyle: { color: gColor },
                                label: { show: true, formatter: '{c}', position: 'inside', fontWeight: 'bold', fontSize: 10, color: gValue > 5 ? 'white' : 'black' },
                                children: children
                            });
                        }
                    });
                    
                    const row = Math.floor(index / gridCols);
                    const col = index % gridCols;
                    const cx = (col + 0.5) * (100 / gridCols) + '%';
                    const cy = (row + 0.5) * (100 / gridRows) + '%';
        
                    series.push({
                        type: 'sunburst',
                        data: data,
                        center: [cx, cy],
                        radius: ['6%', '16%'], 
                        label: { rotate: 'radial' },
                        itemStyle: {
                            borderColor: '#fff',
                            borderWidth: 1
                        }
                    });
                });
        
                const chart = echarts.init(document.getElementById('chart-container'));
        
                const option = {
                    backgroundColor: 'white',
                    series: series,
                    graphic: orderedModels.map((model, index) => {
                        const row = Math.floor(index / gridCols);
                        const col = index % gridCols;
                        const cx = (col + 0.5) * (1000 / gridCols); 
                        const cy = (row + 0.5) * (600 / gridRows);
                        
                        let text = model;
                        if (chartData.model_labels && chartData.model_labels[model]) {
                            text = chartData.model_labels[model];
                        } else if (model.length > 8) {
                            text = model.slice(0,6) + '..';
                        }
        
                        return {
                            type: 'text',
                            left: cx,
                            top: cy,
                            style: {
                                text: text,
                                textAlign: 'center',
                                textVerticalAlign: 'middle',
                                font: '10px Arial',
                                fill: 'black'
                            }
                        };
                    }).concat([{ type: 'text', left: 20, top: 20, style: { text: 'f', font: 'bold 24px Arial' } }])
                };
        
                chart.setOption(option);
