        const chart = echarts.init(document.getElementById('chart-container'));

        const colorPiggy = '#8c5e4d';
        const colorSomatic = '#da7cb8';
        const colorTotal = '#866bb1';
        const sizeFactor = 6.5;

        function getSymbolSize(val) {
            // Area = val * sizeFactor
            // Diameter = 2 * sqrt(Area / PI)
            const area = val * sizeFactor;
            return 2 * Math.sqrt(area / Math.PI);
        }

        const option = {
            backgroundColor: 'white',
            grid: {
                top: 80,
                bottom: 50,
                left: 200, // Space for labels
                right: 50
            },
            xAxis: {
                name: '-log₁₀[q value]',
                nameLocation: 'middle',
                nameGap: 30,
                nameTextStyle: { fontSize: 12, color: 'black' },
                type: 'value',
                min: -2,
                max: 42,
                interval: 10,
                splitLine: { 
                    show: true,
                    lineStyle: { color: 'black', width: 0.5 }
                },
                axisLine: { show: true, lineStyle: { color: 'black' } },
                axisLabel: { color: 'black' },
                axisTick: { show: true, lineStyle: { color: 'black' } }
            },
            yAxis: {
                type: 'category',
                data: data.map(d => d.display_label),
                inverse: true, // Top to bottom
                axisLine: { show: false },
                axisTick: { show: false },
                axisLabel: {

                    fontSize: 11,
                    margin: 10
                },
                splitLine: { show: false }
            },
            series: [
                // Horizontal lines (using custom series or just lines)
                {
                    type: 'custom',
                    renderItem: function (params, api) {
                        const yValue = api.value(1);
                        const start = api.coord([0, yValue]);
                        const end = api.coord([api.value(0), yValue]);
                        return {
                            type: 'line',
                            shape: {
                                x1: start[0], y1: start[1],
                                x2: end[0], y2: end[1]
                            },
                            style: {

                                lineWidth: 0.8
                            }

                    z: 1,

                    data: data.map((item, index) => [item.sum_abs_log10_q_value, index, item.total_marker_size_binned_q]),

                    itemStyle: { color: colorTotal, opacity: 1 },
                    z: 2
