        // ---------------------------------------------------------
        // 2. Data Processing
        // ---------------------------------------------------------
        
        // Define colors
        const colors = {
            'Traffic': '#A89956',
            'Urban': '#6FA057',
            'Industrial': '#D98695',
            'Suburban': '#6DA6D4',
            'Rural': '#C68BD3',
            'Default': '#808080'
        };
        const siteOrder = ['Traffic', 'Urban', 'Industrial', 'Suburban', 'Rural'];

        // Get total count for width calculation
        const pmSizes = ['PM10', 'PM2.5', 'PM1'];
        const pmCounts = pmSizes.map(pm => sourceData[pm].length);
        const totalCount = pmCounts.reduce((a, b) => a + b, 0);

        // ---------------------------------------------------------
        // 3. ECharts Configuration
        // ---------------------------------------------------------
        
        const chartDom = document.getElementById('chart');
        const myChart = echarts.init(chartDom);
        var option;

        // --- Grid Layout Calculation ---
        // We want strict bar-width consistency across subplots.
        // We will disable containLabel and handle margins manually.
        
        const marginLeft = 8; // % for Left Y Axis
        const marginRight = 6; // % for Right Y Axis
        const gap = 1; // % Gap between subplots
        const bottomMargin = '25%'; // Space for X labels
        
        // Calculate total available width for bars
        const totalGapWidth = gap * (pmSizes.length - 1);
        const availableWidth = 100 - marginLeft - marginRight - totalGapWidth;
        
        let currentLeft = marginLeft;
        
        const gridDefs = [];
        const xAxisDefs = [];
        const yAxisDefs = [];
        const seriesDefs = [];
        const titleDefs = [];

        // Custom render function for Error Bars
        function renderErrorBar(params, api) {
            var xValue = api.value(0); // Index x
            var highPoint = api.coord([xValue, api.value(1)]); // High
            var lowPoint = api.coord([xValue, api.value(2)]);  // Low
            var halfWidth = api.size([1, 0])[0] * 0.15; // Width of error bar cap
            var style = api.style({
                stroke: 'gray',
                fill: null,
                lineWidth: 1
            });
            return {
                type: 'group',
                children: [{
                    type: 'line', // Top cap
                    shape: {
                        x1: highPoint[0] - halfWidth, y1: highPoint[1],
                        x2: highPoint[0] + halfWidth, y2: highPoint[1]
                    },
                    style: style
                }, {
                    type: 'line', // Vertical line
                    shape: {
                        x1: highPoint[0], y1: highPoint[1],
                        x2: lowPoint[0], y2: lowPoint[1]
                    },
                    style: style
                }, {
                    type: 'line', // Bottom cap
                    shape: {
                        x1: lowPoint[0] - halfWidth, y1: lowPoint[1],
                        x2: lowPoint[0] + halfWidth, y2: lowPoint[1]
                    },
                    style: style
                }]
            };
        }

        pmSizes.forEach((pm, idx) => {
            // Get Data from JSON
            let subset = [...sourceData[pm]]; // copy to sort
            
            // Re-apply sorting to ensure consistency even if JSON order varies
            subset.sort((a, b) => {
                const idxA = siteOrder.indexOf(a.Site_type);
                const idxB = siteOrder.indexOf(b.Site_type);
                if (idxA !== idxB) return idxA - idxB;
                const topoA = (a.Site_topography === 'Valley') ? 0 : 1;
                const topoB = (b.Site_topography === 'Valley') ? 0 : 1;
                if (topoA !== topoB) return topoA - topoB;
                return a.Station.localeCompare(b.Station);
            });
            
            const count = subset.length;
            const xLabels = subset.map(d => d.Station);
            
            // Calculate dynamic width
            const gridWidth = (count / totalCount) * availableWidth;

            // Grid Definition
            gridDefs.push({
                left: currentLeft + '%',
                width: gridWidth + '%',
                bottom: bottomMargin,
                containLabel: false // Critical for alignment
            });
            
            // Titles (Positioned above grid)
            const midPoint = currentLeft + (gridWidth / 2);
            let titleText = pm;
            if (pm === 'PM10') {
                 // Using 'a' label convention
                 titleText = '{a|a} ' + pm;
            }
            titleDefs.push({
                text: titleText,
                left: midPoint + '%',
                top: '5%',
                textAlign: 'center',
                textStyle: {
                    fontSize: 14,
                    rich: {
                        a: { fontSize: 20, fontWeight: 'bold' }
                    }
                }
            });

            // Series Data
            const barData = [];
            const errorData = [];
            const scatterData = [];
            
            subset.forEach((d, i) => {
                const color = colors[d.Site_type] || colors['Default'];
                
                let itemStyle = { color: color };
                if (d.Site_topography === 'Valley') {
                     itemStyle.decal = {
                        symbol: 'rect',
                        symbolSize: 1,
                        rotation: Math.PI / 4,
                        color: 'white',
                        dashArrayX: [1, 0],
                        dashArrayY: [2, 5],
                        opacity: 0.6
                    };
                }

                barData.push({
                    value: d.OP_AA_v_mean,
                    itemStyle: itemStyle
                });

                // Error Data: [index, high, low]
                const high = d.OP_AA_v_mean + d.OP_AA_v_SD;
                const low = Math.max(0, d.OP_AA_v_mean - d.OP_AA_v_SD);
                errorData.push([i, high, low]);
                
                // Scatter Data: [index, value]
                scatterData.push([i, d.PM_mass_mean]);
            });

            // X-Axis
            xAxisDefs.push({
                type: 'category',
                gridIndex: idx,
                data: xLabels,
                axisLabel: {
                    rotate: 90,
                    interval: 0, 
                    fontSize: 10,
                    // Ensure labels don't overflow the bottom margin
                    overflow: 'truncate',
                    width: 150
                },
                axisTick: { alignWithLabel: true }
            });

            // Y-Axes
            // Left (Bars)
            yAxisDefs.push({
                type: 'value',
                gridIndex: idx,
                min: 0, max: 7,
                position: 'left',
                axisLine: { show: (idx === 0) }, // Only line for first
                axisTick: { show: (idx === 0) },
                axisLabel: { show: (idx === 0) },
                name: (idx === 0) ? 'OP_v^AA (nmol AA min^-1 m^-3)' : '',
                nameLocation: 'middle',
                nameGap: 40,
                splitLine: { show: false }
            });
            // Right (Scatter)
            yAxisDefs.push({
                type: 'value',
                gridIndex: idx,
                min: 0, max: 70,
                position: 'right',
                axisLine: { show: (idx === 2) }, // Only line for last
                axisTick: { show: (idx === 2) },
                axisLabel: { show: (idx === 2) },
                name: (idx === 2) ? 'PM (µg m^-3)' : '',
                nameLocation: 'middle',
                nameGap: 40,
                nameRotate: -90,
                splitLine: { show: false }
            });

            // Series
            // 1. Bar
            seriesDefs.push({
                name: 'OP AA',
                type: 'bar',
                xAxisIndex: idx,
                yAxisIndex: idx * 2,
                data: barData,
                z: 2
            });

            // 2. Error Bar
            seriesDefs.push({
                type: 'custom',
                renderItem: renderErrorBar,
                xAxisIndex: idx,
                yAxisIndex: idx * 2,
                data: errorData,
                z: 3
            });

            // 3. Scatter
            seriesDefs.push({
                name: 'PM mass',
                type: 'scatter',
                xAxisIndex: idx,
                yAxisIndex: idx * 2 + 1,
                data: scatterData,
                symbolSize: 8,
                itemStyle: {
                    color: 'black',
                    borderColor: 'white',
                    borderWidth: 1
                },
                z: 4
            });
            
            // Advance Left Position
            currentLeft += gridWidth + gap;
        });

        // Dummy Legend Items
        siteOrder.forEach(type => {
            seriesDefs.push({
                name: type,
                type: 'bar',
                data: [],
                barGap: '-100%',
                itemStyle: { color: colors[type] }
            });
        });
        
        seriesDefs.push({
            name: 'Valley',
            type: 'bar',
            data: [],
            barGap: '-100%',
            itemStyle: {
                color: 'gray',
                decal: {
                    symbol: 'rect',
                    symbolSize: 1,
                    rotation: Math.PI / 4,
                    color: 'white',
                    dashArrayX: [1, 0],
                    dashArrayY: [2, 5],
                    opacity: 0.6
                }
            }
        });

        option = {
            backgroundColor: '#fff',
            title: titleDefs,
            legend: {
                data: [...siteOrder, 'Valley', 'PM mass'],
                top: '2%',
                selectedMode: false
            },
            grid: gridDefs,
            xAxis: xAxisDefs,
            yAxis: yAxisDefs,
            series: seriesDefs,
            animation: false
        };

        myChart.setOption(option);
        
        // Handle Resize
        window.addEventListener('resize', () => {
            myChart.resize();
        });

    </script>
