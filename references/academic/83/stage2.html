        const df = sourceData;
        
        const colors = {
            'Cold': '#7ea6c9',
            'Warm': '#cc9a52'
        };
        
        const pmOrder = ['PM10', 'PM2.5', 'PM1'];
        const typeOrder = ['Traffic', 'Urban', 'Industrial', 'Suburban', 'Rural'];
        const seasons = ['Cold', 'Warm'];

        // ECharts doesn't support easy multi-panel like Matplotlib.
        // We can simulate it using multiple grids.
        // Layout: 3 horizontal grids.
        
        const grids = [
            { left: '7%', top: '15%', width: '28%', bottom: '15%' },
            { left: '39%', top: '15%', width: '28%', bottom: '15%' },
            { left: '71%', top: '15%', width: '28%', bottom: '15%' }
        ];
        
        const titles = [
            { text: 'PM₁₀', left: '21%', top: '5%', textAlign: 'center' },
            { text: 'PM₂.₅', left: '53%', top: '5%', textAlign: 'center' },
            { text: 'PM₁', left: '85%', top: '5%', textAlign: 'center' }
        ];
        
        const xAxes = [];
        const yAxes = [];
        const series = [];
        const dataset = [];

        pmOrder.forEach((pm, gridIndex) => {
            const subset = df.filter(d => d.PM_size === pm);
            const presentTypes = typeOrder.filter(t => subset.some(d => d.Type === t));
            
            xAxes.push({
                gridIndex: gridIndex,
                type: 'category',
                data: presentTypes,
                axisTick: { show: false },
                axisLabel: { interval: 0, rotate: 0, fontSize: 11 }
            });
            
            yAxes.push({
                gridIndex: gridIndex,
                type: 'value',
                min: 0,
                max: 12,
                interval: 2,
                name: gridIndex === 0 ? 'OPᵛᴬᴬ (nmolAA min⁻¹ m⁻³)' : '',
                nameLocation: 'middle',
                nameGap: 40,
                axisLabel: { show: gridIndex === 0 }, // Only show labels on first plot
                splitLine: { show: true, lineStyle: { type: 'dashed' } }
            });
            
            seasons.forEach(season => {
                const seasonData = [];
                presentTypes.forEach(type => {
                    const row = subset.find(d => d.Type === type && d.Season === season);
                    if (row) {
                        const iqr = row.OP_v_AA_Q3 - row.OP_v_AA_Q1;
                        const whislo = Math.max(0, row.OP_v_AA_Q1 - 1.5 * iqr);
                        const whishi = row.OP_v_AA_Q3 + 1.5 * iqr;
                        seasonData.push([whislo, row.OP_v_AA_Q1, row.OP_v_AA_median, row.OP_v_AA_Q3, whishi]);
                    } else {
                        seasonData.push([]); // Empty
                    }
                });
                
                series.push({
                    name: season,
                    type: 'boxplot',
                    xAxisIndex: gridIndex,
                    yAxisIndex: gridIndex,
                    data: seasonData,
                    itemStyle: {
                        color: colors[season],
                        borderColor: 'black'
                    },
                    boxWidth: '35%'
                });
            });
        });

        const chart = echarts.init(document.getElementById('chart-container'));

        const option = {
            backgroundColor: 'white',
            grid: grids,
            title: titles,
            xAxis: xAxes,
            yAxis: yAxes,
            legend: {
                data: ['Cold', 'Warm'],
                right: '5%',
                top: '5%',
                itemWidth: 15,
                itemHeight: 10
            },
            series: series,
            graphic: [
                {
                    type: 'text',
                    left: '2%',
                    top: '2%',
                    style: {
                        text: 'a)',
                        font: 'bold 16px Arial'
                    }
                }
            ]
        };

        chart.setOption(option);
    </script>
