<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nature Chart Reproduction</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts-stat/dist/ecStat.min.js"></script>
    <style>
        body { margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #ffffff; font-family: Arial, sans-serif; }
        #chart-container { width: 500px; height: 400px; }
    </style>
</head>
<body>
    <div id="chart-container"></div>
    <script>
        // Data parsed from 61.json
        const chartData = {
    "NT": {
        "x": [
            -5.0,
            -6.0,
            -7.0,
            -8.0,
            -9.0,
            -10.0,
            -11.0,
            -12.0
        ],
        "y": [
            -0.0125470793844,
            -0.003947249835093004,
            -0.0252488347994,
            -0.0057359557232999955,
            -0.01345463016700001,
            -0.002402660706389999,
            -0.007839227384,
            0.0
        ],
        "err": [
            0.021018533530380974,
            0.016124274366464984,
            0.02020832852479565,
            0.02056291859997351,
            0.025724437100132596,
            0.012325554304643582,
            0.01300176856522546,
            0.0
        ]
    },
    "SR": {
        "x": [
            -4.0,
            -5.0,
            -6.0,
            -7.0,
            -8.0,
            -9.0,
            -10.0,
            -12.0
        ],
        "y": [
            -0.0211623172729,
            -0.009383598488999997,
            -0.025273554992500002,
            -0.017872331502,
            -0.026566947245699996,
            -0.027398907374000005,
            -0.0390528775349,
            0.0
        ],
        "err": [
            0.02090272311661118,
            0.023717298126883918,
            0.012940841395333694,
            0.012851992774390471,
            0.013861779384327534,
            0.008023035014041918,
            0.012387116206316483,
            0.0
        ]
    },
    "SBI": {
        "x": [
            -4.522878745280337,
            -5.0,
            -5.522878745280337,
            -6.0,
            -6.522878745280337,
            -7.0,
            -12.0
        ],
        "y": [
            -0.0029063533927000005,
            0.01873279872,
            -0.000634932389899999,
            0.0022514996223999993,
            -0.020950604573899998,
            -0.014051393995999997,
            0.0
        ],
        "err": [
            0.015539332737536965,
            0.010342889590110921,
            0.010621738487626846,
            0.009322664929773784,
            0.00769176044105665,
            0.008072591444834003,
            0.0
        ]
    },
    "PD": {
        "x": [
            -4.522878745280337,
            -5.0,
            -5.522878745280337,
            -6.0,
            -6.522878745280337,
            -7.0,
            -12.0
        ],
        "y": [
            0.04990363170222223,
            0.02363582441888889,
            -0.014865049081111109,
            -0.010221595180000003,
            0.0009614838007777785,
            -0.02215837370344444,
            0.0
        ],
        "err": [
            0.011827525483735385,
            0.011195441156080725,
            0.015308300486812717,
            0.015474566161686057,
            0.012870791602354768,
            0.008356306934849992,
            0.0
        ]
    }
};

        const series = [];
        const colors = ['#00008B', '#9400D3', '#FFA500', '#3CB371']; // Blue, Purple, Orange, Green
        const labels = ['NT', 'SR142948A', 'SBI-553', 'PD149163'];
        const keys = ['NT', 'SR', 'SBI', 'PD'];
        
        keys.forEach((key, idx) => {
            const sData = chartData[key];
            const data = sData.x.map((x, i) => [x, sData.y[i], sData.err[i]]).sort((a,b)=>a[0]-b[0]);
            
            const color = colors[idx];
            
            // Error bars
            series.push({
                type: 'custom',
                name: labels[idx],
                itemStyle: {
                    color: color,
                    borderWidth: 1.5
                },
                renderItem: function (params, api) {
                    const xValue = api.value(0);
                    const yValue = api.value(1);
                    const lowPoint = api.coord([xValue, yValue - api.value(2)]);
                    const highPoint = api.coord([xValue, yValue + api.value(2)]);
                    const style = api.style({
                        stroke: api.visual('color'),
                        fill: null
                    });
                    return {
                        type: 'group',
                        children: [
                            {
                                type: 'line',
                                shape: {
                                    x1: lowPoint[0], y1: lowPoint[1],
                                    x2: highPoint[0], y2: highPoint[1]
                                },
                                style: style
                            },
                            {
                                type: 'line',
                                shape: {
                                    x1: lowPoint[0] - 3, y1: lowPoint[1],
                                    x2: lowPoint[0] + 3, y2: lowPoint[1]
                                },
                                style: style
                            },
                            {
                                type: 'line',
                                shape: {
                                    x1: highPoint[0] - 3, y1: highPoint[1],
                                    x2: highPoint[0] + 3, y2: highPoint[1]
                                },
                                style: style
                            }
                        ]
                    };
                },
                data: data,
                z: 10
            });

            // Scatter points
            series.push({
                type: 'scatter',
                name: labels[idx],
                data: data,
                itemStyle: { color: color },
                symbolSize: 8,
                z: 10
            });

            // Spline line
            series.push({
                type: 'line',
                name: labels[idx],
                data: data.map(d => [d[0], d[1]]),
                smooth: true,
                showSymbol: false,
                lineStyle: {
                    color: color,
                    width: 2
                },
                z: 5
            });
        });

        const chart = echarts.init(document.getElementById('chart-container'));

        const option = {
            backgroundColor: 'white',
            grid: { top: 50, right: 50, bottom: 50, left: 60 },
            xAxis: {
                type: 'value',
                min: -13, max: -3,
                interval: 2,
                axisLine: { show: true, lineStyle: { color: 'black' } },
                axisLabel: { color: 'black', fontSize: 12 },
                axisTick: { show: true, inside: true },
                splitLine: { show: false }
            },
            yAxis: {
                type: 'value',
                min: -0.1, max: 0.6,
                axisLine: { show: true, lineStyle: { color: 'black' } },
                axisLabel: { color: 'black', fontSize: 12 },
                axisTick: { show: true, inside: true },
                splitLine: { show: false }
            },
            series: [
                ...series,
                {
                    type: 'line',
                    markLine: {
                        symbol: 'none',
                        lineStyle: { type: 'dashed', color: 'black', width: 1 },
                        data: [{ yAxis: 0 }]
                    }
                }
            ],
            graphic: [
                {
                    type: 'text',
                    left: 70,
                    top: 60,
                    style: {
                        text: 'GsS',
                        font: '14px Arial',
                        fill: 'black'
                    }
                }
            ]
        };

        chart.setOption(option);
    </script>
</body>
</html>
