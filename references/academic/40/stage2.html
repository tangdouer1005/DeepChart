<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nature Chart Reproduction</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
    <style>
        body { margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #ffffff; font-family: Arial, sans-serif; }
        #chart-container { width: 800px; height: 600px; }
    </style>
</head>
<body>
    <div id="chart-container"></div>
    <script>
        const jsonData = {
    "current_density": [
        50.0,
        100.0,
        200.0,
        300.0,
        400.0,
        500.0,
        600.0,
        700.0,
        800.0
    ],
    "h2_mean": [
        16.771927966191893,
        14.814297981506519,
        13.852531061860747,
        12.050206399740743,
        10.825938162006736,
        10.54433879863223,
        10.364167289972016,
        10.485043470697514,
        10.429931452079721
    ],
    "h2_std": [
        1.6797667896175967,
        0.9370386749422287,
        1.1134786451195535,
        1.0942799760084863,
        1.0004295797808365,
        0.9824642718728216,
        0.8611107135501045,
        0.8155472594198899,
        0.8283151590031996
    ],
    "c2h4_mean": [
        27.559576006950067,
        32.94189250240694,
        36.11477397251397,
        37.51408093861102,
        39.80412478044111,
        41.890146085318655,
        43.97722677735237,
        44.97808337672044,
        45.75844824649382
    ],
    "c2h4_std": [
        1.5907618501492724,
        2.4554508021013963,
        1.29873250024241,
        1.0498185834864042,
        1.2834104006043692,
        0.8025740239038405,
        0.6906469801756864,
        0.3535712887483668,
        0.055917796646560436
    ],
    "volt_mean": [
        -2.1933333333333334,
        -2.3033333333333332,
        -2.4333333333333336,
        -2.53,
        -2.62,
        -2.706666666666667,
        -2.776666666666667,
        -2.84,
        -2.9000000000000004
    ],
    "volt_std": [
        0.012472191289246403,
        0.012472191289246403,
        0.012472191289246561,
        0.016329931618554536,
        0.016329931618554536,
        0.016996731711975934,
        0.016996731711975934,
        0.014142135623730857,
        0.014142135623730857
    ]
};
        
        // Aggregate data
        const x = jsonData.current_density;
        const h2 = jsonData.h2_mean;
        const h2_err = jsonData.h2_std;
        const c2h4 = jsonData.c2h4_mean;
        const c2h4_err = jsonData.c2h4_std;
        const volt = jsonData.volt_mean;
        const volt_err = jsonData.volt_std;

        const chart = echarts.init(document.getElementById('chart-container'));

        const option = {
            backgroundColor: 'white',
            legend: {
                data: ['H₂', 'C₂H₄', 'Acetate', 'Ethanol', 'n-propanol'],
                top: 30,
                selectedMode: false,
                itemGap: 20
            },
            grid: { top: 100, bottom: 60, left: 60, right: 60 },
            xAxis: {
                type: 'category',
                data: x,
                name: 'Current density (mA cm⁻²)',
                nameLocation: 'middle',
                nameGap: 30,
                axisLabel: { color: 'black' },
                axisLine: { show: true, lineStyle: { color: 'black' } },
                splitLine: { show: false }
            },
            yAxis: [
                {
                    type: 'value',
                    name: 'FE (%)',
                    min: 0, max: 110,
                    position: 'left',
                    axisLabel: { color: 'black' },
                    axisLine: { show: true, lineStyle: { color: 'black' } },
                    splitLine: { show: false }
                },
                {
                    type: 'value',
                    name: 'Cell voltage (V)',
                    min: -3.0, max: -2.0,
                    inverse: true, // Chart shows -2 at bottom, -3 at top?
                    // Python code: set_ylim(-2.0, -3.0) -> This inverts it visually in matplotlib (top is smaller number, bottom is larger) or vice versa?
                    // Actually usually voltage negative means cathodic potential. Inverted scale often used.
                    // Python: -2.0 bottom, -3.0 top? Or normal math order?
                    // Matplotlib standard: ymin bottom, ymax top. 
                    // ylim(-2, -3) -> Bottom -2, Top -3.
                    // So Top is more negative.
                    // ECharts `inverse: true` means smaller values at top? No, `inverse: true` flips direction.
                    // Normal: small bottom, large top.
                    // Inverse: small top, large bottom.
                    // We want -3 at Top, -2 at Bottom.
                    // -3 is smaller than -2.
                    // So we want Smaller at Top. -> Inverse: True.
                    position: 'right',
                    axisLabel: { color: 'black' },
                    axisLine: { show: true, lineStyle: { color: 'black' } },
                    splitLine: { show: false }
                }
            ],
            series: [
                {
                    name: 'H₂',
                    type: 'bar',
                    stack: 'FE',
                    data: h2,
                    itemStyle: { color: '#BDC6D9' },
                    barWidth: '50%'
                },
                {
                    name: 'C₂H₄',
                    type: 'bar',
                    stack: 'FE',
                    data: c2h4,
                    itemStyle: { color: '#7087B0' },
                    barWidth: '50%'
                },
                // Missing data placeholders for legend
                { name: 'Acetate', type: 'bar', stack: 'FE', data: [], itemStyle: { color: '#4E668C' } },
                { name: 'Ethanol', type: 'bar', stack: 'FE', data: [], itemStyle: { color: '#D9ADA7' } },
                { name: 'n-propanol', type: 'bar', stack: 'FE', data: [], itemStyle: { color: '#B36855' } },
                
                // Voltage Line
                {
                    name: 'Voltage',
                    type: 'line',
                    yAxisIndex: 1,
                    data: volt,
                    symbol: 'circle',
                    symbolSize: 8,
                    itemStyle: { color: 'white', borderColor: '#8D564A', borderWidth: 2 },
                    lineStyle: { color: '#8D564A', width: 1 },
                    showSymbol: true
                },
                
                // Error bars (Custom)
                // H2 Error
                {
                    type: 'custom',
                    renderItem: function (params, api) {
                        const x = api.value(0);
                        const val = api.value(1); // h2 mean
                        const err = h2_err[params.dataIndex];
                        
                        const top = api.coord([x, val + err]);
                        const bottom = api.coord([x, val - err]);
                        // Center is api.coord([x, val])
                        // Note: Because it's stacked, the bar top is at 'val'.
                        // Wait, stacked bars error bars usually go from Top of bar?
                        // Python code: yerr=h2_std. Centered at mean?
                        // Yes, standard error bar is mean +/- std.
                        // But for stacked bars, it's tricky. Python matplotlib draws error relative to the segment top.
                        // Here H2 is bottom segment. So it's fine.
                        
                        const style = api.style({ stroke: 'black', lineWidth: 1 });
                        
                        return {
                            type: 'group',
                            children: [
                                { type: 'line', shape: { x1: top[0], y1: top[1], x2: bottom[0], y2: bottom[1] }, style: style },
                                { type: 'line', shape: { x1: top[0]-3, y1: top[1], x2: top[0]+3, y2: top[1] }, style: style },
                                { type: 'line', shape: { x1: bottom[0]-3, y1: bottom[1], x2: bottom[0]+3, y2: bottom[1] }, style: style }
                            ]
                        };
                    },
                    data: h2.map((v, i) => [i, v]),
                    z: 10
                },
                // C2H4 Error
                {
                    type: 'custom',
                    renderItem: function (params, api) {
                        const idx = params.dataIndex;
                        const x = api.value(0);
                        const val = api.value(1); // c2h4 mean
                        const base = h2[idx]; // C2H4 sits on top of H2
                        const err = c2h4_err[idx];
                        
                        const centerY = base + val;
                        const top = api.coord([x, centerY + err]);
                        const bottom = api.coord([x, centerY - err]);
                        
                        const style = api.style({ stroke: 'black', lineWidth: 1 });
                        
                        return {
                            type: 'group',
                            children: [
                                { type: 'line', shape: { x1: top[0], y1: top[1], x2: bottom[0], y2: bottom[1] }, style: style },
                                { type: 'line', shape: { x1: top[0]-3, y1: top[1], x2: top[0]+3, y2: top[1] }, style: style },
                                { type: 'line', shape: { x1: bottom[0]-3, y1: bottom[1], x2: bottom[0]+3, y2: bottom[1] }, style: style }
                            ]
                        };
                    },
                    data: c2h4.map((v, i) => [i, v]),
                    z: 10
                },
                // Voltage Error
                {
                    type: 'custom',
                    yAxisIndex: 1,
                    renderItem: function (params, api) {
                        const x = api.value(0);
                        const val = api.value(1);
                        const err = volt_err[params.dataIndex];
                        
                        const top = api.coord([x, val + err]);
                        const bottom = api.coord([x, val - err]);
                        
                        const style = api.style({ stroke: '#8D564A', lineWidth: 1 });
                        
                        return {
                            type: 'group',
                            children: [
                                { type: 'line', shape: { x1: top[0], y1: top[1], x2: bottom[0], y2: bottom[1] }, style: style },
                                { type: 'line', shape: { x1: top[0]-3, y1: top[1], x2: top[0]+3, y2: top[1] }, style: style },
                                { type: 'line', shape: { x1: bottom[0]-3, y1: bottom[1], x2: bottom[0]+3, y2: bottom[1] }, style: style }
                            ]
                        };
                    },
                    data: volt.map((v, i) => [i, v]),
                    z: 10
                }
            ],
            graphic: [
                { type: 'text', left: 0, top: 0, style: { text: 'c', font: 'bold 24px Arial' } },
                // Arrow
                // ECharts graphic elements are absolute or relative to container.
                // Hard to position exactly at (1.02, 0.92) axes fraction without coordinate conversion logic.
                // We'll skip or approximate.
            ]
        };

        chart.setOption(option);
    </script>
</body>
</html>
