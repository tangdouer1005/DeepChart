        /* const labelMap = {
            'preschool': 'Preschool',
            'primary school': 'Primary\nschool',
            'secondary school': 'Secondary\nschool',
            'university': 'University'
        };

        rawData.forEach(d => d.Stage = labelMap[d.Stage]); */

        const categories = ['Preschool', 'Primary\nschool', 'Secondary\nschool', 'University'];
        const colors = {
            'Preschool': '#8da0cb',       
            'Primary\nschool': '#bebada', 
            'Secondary\nschool': '#ffffb3', 
            'University': '#bf812d'       
        };

        const chart = echarts.init(document.getElementById('chart-container'));

        // Prepare data for boxplot (used for bar chart approximation)
        const boxplotData = [];
        const scatterData = [];
        const errorData = [];

        categories.forEach((cat, idx) => {
            const values = rawData.filter(d => d.Stage === cat).map(d => d.value);
            
            const n = values.length;
            const mean = values.reduce((a, b) => a + b, 0) / n;
            
            // Standard Error
            const std = Math.sqrt(values.map(x => Math.pow(x - mean, 2)).reduce((a, b) => a + b) / (n - 1));
            const se = std / Math.sqrt(n);
            const ci = se; // Python code uses 'se' for error bars directly

            boxplotData.push({
                value: mean,
                itemStyle: {
                    color: '#d9d9d9',
                    borderColor: 'black',
                    borderWidth: 1
                }
            });

            // Error bar data
            errorData.push({
                x: idx,
                low: mean - ci,
                high: mean + ci
            });

            // Scatter data
            values.forEach(v => {
                const jitter = (Math.random() - 0.5) * 0.5;
                scatterData.push({
                    value: [idx + jitter, v],
                    itemStyle: {
                        color: colors[cat],
                        borderColor: '#555555',
                        borderWidth: 1,
                        opacity: 0.6
                    }
                });
            });
        });

        const option = {
            animation: false,
            backgroundColor: 'white',
            grid: {
                top: 50,
                bottom: 50,
                left: 60,
                right: 20
            },
            xAxis: {
                type: 'category',
                data: categories,
                axisLabel: { color: 'black', fontSize: 11, interval: 0 },
                axisLine: { show: true, lineStyle: { color: 'black' } },
                axisTick: { show: true }
            },
            yAxis: {
                type: 'value',
                name: 'Plate waste amount (g per capita per meal)',
                nameLocation: 'middle',
                nameGap: 40,
                min: 0,
                max: 320,
                interval: 40,
                axisLabel: { color: 'black' },
                axisLine: { show: true, lineStyle: { color: 'black' } },
                splitLine: { show: false }
            },
            series: [
                {
                    type: 'bar',
                    data: boxplotData,
                    barWidth: '60%',
                    z: 1
                },
                {
                    type: 'custom',
                    renderItem: function (params, api) {
                        const idx = params.dataIndex;
                        const err = errorData[idx];
                        const x = api.coord([err.x, 0])[0];
                        const yHigh = api.coord([err.x, err.high])[1];
                        const yLow = api.coord([err.x, err.low])[1];
                        
                        const capWidth = 10;

                        return {
                            type: 'group',
                            children: [
                                {
                                    type: 'line',
                                    shape: { x1: x, y1: yHigh, x2: x, y2: yLow },
                                    style: { stroke: 'black', lineWidth: 1.2 }
                                },
                                {
                                    type: 'line',
                                    shape: { x1: x - capWidth/2, y1: yHigh, x2: x + capWidth/2, y2: yHigh },
                                    style: { stroke: 'black', lineWidth: 1.2 }
                                },
                                {
                                    type: 'line',
                                    shape: { x1: x - capWidth/2, y1: yLow, x2: x + capWidth/2, y2: yLow },
                                    style: { stroke: 'black', lineWidth: 1.2 }
                                }
                            ]
                        };
                    },
                    data: errorData,
                    z: 3
                },
                {
                    type: 'scatter',
                    data: scatterData,
                    symbolSize: 9,
                    z: 2
                }
            ],
            graphic: [
                {
                    type: 'text',
                    left: 0,
                    top: 0,
                    style: {
                        text: 'c',
                        font: 'bold 20px Arial',
                        fill: 'black'
                    }
                }
            ]
        };

        chart.setOption(option);
    </script>
