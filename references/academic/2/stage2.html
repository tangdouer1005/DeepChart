<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nature Chart Reproduction</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jstat@latest/dist/jstat.min.js"></script>
    <style>
        body { 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            background-color: #ffffff; 
            font-family: Arial, sans-serif;
        }
        #chart-container { 
            width: 400px; 
            height: 500px; 
        }
    </style>
</head>
<body>
    <div id="chart-container"></div>
    <script>
        // 1. Data Source (Embedded JSON)
        const chartData = {
    "means": {
        "saline": 0.9999996666666666,
        "K5": 1.5315751111111109,
        "K10": 4.1726841666666665,
        "K20": 7.702259166666665,
        "K30": 8.741642500000001,
        "K50": 12.284756363636365
    },
    "sems": {
        "saline": 0.2581616501157264,
        "K5": 0.3106889324183633,
        "K10": 0.34270561955331535,
        "K20": 0.5403931166380502,
        "K30": 0.6598395044620126,
        "K50": 1.6866677142413478
    },
    "raw_data": {
        "saline": [
            -0.15442,
            -0.58043,
            1.58696,
            0.868186,
            2.32056,
            2.3009,
            1.01952,
            1.11587,
            0.781112,
            0.46059,
            0.517398,
            1.76375
        ],
        "K5": [
            2.02859,
            0.878401,
            0.98349,
            0.785771,
            0.388214,
            2.19805,
            1.57333,
            1.50217,
            3.44616
        ],
        "K10": [
            5.40501,
            2.23115,
            6.34756,
            2.56239,
            4.55303,
            5.07432,
            4.39348,
            4.89635,
            3.20176,
            3.7647,
            3.76893,
            3.87353
        ],
        "K20": [
            5.92692,
            4.92276,
            11.0817,
            7.97339,
            7.98792,
            8.42453,
            9.63153,
            9.48093,
            7.67429,
            7.56366,
            6.8856,
            4.87388
        ],
        "K30": [
            8.08702,
            5.83228,
            11.3787,
            9.18607,
            8.53485,
            9.63262,
            11.4553,
            10.6288,
            10.3601,
            9.52821,
            5.61355,
            4.66221
        ],
        "K50": [
            6.62419,
            13.2996,
            8.36267,
            11.9092,
            17.7595,
            21.4167,
            21.2146,
            9.24065,
            5.81632,
            7.84489,
            11.644
        ]
    },
    "comparisons": [
        {
            "col1": "saline",
            "col2": "K5",
            "x1": 0,
            "x2": 1,
            "y_pos": 5.0,
            "p_val": 0.20116129513577516
        },
        {
            "col1": "K5",
            "col2": "K10",
            "x1": 1,
            "x2": 2,
            "y_pos": 8.8,
            "p_val": 2.5798147261719406e-05
        },
        {
            "col1": "K10",
            "col2": "K20",
            "x1": 2,
            "x2": 3,
            "y_pos": 13.2,
            "p_val": 1.5256468394102724e-05
        },
        {
            "col1": "K20",
            "col2": "K30",
            "x1": 3,
            "x2": 4,
            "y_pos": 17.0,
            "p_val": 0.23587763448939142
        },
        {
            "col1": "K30",
            "col2": "K50",
            "x1": 4,
            "x2": 5,
            "y_pos": 23.0,
            "p_val": 0.056205026228532955
        }
    ],
    "columns": [
        "saline",
        "K5",
        "K10",
        "K20",
        "K30",
        "K50"
    ],
    "x_labels": [
        "0",
        "5",
        "10",
        "20",
        "30",
        "50"
    ]
};
        
        // Configuration
        const columns = chartData.columns;
        const xLabels = chartData.x_labels;
        const colorPalette = [
            '#1a1a1a', 
            '#ea8685', 
            '#b33939', 
            '#881e19', 
            '#6d1512', 
            '#4a0d0b'
        ];

        // 3. Prepare Data Structure
        const stats = {};
        columns.forEach(col => {
            stats[col] = { 
                mean: chartData.means[col], 
                sem: chartData.sems[col], 
                arr: chartData.raw_data[col]
            };
        });

        // Significance Annotations
        const sigAnnotations = [];
        
        chartData.comparisons.forEach(comp => {
            const pVal = comp.p_val;
            
            let sigText = "";
            if (pVal < 0.001) sigText = "***";
            else if (pVal < 0.01) sigText = "**";
            else if (pVal < 0.05) sigText = "*";
            else sigText = `P = ${pVal.toFixed(2)}`;
            
            sigAnnotations.push({
                x1: comp.x1,
                x2: comp.x2,
                y: comp.y_pos,
                text: sigText
            });
        });

        // 4. ECharts Rendering
        const chart = echarts.init(document.getElementById('chart-container'));

        const scatterData = [];
        columns.forEach((col, colIdx) => {
            stats[col].arr.forEach(val => {
                const jitter = (Math.random() - 0.5) * 0.3; 
                scatterData.push([colIdx + jitter, val]);
            });
        });

        const option = {
            animation: false,
            backgroundColor: 'white',
            grid: {
                top: '10%',
                right: '5%',
                bottom: '15%',
                left: '15%'
            },
            xAxis: {
                type: 'category',
                data: xLabels,
                axisLine: { show: true, lineStyle: { color: 'black' } },
                axisTick: { show: true, lineStyle: { color: 'black' } },
                axisLabel: { color: 'black', fontSize: 12, fontFamily: 'Arial' },
                name: 'Ketamine (mg kg⁻¹)',
                nameLocation: 'middle',
                nameGap: 30,
                nameTextStyle: { color: 'black', fontSize: 14, fontFamily: 'Arial' }
            },
            yAxis: {
                type: 'value',
                min: -1,
                max: 25,
                interval: 5,
                axisLine: { show: true, lineStyle: { color: 'black' } },
                axisTick: { show: true, lineStyle: { color: 'black' } },
                axisLabel: { color: 'black', fontSize: 12, fontFamily: 'Arial' },
                splitLine: { show: false },
                name: 'AUC normalized',
                nameLocation: 'middle',
                nameGap: 40,
                nameTextStyle: { color: 'black', fontSize: 14, fontFamily: 'Arial' }
            },
            series: [
                {
                    type: 'bar',
                    data: columns.map((col, i) => ({
                        value: stats[col].mean,
                        itemStyle: { color: colorPalette[i] }
                    })),
                    barWidth: '70%',
                    z: 1
                },
                {
                    type: 'custom',
                    renderItem: function (params, api) {
                        const xIdx = api.value(0);
                        const mean = api.value(1);
                        const sem = api.value(2);
                        const highPoint = api.coord([xIdx, mean + sem]);
                        const lowPoint = api.coord([xIdx, mean - sem]);
                        const style = api.style({ stroke: 'gray', fill: null, lineWidth: 1.5 });
                        return {
                            type: 'group',
                            children: [
                                { type: 'line', shape: { x1: highPoint[0], y1: highPoint[1], x2: lowPoint[0], y2: lowPoint[1] }, style: style },
                                { type: 'line', shape: { x1: highPoint[0] - 4, y1: highPoint[1], x2: highPoint[0] + 4, y2: highPoint[1] }, style: style },
                                { type: 'line', shape: { x1: lowPoint[0] - 4, y1: lowPoint[1], x2: lowPoint[0] + 4, y2: lowPoint[1] }, style: style }
                            ]
                        };
                    },
                    data: columns.map((col, i) => [i, stats[col].mean, stats[col].sem]),
                    z: 3
                },
                {
                    type: 'scatter',
                    symbolSize: 6,
                    itemStyle: { color: '#555555', opacity: 0.8, borderWidth: 0 },
                    data: scatterData,
                    z: 4
                },
                {
                    type: 'custom',
                    renderItem: function (params, api) {
                        const idx = params.dataIndex;
                        const annotation = sigAnnotations[idx];
                        const start = api.coord([annotation.x1, annotation.y]);
                        const end = api.coord([annotation.x2, annotation.y]);
                        const style = api.style({ stroke: 'black', lineWidth: 0.8, fill: null });
                        return {
                            type: 'group',
                            children: [
                                { type: 'line', shape: { x1: start[0], y1: start[1], x2: end[0], y2: end[1] }, style: style },
                                {
                                    type: 'text',
                                    style: {
                                        text: annotation.text,
                                        x: (start[0] + end[0]) / 2,
                                        y: start[1] - 5,
                                        textAlign: 'center',
                                        textVerticalAlign: 'bottom',
                                        font: '12px Arial',
                                        fill: 'black'
                                    }
                                }
                            ]
                        };
                    },
                    data: sigAnnotations.map(a => [a.x1, a.x2, a.y]),
                    z: 5
                }
            ],
            graphic: [
                {
                    type: 'text',
                    left: 0,
                    top: 0,
                    style: {
                        text: 'g',
                        font: 'bold 20px Arial',
                        fill: 'black'
                    }
                }
            ]
        };
        chart.setOption(option);
    </script>
</body>
</html>
