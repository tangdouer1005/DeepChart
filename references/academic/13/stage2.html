            });
        });

        const chart = echarts.init(document.getElementById('chart-container'));

                left: 'center',
                textStyle: { fontSize: 16, color: 'black' }

            legend: {

                right: 10,

            grid: {

                right: 120,
                bottom: 80,

            xAxis: {

                axisLabel: {

                    interval: 0

                axisLine: { show: true, lineStyle: { color: '#333333' } },

            yAxis: {
                type: 'value',
                min: 0.50,
                max: 0.82,
                name: "Average AUROC score",
                nameLocation: 'middle',
                nameGap: 40,
                splitLine: { show: true, lineStyle: { color: '#d9d9d9' } },
                axisLabel: { color: '#333333' }
            },
            series: taskTypes.map((type, i) => ({
                name: type,
                type: 'bar',
                data: seriesData[i],
                itemStyle: { color: colors[i] },
                barGap: 0
            }))
        };
