        const xLabels = chartData.columns;
        const yLabels = chartData.index;

        const heatmapData = [];
        
        chartData.data.forEach((row, yIdx) => {
            row.forEach((val, xIdx) => {
                heatmapData.push([xIdx, yIdx, val]);
            });
        });

        const chart = echarts.init(document.getElementById('chart-container'));

        const option = {
            backgroundColor: 'white',
            title: {
                text: 'Morphology tasks',
                left: 'center',
                top: 10
            },
            grid: {
                top: 60,
                bottom: 80,
                left: 150,
                right: 20
            },
            visualMap: {
                min: 0.5,
                max: 1.0,
                calculable: false,
                show: false, // Image doesn't show colorbar
                inRange: {
                    color: ['#dcd0d9', '#3f224f']
                }
            },
            xAxis: {
                type: 'category',
                data: xLabels,
                axisLabel: { 
                    rotate: 45, 
                    color: 'black',
                    interval: 0
                },
                axisLine: { show: false },
                axisTick: { show: false },
                splitLine: { show: false }
            },
            yAxis: {
                type: 'category',
                data: yLabels,
                inverse: true,
                axisLabel: { color: 'black' },
                axisLine: { show: false },
                axisTick: { show: false },
                splitLine: { show: false }
            },
            series: [{
                type: 'heatmap',
                data: heatmapData,
                label: {
                    show: true,
                    formatter: function(params) {
                        return params.value[2].toFixed(2);
                    },
                    color: 'auto' // Contrast color? ECharts usually handles it or we set specific
                },
                itemStyle: {
                    borderColor: 'white',
                    borderWidth: 1
                }
            }],
            graphic: [
                { type: 'text', left: 20, top: 20, style: { text: 'c', font: 'bold 24px Arial' } }
            ]
        };
        
        // Improve label color contrast manually if needed
        option.series[0].label.color = function(params) {
            return params.value[2] > 0.75 ? 'white' : 'black';
        };

        chart.setOption(option);
