            "CH4": " [↑ +16%]",
            "CO2": " [↓ −11%]",
            "N2O": " [↑ +29%]",
            "Land based": " [↓ −13%]",
            "Energy": " [↑ +78%]",

            "Waste": " [↑ +67%]",
            "LULUC": " [↓ −28%]",
            "Production": " [↑ +18%]",
            "Transport": " [↑ +200%]",
            "Processing": " [↑ +200%]",
            "Packaging": " [↑ +150%]",
            "Retail": " [↑ > 100%]",
            "Consumption": " [↑ +50%]",
            "End of life": " [↑ +50%]"
        };

        function getColor(name) {
            if (colors[name]) return colors[name];
            if (name.includes('Energy') || name.includes('Ener')) return colors["Energy"];
            if (name.includes('Waste')) return colors["Waste"];
            if (name.includes('Transport')) return colors["Transport"];
            return "#D3D3D3";
        }

        const nodes = new Set();
        const linksArray = [];
        const flows = chartData.flows;

        flows.forEach(flow => {
            const s = "L" + flow.source_col + "_" + flow.source;
            const t = "L" + flow.target_col + "_" + flow.target;
            
            nodes.add(s);
            nodes.add(t);
            linksArray.push({
                source: s,
                target: t,
                value: flow.value
            });
        });

        const nodesArray = Array.from(nodes).map(id => {
            const parts = id.split('_');
            const layer = parseInt(parts[0].replace('L', ''));
            const name = parts.slice(1).join('_');
            return {
                name: id,
                realName: name,
                itemStyle: {
                    color: getColor(name)
                },
                depth: layer 
            };
        });

        const totalFlux = chartData.total_flux;

        const option = {
            title: { text: '' },
            tooltip: {
                trigger: 'item',
                triggerOn: 'mousemove'
            },
            series: [
                {
                    type: 'sankey',
                    data: nodesArray,
                    links: linksArray,
                    left: '2%',
                    right: '15%',
                    top: '10%',
                    bottom: '5%',
                    nodeWidth: 20,
                    nodeGap: 8,
                    layoutIterations: 32,
                    draggable: false,
                    label: {
                        show: true,
                        position: 'right',
                        formatter: function(params) {
                            const node = params.data;
                            const name = node.realName;
                            const val = params.value;
                            const pct = (val / totalFlux * 100).toFixed(1);
                            if (parseFloat(pct) < 1) return '';
                            
                            const extra = labelsExtra[name] || '';
                            return `${name} (${pct}%)${extra}`;
                        },
                        fontSize: 10
                    },
                    lineStyle: {
                        color: 'source',
                        opacity: 0.4,
                        curveness: 0.5
                    }
                }
            ],
            graphic: [
                { type: 'text', left: '2%', top: '6%', style: { text: 'Gases', fontWeight: 'bold' } },

                { type: 'text', left: '82%', top: '6%', style: { text: 'Gases', fontWeight: 'bold' } }
            ]
        };

        chart.setOption(option);
