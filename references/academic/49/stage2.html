            'Other': '#808080'
        };

        const sizeScaleFactor = 2.5;
        df.forEach(row => {
            // Calculate diameter based on area to match legend (radius = sqrt(area/pi))
            row.plot_size = 2 * Math.sqrt((row.marker_size_binned_q * sizeScaleFactor) / Math.PI);
            row.color = palette[row.annotation];
        });
        
        // Reverse data for plotting order (matplotlib default is bottom-up)
        df.reverse();

        const chart = echarts.init(document.getElementById('chart-container'));

        const option = {
            animation: false,
            backgroundColor: 'white',
            grid: { top: 80, right: 20, bottom: 60, left: 80 },
            xAxis: {
                name: 'log₂ (fold change) in PNECs vs others',
                nameLocation: 'middle',
                nameGap: 30,
                type: 'value',
                min: -1.5,
                max: 7.8,

            },
            yAxis: {
                name: 'RB-E2F ChIP-seq score',
                nameLocation: 'middle',
                nameGap: 40,
                type: 'value',
                min: 0.1,
                max: 2.1,
                interval: 0.2,
                axisLabel: { color: 'black', fontSize: 11 },
                axisLine: { lineStyle: { color: 'black', width: 1.2 } },
                axisTick: { alignWithLabel: true },
                splitLine: { show: false }
            },
            series: [{
                type: 'scatter',
                data: df.map(row => ({
                    value: [row.log2fc_PNEC_vs_others, row.RB_E2F_CHIPseq_score],
                    itemStyle: {
                        color: row.color,
                        borderColor: 'white',
                        borderWidth: 0.8,
                        opacity: 1
                    },
                    symbolSize: row.plot_size // ECharts symbolSize is diameter
                })),
                z: 2
            }],
            markLine: {
                silent: true,
                lineStyle: {
                    color: 'black',
                    type: 'solid',
                    width: 1.2
                },
                data: [{ xAxis: 0 }, { yAxis: 0.5 }]
            },
            graphic: [
                {
                    type: 'text',
                    left: 10,
                    top: 10,
                    style: {
                        text: 'd',
                        font: 'bold 24px Arial',
                        fill: 'black'

        // Custom Legend for Size and Color
        // These need to be placed carefully using explicit pixel positions or relative to grid.
        // For simplicity and direct translation of custom Matplotlib legend, we use `graphic` elements.

        const legendX = 0.75; // Normalized X position for graphic elements
        let legendY = 0.05;  // Normalized Y position for graphic elements (from top)

        // Title for Color Legend
        option.graphic.push({
            type: 'text',
            right: '20%',
            top: 50,
            style: { text: 'Annotations', fill: 'black', fontSize: 12, fontWeight: 'bold' }

        const colorOrder = ['Cell proliferation', 'DNA maintenance', 'Neuronal', 'Other'];
        colorOrder.forEach((cat, i) => {
            option.graphic.push({
                type: 'circle',
                right: '20%',
                top: 75 + i * 20,
                shape: { r: 5 }, // Smaller marker in legend
                style: { fill: palette[cat], stroke: 'white', lineWidth: 0.8 }
            });
            option.graphic.push({
                type: 'text',
                right: '15%',
                top: 75 + i * 20,
                style: { text: cat, fill: 'black', fontSize: 11, align: 'left' }
            });
        });

        // Title for Size Legend
        option.graphic.push({
            type: 'text',
            right: '20%',
            top: 75 + colorOrder.length * 20 + 20,
            style: { text: 'q-values', fill: 'black', fontSize: 12, fontWeight: 'bold' }
        });

        const sizeLabels = [
            '0.01 ≥ q > 10⁻¹⁰',
            '10⁻¹⁰ ≥ q > 10⁻²⁰',
            '10⁻²⁰ ≥ q'
        ];
        sizesRaw.forEach((size, i) => {
            // Replicate Matplotlib's marker size in legend. It is area, so sqrt(area/PI) is radius.
            const markerRadius = Math.sqrt(size * sizeScaleFactor / Math.PI);

            option.graphic.push({
                type: 'circle',
                right: '20%',
                top: 75 + (colorOrder.length + 1) * 20 + 20 + i * 25,

            });

                right: '15%',
                top: 75 + (colorOrder.length + 1) * 20 + 20 + i * 25,
