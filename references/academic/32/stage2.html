<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nature Chart Reproduction</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
    <style>
        body { margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #ffffff; font-family: Arial, sans-serif; }
        #chart-container { width: 600px; height: 500px; }
    </style>
</head>
<body>
    <div id="chart-container"></div>
    <script>
        const data = [
    {
        "fraction": -0.01,
        "heat": 14.00903,
        "fuel": 2.44504
    },
    {
        "fraction": 0.00222,
        "heat": 13.99935,
        "fuel": 2.55441
    },
    {
        "fraction": 0.01444,
        "heat": 13.99101,
        "fuel": 2.66164
    },
    {
        "fraction": 0.02667,
        "heat": 13.98485,
        "fuel": 2.7654
    },
    {
        "fraction": 0.03889,
        "heat": 13.97775,
        "fuel": 2.87066
    },
    {
        "fraction": 0.05111,
        "heat": 13.96978,
        "fuel": 2.9773
    },
    {
        "fraction": 0.06333,
        "heat": 13.96196,
        "fuel": 3.0837
    },
    {
        "fraction": 0.07556,
        "heat": 13.95426,
        "fuel": 3.18993
    },
    {
        "fraction": 0.08778,
        "heat": 13.94662,
        "fuel": 3.29604
    },
    {
        "fraction": 0.1,
        "heat": 13.93902,
        "fuel": 3.40209
    }
];
        
        const chart = echarts.init(document.getElementById('chart-container'));

        const color_fuel = '#696969'; // DimGray
        const color_heat = '#d64040'; // Red

        const option = {
            backgroundColor: 'white',
            grid: { top: 50, right: 60, bottom: 60, left: 60 },
            xAxis: {
                type: 'value',
                name: 'Increasing PV capture area (%)',
                nameLocation: 'middle',
                nameGap: 35,
                min: -2,
                max: 12,
                axisLabel: { color: 'black' },
                axisLine: { show: true, lineStyle: { color: 'black' } },
                splitLine: { show: false }
            },
            yAxis: [
                {
                    type: 'value',
                    name: 'Power fuel (kW)',
                    nameLocation: 'middle',
                    nameGap: 40,
                    min: 2.3,
                    max: 3.5,
                    interval: 0.2,
                    axisLabel: { color: 'black' },
                    axisLine: { show: true, lineStyle: { color: 'black' } },
                    splitLine: { show: false }
                },
                {
                    type: 'value',
                    name: 'Power heat (kW)',
                    nameLocation: 'middle',
                    nameGap: 40,
                    min: 13.93,
                    max: 14.03,
                    interval: 0.02,
                    position: 'right',
                    axisLabel: { color: 'black' },
                    axisLine: { show: true, lineStyle: { color: 'black' } },
                    nameTextStyle: { color: color_heat },
                    splitLine: { show: false }
                }
            ],
            series: [
                {
                    name: 'Power fuel',
                    type: 'line',
                    data: data.map(d => [d.fraction * 100, d.fuel]),
                    symbol: 'rect', // Square marker
                    symbolSize: 9,
                    itemStyle: { color: color_fuel, borderColor: color_fuel },
                    lineStyle: { width: 0.8, color: color_fuel }
                },
                {
                    name: 'Power heat',
                    type: 'line',
                    data: data.map(d => [d.fraction * 100, d.heat]),
                    symbol: 'triangle', // Triangle marker
                    symbolSize: 9,
                    itemStyle: { color: color_heat, borderColor: color_heat },
                    lineStyle: { width: 0.8, color: color_heat },
                    yAxisIndex: 1
                }
            ]
        };
        
        chart.setOption(option); // Initial render

        // Function to create and update graphic elements
        function updateGraphicElements() {
             const vLineX = chart.convertToPixel('xAxis', 0);
             
             // Using yAxisIndex: 0 to get grid top/bottom pixels
             const y_bottom_pixel = chart.convertToPixel({yAxisIndex: 0}, chart.getOption().yAxis[0].min);
             const y_top_pixel = chart.convertToPixel({yAxisIndex: 0}, chart.getOption().yAxis[0].max);
             
             return [
                { type: 'text', left: 10, top: 10, style: { text: 'c', font: 'bold 24px Arial' } },
                // Vertical dashed line at x=0
                {
                    type: 'line',
                    shape: {
                        x1: vLineX,
                        y1: y_bottom_pixel,
                        x2: vLineX,
                        y2: y_top_pixel
                    },
                    style: { stroke: 'black', lineWidth: 0.8, lineDash: [5, 5] }
                }
             ];
        }

        // Apply graphic elements after chart render
        chart.setOption({ graphic: updateGraphicElements() });

        // Update on resize
        window.addEventListener('resize', () => {
            chart.resize();
            chart.setOption({ graphic: updateGraphicElements() });
        });
        
    </script>
</body>
</html>
