        // --- 4. Curve Fitting Logic ---
        
        function sigmoid(x, top, bottom, log_ec50, hill_slope) {
            return bottom + (top - bottom) / (1 + Math.pow(10, (log_ec50 - x) * hill_slope));
        }
        
        // Simple optimization using Nelder-Mead method (Downhill Simplex)
        // Adapted for minimizing sum of squared errors
        function fitSigmoid(xData, yData, p0) {
            // Objective function: Sum of Squared Residuals
            const func = (params) => {
                const [top, bottom, log_ec50, hill_slope] = params;
                let rss = 0;
                for (let i = 0; i < xData.length; i++) {
                    const yPred = sigmoid(xData[i], top, bottom, log_ec50, hill_slope);
                    rss += Math.pow(yData[i] - yPred, 2);
                }
                return rss;
            };

            // Initial Simplex
            const dim = 4;
            let simplex = [p0.slice()];
            // Create initial simplex around p0
            for (let i = 0; i < dim; i++) {
                const p = p0.slice();
                p[i] = p[i] !== 0 ? p[i] * 1.05 : 0.001; // Perturb
                simplex.push(p);
            }
            
            // Nelder-Mead Constants
            const alpha = 1.0, gamma = 2.0, rho = 0.5, sigma = 0.5;
            const maxIter = 1000;
            const tol = 1e-6;

            for (let iter = 0; iter < maxIter; iter++) {
                // Sort simplex by cost
                simplex.sort((a, b) => func(a) - func(b));
                const best = simplex[0];
                const worst = simplex[dim];
                
                if (Math.abs(func(best) - func(worst)) < tol) break;
                
                // Centroid
                const centroid = new Array(dim).fill(0);
                for (let i = 0; i < dim; i++) {
                    for (let j = 0; j < dim; j++) { // Exclude worst
                        centroid[i] += simplex[j][i];
                    }
                    centroid[i] /= dim;
                }
                
                // Reflect
                const reflected = centroid.map((c, i) => c + alpha * (c - worst[i]));
                const fReflected = func(reflected);
                
                if (fReflected < func(simplex[dim-1]) && fReflected >= func(best)) {
                    simplex[dim] = reflected;
                    continue;
                }
                
                // Expand
                if (fReflected < func(best)) {
                    const expanded = centroid.map((c, i) => c + gamma * (reflected[i] - centroid[i]));
                    if (func(expanded) < fReflected) {
                        simplex[dim] = expanded;
                    } else {
                        simplex[dim] = reflected;
                    }
                    continue;
                }
                
                // Contract
                const contracted = centroid.map((c, i) => c + rho * (worst[i] - centroid[i]));
                if (func(contracted) < func(worst)) {
                    simplex[dim] = contracted;
                    continue;
                }
                
                // Shrink
                for (let i = 1; i <= dim; i++) {
                    simplex[i] = simplex[i].map((val, j) => best[j] + sigma * (val - best[j]));
                }
            }
            
            return simplex[0]; // Return best parameters
        }

        function linear(x, m, c) {
            return m * x + c;
        }

        // --- 5. Main Execution ---
        const data = chartData;

        for (const [name, groupData] of Object.entries(data)) {

            // 1. Scatter Plot with Error Bars
            traces.push({
                x: x,
                y: y,
                mode: 'markers',
                error_y: {
                    type: 'data',
                    array: yerr,
                    visible: true,
                    color: color,
                    thickness: 1.5,
                    width: 3
                },
                marker: {
                    color: color,
                    size: 8,
                    line: { width: 0 }
                },
                name: name, // Using label name
                showlegend: true
            });
            
            // 2. Curve Fitting
            // p0 = [max(y), min(y), np.mean(x), 1.0]
            const yMax = Math.max(...y);
            const yMin = Math.min(...y);
            const xMean = x.reduce((a, b) => a + b, 0) / x.length;
            const p0 = [yMax, yMin, xMean, 1.0];
            
            try {
                // Try Sigmoidal Fit
                const popt = fitSigmoid(x, y, p0);
                
                // Generate fit line
                const xFit = [];
                const step = (Math.max(...x) - Math.min(...x) + 1.0) / 100;
                for (let val = Math.min(...x) - 0.5; val <= Math.max(...x) + 0.5; val += step) {
                    xFit.push(val);
                }
                
                const yFit = xFit.map(val => sigmoid(val, ...popt));
                
                traces.push({
                    x: xFit,
                    y: yFit,
                    mode: 'lines',
                    line: {
                        color: color,
                        width: 2
                    },
                    showlegend: false,
                    hoverinfo: 'skip'
                });
                
            } catch (e) {
                // Fallback Linear
                // Simple linear regression
                const n = x.length;
                const sumX = x.reduce((a, b) => a + b, 0);
                const sumY = y.reduce((a, b) => a + b, 0);
                const sumXY = x.reduce((a, b, i) => a + b * y[i], 0);
                const sumXX = x.reduce((a, b) => a + b * b, 0);
                
                const slope = (n * sumXY - sumX * sumY) / (n * sumXX - sumX * sumX);
                const intercept = (sumY - slope * sumX) / n;
                
                const xFit = [Math.min(...x) - 0.5, Math.max(...x) + 0.5];
                const yFit = xFit.map(val => linear(val, slope, intercept));
                
                traces.push({
                    x: xFit,
                    y: yFit,
                    mode: 'lines',
                    line: {
                        color: color,
                        width: 2
                    },
                    showlegend: false,
                    hoverinfo: 'skip'
                });
            }
        }
