        const years = [2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020];
        const categories = ['Brazil/Domestic', 'China', 'EU28', 'Other countries'];
        
        // Prepare Data Structures
        const landUseData = {};
        const deforestationData = {};
        const appropriationData = {};
        
        categories.forEach(cat => {
            landUseData[cat] = [];
            deforestationData[cat] = [];
            appropriationData[cat] = [];
        });

        // Fill Data
        // rawData is not sorted guaranteed, so iterate years and categories
        years.forEach(year => {
            categories.forEach(cat => {
                // Find matching item
                const item = rawData.find(d => d.Year === year && d.Category === cat);
                if (item) {
                    landUseData[cat].push(item.LandUse);
                    deforestationData[cat].push(item.Deforestation);
                    appropriationData[cat].push(item.Appropriation);
                } else {
                    // Fallback
                    landUseData[cat].push(0);
                    deforestationData[cat].push(0);
                    appropriationData[cat].push(0);
                }
            });
        });

        const colors = {
            'Brazil/Domestic': '#d73027', 
            'China': '#fdae61',            
            'EU28': '#abdda4',             
            'Other countries': '#2b83ba'   
        };

        const markers = {
            'Brazil/Domestic': 'circle',
            'China': 'rect', // Square
            'EU28': 'triangle',
            'Other countries': 'diamond'
        };

        const series = [];

        // 1. Deforestation Bars (Left Axis, Hatched)
        categories.forEach(cat => {
            series.push({
                name: cat + ' (Deforestation)',
                type: 'bar',
                stack: 'deforestation',
                yAxisIndex: 0,
                data: deforestationData[cat],
                itemStyle: {
                    color: colors[cat],
                    decal: {
                        symbol: 'rect',
                        symbolSize: 1,
                        rotation: Math.PI / 4,
                        color: 'rgba(0, 0, 0, 0.3)',
                        dashArrayX: [1, 0],
                        dashArrayY: [2, 5]
                    },
                    borderColor: 'black',
                    borderWidth: 0.5
                },
                barWidth: '35%'
            });
        });

        // 2. Land Use Bars (Right Axis, Solid)
        categories.forEach(cat => {
            series.push({
                name: cat + ' (Land Use)',
                type: 'bar',
                stack: 'landuse',
                yAxisIndex: 1,
                data: landUseData[cat],
                itemStyle: {
                    color: colors[cat],
                    borderColor: 'black',
                    borderWidth: 0.5
                },
                barWidth: '35%'
            });
        });

        // 3. Appropriation Markers (Right Axis, Scaled)
        // Scaled by 0.5 to fit on the 0-42 axis (representing Mt but plotted on Mha scale visually)
        categories.forEach(cat => {
            const data = appropriationData[cat].map(val => val * 0.5);
            series.push({
                name: cat + ' (Appropriation)',
                type: 'scatter',
                yAxisIndex: 1,
                data: data,
                symbol: markers[cat],
                symbolSize: 12,
                itemStyle: {
                    color: colors[cat],
                    borderColor: 'black',
                    borderWidth: 1
                },
                label: {
                    show: true,
                    position: 'top',
                    formatter: function(params) {
                        return appropriationData[cat][params.dataIndex].toFixed(1);
                    },
                    backgroundColor: 'white',
                    borderColor: 'black',
                    borderWidth: 0.5,
                    padding: [2, 4],
                    fontSize: 10,
                    color: 'black'
                },
                z: 10
            });
        });

        const option = {
            backgroundColor: 'white',
            grid: {
                top: 150, // Space for legend
                left: 80,
                right: 80,
                bottom: 50
            },
            legend: {
                show: false // Custom legend via graphic
            },
            xAxis: {
                type: 'category',
                data: years,
                axisTick: { show: false },

            yAxis: [

                    name: 'Brazil deforestation exposure (Mha)',
                    min: 0,
