        // --------------------------------------------------------
        // 2. Data Processing
        // --------------------------------------------------------
        function processData(data_dict) {
            const processed_data = [];
            for (const g_protein in data_dict) {
                for (const treatment in data_dict[g_protein]) {
                    data_dict[g_protein][treatment].forEach(val => {
                        processed_data.push({
                            'G_Protein': g_protein,
                            'Treatment': treatment,
                            'Value': -1 * val // Invert Logic
                        });
                    });
                }
            }
            return processed_data;
        }

        const df = processData(raw_data);
        const g_order = ['Gq', 'G11', 'G15', 'Gi1', 'Gi2', 'Gi3', 'GoA', 'GoB', 'Gz', 'Gg', 'GsS', 'GsL', 'G12', 'G13'];
        const hue_order = ['NT', 'PD142948A', 'SBI-553', 'SR142948A'];
        
        // Colors
        const color_palette = {
            'NT': '#0000A0',       // Deep Blue
            'PD142948A': '#4DAF7C', // Medium Sea Green
            'SBI-553': '#A020F0',   // Purple
            'SR142948A': '#FFA500'  // Orange
        };

        // Helpers
        function getValidValues(arr) { return arr.filter(v => typeof v === 'number' && !isNaN(v)); }
        function mean(arr) {
            const valid = getValidValues(arr);
            if (valid.length === 0) return 0;
            return valid.reduce((a, b) => a + b, 0) / valid.length;
        }
        function stdDev(arr) {
            const valid = getValidValues(arr);
            const n = valid.length;
            if (n < 2) return 0;
            const m = mean(valid);
            const sumSq = valid.reduce((a, b) => a + Math.pow(b - m, 2), 0);
            return Math.sqrt(sumSq / (n - 1));
        }
        function sem(arr) {
            const valid = getValidValues(arr);
            const n = valid.length;
            if (n < 2) return 0;
            return stdDev(valid) / Math.sqrt(n);
        }

        // --------------------------------------------------------
        // 3. Statistical Analysis (ANOVA + Bonferroni T-tests)
        // --------------------------------------------------------
        const tukey_results = {};
        g_order.forEach(protein => {
            const proteinData = df.filter(row => row.G_Protein === protein);
            if (proteinData.length === 0) return;

            const groups = {};
            let allValues = [];
            hue_order.forEach(treatment => {
                const vals = proteinData.filter(row => row.Treatment === treatment).map(row => row.Value);
                if (vals.length > 0) {
                    groups[treatment] = vals;
                    allValues = allValues.concat(vals);
                }
            });
            const groupNames = Object.keys(groups);
            if (groupNames.length < 2) return;

            const grandMean = mean(allValues);
            let ssWithin = 0;
            let dfWithin = 0;
            groupNames.forEach(gName => {
                const gVals = groups[gName];
                const gMean = mean(gVals);
                gVals.forEach(v => ssWithin += Math.pow(v - gMean, 2));
                dfWithin += (gVals.length - 1);
            });

            const msWithin = ssWithin / dfWithin;
            const k = groupNames.length;
            const numComparisons = (k * (k - 1)) / 2;

            if (!tukey_results[protein]) tukey_results[protein] = {};

            for (let i = 0; i < k; i++) {
                for (let j = i + 1; j < k; j++) {
                    const g1 = groupNames[i];
                    const g2 = groupNames[j];
                    const vals1 = groups[g1];
                    const vals2 = groups[g2];
                    const n1 = vals1.length;
                    const n2 = vals2.length;
                    const m1 = mean(vals1);
                    const m2 = mean(vals2);
                    
                    const seDiff = Math.sqrt(msWithin * (1/n1 + 1/n2));
                    const tStat = Math.abs(m1 - m2) / seDiff;
                    const pRaw = 2 * (1 - jStat.studentt.cdf(tStat, dfWithin));
                    
                    let pAdj = pRaw * numComparisons;
                    if (pAdj > 1.0) pAdj = 1.0;

                    tukey_results[protein][`${g1}-${g2}`] = pAdj;
                    tukey_results[protein][`${g2}-${g1}`] = pAdj;
                }
            }
        });

        // --------------------------------------------------------
        // 4. ECharts Visualization
        // --------------------------------------------------------
        const chartDom = document.getElementById('chart');
        const myChart = echarts.init(chartDom);

        // Constants
        const barWidth = 0.2;
        const offsets = [-0.3, -0.1, 0.1, 0.3];
        
        // Comparison Helper
        const getSymbol = (p_val) => {
            if (p_val < 0.001) return '***';
            if (p_val < 0.01) return '**';
            if (p_val < 0.05) return '*';
            return 'ns';
        };

        // Comparison Map (Colors to Treatments)
        const comparison_map = {
            'Gq-NT': ['#A020F0', '#FFA500'], 'Gq-PD142948A': ['#A020F0', '#FFA500'],
            'G11-NT': ['#A020F0', '#FFA500'], 'G11-PD142948A': ['#A020F0', '#FFA500'],
            'G15-NT': ['#A020F0', '#FFA500'], 'G15-PD142948A': ['#A020F0', '#FFA500'], 'G15-SBI-553': ['#4DAF7C'], 
            'Gi1-NT': ['#A020F0', '#FFA500'], 'Gi1-PD142948A': ['#A020F0', '#FFA500'], 'Gi1-SBI-553': ['#4DAF7C'],
            'Gi2-NT': ['#A020F0', '#FFA500'], 'Gi2-PD142948A': ['#A020F0', '#FFA500'], 'Gi2-SBI-553': ['#4DAF7C'],
            'Gi3-NT': ['#A020F0', '#FFA500'], 'Gi3-PD142948A': ['#0000A0', '#FFA500'],
            'GoA-NT': ['#A020F0', '#FFA500'], 'GoA-PD142948A': ['#A020F0', '#FFA500'],
            'GoB-NT': ['#A020F0', '#FFA500'], 'GoB-PD142948A': ['#A020F0', '#FFA500'],
            'Gz-NT': ['#A020F0', '#FFA500'], 'Gz-PD142948A': ['#A020F0', '#FFA500'],
            'Gg-NT': ['#A020F0'], 'Gg-PD142948A': ['#0000A0'],
            'G12-NT': ['#4DAF7C', '#A020F0', '#FFA500'], 'G12-PD142948A': ['#0000A0', '#A020F0', '#FFA500'], 'G12-SBI-553': ['#0000A0', '#4DAF7C'],
            'G13-NT': ['#4DAF7C', '#A020F0', '#FFA500'], 'G13-PD142948A': ['#0000A0', '#A020F0'], 'G13-SBI-553': ['#0000A0']
        };
        const c_map_colors = {
            '#A020F0': 'SBI-553', '#FFA500': 'SR142948A', '#4DAF7C': 'PD142948A', '#0000A0': 'NT'
        };

        // Resetting Series Data Arrays
        const seriesData = {
            bars: {},
            errors: {},
            scatter: {},
            stars: []      // [[x, y, text, color], ...]
        };
        hue_order.forEach(t => {
            seriesData.bars[t] = [];
            seriesData.errors[t] = [];
            seriesData.scatter[t] = [];
        });

        // Populate Data
        const groupedData = {}; 
        df.forEach(row => {
            if(!groupedData[row.G_Protein]) groupedData[row.G_Protein] = {};
            if(!groupedData[row.G_Protein][row.Treatment]) groupedData[row.G_Protein][row.Treatment] = [];
            groupedData[row.G_Protein][row.Treatment].push(row.Value);
        });

        g_order.forEach((protein, i) => {
            hue_order.forEach((treatment, j) => {
                const vals = groupedData[protein] ? groupedData[protein][treatment] : [];
                const validVals = getValidValues(vals || []);
                
                // X Center
                const cx = i + offsets[j];
                
                if (validVals.length > 0) {
                    const m = mean(validVals);
                    const s = sem(validVals);
                    
                    // Bar Data
                    seriesData.bars[treatment].push([cx, m]);
                    
                    // Error Data
                    seriesData.errors[treatment].push([cx, m, m + s, m - s]);
                    
                    // Scatter Data (Jitter)
                    validVals.forEach(v => {
                        // Jitter width +/- 0.08
                        const jitter = (Math.random() - 0.5) * 0.16;
                        seriesData.scatter[treatment].push([cx + jitter, v]);
                    });
                    
                    // Stars Calculation
                    const key = `${protein}-${treatment}`;
                    if (comparison_map[key]) {
                        const colors = comparison_map[key];
                        let stackIdx = 0;
                        colors.forEach(col => {
                            const targetT = c_map_colors[col];
                            const pKey = `${treatment}-${targetT}`;
                            const pVal = (tukey_results[protein] && tukey_results[protein][pKey] !== undefined) 
                                         ? tukey_results[protein][pKey] : 1.0;
                            const sym = getSymbol(pVal);
                            
                            if(sym !== 'ns') {
                                const yPos = m + s + 0.02 + (stackIdx * 0.04);
                                seriesData.stars.push([cx, yPos, sym, col]);
                                stackIdx++;
                            }
                        });
                    }
                }
            });
        });

        // Build Series Array
        const finalSeries = [];

        // 1. Bars
        hue_order.forEach(t => {
            finalSeries.push({
                name: t,
                type: 'custom',
                renderItem: function (params, api) {
                    const xVal = api.value(0);
                    const yVal = api.value(1);
                    const size = api.size([0.2, yVal]); // width 0.2 data units
                    const style = api.style();
                    
                    // Width in pixels
                    const p0 = api.coord([0, 0]);
                    const p1 = api.coord([0.2, 0]);
                    const w = Math.abs(p1[0] - p0[0]);
                    
                    // Height
                    const startY = api.coord([0, 0])[1];
                    const endY = api.coord([0, yVal])[1];
                    const h = Math.abs(endY - startY);
                    
                    // Top Left
                    const pt = api.coord([xVal, yVal]);
                    
                    // Logic for y direction
                    const x = pt[0] - w/2;
                    const y = Math.min(startY, endY);
                    
                    return {
                        type: 'rect',
                        shape: {
                            x: x, y: y, width: w, height: h
                        },
                        style: style
                    };
                },
                data: seriesData.bars[t],
                itemStyle: { color: color_palette[t] }
            });
        });

        // 2. Error Bars (Custom)
        hue_order.forEach(t => {
            finalSeries.push({
                name: t + ' Error',
                type: 'custom',
                renderItem: function (params, api) {
                    const xVal = api.value(0);
                    const high = api.coord([xVal, api.value(2)]);
                    const low = api.coord([xVal, api.value(3)]);
                    const style = { stroke: '#000', lineWidth: 1.5 };
                    
                    const p0 = api.coord([0, 0]);
                    const p1 = api.coord([0.05, 0]); // Cap width 0.05 data units
                    const capW = Math.abs(p1[0] - p0[0]);
                    
                    return {
                        type: 'group',
                        children: [
                            { type: 'line', shape: { x1: high[0], y1: high[1], x2: low[0], y2: low[1] }, style: style }, // Vertical
                            { type: 'line', shape: { x1: high[0]-capW, y1: high[1], x2: high[0]+capW, y2: high[1] }, style: style }, // Top Cap
                            { type: 'line', shape: { x1: low[0]-capW, y1: low[1], x2: low[0]+capW, y2: low[1] }, style: style }  // Bot Cap
                        ]
                    };
                },
                data: seriesData.errors[t],
                z: 10
            });
        });

        // 3. Scatter (Jitter)
        hue_order.forEach(t => {
            finalSeries.push({
                name: t + ' Points',
                type: 'scatter',
                symbol: 'circle',
                symbolSize: 6,
                itemStyle: {
                    color: 'transparent',
                    borderColor: color_palette[t],
                    borderWidth: 1.5
                },
                data: seriesData.scatter[t],
                z: 20
            });
        });

        // 4. Stars (Custom text)
        finalSeries.push({
            name: 'Stars',
            type: 'custom',
            renderItem: function (params, api) {
                const pos = api.coord([api.value(0), api.value(1)]);
                return {
                    type: 'text',
                    x: pos[0],
                    y: pos[1],
                    style: {
                        text: api.value(2), 
                        fill: api.value(3),
                        font: 'bold 12px Arial',
                        textAlign: 'center',
                        textVerticalAlign: 'bottom'
                    }
                };
            },
            data: seriesData.stars.map(s => ({ value: [s[0], s[1], s[2], s[3]] })),
            z: 30
        });
        
        // 5. Family Lines (Graphic-like via Custom Series)
        const families = [
            { start: 0, end: 2, label: 'Gq' },
            { start: 3, end: 9, label: 'Gi/o' },
            { start: 10, end: 11, label: 'Gs' },
            { start: 12, end: 13, label: 'G12/13' }
        ];
        finalSeries.push({
            type: 'custom',
            renderItem: function (params, api) {
                const start = api.value(0);
                const end = api.value(1);
                const label = api.value(2);
                
                const yLine = -0.13;
                const pStart = api.coord([start - 0.4, yLine]);
                const pEnd = api.coord([end + 0.4, yLine]);
                
                return {
                    type: 'group',
                    children: [
                        {
                            type: 'line',
                            shape: { x1: pStart[0], y1: pStart[1], x2: pEnd[0], y2: pEnd[1] },
                            style: { stroke: '#000', lineWidth: 1.5 }
                        },
                        {
                            type: 'text',
                            x: (pStart[0] + pEnd[0]) / 2,
                            y: pStart[1] + 5, // Label below line
                            style: {
                                text: label,
                                font: 'bold 12px Arial',
                                textAlign: 'center',
                                textVerticalAlign: 'top',
                                fill: '#000'
                            }
                        }
                    ]
                };
            },
            data: families.map(f => ({ value: [f.start, f.end, f.label] })),
            z: 5
        });

        const option = {
            title: {
                text: '',
                left: 'center'
            },
            legend: {
                data: hue_order,
                top: 20,
                left: 50,
                itemWidth: 15,
                itemHeight: 15,
                textStyle: { fontSize: 12 }
            },
            grid: {
                top: 100,
                bottom: 100,
                left: 80,
                right: 50
            },
            xAxis: {
                type: 'value',
                min: -0.5,
                max: 13.5,
                interval: 1,
                splitLine: { show: false },
                axisLabel: {
                    formatter: function (val) {
                        return g_order[val] || '';
                    },
                    fontWeight: 'bold',
                    color: '#000'
                },
                axisTick: { show: false }
            },
            yAxis: {
                type: 'value',
                min: -0.1,
                max: 0.65,
                name: 'G protein Activation\n(-Δ Net BRET)',
                nameLocation: 'middle',
                nameGap: 50,
                nameTextStyle: {
                    fontWeight: 'bold',
                    fontSize: 14
                },
                splitLine: { show: false },
                axisLine: { show: true },
                axisLabel: { show: true }
            },
            series: finalSeries
        };
        
        // Add markLine to first series
        finalSeries[0].markLine = {
            symbol: 'none',
            lineStyle: { color: 'black', width: 1, type: 'solid' },
            data: [{ yAxis: 0 }],
            z: 1,
            silent: true
        };
        
        // Family Label "Family"
        finalSeries.push({
            type: 'custom',
            renderItem: (params, api) => {
                const pt = api.coord([-1.0, -0.12]);
                return {
                    type: 'text',
                    x: pt[0], y: pt[1],
                    style: { text: 'Family', font: 'bold 12px Arial', fill: '#000', textAlign: 'right' }
                };
            },
            data: [{}]
        });

        myChart.setOption(option);
        
        window.addEventListener('resize', () => myChart.resize());
    </script>
</body>
</html>
