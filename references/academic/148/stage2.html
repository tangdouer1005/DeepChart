        "fairness_index":-0.555556
    }
];

        const plotData = jsonData.map(d => [d.percent_high_aging, d.fairness_index]);

        // Calculate main regression line
        function calculateRegression(data) {
            let n = data.length;
            let sumX = 0, sumY = 0, sumXY = 0, sumXX = 0;
            data.forEach(pt => {
                sumX += pt[0];
                sumY += pt[1];
                sumXY += pt[0] * pt[1];
                sumXX += pt[0] * pt[0];
            });
            
            let m = (n * sumXY - sumX * sumY) / (n * sumXX - sumX * sumX);
            let b = (sumY - m * sumX) / n;
            return { m, b };
        }

        const mainReg = calculateRegression(plotData);

        // Bootstrap for 95% Confidence Interval
        function bootstrapCI(data, numBootstraps = 1000, ci = 95) {
            const n = data.length;
            const xRange = [-1, 39]; // Range for plotting
            const step = 0.5;
            const xValues = [];
            for (let x = xRange[0]; x <= xRange[1]; x += step) {
                xValues.push(x);
            }
            
            const predictions = xValues.map(() => []);
            
            for (let i = 0; i < numBootstraps; i++) {
                // Resample with replacement
                const sample = [];
                for (let j = 0; j < n; j++) {
                    const idx = Math.floor(Math.random() * n);
                    sample.push(data[idx]);
                }
                
                // Fit line for sample
                // Note: It's possible for a bootstrap sample to have 0 variance in X, though unlikely with continuous data.
                // We'll skip if denominator is near zero.
                let sumX = 0, sumY = 0, sumXY = 0, sumXX = 0;
                sample.forEach(pt => {
                    sumX += pt[0];
                    sumY += pt[1];
                    sumXY += pt[0] * pt[1];
                    sumXX += pt[0] * pt[0];
                });
                
                const denom = n * sumXX - sumX * sumX;
                if (Math.abs(denom) < 1e-9) continue;

                const m = (n * sumXY - sumX * sumY) / denom;
                const b = (sumY - m * sumX) / n;
                
                // Predict
                xValues.forEach((x, idx) => {
                    predictions[idx].push(m * x + b);
                });
            }
            
            // Calculate percentiles
            const lowerPercentile = (100 - ci) / 2;
            const upperPercentile = 100 - lowerPercentile;
            
            // Indices after sorting
            // If predictions length < numBootstraps (due to skips), adjust.
            // Using actual length of predictions[0] is safer.
            const validBootstraps = predictions[0].length;
            const lowerIndex = Math.floor(lowerPercentile / 100 * validBootstraps);
            const upperIndex = Math.floor(upperPercentile / 100 * validBootstraps);
            
            const bandPointsUpper = [];
            const bandPointsLower = [];
            
            xValues.forEach((x, idx) => {
                const preds = predictions[idx].sort((a, b) => a - b);
                if (preds.length > 0) {
                    bandPointsLower.push([x, preds[lowerIndex]]);
                    bandPointsUpper.push([x, preds[upperIndex]]);
                }
            });
            
            // Create polygon points
            const polyPoints = [...bandPointsUpper];
            for (let k = bandPointsLower.length - 1; k >= 0; k--) {
                polyPoints.push(bandPointsLower[k]);
            }
            
            return polyPoints;
        }
        
        const bootstrapPolyPoints = bootstrapCI(plotData);
        
        const lineData = [
            [-1, mainReg.m * -1 + mainReg.b],
            [39, mainReg.m * 39 + mainReg.b]
        ];

        const chart = echarts.init(document.getElementById('chart-container'));

        const option = {
            backgroundColor: 'white',
            title: {
                text: 'HRE',
                left: 'center',
                top: 2,
                textStyle: {
                    color: 'black',
                    fontSize: 18,
                    fontWeight: 'normal',
                    fontFamily: 'Arial'
                }
            },
            grid: {
                top: 40,
                bottom: 60,
                left: 70,
                right: 20,
                show: true,
                borderColor: 'black',
                borderWidth: 1
            },
            xAxis: {
                name: 'Percentage of high-ageing\\nCBGs',
                nameLocation: 'middle',
                nameGap: 40,
                nameTextStyle: {
                    fontSize: 16,
                    color: 'black',
                    fontFamily: 'Arial'
                },
                type: 'value',
                min: -1,
                max: 39,
                interval: 10,
                axisTick: {
                    inside: false,
                    length: 6,
                    lineStyle: { width: 0.8, color: 'black' }
                },
                axisLabel: {
                    fontSize: 14,
                    color: 'black',
                    fontFamily: 'Arial'
                },
                axisLine: {
                    show: false 
                },
                splitLine: { show: false }
            },
            yAxis: {
                name: 'ΔF̄', 
                nameLocation: 'middle',
                nameGap: 50,
                nameTextStyle: {
                    fontSize: 18,
                    color: 'black',
                    fontStyle: 'italic',
                    fontFamily: 'Times New Roman' 
                },
                type: 'value',
                min: -1.1,
                max: 1.1,
                interval: 0.5, 
                axisTick: {
                    inside: false,
                    length: 6,
                    lineStyle: { width: 0.8, color: 'black' }
                },
                axisLabel: {
                    fontSize: 14,
                    color: 'black',
                    fontFamily: 'Arial',
                    formatter: function(value) {
                        return value.toFixed(1);
                    }
                },
                axisLine: {
                    show: false 
                },
                splitLine: { show: false }
            },
            series: [
                {
                    // Confidence Interval Band
                    type: 'custom',
                    renderItem: function (params, api) {
                        if (bootstrapPolyPoints.length === 0) return;
                        
                        const points = bootstrapPolyPoints.map(pt => api.coord(pt));
                        
                        return {
                            type: 'polygon',
                            shape: {
                                points: points
                            },
                            style: {
                                fill: '#aecfc8',
                                opacity: 0.2 // Light transparency for the band
                            }
                        };
                    },
                    data: [0], // Dummy data to trigger render
                    z: 0 // Behind everything
                },
                {
                    type: 'scatter',
                    data: plotData,
                    symbolSize: 10, 
                    itemStyle: {
                        color: '#aecfc8',
                        borderColor: 'white',
                        borderWidth: 1,
                        opacity: 1
                    },
                    z: 2
                },
                {
                    type: 'line',
                    data: lineData,
                    symbol: 'none',
                    lineStyle: {
                        color: '#aecfc8',
                        width: 4,
                        opacity: 0.9
                    },
                    z: 1 
                }
            ],
            graphic: [
                {
                    type: 'text',
                    left: 0, 
                    top: 0,
                    style: {
                        text: 'e',
                        font: 'bold 24px Arial',
                        fill: 'black'
                    }
                }
            ]
        };
        
        chart.setOption(option);
    </script>
