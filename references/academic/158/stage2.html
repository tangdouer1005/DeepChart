<!DOCTYPE html>
<html lang="en">
<head>

    <title>Nature Chart Reproduction</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
    <style>

        #chart-container { width: 800px; height: 600px; }
    </style>
</head>

    <script>

    {

    },
    {

    },
    {

    },
    {

        "Central": 2379.4,

        "High": 4294.6
    },
    {
        "Scenario": "central estimate of CORSIA offset cost",
        "Year": 2035,
        "Central": 2046.7,
        "Low": 303.2,
        "High": 4141.0
    },
    {
        "Scenario": "low estimate of CORSIA offset cost",
        "Year": 2027,
        "Central": 3784.4,
        "Low": 2333.9,
        "High": 4608.0
    },
    {
        "Scenario": "low estimate of CORSIA offset cost",
        "Year": 2028,
        "Central": 3833.8,
        "Low": 2319.6,
        "High": 4809.9
    },
    {
        "Scenario": "low estimate of CORSIA offset cost",
        "Year": 2029,
        "Central": 3894.0,
        "Low": 2293.0,
        "High": 5024.8
    },
    {
        "Scenario": "low estimate of CORSIA offset cost",
        "Year": 2030,
        "Central": 3980.3,
        "Low": 2260.3,
        "High": 5264.9
    },
    {
        "Scenario": "low estimate of CORSIA offset cost",
        "Year": 2031,
        "Central": 4108.8,
        "Low": 2228.0,
        "High": 5543.2
    },
    {
        "Scenario": "low estimate of CORSIA offset cost",
        "Year": 2032,
        "Central": 3970.6,
        "Low": 2099.4,
        "High": 5558.3
    },
    {
        "Scenario": "low estimate of CORSIA offset cost",
        "Year": 2033,
        "Central": 3802.5,
        "Low": 1941.1,

    },
    {

        "Year": 2034,
        "Central": 3633.0,
        "Low": 1819.3,
        "High": 5548.2
    },
    {
        "Scenario": "low estimate of CORSIA offset cost",
        "Year": 2035,
        "Central": 3477.4,
        "Low": 1734.0,
        "High": 5571.8
    },
    {
        "Scenario": "high estimate of CORSIA offset cost",
        "Year": 2027,
        "Central": 2989.5,
        "Low": 1539.0,

    },
    {

        "Year": 2028,
        "Central": 2848.2,

    },
    {
        "Scenario": "high estimate of CORSIA offset cost",
        "Year": 2029,
        "Central": 2694.6,
        "Low": 1093.6,
        "High": 3825.4
    },
    {
        "Scenario": "high estimate of CORSIA offset cost",
        "Year": 2030,
        "Central": 2542.8,
        "Low": 822.8,
        "High": 3827.4
    },
    {
        "Scenario": "high estimate of CORSIA offset cost",
        "Year": 2031,
        "Central": 2408.1,
        "Low": 527.3,
        "High": 3842.6
    },
    {
        "Scenario": "high estimate of CORSIA offset cost",
        "Year": 2032,
        "Central": 1980.6,
        "Low": 109.4,
        "High": 3568.3
    },
    {
        "Scenario": "high estimate of CORSIA offset cost",
        "Year": 2033,
        "Central": 1457.5,
        "Low": -403.9,
        "High": 3209.7
    },
    {
        "Scenario": "high estimate of CORSIA offset cost",
        "Year": 2034,
        "Central": 935.9,
        "Low": -877.9,
        "High": 2851.1
    },
    {
        "Scenario": "high estimate of CORSIA offset cost",
        "Year": 2035,
        "Central": 398.1,
        "Low": -1345.4,
        "High": 2492.4
    }
];

        function getSeriesData(scenarioName) {
            return jsonData.filter(d => d.Scenario === scenarioName)
                           .sort((a, b) => a.Year - b.Year);
        }

        const dataHigh = getSeriesData('high estimate of CORSIA offset cost');
        const dataMed = getSeriesData('central estimate of CORSIA offset cost');
        const dataLow = getSeriesData('low estimate of CORSIA offset cost');

        const years = [2027, 2028, 2029, 2030, 2031, 2032, 2033, 2034, 2035];

        const central_high = dataHigh.map(d => d['Central']);
        const low_high = dataHigh.map(d => d['Low']);
        const high_high = dataHigh.map(d => d['High']);

        const central_med = dataMed.map(d => d['Central']);
        const low_med = dataMed.map(d => d['Low']);
        const high_med = dataMed.map(d => d['High']);

        const central_low = dataLow.map(d => d['Central']);
        const low_low = dataLow.map(d => d['Low']);
        const high_low = dataLow.map(d => d['High']);

        const chart = echarts.init(document.getElementById('chart-container'));

        const option = {
            backgroundColor: 'white',
            grid: { top: 50, right: 100, bottom: 50, left: 80 },
            legend: {
                data: ['High offset price', 'Low offset price', 'Medium offset price'],
                bottom: 10,
                left: 10,
                orient: 'vertical'
            },
            xAxis: {
                type: 'category',
                data: years,
                axisLabel: { color: 'black' },
                axisLine: { show: true, lineStyle: { color: 'black' } },
                axisTick: { show: true, alignWithLabel: true }
            },
            yAxis: {
                type: 'value',
                name: 'Net costs of max usage of SAF (million US$)',
                nameLocation: 'middle',
                nameGap: 50,
                min: -4000,
                max: 6000,
                axisLabel: { 
                    color: 'black',
                    formatter: function(value) {
                        return value.toLocaleString();
                    }
                },
                axisLine: { show: true, lineStyle: { color: 'black' } },
                splitLine: { show: false }
            },
            series: [
                // High offset price (Yellow)
                {
                    name: 'High offset price',
                    type: 'line',
                    data: central_high,
                    lineStyle: { color: '#dcdb55', width: 3 },
                    symbol: 'none',
                    z: 1
                },
                {
                    name: 'High offset price CI',
                    type: 'custom',
                    renderItem: function (params, api) {
                        const points = [];
                        for (let i = 0; i < years.length; i++) {
                            points.push(api.coord([i, high_high[i]]));
                        }
                        for (let i = years.length - 1; i >= 0; i--) {
                            points.push(api.coord([i, low_high[i]]));
                        }
                        return {
                            type: 'polygon',
                            shape: { points: points },
                            style: api.style({ fill: '#f6ecc8', stroke: 'none', opacity: 0.5 })
                        };
                    },
                    data: [0],
                    z: 0
                },
                // Medium offset price (Red)
                {
                    name: 'Medium offset price',
                    type: 'line',
                    data: central_med,
                    lineStyle: { color: '#e07b7b', width: 3 },
                    symbol: 'none',
                    z: 2
                },
                {
                    name: 'Medium offset price CI',
                    type: 'custom',
                    renderItem: function (params, api) {
                        const points = [];
                        for (let i = 0; i < years.length; i++) {
                            points.push(api.coord([i, high_med[i]]));
                        }
                        for (let i = years.length - 1; i >= 0; i--) {
                            points.push(api.coord([i, low_med[i]]));
                        }
                        return {
                            type: 'polygon',
                            shape: { points: points },
                            style: api.style({ fill: '#ebd6d8', stroke: 'none', opacity: 0.5 })
                        };
                    },
                    data: [0],
                    z: 0
                },
                // Low offset price (Blue)
                {
                    name: 'Low offset price',
                    type: 'line',
                    data: central_low,
                    lineStyle: { color: '#2b4f76', width: 3 },
                    symbol: 'none',
                    z: 3
                },
                {
                    name: 'Low offset price CI',
                    type: 'custom',
                    renderItem: function (params, api) {
                        const points = [];
                        for (let i = 0; i < years.length; i++) {
                            points.push(api.coord([i, high_low[i]]));
                        }
                        for (let i = years.length - 1; i >= 0; i--) {
                            points.push(api.coord([i, low_low[i]]));
                        }
                        return {
                            type: 'polygon',
                            shape: { points: points },
                            style: api.style({ fill: '#dce7f1', stroke: 'none', opacity: 0.5 })
                        };
                    },
                    data: [0],
                    z: 0
                },
                // Mark Line
                {
                    name: 'Zero Line',
                    type: 'line',
                    markLine: {
                        symbol: 'none',
                        label: { show: false },
                        lineStyle: { type: 'dotted', color: 'grey', width: 1.5 },
                        data: [{ yAxis: 0 }]
                    }
                }
            ],
            graphic: [
                { type: 'text', left: 10, top: 10, style: { text: 'b', font: 'bold 24px Arial' } },
                { type: 'text', left: 80, bottom: 100, style: { text: 'US-S1', font: 'bold 14px Arial' } },
                // Annotations
                { type: 'text', right: 30, top: '45%', style: { text: '3.5 B', fill: '#bfbd4d', font: '14px Arial' } },
                { type: 'text', right: 30, top: '30%', style: { text: '13.8 B', fill: '#e07b7b', font: '14px Arial' } },
                { type: 'text', right: 30, top: '15%', style: { text: '22.8 B', fill: '#2b4f76', font: '14px Arial' } }
            ]
        };

        chart.setOption(option);
    </script>
</body>
</html>
