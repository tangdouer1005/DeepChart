        const rawData = chartData.plot_data.map(d => ({
            cancer: d["Cancer Type"],
            model: d["Model"],
            percent: d["Percentage"],
            auroc: d["Performance"]
        }));

        const colors = {
            'LUNG': '#6baed6',
            'STAD': '#d6616b',
            'BRCA': '#8c1b2f',
            'CRC': '#316ca0'
        };

        const advancedSymbolMap = {
            'ctranspath': 'circle',
            'phikon': 'rect',
            'uni': 'diamond',
            'kaiko': 'triangle',
            'prov-gigapath': 'path://M5 5 L15 15 M15 5 L5 15',
            'virchow-class': 'path://M10 0 L20 10 L10 20 L0 10 Z',
            'virchow2-class': 'path://M10 0 L0 20 L20 20 Z',
            'panakeia': 'path://M 10 0 L 17 6 L 17 14 L 10 20 L 3 14 L 3 6 Z'
        };

        const cancerTypes = ['LUNG', 'STAD', 'BRCA', 'CRC'];
        const series = [];
        const datasets = [];

        echarts.registerTransform(ecStat.transform.regression);

        cancerTypes.forEach(cat => {
            const catDataPoints = rawData.filter(d => d.cancer === cat);
            const regressionSourceData = catDataPoints.map(d => [d.percent, d.auroc]);
            
            const stat = chartData.stats_data.find(s => s.cancer_type === cat);
            const r = stat ? stat.r : 0;
            const p = stat ? stat.p : 0;
            
            let pStr = p.toFixed(2);
            if (cat === 'STAD') pStr = p.toFixed(1);
            const dispName = cat === 'LUNG' ? 'NSCLC' : cat;
            const label = `${dispName} (r = ${r.toFixed(2)}, P = ${pStr})`;

            const scatterPlotData = catDataPoints.map(d => ({
                value: [d.percent, d.auroc],
                symbol: advancedSymbolMap[d.model] || 'circle',
                symbolKeepAspect: true,
                symbolOffset: [0,0],
                symbolSize: 10
            }));
            
            const sourceIdx = datasets.length;
            datasets.push({ source: regressionSourceData });
            
            const transformIdx = datasets.length;
            datasets.push({
                fromDatasetIndex: sourceIdx,
                transform: {
                    type: 'ecStat:regression',
                    config: { method: 'linear' }
                }
            });

            series.push({
                name: label,
                type: 'scatter',
                datasetIndex: sourceIdx,
                data: scatterPlotData,
                itemStyle: { color: colors[cat], opacity: 1 },
                symbolSize: 10
            });

            series.push({
                name: label,
                type: 'line',
                datasetIndex: transformIdx,
                symbol: 'none',
                lineStyle: { color: colors[cat], width: 3 },
                silent: true,
                tooltip: { show: false }
            });
        });

        const option = {
            backgroundColor: 'white',
            grid: { top: 50, right: 20, bottom: 80, left: 80 },
            xAxis: {
                name: 'Percentage of slides in pretraining dataset (%)',
                nameLocation: 'middle',
                nameGap: 40,
                type: 'value',
                min: -5,
                max: 87,
                interval: 10,
                splitLine: { show: true, lineStyle: { color: '#E0E0E0' } },

                    top: 10,

                        font: 'bold 24px Arial',

                    }
                }
