<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nature Chart Reproduction</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jstat@latest/dist/jstat.min.js"></script>
    <style>
        body { margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #ffffff; font-family: Arial, sans-serif; }
        #chart-container { width: 600px; height: 500px; }
    </style>
</head>
<body>
    <div id="chart-container"></div>
    <script>
        const jsonData = [
    {
        "Electrolyte": "LiAsF6 electrolyte",
        "SSL ratio (%)": 90.0,
        "m1": 2.9,
        "m2": 2.6,
        "m3": 2.6,
        "m4": 2.7,
        "Label": "LiAsF₆",
        "Mean_Size": 2.7,
        "Std_Size": 0.14142135623730942,
        "color": "#d64541", 
        "label_pos": [-15, 0]
    },
    {
        "Electrolyte": "LiPF6 electrolyte",
        "SSL ratio (%)": 80.0,
        "m1": 3.0,
        "m2": 3.3,
        "m3": 2.8,
        "m4": 3.3,
        "Label": "LiPF₆",
        "Mean_Size": 3.0999999999999996,
        "Std_Size": 0.2449489742783178,
        "color": "#4d73a0",
        "label_pos": [20, 0]
    },
    {
        "Electrolyte": "LiFSI electrolyte",
        "SSL ratio (%)": 78.33333,
        "m1": 3.2,
        "m2": 3.1,
        "m3": 3.3,
        "m4": 3.0,
        "Label": "LiFSI",
        "Mean_Size": 3.1500000000000004,
        "Std_Size": 0.12909944487358052,
        "color": "#f2c65e",
        "label_pos": [-10, -20]
    },
    {
        "Electrolyte": "LiTFSI electrolyte",
        "SSL ratio (%)": 76.66667,
        "m1": 3.9,
        "m2": 3.4,
        "m3": 3.0,
        "m4": 3.7,
        "Label": "LiTFSI",
        "Mean_Size": 3.5,
        "Std_Size": 0.3915780041490244,
        "color": "#6bc985",
        "label_pos": [15, 10]
    },
    {
        "Electrolyte": "LiClO4 electrolyte",
        "SSL ratio (%)": 71.66667,
        "m1": 4.1,
        "m2": 4.8,
        "m3": 4.2,
        "m4": 3.8,
        "Label": "LiClO₄",
        "Mean_Size": 4.225,
        "Std_Size": 0.4193248541803042,
        "color": "#666699",
        "label_pos": [-35, 0]
    },
    {
        "Electrolyte": "LiBF4 electrolyte",
        "SSL ratio (%)": 75.0,
        "m1": 3.9,
        "m2": 4.1,
        "m3": 5.4,
        "m4": 4.4,
        "Label": "LiBF₄",
        "Mean_Size": 4.45,
        "Std_Size": 0.6658328118479395,
        "color": "#999999",
        "label_pos": [20, 0]
    },
    {
        "Electrolyte": "LiDFOB electrolyte",
        "SSL ratio (%)": 70.4918,
        "m1": 4.7,
        "m2": 4.5,
        "m3": 4.9,
        "m4": 5.4,
        "Label": "LiDFOB",
        "Mean_Size": 4.875,
        "Std_Size": 0.3862210075418824,
        "color": "#e67e75",
        "label_pos": [15, 15]
    },
    {
        "Electrolyte": "LiNO3 electrolyte",
        "SSL ratio (%)": 68.33333,
        "m1": 5.2,
        "m2": 5.2,
        "m3": 6.2,
        "m4": 5.3,
        "Label": "LiNO₃",
        "Mean_Size": 5.4750000000000005,
        "Std_Size": 0.48562674281111556,
        "color": "#6b9ac9",
        "label_pos": [15, 15]
    }
];

        const scatterData = [];
        const errorData = [];
        const ssls = [];
        const sizes = [];

        jsonData.forEach(item => {
            const meanSize = item.Mean_Size;
            const stdSize = item.Std_Size;
            const ssl = item["SSL ratio (%)"];
            
            ssls.push(ssl);
            sizes.push(meanSize);

            scatterData.push({
                name: item.Label,
                value: [ssl, meanSize],
                itemStyle: { color: item.color },
                label: {
                    show: true,
                    formatter: item.Label,
                    offset: item.label_pos,
                    color: 'black',
                    fontSize: 12
                }
            });

            errorData.push({
                value: [ssl, meanSize, stdSize], // x, y, err
                itemStyle: { color: 'black' }
            });
        });

        // Stats
        // Use Spearman correlation as per the reference Python script (scipy.stats.spearmanr)
        const corr = jStat.spearmancoeff(ssls, sizes);
        const n = ssls.length;
        const t = corr * Math.sqrt((n-2)/(1-corr*corr));
        // 2-tailed p-value
        const pVal = 2 * (1 - jStat.studentt.cdf(Math.abs(t), n-2));
        
        // Formatting for display: "3.9 × 10⁻⁵" (Example)
        const exp = Math.floor(Math.log10(pVal));
        const coeff = (pVal / Math.pow(10, exp)).toFixed(1);
        const superscripts = { '-': '⁻', '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' };
        const expStr = exp.toString().split('').map(c => superscripts[c] || c).join('');
        const pLabel = `P value: ${coeff} × 10${expStr}`;

        const chart = echarts.init(document.getElementById('chart-container'));

        const option = {
            backgroundColor: 'white',
            grid: { top: 50, right: 50, bottom: 60, left: 60 },
            xAxis: {
                type: 'value',
                name: 'SSL ratio (%)',
                nameLocation: 'middle',
                nameGap: 35,
                min: 65,
                max: 95,
                axisLabel: { color: 'black' },
                axisLine: { show: true, lineStyle: { color: 'black' } },
                splitLine: { show: false }
            },
            yAxis: {
                type: 'value',
                name: 'Crystallite size in SEI (nm)',
                nameLocation: 'middle',
                nameGap: 40,
                min: 2.0,
                max: 6.0,
                axisLabel: { color: 'black' },
                axisLine: { show: true, lineStyle: { color: 'black' } },
                splitLine: { show: false }
            },
            series: [
                {
                    type: 'scatter',
                    data: scatterData,
                    symbol: 'rect', // Square
                    symbolSize: 15,
                    z: 10
                },
                {
                    type: 'custom',
                    renderItem: function (params, api) {
                        const xVal = api.value(0);
                        const yVal = api.value(1);
                        const err = api.value(2);
                        
                        const pt = api.coord([xVal, yVal]);
                        const top = api.coord([xVal, yVal + err]);
                        const bottom = api.coord([xVal, yVal - err]);
                        
                        const style = api.style({ stroke: 'black', lineWidth: 1 });
                        
                        return {
                            type: 'group',
                            children: [
                                // Vertical Error Bar
                                { type: 'line', shape: { x1: top[0], y1: top[1], x2: bottom[0], y2: bottom[1] }, style: style },
                                // Caps
                                { type: 'line', shape: { x1: top[0]-3, y1: top[1], x2: top[0]+3, y2: top[1] }, style: style },
                                { type: 'line', shape: { x1: bottom[0]-3, y1: bottom[1], x2: bottom[0]+3, y2: bottom[1] }, style: style }
                            ]
                        };
                    },
                    data: errorData,
                    z: 5
                }
            ],
            graphic: [
                { type: 'text', left: 10, top: 10, style: { text: 'e', font: 'bold 24px Arial' } },
                {
                    type: 'text', 
                    right: 60, 
                    top: 60, 
                    style: { 
                        text: `Correlation coefficient: ${corr.toFixed(2)}
${pLabel}`, 
                        font: '14px Arial',
                        textAlign: 'right',
                        lineHeight: 20
                    } 
                }
            ]
        };

        chart.setOption(option);
    </script>
</body>
</html>
