    <style>

        #chart-container { width: 1000px; height: 600px; }
    </style>
</head>
<body>

    <script>
        const chartData = {

        ],
        "C2H4_std": [

        ]
    },
    "50°C": {
        "CD": [
            50,

        ],
        "H2_mean": [
            3.287059628755236,

        ],
        "H2_std": [
            1.1463168405309254,

            1.6065251012223831,
            2.317959402621786,

            5.769325475079365
        ],
        "C2H4_mean": [
            37.26284826799152,

            55.106440937810156,
            54.965994542693124,
            53.40276036759595,
            47.76289797867989,
            44.11011653777273,
            32.974338945092285
        ],
        "C2H4_std": [
            1.1720323694928647,
            0.8013776181044271,
            0.943935402977458,
            0.41680246735873855,
            0.4021059504857324,
            0.9346165079725124,
            2.4609953747908007,
            3.013351613057377,
            5.114262013945104
        ]

};

        const chart = echarts.init(document.getElementById('chart-container'));

        // Colors
        const colorH2 = '#aebcd6';
        const colorC2H4 = '#6c85b5';

        // Patterns
        // 35C Pattern: Diagonal lines (////)
        const pattern35C = (() => {
            const canvas = document.createElement('canvas');
            canvas.width = 10;
            canvas.height = 10;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = colorH2; // Base color? No, pattern is usually overlay. 
            // Matplotlib `hatch='////'` overlays black lines over the face color. 
            // Here we want white lines? Or black? Python script says `edgecolor='white'`, `hatch` color is usually black by default in MPL unless specified.
            // In MPL code: `color=color_h2`, `edgecolor='white'`, `hatch=hatches[temp]`.
            // Hatch in MPL is usually black.
            // Let's assume thin black lines for the pattern.
            
            // To emulate MPL hatch over color:
            // We can't easily "overlay" a pattern on a color in ECharts `itemStyle` without using `decal` or a complex image.
            // Instead, we create an image that IS the color + the hatch.
            
            // Draw background
            ctx.fillStyle = colorH2; // Will be dynamic? No, we need one for H2, one for C2H4.
            // This means we need 2 patterns per temp.
            return null; // Logic moved inside loop
        })();

        function createPattern(bgColor, hatchType) {
            const canvas = document.createElement('canvas');
            canvas.width = 8;
            canvas.height = 8;
            const ctx = canvas.getContext('2d');
            
            // Fill Background
            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, 8, 8);
            
            // Draw Hatch
            ctx.strokeStyle = 'rgba(0,0,0,0.5)'; // Semi-transparent black lines
            ctx.lineWidth = 1;
            
            if (hatchType === '////') {
                ctx.beginPath();
                ctx.moveTo(0, 8);
                ctx.lineTo(8, 0);
                ctx.stroke();
            } else if (hatchType === 'xxxx') {
                ctx.beginPath();
                ctx.moveTo(0, 8);
                ctx.lineTo(8, 0);
                ctx.moveTo(0, 0);
                ctx.lineTo(8, 8);
                ctx.stroke();
            }
            
            return { image: canvas, repeat: 'repeat' };
        }

        const xData = chartData["20°C"].CD; // Shared X-axis
        const temps = ["20°C", "35°C", "50°C"];
        const hatches = {
            "20°C": null,
            "35°C": '////',
            "50°C": 'xxxx'
        };

        const series = [];
        const barWidthPercent = 0.22; // 22% of category width
        // ECharts barWidth is absolute or percent of category.
        // If we set barWidth: '22%', and barGap: '0%', the bars will be side by side.
        
        temps.forEach((temp, index) => {
            const data = chartData[temp];
            const hatch = hatches[temp];
            
            // H2 Series (Bottom)
            series.push({
                name: `H2_${temp}`,
                type: 'bar',
                stack: temp, // Stack by temperature group
                data: data.H2_mean.map(val => ({
                    value: val,
                    itemStyle: {
                        color: hatch ? createPattern(colorH2, hatch) : colorH2,
                        borderColor: 'white',
                        borderWidth: 0.5
                    }
                })),
                barWidth: '22%',
                barGap: '0%' // Side by side
            });

            // C2H4 Series (Top)
            series.push({
                name: `C2H4_${temp}`,
                type: 'bar',
                stack: temp,
                data: data.C2H4_mean.map(val => ({
                    value: val,
                    itemStyle: {
                        color: hatch ? createPattern(colorC2H4, hatch) : colorC2H4,
                        borderColor: 'white',
                        borderWidth: 0.5
                    }
                })),
                barWidth: '22%',
                barGap: '0%'
            });
            
            // Error Bars
            // Calculate offsets for error bars
            // We have 3 bars. 
            // Bar 0 (20C) is index 0. Bar 1 (35C) index 1. Bar 2 (50C) index 2.
            // With barGap 0 and barWidth 22%:
            // Total width used = 66%. Center is at 50%.
            // Bar 0 center: 50% - 22% = 28%? No.
            // Visual Layout: [Bar0][Bar1][Bar2] centered in the category.
            // 3 * 22 = 66% width.
            // Center of Bar 1 is exactly at the category tick (0 offset).
            // Center of Bar 0 is -1 * 22% = -0.22 units (if category is 1 unit)
            // Center of Bar 2 is +1 * 22% = +0.22 units
            
            const offsetMultiplier = index - 1; // -1, 0, 1
            
            // H2 Error Bars (centered at H2_mean)
            series.push({
                type: 'custom',
                name: `Error_H2_${temp}`,
                renderItem: (params, api) => {
                    const xValue = api.value(0);
                    const highValue = api.value(1);
                    const lowValue = api.value(2);
                    
                    const categoryWidth = api.size([1, 0])[0];
                    const xCenter = api.coord([xValue, 0])[0];
                    const x = xCenter + offsetMultiplier * (categoryWidth * barWidthPercent);
                    
                    const yHigh = api.coord([xValue, highValue])[1];
                    const yLow = api.coord([xValue, lowValue])[1];
                    const halfWidth = 5; // Cap width

                    const style = api.style({ stroke: 'black', lineWidth: 1 });

                    return {
                        type: 'group',
                        children: [
                            { type: 'line', shape: { x1: x, y1: yHigh, x2: x, y2: yLow }, style: style },
                            { type: 'line', shape: { x1: x - halfWidth, y1: yHigh, x2: x + halfWidth, y2: yHigh }, style: style },
                            { type: 'line', shape: { x1: x - halfWidth, y1: yLow, x2: x + halfWidth, y2: yLow }, style: style }
                        ]
                    };
                },
                data: data.H2_mean.map((mean, i) => [i, mean + data.H2_std[i], mean - data.H2_std[i]]),
                z: 100
            });

            // C2H4 Error Bars (centered at H2_mean + C2H4_mean)
            series.push({
                type: 'custom',
                name: `Error_C2H4_${temp}`,
                renderItem: (params, api) => {
                    const xValue = api.value(0);
                    const highValue = api.value(1);
                    const lowValue = api.value(2);
                    
                    const categoryWidth = api.size([1, 0])[0];
                    const xCenter = api.coord([xValue, 0])[0];
                    const x = xCenter + offsetMultiplier * (categoryWidth * barWidthPercent);
                    
                    const yHigh = api.coord([xValue, highValue])[1];
                    const yLow = api.coord([xValue, lowValue])[1];
                    const halfWidth = 5;

                    const style = api.style({ stroke: 'black', lineWidth: 1 });

                    return {
                        type: 'group',
                        children: [
                            { type: 'line', shape: { x1: x, y1: yHigh, x2: x, y2: yLow }, style: style },
                            { type: 'line', shape: { x1: x - halfWidth, y1: yHigh, x2: x + halfWidth, y2: yHigh }, style: style },
                            { type: 'line', shape: { x1: x - halfWidth, y1: yLow, x2: x + halfWidth, y2: yLow }, style: style }
                        ]
                    };
                },
                data: data.C2H4_mean.map((mean, i) => {
                   const total = data.H2_mean[i] + mean;
                   const std = data.C2H4_std[i];
                   return [i, total + std, total - std];
                }),
                z: 100
            });
        });

        // Legend Components
        // We need a complex legend: Colors for chemicals, Patterns for temps.
        // ECharts legend doesn't support "two separate legends" easily mapped to the same series without showing duplicates.
        // We will build a Custom Legend using 'graphic' components? Or simply HTML overlay?
        // Or cleaner: Use ECharts legend but manipulate the data to show what we want.
        // We can add "Fake" series for legend items.
        
        const fakeSeries = [];
        // Chemical Colors
        fakeSeries.push({ name: 'H₂', type: 'bar', itemStyle: { color: colorH2 }, data: [] });
        fakeSeries.push({ name: 'C₂H₄', type: 'bar', itemStyle: { color: colorC2H4 }, data: [] });
        
        // Temp Patterns (using H2 color as base)
        fakeSeries.push({ name: '20 °C', type: 'bar', itemStyle: { color: colorH2, borderColor: 'black', borderWidth: 0.5 }, data: [] });
        fakeSeries.push({ name: '35 °C', type: 'bar', itemStyle: { color: createPattern(colorH2, '////'), borderColor: 'black', borderWidth: 0.5 }, data: [] });
        fakeSeries.push({ name: '50 °C', type: 'bar', itemStyle: { color: createPattern(colorH2, 'xxxx'), borderColor: 'black', borderWidth: 0.5 }, data: [] });

        const option = {
            backgroundColor: 'white',
            title: { text: '' },
            grid: { top: 100, bottom: 60, left: 60, right: 20 },
            xAxis: {
                type: 'category',
                data: xData,
                name: 'Current density (mA cm⁻²)',
                nameLocation: 'middle',
                nameGap: 35,
                axisLabel: { color: 'black', fontSize: 12 },
                axisLine: { lineStyle: { color: 'black' } },
                axisTick: { alignWithLabel: true }
            },
            yAxis: {
                type: 'value',
                name: 'FE (%)',
                max: 120,
                nameTextStyle: { color: 'black', fontSize: 14 },
                axisLabel: { color: 'black', fontSize: 12 },
                axisLine: { lineStyle: { color: 'black' } }, // Show Y axis line
                splitLine: { show: true, lineStyle: { type: 'dashed' } }
            },
            legend: [
                {
                    data: [
                        { name: 'H₂', icon: 'rect' },
                        { name: 'C₂H₄', icon: 'rect' }
                    ],
                    top: 10,
                    left: 20,
                    itemGap: 15,
                    textStyle: { fontSize: 12 }
                },
                {
                    data: [
                        { name: '20 °C', icon: 'rect' },
                        { name: '35 °C', icon: 'rect' },
                        { name: '50 °C', icon: 'rect' }
                    ],
                    top: 35,
                    left: 20,
                    itemGap: 15,
                    textStyle: { fontSize: 12 }
                }
            ],
            series: [...series, ...fakeSeries],
            graphic: [
                {
                    type: 'text',
                    left: 10,
                    top: 10,
                    style: {
                        text: 'e',
                        font: 'bold 24px Arial',
                        fill: 'black'
                    }
                }
            ]
        };

        chart.setOption(option);
    </script>
</body>
